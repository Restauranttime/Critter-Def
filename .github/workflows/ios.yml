# Baut die iOS-App von Football Empire auf einem Mac bei GitHub und startet sie im iPad-Simulator.
# Läuft nur, wenn sich etwas im Ordner ios/ (oder diese Datei) ändert. Signiert wird hier nichts.
name: iOS-App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bauen:
    name: Bauen und im Simulator starten
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Für echte Geräte bauen (ohne Signatur)
        run: |
          xcodebuild -quiet -project ios/FootballEmpire.xcodeproj -scheme FootballEmpire \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build

      - name: Für den Simulator bauen
        run: |
          xcodebuild -quiet -project ios/FootballEmpire.xcodeproj -scheme FootballEmpire \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build

      - name: Im iPad-Simulator starten und prüfen, ob das Spiel lädt
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ipads = [x for k in sorted(d) if "iOS" in k for x in d[k] if "iPad" in x["name"]]
          print(ipads[-1]["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/FootballEmpire.app
          xcrun simctl launch --stdout="$PWD/app-out.txt" --stderr="$PWD/app-err.txt" "$UDID" com.restauranttime.footballempire
          for i in $(seq 1 45); do grep -q "Football Empire geladen" app-err.txt 2>/dev/null && break; sleep 2; done
          sleep 5
          xcrun simctl io "$UDID" screenshot ipad.png
          echo "--- Rückmeldung der App ---"
          grep "Football Empire" app-err.txt || { echo "Die App hat das Spiel nicht geladen."; cat app-err.txt; exit 1; }
          grep -q "Startseite | App erkannt" app-err.txt || { echo "Startseite fehlt oder App-Kennung nicht gesetzt."; exit 1; }
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.restauranttime.footballempire || { echo "Die App läuft nicht mehr."; exit 1; }
          echo "Die App läuft und zeigt die Startseite des Spiels."

      - name: Foto vom Simulator hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-simulator
          path: ipad.png
          if-no-files-found: ignore
