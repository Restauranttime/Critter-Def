<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Quiz Abend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--pwa-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Abend">
<meta name="theme-color" content="#121733">
<link rel="apple-touch-icon" href="quizabend-icon-180.png">
<link rel="icon" type="image/png" href="quizabend-icon-192.png">
<link rel="manifest" href="quizabend.webmanifest">
<!--/pwa-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Quizabend bei Nacht: mitternachtsblaue Bühne, ein warmer Lampenkegel von oben,
   Antworten als cremefarbene Quizkarten. Der einzige Schmuck: der Glühbirnen-Rahmen ums Logo. */
:root{
  --nacht:#121733; --nacht2:#1a2147; --tafel:#0b0f25; --tafel2:#161c3c;
  --text:#f4efe4; --text2:#b9b7cf; --text3:#7f81a3; --linie:rgba(244,239,228,.14);
  --karte:#f6f0e4; --karte2:#cbc1aa; --lampe:#ffc04d; --lampe2:#ffe2a0; --lampe3:#a5741a;
  --ok:#5fe0a0; --ok2:#2f9e68; --bad:#ff6a5c; --bad2:#b03a30;
  --p1:#ff7a6b; --p2:#5bb8ff;
  --f-disp:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--nacht)}
body{font-family:var(--f-body);color:var(--text);font-size:16px;line-height:1.38;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--lampe);outline-offset:2px}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}

/* Bühne: Lampenkegel von oben, ein paar Sterne */
#app{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(70% 45% at 50% -8%,rgba(255,200,110,.20),transparent 70%),
    radial-gradient(1.5px 1.5px at 12% 22%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 83% 14%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 68% 34%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 27% 61%,rgba(255,255,255,.3),transparent 60%),
    radial-gradient(1.5px 1.5px at 91% 72%,rgba(255,255,255,.3),transparent 60%),
    linear-gradient(180deg,var(--nacht2),var(--nacht) 45%,#0e1229)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}

/* Typografie */
h2{font-family:var(--f-disp);font-weight:800;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:700;font-size:18px;margin:0;color:var(--text2)}
.lead{color:var(--text2);margin:0;font-size:15px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.num{font-variant-numeric:tabular-nums}

/* Kopfzeile der Unterseiten */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--linie);background:rgba(11,15,37,.6);flex:none}
.icon-btn svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Knöpfe */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 18px;border-radius:var(--r);
  background:var(--lampe);color:#2a1a00;font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.005em;
  box-shadow:0 4px 0 var(--lampe3),0 10px 26px rgba(255,192,77,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lampe3)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:rgba(11,15,37,.6);color:var(--text);border:1.5px solid var(--linie);box-shadow:none;font-size:18px}
.btn.small{min-height:44px;font-size:17px;padding:8px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* Startseite: Logo im Glühbirnen-Rahmen */
.brand{display:flex;justify-content:center;padding:18px 0 8px}
.marquee{position:relative;padding:22px 30px 18px;text-align:center}
.marquee::before{content:"";position:absolute;inset:0;border:7px dotted var(--lampe);border-radius:22px;filter:drop-shadow(0 0 6px rgba(255,192,77,.8));animation:bulbs 2.4s ease-in-out infinite}
@keyframes bulbs{0%,100%{opacity:1}50%{opacity:.55}}
.marquee h1{margin:0;font-family:var(--f-disp);font-weight:800;line-height:.86;font-size:clamp(58px,17vw,92px);letter-spacing:-.03em;color:var(--lampe);text-shadow:0 0 30px rgba(255,192,77,.35)}
.marquee h1 span{display:block;color:var(--text);font-size:.62em;letter-spacing:.02em}
.brand-sub{margin:-4px 0 0;text-align:center;color:var(--text2);font-size:16px;font-weight:500}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;padding:14px 16px;border-radius:var(--r);
  background:rgba(11,15,37,.72);border:1.5px solid var(--linie);transition:transform .08s,border-color .15s;position:relative;overflow:hidden}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.mode:active{transform:scale(.985)}
.mode b{font-family:var(--f-disp);font-weight:800;font-size:25px;line-height:1.05}
.mode span{grid-column:1;color:var(--text2);font-size:14.5px}
.mode i{grid-column:2;grid-row:1/span 2;font-style:normal;font-weight:700;font-size:13px;letter-spacing:.04em;
  color:var(--tafel);background:var(--karte);border-radius:8px;padding:5px 8px;white-space:nowrap}
.mode.off{opacity:.55}
.foot{text-align:center;color:var(--text3);font-size:13px;margin-top:auto;padding-top:8px}

/* Formulare */
.card{background:rgba(11,15,37,.72);border:1.5px solid var(--linie);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.inp{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--linie);background:var(--tafel);padding:10px 14px;font-size:18px;font-weight:600}
.inp::placeholder{color:var(--text3);font-weight:500}
.inp.code{font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.seg{display:flex;background:var(--tafel);border:1.5px solid var(--linie);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:700;font-size:15px;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--karte);color:var(--tafel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;min-height:38px;padding:6px 12px 6px 10px;border-radius:99px;border:1.5px solid var(--linie);font-weight:600;font-size:14px;color:var(--text3)}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.chip.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.on::before{opacity:1}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .dot{width:14px;height:14px;border-radius:50%;flex:none}
.prow .inp{flex:1;min-width:0;min-height:46px;font-size:17px}
.prow .icon-btn{width:46px;height:46px}
.tog{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 14px;text-align:left;padding:4px 0}
.tog b{font-weight:700;font-size:16px}
.tog span{grid-column:1;color:var(--text2);font-size:13.5px}
.tog .sw{grid-column:2;grid-row:1/span 2;width:52px;height:32px;border-radius:99px;background:var(--tafel);border:1.5px solid var(--linie);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--text3);transition:transform .15s,background .15s}
.tog[aria-pressed="true"] .sw{background:var(--lampe);border-color:var(--lampe)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(20px);background:#2a1a00}
.sep{height:1px;background:var(--linie)}

/* Frage */
.hd-cat{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.cat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--lampe))}
.diff{display:inline-flex;gap:3px;margin-left:6px}
.diff u{width:7px;height:7px;border-radius:2px;background:var(--text3);opacity:.4}
.diff u.on{background:var(--lampe);opacity:1}
.qtext{font-size:clamp(20px,5.6vw,26px);font-weight:700;line-height:1.24;margin:0;text-wrap:balance}
.answers{display:grid;gap:9px}
.ans{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:14px;text-align:left;font-weight:600;font-size:17.5px;line-height:1.2;
  background:var(--karte);color:var(--tafel);box-shadow:0 3px 0 var(--karte2);transition:transform .08s,background .15s,opacity .2s}
.ans:active{transform:translateY(2px);box-shadow:0 1px 0 var(--karte2)}
.ans .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:17px;background:var(--tafel);color:var(--lampe)}
.ans.ok{background:var(--ok);box-shadow:0 3px 0 var(--ok2)}
.ans.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 var(--bad2)}
.ans.bad .k{background:rgba(0,0,0,.35);color:#fff}
.ans.sel{outline:4px solid var(--lampe);outline-offset:2px}
.ans.dim{opacity:.35}
.ans.gone{display:none}
.answers.lock .ans{pointer-events:none}
.timer{height:8px;border-radius:99px;background:rgba(244,239,228,.12);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--lampe);border-radius:99px;transform-origin:left center}
.timer.hurry i{background:var(--bad)}
.timer.off{display:none}
.info{font-size:15px;color:var(--text2);background:rgba(11,15,37,.7);border-left:4px solid var(--lampe);border-radius:0 10px 10px 0;padding:10px 12px;margin:0}
.verdict{font-family:var(--f-disp);font-weight:800;font-size:36px;line-height:1;margin:0}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.steal{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--lampe)) 18%,transparent);border:1.5px solid var(--c,var(--lampe));font-weight:700}

/* Schätzfrage */
.est{display:flex;flex-direction:column;gap:10px}
.est-val{display:flex;align-items:baseline;justify-content:center;gap:8px;font-family:var(--f-disp);font-weight:800;font-size:50px;line-height:1;color:var(--lampe);font-variant-numeric:tabular-nums}
.est-val small{font-size:19px;color:var(--text2);font-weight:700}
.est-row{display:flex;gap:8px;align-items:center}
.est-row button{width:48px;height:48px;border-radius:12px;background:var(--karte);color:var(--tafel);font-family:var(--f-disp);font-weight:800;font-size:26px;flex:none}
.est-row input[type=range]{flex:1;min-width:0;accent-color:var(--lampe);height:36px}
.est-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}

/* Spielstand-Tafel */
.board{display:flex;align-items:stretch;background:var(--tafel);border:1.5px solid var(--linie);border-radius:12px;overflow:hidden}
.board .side{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .side.r{justify-content:flex-end;text-align:right}
.board .side>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid.rev .board .side{display:none}
.mid.rev .board{justify-content:center}
.board .score{font-family:var(--f-disp);font-weight:800;font-size:32px;color:var(--lampe);padding:0 10px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.board .clock{font-weight:700;font-size:13px;color:var(--tafel);background:var(--karte);padding:0 8px;display:flex;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Duell: zwei Hälften, die obere gedreht */
#s-duel{padding:0;gap:0}
.half{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px));position:relative}
.half.top{transform:rotate(180deg);padding-bottom:calc(env(safe-area-inset-top,0px) + 10px)}
.half.bot{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.half .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.half .who{font-family:var(--f-disp);font-weight:800;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half .qtext{font-size:clamp(16px,4.6vw,21px)}
.half .answers{grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}
.half .ans{min-height:52px;font-size:15.5px;padding:8px 10px;gap:8px}
.half .ans .k{width:24px;height:24px;font-size:15px}
.half .est-val{font-size:38px}
.half .msg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.half.pa{background:linear-gradient(0deg,color-mix(in srgb,var(--p1) 16%,transparent),transparent 70%)}
.half.pb{background:linear-gradient(0deg,color-mix(in srgb,var(--p2) 16%,transparent),transparent 70%)}
.half.pa .who{color:var(--p1)}.half.pb .who{color:var(--p2)}
.mid{flex:none;display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-left,0px));background:var(--tafel);border-block:1.5px solid var(--linie)}
.mid .board{flex:1;border:0;border-radius:0}
.mid .icon-btn{width:40px;height:40px}
.stamp{font-family:var(--f-disp);font-weight:800;font-size:24px;padding:6px 14px;border-radius:10px;background:var(--tafel);border:2px solid currentColor;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}.stamp.lampe{color:var(--lampe)}

/* Party: Kategorie und Punkte wählen */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.catbtn{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 12px;border-radius:14px;text-align:left;font-weight:700;font-size:15.5px;line-height:1.15;
  background:rgba(11,15,37,.75);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.catbtn::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.catbtn:active{transform:scale(.98)}
.ptsgrid{display:grid;gap:10px}
.ptsbtn{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r);text-align:left;background:var(--karte);color:var(--tafel);box-shadow:0 4px 0 var(--karte2);transition:transform .08s}
.ptsbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--karte2)}
.ptsbtn b{font-family:var(--f-disp);font-weight:800;font-size:46px;line-height:1;width:40px;text-align:center;color:var(--lampe3)}
.ptsbtn span{display:flex;flex-direction:column;font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1.1}
.ptsbtn small{font-family:var(--f-body);font-weight:600;font-size:14px;color:#5b5f7d}
.hand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.hand .big{font-family:var(--f-disp);font-weight:800;font-size:clamp(44px,14vw,76px);line-height:.95;letter-spacing:-.02em;overflow-wrap:anywhere}
.joker{display:flex;gap:8px}
.joker button{flex:1;min-height:42px;border-radius:11px;border:1.5px dashed var(--lampe);color:var(--lampe);font-weight:700;font-size:15px}
.joker button[disabled]{opacity:.3;border-style:solid}

/* Quizmaster */
.qmopts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.qmopts li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(246,240,228,.08);border:1.5px solid var(--linie);font-weight:600;font-size:18px}
.qmopts li .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;background:var(--karte);color:var(--tafel)}
.qmopts li.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.qmopts li.dim{opacity:.4}
.answer-big{font-family:var(--f-disp);font-weight:800;font-size:34px;color:var(--ok);line-height:1.05;margin:0;text-wrap:balance}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whob{display:flex;align-items:center;gap:9px;min-height:52px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--linie);background:rgba(11,15,37,.7);font-weight:700;text-align:left;min-width:0}
.whob .dot{width:12px;height:12px;border-radius:50%;flex:none}
.whob span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whob.on{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.whob.on::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}

/* Tabellen & Siegertreppchen */
.table{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(11,15,37,.72);border:1px solid var(--linie)}
.trow .pl{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--text2);text-align:center}
.trow .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;min-width:0}
.trow .nm .dot{width:11px;height:11px;border-radius:50%;flex:none}
.trow .pt{font-family:var(--f-disp);font-weight:800;font-size:24px;color:var(--lampe);font-variant-numeric:tabular-nums}
.trow .plus{font-size:13px;font-weight:700;color:var(--ok);margin-right:6px}
.trow.me{border-color:var(--lampe)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:10px 10px 0 0;background:var(--karte);color:var(--tafel);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-family:var(--f-disp);font-weight:800}
.pod .blk b{font-size:32px;line-height:1}
.pod .blk small{font-size:15px}
.pod.p1 .blk{height:130px;background:var(--lampe)}
.pod.p2 .blk{height:96px}
.pod.p3 .blk{height:72px;background:#d9a77c}

/* Online & Challenge */
.codebox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border-radius:var(--r);background:var(--tafel);border:1.5px solid var(--linie)}
.codebox b{font-family:var(--f-disp);font-weight:800;font-size:60px;letter-spacing:.18em;color:var(--lampe);line-height:1;padding-left:.18em}
.codebox.long b{font-size:clamp(34px,11vw,52px);letter-spacing:.06em;padding-left:.06em;white-space:nowrap}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:rgba(11,15,37,.72);border:1.5px solid var(--linie);font-weight:700}
.person .dot{width:10px;height:10px;border-radius:50%}
.person.done{border-color:var(--ok)}
.note{font-size:14px;color:var(--text2);background:rgba(11,15,37,.6);border:1px dashed var(--linie);border-radius:12px;padding:10px 12px;margin:0}

/* Konto, Statistik, Verlauf */
.acct{display:flex;align-items:center;gap:8px;min-height:44px;max-width:62%;padding:0 14px 0 6px;border-radius:99px;border:1px solid var(--linie);background:rgba(11,15,37,.6);font-weight:700;font-size:15px}
.acct .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lampe);color:#2a1a00;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:16px}
.acct span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(11,15,37,.72);border:1.5px solid var(--linie);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-family:var(--f-disp);font-weight:800;font-size:32px;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums}
.tile small{color:var(--text2);font-size:13px}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.barrow span{font-weight:600;font-size:15px;min-width:0}
.barrow em{font-style:normal;color:var(--text2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.barrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(244,239,228,.1);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:4px;background:var(--lampe)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(11,15,37,.72);border:1px solid var(--linie)}
.hrow .d{color:var(--text3);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .w{min-width:0;font-size:14.5px}
.hrow .w b{display:block;font-weight:700}
.hrow .w small{display:block;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{font-family:var(--f-disp);font-weight:800;font-size:19px;color:var(--lampe);white-space:nowrap}
.linkbtn{color:var(--lampe);font-weight:700;text-decoration:underline;align-self:flex-start;min-height:44px}
#accForm .lbl{margin-bottom:-6px}

/* Großer Einblender */
#ovl{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;padding:0 16px}
#ovl .t{font-family:var(--f-disp);font-weight:800;font-size:clamp(56px,18vw,120px);line-height:.9;letter-spacing:-.03em;text-align:center;color:var(--lampe);
  text-shadow:0 0 40px rgba(255,192,77,.5);animation:boom 1.5s cubic-bezier(.2,.9,.2,1) forwards}
#ovl .t small{display:block;font-size:.3em;letter-spacing:0;color:var(--text);text-shadow:0 2px 8px rgba(0,0,0,.6);margin-top:.3em}
#ovl.rot180 .t{rotate:180deg}
@keyframes boom{0%{transform:scale(.3);opacity:0}18%{transform:scale(1.08);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);max-width:calc(100% - 32px);z-index:60;
  background:var(--karte);color:var(--tafel);font-weight:700;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:opacity .25s;opacity:0;pointer-events:none}
#toast.on{opacity:1}
.fade-in{animation:fin .25s ease-out}
@keyframes fin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (min-height:760px){.half .ans{min-height:60px}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=Math.random;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,1|t);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r=R){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickOne=(a,r=R)=>a[Math.floor(r()*a.length)];
function fmtN(n,q){return q&&q.u==='Jahr'?String(n):Number(n).toLocaleString('de-DE')}
function estStep(q){const span=q.hi-q.lo;return span<=200?1:Math.pow(10,Math.floor(Math.log10(span/200)))}
/* Startwert zufällig, aber mit deutlichem Abstand zur Lösung */
function estStart(q){const st=estStep(q),span=q.hi-q.lo,gap=Math.max(q.tol*3,span*.15);
  for(let i=0;i<40;i++){const x=Math.round((q.lo+R()*span)/st)*st;if(x>=q.lo&&x<=q.hi&&Math.abs(x-q.v)>gap)return x}
  return Math.abs(q.lo-q.v)>Math.abs(q.hi-q.v)?q.lo:q.hi}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}}

/* ---------- Ton ---------- */
let AC=null;
function audio(){if(!SET.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){return null}return AC}
function tone(a,f,t,dur,type,vol,f2){const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function applause(a,t,dur,vol){const sr=a.sampleRate,n=Math.floor(sr*dur),b=a.createBuffer(1,n,sr),d=b.getChannelData(0);let env=0;
  for(let i=0;i<n;i++){if(Math.random()<.004)env=Math.min(1,env+.7);env*=.9985;d[i]=(Math.random()*2-1)*env}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1700;f.Q.value=.6;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.12);g.gain.setValueAtTime(vol,t+dur*.45);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t)}
function gong(a,t){for(const [f,v] of [[196,.16],[293.7,.09],[392,.06],[587,.03]]){const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+2.05)}}
function sfx(k){const a=audio();if(!a)return;const t=a.currentTime+.01;
  if(k==='tap')tone(a,540,t,.05,'triangle',.07);
  else if(k==='ok'){tone(a,660,t,.14,'triangle',.16);tone(a,990,t+.09,.22,'triangle',.14)}
  else if(k==='right'){tone(a,784,t,.16,'triangle',.16);tone(a,1175,t+.1,.3,'triangle',.15);applause(a,t+.05,1.1,.12)}
  else if(k==='bad'){tone(a,200,t,.22,'sawtooth',.09,140);tone(a,150,t+.12,.28,'sawtooth',.08,100)}
  else if(k==='tick')tone(a,1100,t,.04,'square',.04);
  else if(k==='lock')tone(a,420,t,.08,'square',.06);
  else if(k==='start'){tone(a,523,t,.16,'triangle',.13);tone(a,659,t+.12,.16,'triangle',.13);tone(a,784,t+.24,.36,'triangle',.14)}
  else if(k==='reveal'){tone(a,659,t,.12,'triangle',.13);tone(a,988,t+.13,.4,'triangle',.14)}
  else if(k==='gong')gong(a,t);
  else if(k==='end'){[523,659,784,1047].forEach((f,i)=>tone(a,f,t+i*.14,i===3?.7:.18,'square',.05));applause(a,t+.45,2.2,.16)}
}

/* ---------- Bildschirm-Wachhalten ---------- */
let WAKE=null;
async function wake(on){try{if(on&&!WAKE&&navigator.wakeLock){WAKE=await navigator.wakeLock.request('screen');WAKE.addEventListener('release',()=>{WAKE=null})}else if(!on&&WAKE){await WAKE.release();WAKE=null}}catch(_){WAKE=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&GAME)wake(true)});

/* ---------- Fragen ziehen ---------- */
function drawQ(pred){
  let c=Q.filter(q=>pred(q)&&!USED.has(q.id)&&!SEEN.has(q.id));
  if(!c.length){c=Q.filter(q=>pred(q)&&!USED.has(q.id));for(const q of c)SEEN.delete(q.id)}
  if(!c.length)return null;
  const q=pickOne(c);USED.add(q.id);SEEN.add(q.id);saveSeen();return q;
}
/* n Fragen, Kategorien möglichst verteilt, Schwierigkeit steigt leicht an */
function diffPlan(n,r=R){const a=[];for(let i=0;i<n;i++){const p=i/Math.max(1,n-1);a.push(p<.3?1:p<.72?2:3)}
  for(let i=0;i<a.length-1;i++)if(r()<.3)[a[i],a[i+1]]=[a[i+1],a[i]];return a}
function drawAny(d,pred){const c=pickOne(SET.cats);return drawQ(x=>x.c===c&&(!d||x.d===d)&&(!pred||pred(x)))||drawQ(x=>SET.cats.includes(x.c)&&(!d||x.d===d)&&(!pred||pred(x)))||drawQ(()=>true)}
function drawSet(n,cats){
  const plan=diffPlan(n);let cyc=[];const out=[];
  for(let i=0;i<n;i++){
    if(!cyc.length)cyc=shuffle(cats.slice());
    const c=cyc.pop(),d=plan[i];
    const q=drawQ(x=>x.c===c&&x.d===d)||drawQ(x=>x.c===c)||drawQ(x=>cats.includes(x.c)&&x.d===d)||drawQ(x=>cats.includes(x.c))||drawQ(()=>true);
    if(q)out.push(q);
  }
  return out;
}

/* ---------- Bausteine für Fragen ---------- */
function qHead(q,extra){return '<div class="hd-cat"><span class="cat" style="--c:'+CATS[q.c].c+'">'+CATS[q.c].n+'</span><span class="diff" aria-label="Schwierigkeit '+q.d+' von 3">'+[1,2,3].map(i=>'<u class="'+(i<=q.d?'on':'')+'"></u>').join('')+'</span>'+(extra||'')+'</div>'}
function ansHTML(q,order,attr){return '<div class="answers">'+order.map((oi,k)=>'<button class="ans" '+attr+'="'+oi+'"><span class="k">'+'ABCD'[k]+'</span><span>'+esc(q.opts[oi])+'</span></button>').join('')+'</div>'}
function estHTML(q,key,btnAttr){const st=estStep(q),v=estStart(q);
  return '<div class="est" data-est="'+key+'" data-q="'+q.id+'"><div class="est-val"><span class="num">'+fmtN(v,q)+'</span>'+(q.u&&q.u!=='Jahr'?'<small>'+esc(q.u)+'</small>':'')+'</div>'+
  '<div class="est-row"><button data-estd="-1" aria-label="weniger">−</button><input type="range" aria-label="Schätzwert" min="'+q.lo+'" max="'+q.hi+'" step="'+st+'" value="'+v+'"><button data-estd="1" aria-label="mehr">+</button></div>'+
  '<div class="est-scale"><span>'+fmtN(q.lo,q)+'</span><span>'+fmtN(q.hi,q)+'</span></div>'+
  '<button class="btn small" '+btnAttr+'>Tipp abgeben</button></div>'}
function estVal(box){return +box.querySelector('input[type=range]').value}
function estOk(q,x){return Math.abs(x-q.v)<=q.tol}
document.addEventListener('input',e=>{if(e.target.matches('.est input[type=range]')){const box=e.target.closest('.est');const q=Q[+box.dataset.q];box.querySelector('.est-val span').textContent=fmtN(+e.target.value,q)}});
function estNudge(btn){const box=btn.closest('.est'),inp=box.querySelector('input[type=range]'),q=Q[+box.dataset.q];if(!q||box.classList.contains('lock'))return;
  const st=estStep(q);inp.value=Math.min(q.hi,Math.max(q.lo,+inp.value+(+btn.dataset.estd)*st));box.querySelector('.est-val span').textContent=fmtN(+inp.value,q);sfx('tap')}
function optOrder(q,r=R){return shuffle(q.opts.map((_,i)=>i),r)}
function correctText(q){return q.est?fmtN(q.v,q)+(q.u&&q.u!=='Jahr'?' '+q.u:''):q.opts[0]}

/* ---------- Timer (ein gemeinsamer Takt) ---------- */
let TM=null;
function startTimer(sec,bars,onEnd){TM={t0:performance.now(),dur:sec*1000,bars,onEnd,last:99}}
function stopTimer(){TM=null}
function timeLeft(){return TM?Math.max(0,TM.dur-(performance.now()-TM.t0)):0}
function loop(){
  requestAnimationFrame(loop);
  if(!TM)return;
  const el=performance.now()-TM.t0,left=Math.max(0,1-el/TM.dur);
  for(const b of TM.bars){if(!b.isConnected)continue;b.firstElementChild.style.transform='scaleX('+left+')';b.classList.toggle('hurry',left<.25)}
  const s=Math.ceil((TM.dur-el)/1000);if(s<=3&&s>0&&s!==TM.last){TM.last=s;sfx('tick')}
  if(el>=TM.dur){const f=TM.onEnd;TM=null;if(f)f()}
}
requestAnimationFrame(loop);

/* ==========================================================================
   DUELL: zwei Spieler, ein Handy, Buzzer-Prinzip
   ========================================================================== */
let D=null;
function duelSetup(){
  page(topBar('Duell')+
  '<h2>Zwei Spieler, ein Handy</h2><p class="lead">Legt das Handy zwischen euch. Jeder hat seine eigene Hälfte. Wer zuerst die richtige Antwort tippt, bekommt den Punkt. Wer danebentippt, ist für diese Frage gesperrt.</p>'+
  '<div class="card"><span class="lbl">Spieler</span><div class="plist">'+
  '<div class="prow"><span class="dot" style="background:var(--p1)"></span><input class="inp" id="dn0" maxlength="14" placeholder="Spieler oben" value="'+esc(SET.duel[0])+'"></div>'+
  '<div class="prow"><span class="dot" style="background:var(--p2)"></span><input class="inp" id="dn1" maxlength="14" placeholder="Spieler unten" value="'+esc(SET.duel[1])+'"></div></div></div>'+
  '<div class="card"><span class="lbl">Spiellänge</span>'+seg('duelN',[5,10,15],v=>v+' Fragen')+'</div>'+
  '<div class="card"><span class="lbl">Kategorien</span>'+catChips()+'</div>'+
  '<button class="btn" data-act="duelGo">Los geht\'s</button>');
}
ACT.duelGo=()=>{
  SET.duel=[$('#dn0').value.trim(),$('#dn1').value.trim()];saveSet();
  duelBegin([SET.duel[0]||'Spieler 1',SET.duel[1]||'Spieler 2'],SET.duelN);
};
function duelBegin(names,n){
  clearLater();USED=new Set();
  D={names,n,score:[0,0],i:-1,qs:drawSet(n,SET.cats),sudden:0,ph:'',q:null};
  GAME='duel';wake(true);show('duel');
  $('#dTop').innerHTML='';$('#dBot').innerHTML='';duelBoard();
  sfx('start');ovl('Los!');later(1200,duelNext);
}
function duelMinute(){return D.sudden?'Stechen':(D.i+1)+'/'+D.n}
function duelBoard(){
  const rev=D.ph==='rev';
  $('#dBoard').innerHTML='<div class="side"><span>'+esc(D.names[0])+'</span></div><div class="score"><span>'+D.score[0]+'</span>:<span>'+D.score[1]+'</span></div><div class="side r"><span>'+esc(D.names[1])+'</span></div><div class="clock">'+(D.i<0?'0/'+D.n:duelMinute())+'</div>';
  const mid=$('#s-duel .mid');mid.classList.toggle('rev',rev);let nb=mid.querySelector('.nextb');
  if(rev&&!nb){nb=document.createElement('button');nb.className='btn small nextb';nb.dataset.act='duelNext';nb.textContent='Weiter';mid.insertBefore(nb,mid.lastElementChild)}
  if(!rev&&nb)nb.remove();
}
ACT.duelNext=()=>{if(D&&D.ph==='rev')duelNext()};
function duelNext(){
  if(!D)return;
  D.i++;
  if(D.i>=D.qs.length&&!D.sudden){
    if(D.score[0]===D.score[1]){D.sudden=1;D.ph='pause';duelBoard();sfx('gong');ovl('Stechen<small>Wer zuerst richtig liegt, gewinnt</small>');later(1900,duelSudden);return}
    return duelEnd();
  }
  if(D.sudden)return duelSudden();
  duelAsk(D.qs[D.i]);
}
function duelSudden(){
  if(D.score[0]!==D.score[1]||D.sudden>6)return duelEnd();
  D.sudden++;const q=drawAny(0,x=>!x.est);if(!q)return duelEnd();duelAsk(q);
}
function duelAsk(q){
  D.q=q;D.ph='q';D.lock=[false,false];D.wrong=[false,false];D.order=q.est?null:optOrder(q);D.estv=[null,null];
  duelBoard();
  for(const p of [0,1]){
    const h=p?$('#dBot'):$('#dTop');
    h.innerHTML='<div class="hd"><span class="who">'+esc(D.names[p])+'</span>'+qHead(q)+'</div><div class="timer"><i></i></div><p class="qtext">'+esc(q.q)+'</p>'+
      (q.est?estHTML(q,p,'data-tap="dEst" data-v="'+p+'"'):ansHTML(q,D.order,'data-tap="dAns" data-p="'+p+'" data-v'))+'<div class="msg"></div>';
  }
  startTimer(q.est?22:15,[...document.querySelectorAll('#s-duel .timer')],()=>duelReveal('time'));
}
function half(p){return p?$('#dBot'):$('#dTop')}
function stamp(p,cls,txt){const m=half(p).querySelector('.msg');if(m)m.innerHTML='<span class="stamp '+cls+'">'+txt+'</span>'}
TAP.dAns=(v,b)=>{
  if(!D||D.ph!=='q')return;const p=+b.dataset.p,oi=+v;if(D.lock[p])return;
  D.lock[p]=true;
  if(oi===0){D.score[p]++;duelReveal('goal',p);return}
  D.wrong[p]=true;sfx('bad');vib(60);
  /* falsche Wahl auf beiden Seiten zeigen */
  for(const q of [0,1])for(const el of half(q).querySelectorAll('.ans'))if(+el.dataset.v===oi)el.classList.add(q===p?'bad':'dim');
  half(p).querySelector('.answers').classList.add('lock');stamp(p,'bad','Gesperrt');
  if(D.lock[0]&&D.lock[1])duelReveal('none');
};
TAP.dEst=(v,b)=>{
  if(!D||D.ph!=='q')return;const p=+v;if(D.lock[p])return;
  const box=half(p).querySelector('.est');D.lock[p]=true;D.estv[p]=estVal(box);box.classList.add('lock');
  box.querySelector('input').disabled=true;b.disabled=true;b.textContent='Tipp steht: '+fmtN(D.estv[p],D.q);sfx('lock');
  if(D.lock[0]&&D.lock[1])duelReveal('est');
};
function duelReveal(why,p){
  if(D.ph!=='q')return;D.ph='rev';stopTimer();const q=D.q;
  if(q.est){
    for(const k of [0,1])if(D.estv[k]==null)D.estv[k]=estVal(half(k).querySelector('.est'));
    const e=D.estv.map(x=>Math.abs(x-q.v));const win=e[0]<e[1]?[0]:e[1]<e[0]?[1]:[0,1];
    for(const k of win)D.score[k]++;
    for(const k of [0,1]){const box=half(k).querySelector('.est');box.classList.add('lock');
      box.innerHTML='<div class="est-val"><span class="num">'+fmtN(q.v,q)+'</span>'+(q.u&&q.u!=='Jahr'?'<small>'+esc(q.u)+'</small>':'')+'</div><p class="lead" style="text-align:center">'+
        esc(D.names[0])+': '+fmtN(D.estv[0],q)+' · '+esc(D.names[1])+': '+fmtN(D.estv[1],q)+'</p>';
      stamp(k,win.includes(k)?'ok':'bad',win.includes(k)?'Näher dran!':'Zu weit weg')}
    sfx('right');vib([40,40,80]);
  }else{
    for(const k of [0,1]){const a=half(k).querySelector('.answers');a.classList.add('lock');
      for(const el of a.querySelectorAll('.ans'))if(+el.dataset.v===0)el.classList.add('ok');else if(!el.classList.contains('bad'))el.classList.add('dim')}
    if(why==='goal'){sfx('right');vib([40,40,80]);stamp(p,'ok','Richtig!');stamp(1-p,'bad',D.wrong[1-p]?'Gesperrt':'Zu langsam')}
    else{sfx('bad');for(const k of [0,1])if(!D.wrong[k])stamp(k,'lampe',why==='time'?'Zeit um':'Keiner richtig')}
  }
  if(q.info)for(const k of [0,1]){const t=half(k).querySelector('.qtext');t.insertAdjacentHTML('afterend','<p class="info" style="font-size:13.5px;padding:7px 10px">'+esc(q.info)+'</p>')}
  duelBoard();
  if(D.sudden&&D.score[0]!==D.score[1])later(2600,duelEnd);
}
function duelEnd(){
  stopTimer();D.ph='end';GAME=null;wake(false);sfx('end');

function markAnswers(root,q,chosen){
  const a=root.querySelector('.answers');if(!a)return;a.classList.add('lock');
  for(const el of a.querySelectorAll('.ans')){const oi=+el.dataset.v;if(oi===0)el.classList.add('ok');else if(oi===chosen)el.classList.add('bad');else el.classList.add('dim')}
}
function lockEst(root,q,x){const box=root.querySelector('.est');if(!box)return;box.classList.add('lock');
  box.innerHTML='<div class="est-val"><span class="num">'+fmtN(q.v,q)+'</span>'+(q.u&&q.u!=='Jahr'?'<small>'+esc(q.u)+'</small>':'')+'</div>'+
  '<p class="lead" style="text-align:center">'+(x==null?'Kein Tipp abgegeben':'Dein Tipp: '+fmtN(x,q)+' · '+(x===q.v?'genau richtig!':'daneben um '+fmtN(Math.abs(x-q.v),q)))+'<br>Als richtig zählt alles bis ±'+fmtN(q.tol,q)+'</p>'}
function resultBlock(ok,title,sub,q,btnAct,btnTxt){
  return '<div class="fade-in" style="display:flex;flex-direction:column;gap:12px"><div><p class="verdict '+(ok?'ok':'bad')+'">'+title+'</p>'+(sub?'<p class="lead">'+sub+'</p>':'')+'</div>'+
    (q.info?'<p class="info">'+esc(q.info)+'</p>':'')+'<button class="btn" data-act="'+btnAct+'">'+btnTxt+'</button></div>'}
function rankList(list){const s=list.slice().sort((a,b)=>b.s-a.s);let last=null,pl=0;return s.map((p,i)=>{if(p.s!==last){pl=i+1;last=p.s}return Object.assign({pl},p)})}
function tableHTML(list,meKey){return '<div class="table">'+rankList(list).map(p=>'<div class="trow'+(meKey!=null&&p.k===meKey?' me':'')+'"><span class="pl">'+p.pl+'</span><span class="nm"><span class="dot" style="background:'+p.c+'"></span>'+esc(p.n)+'</span><span class="pt">'+(p.plus?'<span class="plus">+'+p.plus+'</span>':'')+p.s+'</span></div>').join('')+'</div>'}
function podiumHTML(list){const r=rankList(list);const slot=(p,k)=>p?'<div class="pod p'+k+'"><span class="nm" style="color:'+p.c+'">'+esc(p.n)+'</span><div class="blk"><b>'+p.pl+'</b><small>'+p.s+'</small></div></div>':'<div></div>';
  return '<div class="podium">'+slot(r[1],2)+slot(r[0],1)+slot(r[2],3)+'</div>'}

function togHTML(key,title,desc){return '<button class="tog" data-act="tog" data-v="'+key+'" aria-pressed="'+(!!SET[key])+'"><b>'+title+'</b><span>'+desc+'</span><i class="sw"></i></button>'}
ACT.tog=(v,b)=>{SET[v]=!SET[v];saveSet();b.setAttribute('aria-pressed',String(SET[v]))};
const TEAMKEY={party:'partyTeams',qm:'qmTeams'};
function nameRows(key){const team=!!SET[TEAMKEY[key]];return SET[key].map((n,i)=>'<div class="prow"><span class="dot" style="background:'+PCOL[i]+'"></span><input class="inp" data-pk="'+key+'" data-pi="'+i+'" maxlength="16" placeholder="'+(team?'Team ':'Spieler ')+(i+1)+'" value="'+esc(n)+'">'+

function readNames(key){for(const el of document.querySelectorAll('[data-pk="'+key+'"]'))SET[key][+el.dataset.pi]=el.value.trim()}
function redrawNames(key){$('#plist').innerHTML=nameRows(key);const l=$('#plbl');if(l)l.textContent=SET[TEAMKEY[key]]?'Teams':'Spieler'}
function namesCard(key){return '<div class="card">'+seg(TEAMKEY[key],[0,1],v=>v?'In Teams':'Jeder für sich')+'<span class="lbl" id="plbl">'+(SET[TEAMKEY[key]]?'Teams':'Spieler')+'</span><div class="plist" id="plist">'+nameRows(key)+'</div><button class="btn ghost small" data-act="pAdd" data-v="'+key+'">+ Hinzufügen</button></div>'}
function onSeg(k){for(const key in TEAMKEY)if(TEAMKEY[key]===k){readNames(key);redrawNames(key)}}
ACT.pAdd=v=>{readNames(v);if(SET[v].length>=8)return toast('Höchstens 8 Mitspieler oder Teams.');SET[v].push('');saveSet();redrawNames(v);const l=document.querySelectorAll('[data-pk="'+v+'"]');l[l.length-1].focus()};
ACT.pDel=v=>{const[k,i]=v.split(':');readNames(k);SET[k].splice(+i,1);saveSet();redrawNames(k)};
function makePlayers(key){const team=!!SET[TEAMKEY[key]];return SET[key].map((n,i)=>({k:i,n:n||(team?'Team ':'Spieler ')+(i+1),c:PCOL[i],s:0,j:true,plus:0}))}
function endScreen(list,again){
  for(const x of list)x.plus=0;const r=rankList(list),win=r.filter(x=>x.pl===1);
  page(topBar('Endstand')+'<div class="hand" style="flex:0;padding-top:6px"><span class="lbl">'+(win.length>1?'Geteilter Sieg':'Gewonnen hat')+'</span><div class="big" style="color:'+win[0].c+'">'+win.map(x=>esc(x.n)).join(' & ')+'</div></div>'+
    podiumHTML(list)+tableHTML(list)+'<button class="btn" data-act="'+again+'">Nochmal spielen</button><button class="btn ghost" data-act="home">Zum Menü</button>');

ACT.partyGo2=()=>{clearLater();USED=new Set();P=Object.assign(P,{pl:P.pl.map(x=>Object.assign({},x,{s:0,j:true,plus:0})),r:0,t:0,q:null});GAME='party';wake(true);sfx('start');partyHand()};
function partyHand(){

    '<div class="hand"><span class="lbl">'+(P.teams?'Jetzt ist dran':'Handy weitergeben an')+'</span><div class="big" style="color:'+p.c+'">'+esc(p.n)+'</div>'+

ACT.pReady=()=>{if(P.catSel)partyCats();else{P.cat=null;partyPoints()}};
function partyCats(){

}
ACT.pCat=v=>{P.cat=v;partyPoints()};
function partyPoints(){
  const p=P.pl[P.t];
  page(topBar('Am Zug: '+esc(p.n),'quit')+'<h2>Wie viele Punkte?</h2>'+
    (P.cat?'<span class="cat" style="--c:'+CATS[P.cat].c+'">'+CATS[P.cat].n+'</span>':'<p class="lead">Die Kategorie wird zugelost.</p>')+

}
ACT.pPts=v=>{
  const d=+v,c=P.cat||pickOne(SET.cats);P.pts=d;
  P.q=drawQ(x=>x.c===c&&x.d===d)||drawQ(x=>x.c===c)||drawQ(x=>SET.cats.includes(x.c)&&x.d===d)||drawQ(()=>true);
  P.order=P.q.est?null:optOrder(P.q);P.gone=[];P.firstWrong=null;partyAsk(P.t);
};
function partyAsk(who){
  const p=P.pl[who],q=P.q,steal=who!==P.t;P.done=false;P.who=who;
  page(topBar(steal?'Klau-Chance':esc(p.n)+' · '+PTS[P.pts].n,'quit')+
    '<div id="qa" style="display:flex;flex-direction:column;gap:14px">'+
    (steal?'<div class="steal" style="--c:'+p.c+'">'+esc(p.n)+' kann '+PTS[P.pts].n+' klauen</div>':'')+
    qHead(q)+'<div class="timer'+(P.T?'':' off')+'"><i></i></div><p class="qtext">'+esc(q.q)+'</p>'+
    (q.est?estHTML(q,'p','data-act="pEst"'):ansHTML(q,P.order,'data-act="pAns" data-v')+
      (P.joker&&!steal?'<div class="joker"><button data-act="pJoker"'+(p.j?'':' disabled')+'>50:50-Joker'+(p.j?'':' (verbraucht)')+'</button></div>':''))+'</div>');
  for(const el of document.querySelectorAll('#qa .ans')){const v=+el.dataset.v;if(!steal&&P.gone.includes(v))el.classList.add('gone');if(steal&&v===P.firstWrong){el.classList.add('bad');el.disabled=true}}
  if(P.T)startTimer(q.est?Math.max(P.T,20):P.T,[$('#qa .timer')],()=>partyResult(null,true));
}
ACT.pJoker=(v,b)=>{
  const p=P.pl[P.t];if(!p.j||P.done)return;p.j=false;b.disabled=true;b.textContent='50:50-Joker (verbraucht)';sfx('lock');
  const wrong=shuffle([...document.querySelectorAll('#qa .ans')].filter(el=>+el.dataset.v!==0));
  for(const el of wrong.slice(0,Math.max(0,wrong.length-1))){el.classList.add('gone');P.gone.push(+el.dataset.v)}
};
ACT.pAns=v=>partyResult(+v);
ACT.pEst=()=>partyResult(estVal($('#qa .est')));
function partyResult(choice,timeout){
  if(P.done)return;P.done=true;stopTimer();
  const who=P.who,p=P.pl[who],q=P.q,root=$('#qa');let ok,x=null;
  if(q.est){x=timeout?estVal(root.querySelector('.est')):choice;ok=estOk(q,x)}else ok=choice===0;
  const j=root.querySelector('.joker');if(j)j.remove();
  /* Klau-Regel: der oder die Nächste bekommt eine Chance */
  if(!ok&&P.steal&&who===P.t&&P.pl.length>1){
    const nx=P.pl[(P.t+1)%P.pl.length];
    if(q.est){const box=root.querySelector('.est');box.classList.add('lock');box.querySelector('input').disabled=true;const b=box.querySelector('.btn');b.disabled=true;b.textContent='Tipp: '+fmtN(x,q)}
    else{root.querySelector('.answers').classList.add('lock');if(choice!=null){P.firstWrong=choice;for(const el of root.querySelectorAll('.ans'))if(+el.dataset.v===choice)el.classList.add('bad')}}
    sfx('bad');vib(60);
    root.insertAdjacentHTML('beforeend','<div class="fade-in" style="display:flex;flex-direction:column;gap:12px"><p class="verdict bad">'+(timeout?'Zeit abgelaufen':q.est?'Zu weit weg':'Falsch')+'</p>'+
      '<div class="steal" style="--c:'+nx.c+'">Klau-Chance für '+esc(nx.n)+'</div><button class="btn" data-act="pSteal">'+esc(nx.n)+' antwortet</button></div>');
    return;
  }
  if(q.est)lockEst(root,q,x);else markAnswers(root,q,choice);
  if(ok){p.s+=P.pts;p.plus=P.pts;sfx('right');vib([40,40,80])}else{sfx('bad');vib(60)}
  const last=P.t===P.pl.length-1&&P.r===P.R-1,stolen=who!==P.t;
  root.insertAdjacentHTML('beforeend',resultBlock(ok,ok?(stolen?'Geklaut! +':'Richtig! +')+P.pts:timeout?'Zeit abgelaufen':'Falsch',
    ok?esc(p.n)+' hat jetzt '+p.s+(p.s===1?' Punkt.':' Punkte.'):q.est?'':'Richtig ist: '+esc(correctText(q)),q,'pNext',last?'Zum Endstand':'Weiter'));
}
ACT.pSteal=()=>partyAsk((P.t+1)%P.pl.length);
ACT.pNext=()=>{
  P.t++;
  if(P.t>=P.pl.length){P.t=0;P.r++;
    if(P.r>=P.R){GAME=null;wake(false);sfx('end');return endScreen(P.pl,'partyGo2')}
    page(topBar('Tabelle','quit')+'<h2>Nach Runde '+P.r+' von '+P.R+'</h2>'+tableHTML(P.pl)+'<button class="btn" data-act="pTab">Nächste Runde</button>');
    return;
  }
  partyHand();
};

    '<span class="lbl">'+(q.est?'Wer lag richtig oder am nächsten?':'Wer lag richtig?')+'</span><div class="who-grid">'+
    M.pl.map((p,i)=>'<button class="whob" data-act="qmWho" data-v="'+i+'"><span class="dot" style="background:'+p.c+'"></span><span>'+esc(p.n)+'</span></button>').join('')+'</div>'+

ACT.qmWho=(v,b)=>{const i=+v;if(M.right.has(i))M.right.delete(i);else M.right.add(i);b.classList.toggle('on',M.right.has(i));sfx('tap');
  $('#qmGive').textContent=M.right.size?ptsTxt(qmPts(M.qs[M.i]))+' vergeben':'Weiter ohne Punkte'};
ACT.qmGive=()=>{
  const pts=qmPts(M.qs[M.i]);for(const x of M.pl)x.plus=0;for(const i of M.right){M.pl[i].s+=pts;M.pl[i].plus=pts}if(M.right.size)sfx('right');
  M.i++;
  if(M.i>=M.qs.length){GAME=null;wake(false);sfx('end');return endScreen(M.pl,'qmGo2')}
  if(M.i%5===0){page(topBar('Zwischenstand','quit')+'<h2>Nach '+M.i+' von '+M.qs.length+' Fragen</h2>'+tableHTML(M.pl)+'<button class="btn" data-act="qmNext">Nächste Frage</button>');return}
  qmAsk();
};
ACT.qmNext=()=>qmAsk();

/* ==========================================================================
   CHALLENGE: zehn Fragen allein, Code an Freunde schicken
   ========================================================================== */
let C=null;
const CH_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function chCode(c){let s='',x=c.seed;for(let i=0;i<4;i++){s=CH_ALPHA[x&31]+s;x>>>=5}return c.ver+s}
function chParse(str){
  const m=String(str||'').toUpperCase().replace(/[^A-Z0-9]/g,'').match(/^([A-Z])([A-Z0-9]{4})(\d{0,2})$/);if(!m)return null;
  if(!CH_VER[m[1]])return{old:true};let seed=0;for(const ch of m[2]){const k=CH_ALPHA.indexOf(ch);if(k<0)return null;seed=seed*32+k}
  const sc=m[3]===''?null:+m[3];return{ver:m[1],seed,score:sc!=null&&sc<=10?sc:null};
}
function chQs(ver,seed){

    else{const a=root.querySelector('.answers');a.classList.add('lock');for(const el of a.querySelectorAll('.ans'))el.classList.add(+el.dataset.v===v?'sel':'dim')}
  }
  sfx('lock');stopTimer();oAnswered();if(O.host)oHostCheck();
}
ACT.oAns=v=>oSend(+v);
ACT.oEst=()=>oSend(estVal($('#qa .est')));
function oHasAns(p){if(p.sameTab)return !!O.ans;const a=p.presence&&p.presence.a;return !!a&&a.i===O.g.i}
function oAnswered(){const el=$('#oStat');if(!el)return;
  const ps=oPlayers();const n=ps.filter(oHasAns).length;
  el.innerHTML='<span class="lbl" style="width:100%">'+(O.ans?'Antwort abgegeben · ':'')+n+' von '+ps.length+' haben geantwortet</span>'+ps.map(p=>'<span class="person'+(oHasAns(p)?' done':'')+'"><span class="dot" style="background:'+oColor(p.peer)+'"></span>'+esc(pName(p))+'</span>').join('')}
function oHostCheck(){if(!O||!O.host||O.g.ph!=='q')return;const ps=oPlayers();if(ps.length&&ps.every(oHasAns))later(400,()=>{if(O&&O.g.ph==='q')oHostReveal()})}
function oScore(q,a,t){
  if(!a||a.v==null)return 0;
  if(q.est){const e=Math.abs(a.v-q.v);if(e<=q.tol)return 500+Math.round(500*(1-e/Math.max(q.tol,1e-9)));if(e<=3*q.tol)return Math.round(400*(1-(e-q.tol)/(2*q.tol)));return 0}
  if(a.v!==0)return 0;return 500+Math.round(500*Math.max(0,1-(a.ms||0)/(t*1000)));
}
function oHostReveal(){
  if(!O||!O.host||O.g.ph!=='q')return;clearLater();stopTimer();
  const g=O.g,q=Q[g.q],gain={},pick={};
  for(const p of oPlayers()){const a=p.sameTab?O.ans:(p.presence.a&&p.presence.a.i===g.i?p.presence.a:null);const pts=oScore(q,a,g.t);gain[p.peer]=pts;g.sc[p.peer]=(g.sc[p.peer]||0)+pts;g.nm[p.peer]=pName(p);if(a&&a.v!=null&&!q.est)pick[p.peer]=a.v}
  O.g=Object.assign({},g,{ph:'r',gain,pick});oPush();
  later(11000,()=>{if(O&&O.host&&O.g.ph==='r'&&O.g.i===g.i)ACT.oNext()});
}
ACT.oNext=()=>{
  if(!O||!O.host||O.g.ph!=='r')return;clearLater();const g=O.g,i=g.i+1;
  if(i>=O.qs.length){O.g={ph:'end',b:BUILD,n:g.n,i:g.i,sc:g.sc,nm:g.nm,ep:g.ep};oPush();return}
  O.g={ph:'q',b:BUILD,n:g.n,i,q:O.qs[i].id,sd:Math.floor(R()*1e9),t:O.qs[i].est?25:20,sc:g.sc,nm:g.nm,ep:g.ep};oPush();oHostTimer();
};
function oList(withGain){const g=O.g;return Object.keys(g.sc||{}).map(k=>({k,n:(g.nm&&g.nm[k])||'Gast',c:oColor(k),s:g.sc[k]||0,plus:withGain&&g.gain?g.gain[k]||0:0}))}
function oReveal(){
  const g=O.g,q=Q[g.q];if(!q)return;
  if(O.qi!==g.i)oQuestion();
  O.shown='r'+g.i;stopTimer();
  const root=$('#qa');if(!root)return;const mine=g.gain?g.gain[O.me]||0:0;const ok=mine>0;
  const my=O.ans&&O.ans.i===g.i?O.ans.v:null;
  if(q.est)lockEst(root,q,my);else markAnswers(root,q,my);
  O.log.push({c:q.c,ok:q.est?(my!=null&&estOk(q,my)):my===0});
  const st=$('#oStat');if(st)st.remove();
  if(!q.est){const cnt={};for(const k in (g.pick||{}))cnt[g.pick[k]]=(cnt[g.pick[k]]||0)+1;
    for(const el of root.querySelectorAll('.ans')){const c=cnt[+el.dataset.v]||0;if(c)el.insertAdjacentHTML('beforeend','<span style="margin-left:auto;font-family:var(--f-disp);font-weight:900;font-size:20px">'+c+'×</span>')}}
  ok?sfx('ok'):sfx('bad');vib(ok?30:60);
  root.insertAdjacentHTML('beforeend','<div class="fade-in" style="display:flex;flex-direction:column;gap:12px"><p class="verdict '+(ok?'ok':'bad')+'">'+(ok?'+'+mine+' Punkte':my==null&&!q.est?'Keine Antwort':'Daneben')+'</p>'+
    (!ok&&!q.est?'<p class="lead">Richtig ist: '+esc(correctText(q))+'</p>':'')+(q.info?'<p class="info">'+esc(q.info)+'</p>':'')+
    '<span class="lbl">Zwischenstand</span>'+tableHTML(oList(true),O.me)+
    (O.host?'<button class="btn" data-act="oNext">'+(g.i+1>=g.n?'Zum Endstand':'Nächste Frage')+'</button><p class="lead" style="text-align:center">Geht in ein paar Sekunden von selbst weiter.</p>':'<p class="lead" style="text-align:center">Gleich kommt die nächste Frage.</p>')+'</div>');
}
function oEnd(){
  O.shown='end'+O.g.ep;stopTimer();sfx('end');const list=oList(false),r=rankList(list),me=r.find(x=>x.k===O.me);
  if(O.kind==='fb'&&me&&O.log.length)recordGame({m:'o',log:O.log,pts:me.s,pl:me.pl,of:r.length,win:me.pl===1&&r.length>1,r:O.log.filter(x=>x.ok).length,w:r.filter(x=>x.k!==O.me).map(x=>x.n).join(', ')});
  O.log=[];
  page(topBar('Endstand','quit')+'<div class="hand" style="flex:0;padding-top:6px"><span class="lbl">Sieger</span><div class="big" style="color:var(--lampe)">'+r.filter(x=>x.pl===1).map(x=>esc(x.n)).join(' & ')+'</div>'+
    (me?'<p class="lead">Du bist auf Platz '+me.pl+' von '+r.length+'.</p>':'')+'</div>'+podiumHTML(list)+tableHTML(list,O.me)+
    (O.host?'<button class="btn" data-act="oAgain">Neues Spiel mit allen</button>':'<p class="note">Bleib hier, falls der Gastgeber ein neues Spiel startet.</p>')+'<button class="btn ghost" data-act="home">Verlassen</button>');
}
ACT.oAgain=()=>{if(!O||!O.host)return;const sc={};for(const p of oPlayers())sc[p.peer]=0;O.g={ph:'lobby',b:BUILD,n:SET.onN,i:-1,sc,nm:O.g.nm,ep:O.g.ep};O.qi=-1;O.ans=null;oPush()};
/* ==========================================================================
   KONTO: Anmeldung mit E-Mail und Passwort (Firebase). Pflicht nur für Online.
   Gespeichert werden Statistik, Verlauf, Rangliste und Einstellungen für alle Geräte.
   users/<uid>/{profile,stats,hist,sync} gehört nur dem Spieler, board/<uid> lesen alle Angemeldeten.
   ========================================================================== */
let ACC=null,FBA=null,FBP=null;
const ACC_OK=!IN_CLAUDE&&!!FIREBASE_CONFIG;
function fbBase(){
  if(!FBP)FBP=(async()=>{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    if(!window.firebase)await loadScript(base+'firebase-app-compat.js');
    await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')]);
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();try{auth.languageCode='de'}catch(_){}
    FBA={auth,db:firebase.database()};
    await new Promise(res=>{let first=true;auth.onAuthStateChanged(u=>{acctLoad(u).then(()=>{if(first){first=false;res()}})})});
    return FBA;
  })().catch(e=>{FBP=null;throw e});
  return FBP;
}
async function acctLoad(u){
  if(!u||u.isAnonymous){if(ACC){ACC=null;ST.set('acct',0)}acctUI();return}
  if(ACC&&ACC.uid===u.uid)return;
  ACC={uid:u.uid,email:u.email||'',name:''};
  try{const v=(await FBA.db.ref('users/'+u.uid+'/profile').get()).val()||{};ACC.name=v.n||''}catch(_){}
  if(!ACC.name)ACC.name=(SET.nick||(u.email||'Spieler').split('@')[0]).slice(0,14);
  ST.set('acct',1);acctUI();syncPull();
}
function acctUI(){
  const b=$('#btnAcct');if(!b)return;b.hidden=!ACC_OK;
  b.innerHTML=ACC?'<i class="av">'+esc(ACC.name.slice(0,1).toUpperCase())+'</i><span>'+esc(ACC.name)+'</span>':'<i class="av">?</i><span>Anmelden</span>';
}
if(ACC_OK&&ST.get('acct',0))fbBase().catch(()=>{});
acctUI();

/* ---------- Anmelden / Konto erstellen ---------- */

function authErr(e){const c=e&&e.code||'';return({
  'auth/email-already-in-use':'Zu dieser E-Mail gibt es schon ein Konto. Melde dich damit an.',
  'auth/invalid-email':'Die E-Mail-Adresse stimmt so nicht.','auth/missing-email':'Gib deine E-Mail-Adresse ein.',
  'auth/weak-password':'Das Passwort braucht mindestens 6 Zeichen.','auth/missing-password':'Gib ein Passwort ein.',

  'auth/operation-not-allowed':'Die Anmeldung mit E-Mail ist in Firebase noch nicht eingeschaltet.'}[c]||'Das hat nicht geklappt ('+(c||'unbekannter Fehler')+').')}
function accBusy(on){const b=$('#accGo');if(b){b.disabled=on;b.textContent=on?'Einen Moment …':(ACCV.tab==='new'?'Konto erstellen':'Anmelden')}}

async function acctCreate(){

function acctDone(){toast('Angemeldet als '+ACC.name+'.');if(ACCV.back==='online'){ACCV.back=null;onlineStart()}else acctRender()}
ACT.accReset=async()=>{

/* ---------- Übersicht: Statistik, Stärken, Verlauf ---------- */
function pct(c,a){return a?Math.round(100*c/a):0}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
async function acctOverview(b){
  b.innerHTML='<div class="row" style="align-items:center"><div style="min-width:0"><h2 style="overflow-wrap:anywhere">'+esc(ACC.name)+'</h2><p class="lead">'+esc(ACC.email)+'</p></div></div>'+
    '<div id="accStats"><p class="note">Statistik wird geladen …</p></div>'+
    '<button class="btn" data-act="board" data-v="pts">Rangliste</button>'+
    '<div class="card"><label class="lbl" for="accNewName">Name ändern</label><div class="row"><input class="inp" id="accNewName" maxlength="14" value="'+esc(ACC.name)+'"><button class="btn small ghost" data-act="accName" style="flex:0 0 auto">Speichern</button></div></div>'+
    '<button class="btn ghost" data-act="accOut">Abmelden</button>';
  let s={},h={};
  try{const r=await Promise.all([FBA.db.ref('users/'+ACC.uid+'/stats').get(),FBA.db.ref('users/'+ACC.uid+'/hist').get()]);s=r[0].val()||{};h=r[1].val()||{}}catch(_){}
  const box=$('#accStats');if(!box)return;
  const cats=CAT_KEYS.filter(k=>s.cat&&s.cat[k]&&s.cat[k].a).map(k=>({k,a:s.cat[k].a,c:s.cat[k].c||0})).sort((x,y)=>pct(y.c,y.a)-pct(x.c,x.a)||y.a-x.a);
  const hist=Object.keys(h).sort().reverse().slice(0,15).map(k=>h[k]);
  box.outerHTML='<div style="display:flex;flex-direction:column;gap:16px">'+
    '<div class="tiles">'+
      '<div class="tile"><span class="lbl">Online-Spiele</span><b>'+(s.games||0)+'</b><small>davon '+(s.wins||0)+' gewonnen</small></div>'+
      '<div class="tile"><span class="lbl">Richtig</span><b>'+(s.a?pct(s.c||0,s.a)+' %':'–')+'</b><small>'+(s.c||0)+' von '+(s.a||0)+' Fragen</small></div>'+
      '<div class="tile"><span class="lbl">Online-Punkte</span><b>'+Number(s.pts||0).toLocaleString('de-DE')+'</b><small>insgesamt</small></div>'+
      '<div class="tile"><span class="lbl">Challenge</span><b>'+(s.cg?(s.cb||0)+'/10':'–')+'</b><small>'+(s.cg?'Bestwert aus '+s.cg+(s.cg===1?' Runde':' Runden'):'noch nicht gespielt')+'</small></div>'+
    '</div>'+
    '<div class="card"><span class="lbl">Stärken und Schwächen</span>'+(cats.length?'<div class="bars">'+cats.map(x=>'<div class="barrow"><span>'+CATS[x.k].n+'</span><em>'+x.c+' von '+x.a+' · '+pct(x.c,x.a)+' %</em><div class="track" role="img" aria-label="'+CATS[x.k].n+': '+pct(x.c,x.a)+' Prozent richtig"><i style="width:'+(x.c?Math.max(2,pct(x.c,x.a)):0)+'%"></i></div></div>').join('')+'</div>'
      :'<p class="lead">Spiel online oder eine Challenge, dann siehst du hier, in welchen Kategorien du stark bist.</p>')+'</div>'+
    '<div class="card"><span class="lbl">Verlauf</span>'+(hist.length?'<div class="hist">'+hist.map(e=>'<div class="hrow"><span class="d">'+fmtDate(e.t)+'</span><span class="w"><b>'+(e.m==='o'?'Online · Platz '+e.pl+' von '+e.of:'Challenge'+(e.vs!=null?' gegen '+e.vs+'/10':''))+'</b><small>'+(e.m==='o'?(e.w?'mit '+esc(e.w):'allein'):'Code '+esc(e.code||''))+'</small></span><span class="v num">'+(e.m==='o'?Number(e.pts||0).toLocaleString('de-DE'):e.r+'/10')+'</span></div>').join('')+'</div>'

}
ACT.accName=async()=>{
  const n=($('#accNewName').value||'').trim().slice(0,14);if(!n)return toast('Der Name darf nicht leer sein.');
  try{await FBA.db.ref('users/'+ACC.uid+'/profile/n').set(n);await FBA.db.ref('board/'+ACC.uid+'/n').set(n);ACC.name=n;SET.nick=n;saveSet();acctUI();toast('Name gespeichert.');acctRender()}catch(_){toast('Speichern hat nicht geklappt.')}
};

/* ---------- Rangliste ---------- */
const BOARD={pts:{n:'Punkte',v:x=>x.pts||0,f:v=>Number(v).toLocaleString('de-DE')},wins:{n:'Siege',v:x=>x.wins||0,f:v=>String(v)},
  quote:{n:'Quote',v:x=>x.a>=20?pct(x.c||0,x.a):-1,f:v=>v+' %'},cb:{n:'Challenge',v:x=>x.cb||0,f:v=>v+'/10'}};
async function boardPage(m){
  page(topBar('Rangliste','acct')+'<h2>Rangliste</h2>'+seg2('brd',m,Object.keys(BOARD).map(k=>[k,BOARD[k].n]))+'<div id="brdBox" style="display:flex;flex-direction:column;gap:12px"><p class="note">Wird geladen …</p></div>');
  let all={};try{all=(await FBA.db.ref('board').get()).val()||{}}catch(_){const b=$('#brdBox');if(b)b.innerHTML='<p class="note">Die Rangliste ließ sich nicht laden. Sind die neuen Datenbank-Regeln eingetragen?</p>';return}
  const B=BOARD[m],rows=Object.keys(all).map(k=>Object.assign({k},all[k])).filter(x=>B.v(x)>=0).sort((x,y)=>B.v(y)-B.v(x));
  let last=null,pl=0;const box=$('#brdBox');if(!box)return;
  box.innerHTML=(rows.length?'<div class="table">'+rows.map((x,i)=>{const v=B.v(x);if(v!==last){pl=i+1;last=v}return '<div class="trow'+(ACC&&x.k===ACC.uid?' me':'')+'"><span class="pl">'+pl+'</span><span class="nm">'+esc(String(x.n||'?').slice(0,14))+'</span><span class="pt">'+B.f(v)+'</span></div>'}).join('')+'</div>'
    :'<p class="note">Noch niemand in dieser Wertung.</p>')+(m==='quote'?'<p class="lead">In die Quote kommt, wer mindestens 20 Fragen beantwortet hat.</p>':'')+'<p class="lead">Gezählt werden Online-Spiele und Challenges von allen mit Konto.</p>';
}
function seg2(act,cur,opts){return '<div class="seg">'+opts.map(([v,n])=>'<button class="'+(v===cur?'on':'')+'" data-act="'+act+'" data-v="'+v+'">'+n+'</button>').join('')+'</div>'}
ACT.board=v=>boardPage(v||'pts');ACT.brd=v=>boardPage(v);

/* ---------- Ergebnisse speichern ---------- */
async function recordGame(r){
  if(!ACC||!FBA)return;const db=FBA.db,base='users/'+ACC.uid;
  try{
    const res=await db.ref(base+'/stats').transaction(s=>{s=s||{};
      s.a=(s.a||0)+r.log.length;s.c=(s.c||0)+r.log.filter(x=>x.ok).length;s.cat=s.cat||{};
      for(const x of r.log){const k=s.cat[x.c]||{a:0,c:0};k.a++;if(x.ok)k.c++;s.cat[x.c]=k}
      if(r.m==='o'){s.games=(s.games||0)+1;if(r.win)s.wins=(s.wins||0)+1;s.pts=(s.pts||0)+(r.pts||0)}else{s.cg=(s.cg||0)+1;s.cb=Math.max(s.cb||0,r.r||0)}
      return s});
    const s=res&&res.snapshot?res.snapshot.val()||{}:{};
    await db.ref('board/'+ACC.uid).set({n:ACC.name,pts:s.pts||0,wins:s.wins||0,games:s.games||0,a:s.a||0,c:s.c||0,cb:s.cb||0});
    const e={t:Date.now(),m:r.m,r:r.r||0,n:r.log.length};
    if(r.m==='o')Object.assign(e,{pl:r.pl,of:r.of,pts:r.pts||0,w:(r.w||'').slice(0,80)});else Object.assign(e,{code:r.code||''},r.vs!=null?{vs:r.vs}:{});
    await db.ref(base+'/hist').push().set(e);
    const keys=Object.keys((await db.ref(base+'/hist').get()).val()||{}).sort();
    if(keys.length>30){const up={};for(const k of keys.slice(0,keys.length-30))up[k]=null;await db.ref(base+'/hist').update(up)}
  }catch(_){}
}

/* ---------- Einstellungen und gesehene Fragen auf allen Geräten ---------- */
function seenEncode(){const b=new Uint8Array(Math.ceil(Q.length/8));for(const id of SEEN)if(id<Q.length)b[id>>3]|=1<<(id&7);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s)}
function seenDecode(str){const out=[];try{const s=atob(str);for(let i=0;i<s.length;i++){const x=s.charCodeAt(i);for(let j=0;j<8;j++)if(x&(1<<j))out.push(i*8+j)}}catch(_){}return out}
async function syncPull(){
  if(!ACC||!FBA)return;
  try{
    const v=(await FBA.db.ref('users/'+ACC.uid+'/sync').get()).val();
    if(v&&v.set&&(v.t||0)>ST.get('synct',0)){try{const o=JSON.parse(v.set);for(const k in o)if(k in SET)SET[k]=o[k];ST.set('set',SET)}catch(_){}}
    if(v&&v.seen){for(const id of seenDecode(v.seen))if(id<Q.length)SEEN.add(id);ST.set('seen',[...SEEN])}
    soundIcon();homeInfo();syncPush(true);
  }catch(_){}
}
function syncPush(now){
  if(!ACC||!FBA)return;clearTimeout(syncPush.t);
  syncPush.t=setTimeout(()=>{const t=Date.now();ST.set('synct',t);FBA.db.ref('users/'+ACC.uid+'/sync').set({t,set:JSON.stringify(SET),seen:seenEncode()}).catch(()=>{})},now?0:4000);
}

/* ---------- Start ---------- */
function homeInfo(){const seen=Q.filter(q=>SEEN.has(q.id)).length;$('#bankInfo').textContent=Q.length+' Fragen in '+CAT_KEYS.length+' Kategorien · '+seen+' davon schon gesehen'}
/* Selbst-Update, wenn das Spiel als Webseite läuft */
let updating=false;
async function checkUpdate(){
  if(updating||window.claude||GAME||!/^https?:$/.test(location.protocol))return;
  try{
    const r=await fetch('quizabend.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('qa-upd')}catch(_){}
    if(tried===m[1])return;try{sessionStorage.setItem('qa-upd',m[1])}catch(_){}
    updating=true;toast('Neue Version wird geladen …',3000);
    setTimeout(()=>location.replace('quizabend.html?v='+encodeURIComponent(m[1])+location.hash),700);
  }catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
function openHash(){const h=decodeURIComponent(location.hash.slice(1)).toUpperCase();const c=h&&chParse(h);if(c&&!c.old&&!GAME){chalStart(h.replace(/^([A-Z][A-Z0-9]{4})(\d{1,2})$/,'$1-$2'))}}
addEventListener('hashchange',openHash);
soundIcon();homeInfo();openHash();setTimeout(checkUpdate,1500);
</script>
