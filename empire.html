<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Football Empire</title>
<!--pwa-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Football Empire">
<meta name="theme-color" content="#06122A">
<link rel="apple-touch-icon" href="empire-icon-180.png">
<link rel="icon" type="image/png" href="empire-icon-192.png">
<link rel="manifest" href="empire.webmanifest">
<!--/pwa-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
<style>
/* Football Empire im Matchday-Look: Marineblau wie eine Abendübertragung,
   Neon-Gelbgrün als einziger Akzent, weiße Einblendungen mit schrägen Kanten. */
:root{
  --deep:#040D1F; --navy:#06122A; --panel:#0D1E3E; --panel2:#132A52; --line:#1C3360; --line2:#2E4A78;
  --lime:#C6F135; --lime2:#DDFF73; --muted:#9FB0CC; --dim:#7D90B4; --red:#FF4D5E; --yel:#FFD43B; --ok:#4BD37B;
  --plate:#FFFFFF; --plate2:#EEF2F8; --ink:#06122A; --ink2:#4A5872;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--deep);color:#fff;font-family:var(--f);overflow:hidden;overscroll-behavior:none}
/* In der Home-Bildschirm-App ist --vh die feste Bildschirmhöhe (iOS meldet dort eine zu kleine Fensterhöhe) */
html{min-height:var(--vh,100%)}
.full{position:fixed;top:0;left:0;right:0;height:var(--vh,100%)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.c75{font-stretch:75%}.c80{font-stretch:80%}.c115{font-stretch:115%}
.xi{font-weight:800;font-style:italic}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.lime{color:var(--lime)}
.tag{display:inline-block;padding:4px 12px;background:var(--lime);color:var(--ink);transform:skewX(-12deg);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.12em;white-space:nowrap}
.tag>span{display:inline-block;transform:skewX(12deg)}
.tag.red{background:var(--red);color:#fff}.tag.white{background:#fff}.tag.dark{background:var(--panel2);color:#fff}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;background:var(--lime);color:var(--ink);font-weight:900;font-style:italic;letter-spacing:.08em;text-transform:uppercase;font-size:16px}
.btn.ghost{background:transparent;color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime)}
.btn.dark{background:var(--panel2);color:#fff}
.btn.white{background:#fff;color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.big{min-height:60px;font-size:20px}
.btn.wide{width:100%}
.ico{width:22px;height:22px;flex-shrink:0}
.stripe{display:inline-block;width:6px;align-self:stretch}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:var(--panel2);font-size:12px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--lime);color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.crest{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-stretch:80%;letter-spacing:.02em}
.stars{color:var(--lime);letter-spacing:1px;font-size:12px}
.stars i{color:var(--line2);font-style:normal}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:90;background:#fff;color:var(--ink);padding:12px 18px;font-weight:700;max-width:92vw;box-shadow:0 10px 30px #0008;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- Würfel ---------- */
.die{position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;background:#fff;border-radius:.18em;padding:.14em;box-shadow:0 .08em 0 #B9C6DB,0 .22em .4em #0009;font-size:60px;width:1em;height:1em;flex-shrink:0}
.die i{width:.16em;height:.16em;border-radius:50%;background:var(--ink);opacity:0}
.die i.on{opacity:1}
.die.lime{box-shadow:0 0 0 .04em var(--lime),0 .08em 0 #B9C6DB,0 .22em .4em #0009}
.die.roll{animation:tumble .5s linear infinite}
.die.land{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
.die.ghost{opacity:.25}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-.12em)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-.08em)}100%{transform:rotate(360deg)}}
@keyframes land{0%{transform:scale(1.35) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- Spielerkarte ---------- */
.pc{position:relative;display:flex;flex-direction:column;background:#fff;color:var(--ink);min-width:0}
.pc .pc-top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em}
.pc .pc-s{font-stretch:70%;font-weight:900;font-style:italic;font-size:44px;line-height:.9;color:var(--ink)}
.pc .pc-body{display:flex;gap:10px;align-items:flex-end;padding:8px 10px 6px}
.pc .pc-n{font-weight:800;font-size:14px;line-height:1.15}
.pc .pc-meta{font-size:12px;color:var(--ink2)}
.pc .pc-tr{margin:0 10px 8px;padding:3px 8px;font-size:11px;font-weight:700;background:var(--plate2);color:var(--ink);align-self:flex-start}
.pc .pc-tr.bad{background:#FFE1E4;color:#8A1020}
.pc .pc-foot{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 8px;padding:6px 10px;background:var(--plate2);font-size:12px;font-weight:700}
.pc .pc-foot span:last-child{color:var(--ink2)}
.pc .pc-from{display:inline-block;margin:0 10px 8px;align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;color:#fff}
.pos-TW{background:#E8A33D!important;color:var(--ink)!important}
.pos-AB{background:#3E7BD6!important;color:#fff!important}
.pos-MF{background:#2FA36B!important;color:#fff!important}
.pos-ST{background:#D9465A!important;color:#fff!important}
.posb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;font-size:10px;font-weight:900;letter-spacing:.06em;flex-shrink:0}

/* ==========================================================================
   STARTSEITE
   ========================================================================== */
#start{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);overflow:auto;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));background:var(--navy)}
.start-in{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.start-in img{width:132px;height:132px;border-radius:30px;box-shadow:0 14px 40px #000a}
.wordmark{font-weight:900;font-style:italic;font-stretch:115%;font-size:28px;letter-spacing:.02em;line-height:1}
.wordmark b{color:var(--lime);font-weight:900}
.start-in p{margin:0;color:var(--muted);font-size:14px}
.start-btns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:6px}
.codebox{display:flex;gap:8px;width:100%}
.codebox input{flex:1;min-width:0;height:56px;background:#fff;color:var(--ink);border:0;padding:0 16px;font-size:26px;font-weight:900;font-stretch:80%;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.saves{width:100%;display:flex;flex-direction:column;gap:6px}
.saves button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);text-align:left;font-size:14px}
.err{background:#3A1020;color:#FFC2C9;padding:12px 14px;font-size:14px;text-align:left;width:100%}

/* ==========================================================================
   SPIELBRETT (iPad)
   ========================================================================== */
#board{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);background:var(--deep);overflow:hidden}
.sq{position:absolute;display:flex;align-items:center;justify-content:center;background:#0B1C3A;border:1px solid var(--line);color:var(--dim);font-weight:800;font-stretch:75%;font-size:12px}
.sq.alt{background:#0E2346}
.sq.ten{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pawn{position:absolute;z-index:5;transition:left 1.6s cubic-bezier(.5,0,.3,1),top 1.6s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 3px 2px #000b);pointer-events:none}
.pawn .lap{position:absolute;right:-8px;top:-6px;background:#fff;color:var(--ink);font-size:9px;font-weight:900;padding:0 3px}
.pawn .rd{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:var(--lime);color:var(--ink);font-size:11px;font-weight:900;padding:1px 5px;white-space:nowrap;animation:rdup 1.2s ease-out}
.pawn .rd.neg{background:var(--red);color:#fff}
.pawn .rd.dn{top:auto;bottom:-18px}
@keyframes rdup{from{opacity:0;transform:translate(-50%,8px)}}
#stage{position:absolute;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
#bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;flex-shrink:0}
#bhead .brand{display:flex;align-items:center;gap:10px;min-width:0}
#bhead .brand i{width:9px;height:22px;background:var(--lime);transform:skewX(-16deg)}
#bhead .brand b{font-weight:800;font-style:italic;font-stretch:115%;font-size:16px;white-space:nowrap}
#bhead .mid{font-stretch:80%;font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
#bhead .mid b{color:#fff}
#bhead .ctl{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--muted)}
.ibtn.on{color:var(--lime)}
.roomcode{font-size:12px;color:var(--muted);letter-spacing:.1em;padding:0 6px}
.roomcode b{color:#fff;letter-spacing:.25em}
#bmain{flex:1;min-height:0;display:flex;gap:16px;position:relative}
.col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.pnl{background:var(--panel);padding:16px 18px;min-width:0}
.pnl h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.bigt{font-stretch:75%;font-weight:800;font-style:italic;font-size:40px;line-height:1;margin:0}
.bigt.s{font-size:30px}
.waitrow{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 0;background:var(--panel2);font-size:13px;font-weight:700}
.wchip .stripe{width:6px;height:34px}
.wchip.rdy{background:var(--lime);color:var(--ink)}
.wchip .ck{width:16px;height:16px}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}

/* Lobby */
.lobby-l{width:42%;min-width:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.lobby-l .code{font-weight:900;font-stretch:80%;font-size:84px;letter-spacing:.18em;line-height:1;color:var(--lime);padding-left:.18em}
.qr{background:#fff;padding:12px;width:220px;height:220px}
.qr svg{width:100%;height:100%;display:block}
.lobby-l .url{font-size:13px;color:var(--muted);max-width:360px}
.clist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.crow{display:flex;align-items:stretch;background:#fff;color:var(--ink);min-height:48px}
.crow .stripe{width:10px}
.crow .cn{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 12px;min-width:0}
.crow .cn b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cn span{font-size:12px;color:var(--ink2)}
.crow .sh{display:flex;align-items:center;padding:0 12px;font-stretch:80%;font-weight:900;font-size:18px;background:var(--plate2)}
.crow button{width:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:38px;padding:0 14px;background:var(--panel2);font-size:13px;font-weight:700}
.seg button.on{background:var(--lime);color:var(--ink)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.setrow span{font-size:13px;color:var(--muted);font-weight:600}

/* Markt auf dem Brett */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;overflow:auto;min-height:0}
.mgrid .pc{min-height:150px}
/* Aufdecken */
.rv{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;min-height:0}
.rv .pc{width:230px;min-height:270px;animation:flip .7s ease-out}
.rv .pc .pc-s{font-size:70px}
.rv .pc .pc-n{font-size:18px}
@keyframes flip{0%{transform:perspective(800px) rotateY(90deg)}100%{transform:perspective(800px) rotateY(0)}}
.bids{width:min(440px,46%);display:flex;flex-direction:column;gap:8px}
.bidrow{display:flex;align-items:stretch;height:46px;background:var(--panel);animation:slin .35s ease-out both}
.bidrow .stripe{width:8px}
.bidrow .bn{flex:1;display:flex;align-items:center;padding:0 12px;font-weight:800;min-width:0}
.bidrow .bv{display:flex;align-items:center;padding:0 14px;font-stretch:75%;font-weight:900;font-style:italic;font-size:24px}
.bidrow.win{background:#fff;color:var(--ink)}
.bidrow.win .bv{background:var(--lime)}
@keyframes slin{from{opacity:0;transform:translateX(30px)}}
.verdict{display:flex;align-items:stretch;min-height:54px;margin-top:6px;animation:slin .4s ease-out both}
.verdict .tag{display:flex;align-items:center;font-size:18px;padding:0 18px}
.verdict .vt{flex:1;display:flex;align-items:center;padding:0 16px;background:#fff;color:var(--ink);font-weight:800;font-size:17px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:12px;height:12px;background:var(--line)}
.pips i.done{background:var(--muted)}
.pips i.cur{background:var(--lime)}

/* Spieltag (Konferenz) */
.mgrid2{flex:1;display:grid;gap:12px;min-height:0;min-width:0}
.mcard{position:relative;background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mbug{display:flex;align-items:stretch;height:44px;background:#fff;color:var(--ink);flex-shrink:0}
.mbug .stripe{width:8px}
.mbug .tn{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;font-weight:800;font-size:15px}
.mbug .tn b{font-stretch:80%;font-size:20px}
.mbug .tn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px;color:var(--ink2)}
.mbug .tn.r{justify-content:flex-end;text-align:right}
.mbug .sc{display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--ink);color:#fff;font-stretch:75%;font-weight:900;font-style:italic;font-size:28px}
.mbug .sc u{text-decoration:none;color:var(--lime);font-size:18px}
.mbug .mn{display:flex;align-items:center;padding:0 10px;background:var(--lime);color:var(--ink);font-stretch:75%;font-weight:900;font-size:18px;min-width:52px;justify-content:center}
.mbug .mn.ht{background:var(--yel)}
.mbug .mn.end{background:var(--panel2);color:#fff}
.mbody{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px 12px;min-height:0;position:relative}
.pitch{position:relative;flex:1;min-height:70px;background:#0C2446;overflow:hidden}
.pitch .z{position:absolute;top:0;bottom:0;width:20%}
.pitch .z:nth-child(even){background:#0F2B52}
.pitch .ln{position:absolute;border:1.5px solid var(--line2)}
.pitch .hl{position:absolute;top:0;bottom:0;width:20%;background:#C6F13524;transition:left .6s ease}
.pitch .ball{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 3px 4px #000a;transition:left .9s cubic-bezier(.4,0,.2,1);z-index:2}
.pitch .ball::after{content:'';position:absolute;inset:6px;background:var(--ink);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pitch .zl{position:absolute;bottom:4px;width:20%;text-align:center;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.mline{display:flex;align-items:center;gap:8px;font-size:13px;min-height:20px;white-space:nowrap;overflow:hidden}
.mline b{font-stretch:75%;font-size:15px;color:var(--lime);min-width:30px}
.mline .t{overflow:hidden;text-overflow:ellipsis}
.adice{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.adice .die{font-size:20px}
.adice b{color:#fff;font-stretch:75%;font-size:15px}
.duel{position:absolute;inset:44px 0 0 0;z-index:4;background:#06122AF2;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px 16px;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0}}
.duel .dk{display:flex;justify-content:space-between;align-items:center}
.duel .dg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.duel .side{display:flex;align-items:center;gap:14px;min-width:0}
.duel .side.r{flex-direction:row-reverse;text-align:right}
.duel .who{min-width:0}
.duel .who b{display:block;font-stretch:75%;font-weight:800;font-style:italic;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .who span{font-size:12px;color:var(--muted)}
.duel .who .sum{display:block;margin-top:4px;font-stretch:75%;font-weight:900;font-size:22px;color:#fff}
.duel .who .sum span{font-size:inherit;color:var(--lime)}
.duel .vs{font-weight:900;font-style:italic;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.duel .vs small{font-size:10px;font-style:normal;font-weight:800;letter-spacing:.08em;color:var(--lime);line-height:1.2}
.duel .res{display:flex;align-items:stretch;min-height:40px}
.duel .res .tag{display:flex;align-items:center;font-size:18px}
.duel .res .rt{flex:1;display:flex;align-items:center;padding:0 12px;background:#fff;color:var(--ink);font-weight:800;font-size:14px}
.duel .dice2{display:flex;gap:6px}
.goalflash{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:gf 2.6s ease-out forwards}
.goalflash span{background:var(--lime);color:var(--ink);font-weight:900;font-style:italic;font-size:64px;padding:4px 40px;transform:skewX(-12deg);letter-spacing:.06em}
@keyframes gf{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.httop{position:absolute;inset:0;z-index:8;background:#040D1FE6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.httop .bigt{font-size:72px}
.side-tab{width:330px;flex-shrink:0}
.ttab{display:flex;flex-direction:column}
.ttab .th{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 12px;background:var(--lime);color:var(--ink);font-weight:800;font-style:italic;font-size:13px;letter-spacing:.1em}
.ttab .tr{display:flex;align-items:center;gap:10px;height:36px;padding-right:12px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.ttab .tr:nth-child(odd){background:var(--plate2)}
.ttab .tr .p{width:34px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-stretch:75%;font-weight:900;font-size:18px}
.ttab .tr .n{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttab .tr .v{width:30px;text-align:right;font-size:13px;color:var(--ink2)}

.cf-body .res{font-weight:800;font-size:15px}
@keyframes cflip{0%{transform:rotateY(180deg) scale(.55) translateY(40px)}45%{transform:rotateY(180deg) scale(1.02)}100%{transform:rotateY(0) scale(1)}}
/* Echte Würfel: Augenzahl eintippen */
.rvpad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.rvpad button{display:flex;align-items:center;justify-content:center;padding:6px 0;background:var(--panel);border-radius:10px}
.rvpad button.on{background:var(--lime)}
.btn.lbl2{font-size:16px;letter-spacing:.05em}

/* ==========================================================================
   FOOTBALL EMPIRE – Spiel-Logik
   Läuft nur auf dem Spielbrett (iPad). Die Handys schicken Aktionen, das Brett
   rechnet alles aus und schickt jedem Handy nur das, was es sehen darf.
   Geld wird in Einheiten zu 0,1 Mio € gerechnet (100 = 10 Mio €).
   ========================================================================== */
let SEED = (Math.floor(Math.random() * 4294967296)) >>> 0;
function rnd() {
  SEED = (SEED + 0x6D2B79F5) >>> 0;
  let t = SEED;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const d6 = () => ri(1, 6);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(items, wf) { let sum = 0; const w = items.map(x => { const v = Math.max(0, wf(x)); sum += v; return v; }); if (sum <= 0) return items[0]; let r = rnd() * sum; for (let i = 0; i < items.length; i++) { r -= w[i]; if (r < 0) return items[i]; } return items[items.length - 1]; }
let NOW = () => Date.now();

function fmtM(u) { const neg = u < 0; const v = Math.abs(u) / 10; return (neg ? '−' : '') + v.toFixed(1).replace('.', ',') + ' Mio €'; }
function fmtMs(u) { return (u > 0 ? '+' : '') + fmtM(u); }

/* ---------- Spieler ---------- */
function newName(G) {
  for (let i = 0; i < 60; i++) { const n = pick(FIRST) + ' ' + pick(LAST); if (!G.names[n]) { G.names[n] = 1; return n; } }
  const n = pick(FIRST) + ' ' + pick(LAST) + ' ' + ri(2, 9); G.names[n] = 1; return n;

function makePlayer(G, pos, s, age, tal, tr) {
  return { id: 'p' + (G.nid++), n: newName(G), pos, s: clamp(s, 1, 10), age, tal: tal || 0, tr: tr || null, goals: 0, gt: 0, apps: 0, yc: 0, outUntil: 0, susUntil: 0 };
}
function pValue(p) {
  let v = BASEV[clamp(p.s, 1, 10)];
  const a = p.age;
  v *= a <= 20 ? 1.25 : a <= 23 ? 1.15 : a <= 28 ? 1 : a <= 30 ? 0.85 : a <= 32 ? 0.7 : 0.5;
  if (a <= 23) v *= 1 + 0.1 * p.tal;
  if (p.tr && TRAITS[p.tr]) v *= TRAITS[p.tr].good ? 1.1 : 0.85;
  return Math.max(1, Math.round(v));
}
function pSalary(p) { return Math.max(1, Math.round(pValue(p) * 0.22)); } // pro Saison
function randTrait(pos, goodOnly) {
  const keys = Object.keys(TRAITS).filter(k => TRAITS[k].pos.includes(pos) && (!goodOnly || TRAITS[k].good));
  return keys.length ? pick(keys) : null;
}
function available(G, p) { return G.mdg >= (p.outUntil || 0) && G.mdg >= (p.susUntil || 0); }
function pStatus(G, p) {
  if (G.mdg < (p.outUntil || 0)) return { k: 'inj', n: 'verletzt', left: p.outUntil - G.mdg };
  if (G.mdg < (p.susUntil || 0)) return { k: 'sus', n: 'gesperrt', left: p.susUntil - G.mdg };

}

/* ---------- Spiel anlegen ---------- */
function newGame(settings) {

    phase: 'lobby', phaseAt: NOW(), season: 1, md: 0, mdg: 0, nid: 1, names: {},

function clubById(G, id) { return G.clubs.find(c => c.id === id) || null; }
function clubByUid(G, uid) { return G.clubs.find(c => c.uid === uid) || null; }
function playerOf(c, pid) { return c.players.find(p => p.id === pid) || null; }
function findPlayer(G, pid) { for (const c of G.clubs) { const p = playerOf(c, pid); if (p) return { c, p }; } return null; }
function freeColors(G, exceptId) { const used = new Set(G.clubs.filter(c => c.id !== exceptId).map(c => c.col)); return COLORS.map((x, i) => i).filter(i => !used.has(i)); }

function addClub(G, o) {
  if (G.clubs.length >= 8) return null;
  let col = o.col;
  const free = freeColors(G);
  if (col == null || !free.includes(col)) col = free.length ? free[0] : 0;
  const name = String(o.name || 'FC Unbekannt').slice(0, 24).trim() || 'FC Unbekannt';
  let short = String(o.short || '').toUpperCase().replace(/[^A-ZÄÖÜ0-9]/g, '').slice(0, 3);
  if (short.length < 2) short = autoShort(name);
  const c = {
    id: 'c' + (G.nid++), uid: o.uid || null, bot: !!o.bot, name, short, col, mgr: String(o.mgr || (o.bot ? 'Computer' : 'Manager')).slice(0, 14),

}
function autoShort(name) {
  const w = name.toUpperCase().replace(/[^A-ZÄÖÜ ]/g, ' ').split(/\s+/).filter(Boolean);
  let s = w.length >= 3 ? w[0][0] + w[1][0] + w[2][0] : w.length === 2 ? w[0][0] + w[1].slice(0, 2) : (w[0] || 'FCX').slice(0, 3);

}
function blankTab() { return { sp: 0, s: 0, u: 0, n: 0, gf: 0, ga: 0, pts: 0, form: [] }; }
function removeClub(G, id) { if (G.phase !== 'lobby') return false; G.clubs = G.clubs.filter(c => c.id !== id); return true; }

const START_SQUAD = [['TW', 6], ['TW', 4], ['AB', 6], ['AB', 5], ['AB', 5], ['AB', 4], ['AB', 4], ['MF', 6], ['MF', 5], ['MF', 5], ['MF', 4], ['MF', 3], ['ST', 6], ['ST', 5], ['ST', 4]];
function startSquad(G, c) {
  c.players = START_SQUAD.map(([pos, s]) => {
    const age = s >= 6 ? ri(24, 30) : s <= 3 ? ri(19, 22) : ri(20, 32);
    return makePlayer(G, pos, s, age, age <= 23 ? ri(0, 2) : 0, null);
  });
  c.players.push(makePlayer(G, pick(['AB', 'MF', 'ST']), 3, 18, 3, null));
  // zwei gute Eigenschaften, manchmal eine schlechte
  const pool = shuffle(c.players.slice());
  let good = 0;
  for (const p of pool) { if (good >= 2) break; const t = randTrait(p.pos, true); if (t) { p.tr = t; good++; } }
  if (rnd() < 0.5) { const p = pool.find(x => !x.tr); if (p) p.tr = pick(['heisssporn', 'anfaellig']); }
  c.lu = autoLineup(G, c, '4-4-2', 'bal', 'fair');
}

function startGame(G) {
  if (G.phase !== 'lobby' || G.clubs.length < 2) return false;
  shuffle(G.clubs);
  for (const c of G.clubs) startSquad(G, c);
  G.deck = [];
  makeSchedule(G);
  news(G, 'Anpfiff für Football Empire: ' + G.clubs.length + ' Vereine, ' + G.settings.seasons + (G.settings.seasons === 1 ? ' Saison' : ' Saisons') + '.');
  enterPhase(G, 'saisonstart');
  return true;
}

/* ---------- Spielplan ---------- */
function roundRobin(ids) {
  const a = ids.slice(); if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = []; let bye = null;
    for (let i = 0; i < n / 2; i++) {
      const x = a[i], y = a[n - 1 - i];
      if (x && y) pairs.push((i === 0 ? r % 2 === 0 : i % 2 === 1) ? [x, y] : [y, x]);
      else bye = x || y;
    }
    rounds.push({ pairs, bye });
    a.splice(1, 0, a.pop());
  }
  return rounds;
}
function makeSchedule(G) {
  const ids = shuffle(G.clubs.map(c => c.id));
  const R = roundRobin(ids);
  const target = G.settings.len === 'lang' ? 10 : 5;
  const k = Math.ceil(target / R.length);
  const sch = [];
  for (let rep = 0; rep < k; rep++) for (const r of R) sch.push({ pairs: r.pairs.map(([h, a]) => rep % 2 ? [a, h] : [h, a]), bye: r.bye });
  G.schedule = sch;
  G.seasonLen = sch.length;
  G.winterAt = sch.length >= 4 ? Math.floor(sch.length / 2) : -1;
}

/* ---------- Nachrichten, Ruhm, Geld ---------- */
function news(G, t, k) { G.news.push({ t, k: k || 'info', s: G.season, md: G.md, at: NOW() }); if (G.news.length > 60) G.news.splice(0, G.news.length - 60); }
function addRuhm(G, c, v, why) {
  if (!v) return;
  c.ruhm = Math.max(0, c.ruhm + v);
  c.rlog.push({ s: G.season, md: G.md, v, why });
  if (c.rlog.length > 80) c.rlog.splice(0, c.rlog.length - 80);
  G.rdelta[c.id] = (G.rdelta[c.id] || 0) + v;
}
function addFans(c, v) { c.fans = Math.max(3000, Math.round(c.fans + v)); }
function pay(G, c, v, why) { // v positiv = Einnahme
  c.money += v;
  if (!c.finCur) c.finCur = [];
  c.finCur.push({ t: why, v });
}
function closeFin(G, c, label) {
  if (!c.finCur || !c.finCur.length) return;
  const sum = c.finCur.reduce((a, x) => a + x.v, 0);
  c.fin.push({ s: G.season, md: G.md, label, items: c.finCur, sum, money: c.money });
  if (c.fin.length > 40) c.fin.splice(0, c.fin.length - 40);
  c.finCur = [];
}

/* ---------- Phasen ---------- */
const INPUT_PHASES = ['saisonstart', 'winter', 'bieten'];
function enterPhase(G, ph) {
  G.phase = ph; G.phaseAt = NOW(); G.ready = {}; G.rdelta = {};
  if (ph === 'saisonstart') {
    G.md = 0;
    for (const c of G.clubs) { c.offers = sponsorOffers(G, c); c.sponsor = null; c.listed = []; c.bids = {}; }
  } else if (ph === 'winter') {
    for (const c of G.clubs) { c.listed = []; c.bids = {}; }
  } else if (ph === 'bieten') {
    genMarket(G, G.md > 0);
    for (const c of G.clubs) c.bids = {};
  } else if (ph === 'aufdecken') {
    computeReveal(G);
  } else if (ph === 'spiel') {
    startMatchday(G);
  } else if (ph === 'saisonende') {
    seasonEnd(G);
  } else if (ph === 'ende') {
    finalScoring(G);
  }
  for (const c of G.clubs) if (c.bot) botAct(G, c);
}
function curMatch(G) { return G.phase === 'spiel' && G.live ? G.live.ms[G.live.cur] || null : null; }
function matchOf(G, c) { return G.phase === 'spiel' && G.live ? G.live.ms.find(m => m.h === c.id || m.a === c.id) || null : null; }
/* Darf der Verein noch aufstellen, Karten öffnen usw.? Im Spieltag nur, solange sein Spiel nicht angepfiffen ist. */
function canPrepare(G, c) {
  if (G.phase !== 'spiel') return ['saisonstart', 'winter', 'bieten', 'aufdecken', 'ergebnis'].includes(G.phase);
  const m = matchOf(G, c); return !m || !m.started; // spielfrei: darf trotzdem Karte aufdecken und aufstellen
}
function readyMap(G) { return G.phase === 'spiel' && G.live && G.live.stage === 'ht' ? G.live.htReady : G.ready; }
function needsReady(G) { return INPUT_PHASES.includes(G.phase) || (G.phase === 'spiel' && !!G.live && (G.live.stage === 'pre' || G.live.stage === 'ht')); }
function humans(G) { return G.clubs.filter(c => !c.bot); }
function mustReady(G) {
  const h = humans(G);
  if (G.phase === 'spiel') { const m = curMatch(G); if (!m || !needsReady(G)) return []; return h.filter(c => c.id === m.h || c.id === m.a); }
  return h;
}
function allReady(G) { const r = readyMap(G); return mustReady(G).every(c => r[c.id]); }
function readyCount(G) { const r = readyMap(G); const h = mustReady(G); return { n: h.filter(c => r[c.id]).length, of: h.length, wait: h.filter(c => !r[c.id]).map(c => c.id) }; }

/* Weiter zur nächsten Phase. force: auch wenn noch nicht alle bereit sind (Knopf auf dem Brett). */
function advance(G, force) {
  const ph = G.phase;
  if (needsReady(G) && !force && !allReady(G)) return false;
  if (ph === 'saisonstart') {
    for (const c of G.clubs) if (!c.sponsor) chooseSponsor(G, c, 0);
    enterPhase(G, 'bieten');
  } else if (ph === 'winter') {
    enterPhase(G, 'bieten');
  } else if (ph === 'bieten') {
    enterPhase(G, 'aufdecken');
  } else if (ph === 'aufdecken') {
    if (G.reveal && G.reveal.i < G.reveal.res.length - 1 && !force) { G.reveal.i++; return true; }
    G.reveal = null; G.market = [];
    enterPhase(G, 'spiel');
  } else if (ph === 'spiel') {
    const L = G.live; if (!L) return false;
    if (L.stage === 'pre') { kickoff(G, NOW()); return true; }
    if (L.stage === 'ht') { endHalftime(G, NOW()); return true; }
    return false;
  } else if (ph === 'ergebnis') {
    G.results = null;
    if (G.md >= G.seasonLen) enterPhase(G, 'saisonende');
    else if (G.md === G.winterAt) enterPhase(G, 'winter');
    else enterPhase(G, 'spiel');
  } else if (ph === 'saisonende') {
    G.report = null;
    if (G.season >= G.settings.seasons) enterPhase(G, 'ende');
    else { G.season++; makeSchedule(G); enterPhase(G, 'saisonstart'); }
  } else return false;
  return true;
}

/* ---------- Sponsoren ---------- */
function sponsorOffers(G, c) {
  const fame = Math.round(c.fans / 2500) + Math.floor(c.ruhm / 12);
  const nm = () => pick(SP_PRE) + ' ' + pick(SP_SUF);
  return [
    { k: 'fest', n: nm(), now: 38 + fame, win: 0, bonus: 0, d: 'Fester Betrag, sofort' },
    { k: 'erfolg', n: nm(), now: 12 + Math.round(fame / 2), win: 9, bonus: 0, d: 'Kleiner Sockel plus Prämie für jeden Sieg' },
    { k: 'risiko', n: nm(), now: 16, win: 0, bonus: 52 + fame, d: 'Großer Bonus, wenn du die Saison in der oberen Tabellenhälfte beendest' }
  ];
}
function chooseSponsor(G, c, i) {
  if (c.sponsor || !c.offers || !c.offers[i]) return false;
  c.sponsor = c.offers[i];
  pay(G, c, c.sponsor.now, 'Sponsor ' + c.sponsor.n);
  closeFin(G, c, 'Sponsorvertrag');
  return true;
}

/* ---------- Transfermarkt ---------- */
function genMarket(G, winter) {
  const n = G.clubs.length;
  const cnt = winter ? n + 1 : n * 2 + 2;
  const cards = [];
  for (let i = 0; i < cnt; i++) {
    const s = wpick([3, 4, 5, 6, 7, 8, 9], x => ({ 3: 6, 4: 14, 5: 24, 6: 24, 7: 18, 8: 10, 9: 4 })[x] + (G.season - 1) * (x >= 7 ? 2 : 0));
    const pos = wpick(POS, x => ({ TW: 10, AB: 30, MF: 32, ST: 28 })[x]);
    const age = s >= 8 ? ri(23, 31) : ri(18, 33);
    const tal = age <= 23 ? wpick([0, 1, 2, 3], x => [3, 4, 3, 1][x]) : 0;
    const tr = rnd() < 0.32 ? randTrait(pos, rnd() < 0.8) : null;
    const p = makePlayer(G, pos, s, age, tal, tr);
    cards.push({ id: 'k' + (G.nid++), p, min: Math.max(1, Math.round(pValue(p) * 0.6)), from: null });
  }
  for (const c of G.clubs) for (const pid of c.listed) {
    const p = playerOf(c, pid); if (!p) continue;
    cards.push({ id: 'k' + (G.nid++), p, min: Math.max(1, Math.round(pValue(p) * 0.5)), from: c.id });
  }
  G.market = cards;
}
function cardById(G, id) { return G.market.find(k => k.id === id) || null; }
function setBids(G, c, b) {
  if (G.phase !== 'bieten') return 'Gerade wird nicht geboten.';
  const out = {}; let sum = 0;
  for (const id in b) {
    const v = Math.round(+b[id] || 0); if (v <= 0) continue;
    const k = cardById(G, id); if (!k) continue;
    if (k.from === c.id) return 'Auf eigene Spieler kannst du nicht bieten.';
    if (v < k.min) return 'Mindestens ' + fmtM(k.min) + ' für ' + k.p.n + '.';
    out[id] = v; sum += v;
  }
  if (sum > Math.max(0, c.money)) return 'Deine Gebote zusammen (' + fmtM(sum) + ') sind höher als dein Geld.';
  c.bids = out;
  return null;
}
function computeReveal(G) {
  const order = G.market.slice().sort((a, b) => pValue(a.p) - pValue(b.p));
  const res = [];
  for (const k of order) {
    const bids = G.clubs.map(c => ({ c: c.id, v: c.bids[k.id] | 0 })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    let winner = null, price = 0, tie = null;
    let i = 0;
    while (i < bids.length) {
      const top = bids[i].v;
      const group = bids.filter(x => x.v === top);
      const ok = group.filter(x => { const c = clubById(G, x.c); return c.money >= top && c.players.length < SQUAD_MAX; });
      if (ok.length) {
        if (ok.length > 1) {
          let rolls;
          do { rolls = ok.map(x => ({ c: x.c, r: d6() })); } while (rolls.filter(r => r.r === Math.max(...rolls.map(y => y.r))).length > 1);
          tie = rolls;
          winner = rolls.reduce((a, b) => b.r > a.r ? b : a).c;
        } else winner = ok[0].c;
        price = top; break;
      }
      i += group.length;
    }
    const seller = k.from ? clubById(G, k.from) : null;
    const item = { k: k.id, p: pubPlayer(G, k.p), min: k.min, from: k.from, bids, winner, price, tie, abroad: 0 };
    if (winner) {
      const w = clubById(G, winner);
      if (seller) { seller.players = seller.players.filter(p => p.id !== k.p.id); pay(G, seller, price, 'Verkauf ' + k.p.n); dropFromLineup(seller, k.p.id); }
      pay(G, w, -price, 'Kauf ' + k.p.n);
      k.p.goals = 0; k.p.apps = 0;
      w.players.push(k.p);
      news(G, w.name + ' holt ' + k.p.n + ' für ' + fmtM(price) + (seller ? ' von ' + seller.name : '') + '.', 'transfer');
    } else if (seller) {
      const v = Math.max(1, Math.round(pValue(k.p) * 0.5));
      seller.players = seller.players.filter(p => p.id !== k.p.id); dropFromLineup(seller, k.p.id);
      pay(G, seller, v, 'Verkauf ins Ausland: ' + k.p.n);
      item.abroad = v;
      news(G, k.p.n + ' wechselt für ' + fmtM(v) + ' ins Ausland.', 'transfer');
    }
    res.push(item);
  }
  for (const c of G.clubs) { closeFin(G, c, G.md > 0 ? 'Wintertransfers' : 'Sommertransfers'); c.listed = []; fixLineup(G, c); }
  G.reveal = { i: 0, res };
  if (!res.length) G.reveal.i = -1;

/* ---------- Spieltag auswerten ---------- */
function finishMatchday(G) {

  for (const c of G.clubs) if (c.card && c.card.o == null) decideCard(G, c, cardDefault(c.card));
  const ruhm0 = {}; for (const c of G.clubs) ruhm0[c.id] = c.ruhm;
  for (const m of L.ms) {
    const h = clubById(G, m.h), a = clubById(G, m.a);
    const upd = (c, gf, ga) => {
      c.tab.sp++; c.tab.gf += gf; c.tab.ga += ga;
      const r = gf > ga ? 'S' : gf === ga ? 'U' : 'N';
      if (r === 'S') { c.tab.s++; c.tab.pts += 3; addRuhm(G, c, 2, 'Sieg'); addFans(c, 600); if (c.sponsor && c.sponsor.win) pay(G, c, c.sponsor.win, 'Siegprämie ' + c.sponsor.n); }
      else if (r === 'U') { c.tab.u++; c.tab.pts += 1; addRuhm(G, c, 1, 'Unentschieden'); addFans(c, 100); }

    const cap = 15000 + 6000 * h.st.tri;

    let tick = Math.round(spect / 1000 * 0.3);
    if (h.flags.ausverkauft) { tick *= 2; delete h.flags.ausverkauft; }
    pay(G, h, tick, 'Zuschauer (' + fmtN(spect) + ')');
    if (h.st.vip) pay(G, h, 2 * h.st.vip, 'VIP-Logen');
    m.spect = spect;
    const scorers = m.ev.filter(e => e.t === 'goal').map(e => ({ sd: e.sd, min: e.min, n: (e.text.match(/([^!]+?) trifft/) || [])[1] || '' }));
    res.push({ h: m.h, a: m.a, hg: m.hg, ag: m.ag, scorers, spect, st: m.st });
    news(G, h.name + ' ' + m.hg + ':' + m.ag + ' ' + a.name, 'result');
  }
  for (const c of G.clubs) {
    pay(G, c, 4, 'TV-Geld');
    if (c.st.shop) pay(G, c, c.st.shop, 'Fanshop');
    if (L.bye === c.id) pay(G, c, 3, 'Testspiel (spielfrei)');
    const sal = Math.round(c.players.reduce((a, p) => a + pSalary(p), 0) / Math.max(1, G.seasonLen));
    pay(G, c, -sal, 'Gehälter');
    if (c.money < 0) { const z = Math.max(1, Math.round(-c.money * 0.05)); pay(G, c, -z, 'Zinsen'); addRuhm(G, c, -1, 'Schulden'); }

  G.lastTable = G.results.table;

}
function tableOrder(G) {
  return G.clubs.slice().sort((a, b) => b.tab.pts - a.tab.pts || (b.tab.gf - b.tab.ga) - (a.tab.gf - a.tab.ga) || b.tab.gf - a.tab.gf || b.ruhm - a.ruhm || a.name.localeCompare(b.name));
}

/* ---------- Saisonende ---------- */
function seasonEnd(G) {

  const rep = { season: G.season, table: [], awards: [], clubs: {} };
  const R = id => rep.clubs[id] || (rep.clubs[id] = { ruhm: [], money: [], dev: [], youth: [], gone: [] });
  order.forEach((c, i) => {
    const prize = Math.round(50 - 40 * i / Math.max(1, n - 1));
    const rr = Math.round(10 * (n - 1 - i) / Math.max(1, n - 1));
    pay(G, c, prize, 'Prämie Platz ' + (i + 1)); R(c.id).money.push(['Prämie Platz ' + (i + 1), prize]);
    addRuhm(G, c, rr, 'Platz ' + (i + 1)); R(c.id).ruhm.push(['Platz ' + (i + 1), rr]);
    if (i === 0) { c.titles++; rep.awards.push({ k: 'meister', c: c.id, t: 'Meister', d: c.name }); news(G, c.name + ' ist Meister der Saison ' + G.season + '!', 'title'); }
    if (c.sponsor && c.sponsor.bonus && i < n / 2) { pay(G, c, c.sponsor.bonus, 'Bonus ' + c.sponsor.n); R(c.id).money.push(['Sponsor-Bonus', c.sponsor.bonus]); }
    rep.table.push({ id: c.id, rank: i + 1, tab: JSON.parse(JSON.stringify(c.tab)) });
  });
  // Torschützenkönig
  let best = 0; for (const c of G.clubs) for (const p of c.players) best = Math.max(best, p.goals);
  if (best > 0) for (const c of G.clubs) for (const p of c.players) if (p.goals === best) {
    addRuhm(G, c, 2, 'Torschützenkönig'); R(c.id).ruhm.push(['Torschützenkönig ' + p.n, 2]);
    rep.awards.push({ k: 'tore', c: c.id, t: 'Torschützenkönig', d: p.n + ' (' + best + ' Tore)' });
  }
  for (const c of G.clubs) {
    const fr = Math.floor(c.fans / 5000);
    addRuhm(G, c, fr, 'Fans'); R(c.id).ruhm.push(['Fans (' + fmtN(c.fans) + ')', fr]);
    for (const p of c.players) if (p.tr === 'liebling') { addFans(c, 1500); addRuhm(G, c, 1, 'Publikumsliebling'); R(c.id).ruhm.push(['Publikumsliebling ' + p.n, 1]); }
    // Entwicklung

      if (p.age <= 23) { if (rnd() < clamp(0.22 + 0.18 * p.tal + 0.1 * train, 0, 0.92)) p.s++; if (p.tal >= 3 && rnd() < 0.25 + 0.05 * train) p.s++; }

    }

    for (let i = 0; i < nY && c.players.length < SQUAD_MAX; i++) {
      const pos = wpick(['TW', 'AB', 'MF', 'ST'], x => x === 'TW' ? (c.players.filter(p => p.pos === 'TW').length < 2 ? 3 : 0.5) : 3);

      };

    };

    const meta = await withTimeout(root.child('meta').get(), 12000, 'Zeitüberschreitung');
    if (!meta.exists()) throw new Error('Raum ' + code + ' nicht gefunden. Stimmt der Code?');

    root.child('pub').on('value', s => { const v = s.val(); if (v && v.s) handlers.onPub(v.s); });
    root.child('priv/' + fb.uid).on('value', s => { const v = s.val(); if (v && v.s) handlers.onPriv(v.s); });

  };

  C.leave = () => { try { C.root.child('pub').off(); C.root.child('priv/' + C.uid).off(); FB.db.ref('.info/connected').off('value', C.infoCb); C.root.child('pres/' + C.uid).remove(); } catch (_) {} };

function boardAction(uid, a) {
  const G = B.G; if (!G || !a) return;
  let c = clubByUid(G, uid);
  const fail = msg => { B.errs[uid] = { m: msg, n: (B.errs[uid] ? B.errs[uid].n : 0) + 1 }; if (!c) B.H.sendPriv(uid, JSON.stringify({ err: B.errs[uid] })); };
  if (a.t === 'join') {
    if (G.phase !== 'lobby') { if (!c) fail('Das Spiel läuft schon. Du kannst einen Verein übernehmen.'); }
    else if (c) {
      c.name = String(a.name || c.name).slice(0, 24).trim() || c.name;
      c.mgr = String(a.mgr || c.mgr).slice(0, 14).trim() || c.mgr;
      const sh = String(a.short || '').toUpperCase().replace(/[^A-ZÄÖÜ0-9]/g, '').slice(0, 3); c.short = sh.length >= 2 ? sh : autoShort(c.name);
      if (a.col != null && freeColors(G, c.id).includes(a.col)) c.col = a.col;
    } else {
      c = addClub(G, { uid, name: a.name, short: a.short, col: a.col, mgr: a.mgr });
      if (!c) fail('Es sind schon 8 Vereine dabei.');
      else { SND.ding(); news(G, c.name + ' ist dabei.', 'info'); }
    }
  } else if (a.t === 'leave') {
    if (G.phase === 'lobby' && c) { removeClub(G, c.id); B.H.sendPriv(uid, JSON.stringify({ left: 1 })); c = null; }
  } else if (a.t === 'takeover') {
    const t = clubById(G, a.c);
    if (G.phase !== 'lobby' && t && !t.bot && (!t.conn || t.uid === uid)) {
      const old = clubByUid(G, uid); if (old && old !== t) old.uid = null;
      if (t.uid && t.uid !== uid) B.lastPriv[t.uid] = '';
      t.uid = uid; t.conn = true; c = t; B.lastPriv[uid] = '';
      news(G, t.mgr + ' ist wieder bei ' + t.name + '.', 'info');
    } else fail('Dieser Verein ist gerade verbunden.');
  } else if (a.t === 'hello') {
    B.lastPriv[uid] = '';
  } else if (c) {
    const r = applyAction(G, c, a);
    if (r.err) fail(r.err);
    if (a.t === 'build' && r.ok) SND.ding();
  }
  if (c) { c.seen = Date.now(); if (!c.conn) { c.conn = true; } }
  markDirty();
}
function boardPresence(uids) {
  const G = B.G; if (!G) return;
  let ch = false;
  for (const c of G.clubs) if (!c.bot && c.uid) { const on = uids.includes(c.uid); if (c.conn !== on) { c.conn = on; ch = true; } }
  if (ch) markDirty();
}
function privFor(c) { const v = privView(B.G, c); if (B.errs[c.uid]) v.err = B.errs[c.uid]; return v; }

/* ---------- Takt: Spiel weiterrechnen, senden, zeichnen, speichern ---------- */
function boardTick() {
  const G = B.G; if (!G || !window.BOARD_ON) return;
  const now = Date.now();
  if (!G.paused) {
    if (G.phase === 'spiel') { if (liveStep(G, now)) markDirty(); }
    else if (needsReady(G) && humans(G).length && allReady(G)) {
      if (!B.readyAt) B.readyAt = now;
      if (now - B.readyAt > 1200) { B.readyAt = 0; advance(G); onPhaseSound(); markDirty(); }
    } else B.readyAt = 0;
    if (G.phase === 'aufdecken' && G.reveal && now - B.rvAt > 7000 && G.reveal.i < G.reveal.res.length - 1) { G.reveal.i++; B.rvAt = now; markDirty(); }
    if (G.phase === 'spiel' && G.live && (G.live.stage === 'ht' || G.live.kickAt)) markDirty();
    if (G.phase === 'spiel' && G.live && G.live.ms.some(m => m.duel && !m.duel.res)) markDirty();
  }
  if (B.dirty && now - B.lastFlush > 140) flush(now);
}
function flush(now) {
  const G = B.G; B.dirty = false; B.lastFlush = now;
  G.seed = SEED;
  const pub = JSON.stringify(pubView(G));
  if (pub !== B.lastPub) { B.lastPub = pub; B.H.sendPub(pub); }
  for (const c of G.clubs) if (c.uid && !c.bot) {
    const s = JSON.stringify(privFor(c));
    if (s !== B.lastPriv[c.uid]) { B.lastPriv[c.uid] = s; B.H.sendPriv(c.uid, s); }
  }
  boardRender();
  if (now - B.saveAt > 4000) {
    B.saveAt = now;
    const label = G.clubs.map(c => c.short).join(' · ') + ' – Saison ' + G.season + ', ' + phaseName(G.phase);
    const sv = { code: B.code, at: now, label, G };
    ST.set('save-' + B.code, sv);
    const idx = ST.get('saves', []).filter(x => x.code !== B.code); idx.push({ code: B.code, at: now, label }); ST.set('saves', idx.slice(-8));
    if (now - B.fbSaveAt > 20000) { B.fbSaveAt = now; try { B.H.save(JSON.stringify(sv)); } catch (_) {} }
  }
}
function onPhaseSound() { if (B.G.phase !== 'spiel') SND.flip(); }

/* ---------- Brett-Geometrie: Ruhm-Leiste rundherum ---------- */
function boardLayout() {
  const W = window.innerWidth, Hh = viewH();
  const portrait = Hh > W * 1.05;
  const cols = portrait ? 21 : 31, rows = portrait ? 31 : 21;
  const cs = Math.max(16, Math.floor(Math.min((W - 10) / cols, (Hh - 10) / rows)));
  const x0 = Math.floor((W - cols * cs) / 2), y0 = Math.floor((Hh - rows * cs) / 2);
  const sz = cs - 3;
  const pos = [];
  for (let n = 0; n < 100; n++) {
    let x, y;
    const a = cols - 1, b = a + rows - 1, c2 = b + cols - 1;
    if (n <= a) { x = n; y = 0; } else if (n <= b) { x = cols - 1; y = n - a; } else if (n <= c2) { x = cols - 1 - (n - b); y = rows - 1; } else { x = 0; y = rows - 1 - (n - c2); }
    pos.push({ x: x0 + x * cs, y: y0 + y * cs });
  }
  B.lay = { cs, sz, pos };
  $('#track').innerHTML = pos.map((p, n) => '<div class="sq' + (n % 10 === 0 ? ' ten' : n % 2 ? ' alt' : '') + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + sz + 'px;height:' + sz + 'px;font-size:' + Math.max(9, Math.round(cs * 0.33)) + 'px">' + (n % 5 === 0 ? n : '') + '</div>').join('');
  const st = $('#stage');
  const pad = 10;
  st.style.left = (x0 + cs + pad) + 'px'; st.style.top = (y0 + cs + pad) + 'px';
  st.style.width = ((cols - 2) * cs - 2 * pad + 3) + 'px'; st.style.height = ((rows - 2) * cs - 2 * pad + 3) + 'px';
  $('#pawns').innerHTML = '';
}
function renderPawns() {
  const G = B.G, L = B.lay; if (!L) return;
  const box = $('#pawns'); if (!box) return;
  const w = Math.round(L.cs * 0.62);
  const bySq = {};
  const showRd = ['ergebnis', 'saisonende', 'ende'].includes(G.phase) || (G.phase !== 'lobby' && Object.keys(G.rdelta).length);
  for (const c of G.clubs) { const sq = c.ruhm % 100; (bySq[sq] = bySq[sq] || []).push(c); }
  const seen = new Set();
  for (const c of G.clubs) {
    seen.add(c.id);
    let el = document.getElementById('pw-' + c.id);
    if (!el) { el = document.createElement('div'); el.className = 'pawn'; el.id = 'pw-' + c.id; box.appendChild(el); el.style.left = L.pos[0].x + 'px'; el.style.top = L.pos[0].y + 'px'; }
    const sq = c.ruhm % 100, group = bySq[sq], k = group.indexOf(c);
    const p = L.pos[sq];
    const off = (k - (group.length - 1) / 2) * Math.min(L.cs * 0.28, 12);
    const rd = G.rdelta[c.id] || 0;
    const html = pawnSvg(colOf(c).c, w) + (c.ruhm >= 100 ? '<span class="lap">+' + Math.floor(c.ruhm / 100) * 100 + '</span>' : '') + (showRd && rd ? '<span class="rd' + (rd < 0 ? ' neg' : '') + (p.y - L.pos[0].y < L.cs ? ' dn' : '') + '">' + (rd > 0 ? '+' : '') + rd + '</span>' : '');
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
    const lx = Math.round(p.x + (L.sz - w) / 2 + off) + 'px', ly = Math.round(p.y + L.sz / 2 - w * 1.05 + (k % 2) * 3) + 'px';
    if (el.style.left !== lx) el.style.left = lx;
    if (el.style.top !== ly) el.style.top = ly;
    el.title = c.name + ': ' + c.ruhm + ' Ruhm';
  }
  for (const el of Array.from(box.children)) if (!seen.has(el.id.slice(3))) el.remove();
}

function headHtml() {
  const G = B.G, ph = G.phase;
  let mid = '';
  if (ph === 'lobby') mid = 'SPIEL <b>VORBEREITEN</b>';
  else if (ph === 'ende') mid = '<b>SIEGEREHRUNG</b>';
  else {
    mid = 'SAISON <b>' + G.season + '</b>' + (G.settings.seasons > 1 ? ' VON ' + G.settings.seasons : '') + ' <span class="lime">/</span> ';
    if (ph === 'spiel') mid += '<b>SPIELTAG ' + (G.md + 1) + '</b> VON ' + G.seasonLen + (G.live && G.live.ms.length > 1 ? ' <span class="lime">/</span> SPIEL <b>' + Math.min(G.live.cur + 1, G.live.ms.length) + '</b> VON ' + G.live.ms.length : '');
    else if (ph === 'ergebnis') mid += '<b>SPIELTAG ' + G.md + '</b> VON ' + G.seasonLen;

  return '<div class="brand"><i></i><b>FOOTBALL EMPIRE</b></div><div class="mid">' + mid + '</div><div class="ctl">' +
    '<span class="roomcode">RAUM <b>' + esc(B.code) + '</b></span>' +

}

/* ---------- Zeichnen ---------- */
function boardRender() {
  const G = B.G; if (!G || !$('#bmain')) return;
  const hh = headHtml(); const he = $('#bhead'); if (he._h !== hh) { he.innerHTML = hh; he._h = hh; }
  renderPawns();
  const ph = G.phase;
  if (ph !== B.ph) { B.ph = ph; B.mainKey = ''; if (ph === 'spiel') B.evSeen = {}; }
  const main = $('#bmain');
  if (ph === 'spiel') { renderLive(main); return; }
  const html = (RENDER[ph] || (() => ''))() + (G.paused ? pauseHtml() : '');
  if (html !== B.mainKey) { main.innerHTML = html; B.mainKey = html; afterRender(ph); }
}
function pauseHtml() { return '<div class="pausebox"><div class="bigt">PAUSE</div><p class="mut">Das Spiel ist angehalten.</p><button class="btn big" data-b="pause">' + ic('play') + 'Weiter</button></div>'; }
function afterRender(ph) {
  if (ph === 'lobby') { const q = $('#qrbox'); if (q && !q.firstChild) q.innerHTML = qrSvg(joinUrl()); }
}
function joinUrl() { const u = location.origin + location.pathname + '?raum=' + B.code + (LOCAL ? '&lokal=1' : ''); return u; }
function qrSvg(text) {
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Beitreten"><path d="' + d + '" fill="#06122A"></path></svg>';

}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-b]'); if (!b || !window.BOARD_ON) return;
  const G = B.G; if (!G) return;
  SND.init();
  const k = b.dataset.b;
  if (k === 'set') { const key = b.dataset.k; let v = b.dataset.v; if (key === 'seasons') v = +v; G.settings[key] = v; }
  else if (k === 'bot') { const used = new Set(G.clubs.map(c => c.name)); const nm = BOT_NAMES.find(x => !used.has(x)) || ('Computer ' + (G.clubs.length + 1)); addClub(G, { name: nm, bot: true, mgr: 'Computer' }); SND.ding(); }
  else if (k === 'kick') { const c = clubById(G, b.dataset.v); if (c) { if (c.uid) B.H.sendPriv(c.uid, JSON.stringify({ left: 1 })); removeClub(G, c.id); } }
  else if (k === 'start') { if (startGame(G)) { SND.whistle(1); B.lastPriv = {}; } }
  else if (k === 'force') { advance(G, true); if (G.phase !== 'spiel') onPhaseSound(); }
  else if (k === 'next') { if (G.phase === 'aufdecken') { B.rvAt = Date.now(); advance(G, false); SND.flip(); } else { advance(G, false); onPhaseSound(); } }
  else if (k === 'pause') { if (G.paused) { const dt = Date.now() - (G.pausedAt || Date.now()); G.paused = false; shiftTimes(G, dt); } else { G.paused = true; G.pausedAt = Date.now(); } }
  else if (k === 'snd') { SND.on = !SND.on; ST.set('snd', SND.on); }
  else if (k === 'menu') { boardMenu(); return; }
  else if (k === 'again') {
    const old = G; const N = newGame(old.settings); N.code = B.code;
    for (const c of old.clubs) addClub(N, { uid: c.uid, name: c.name, short: c.short, col: c.col, mgr: c.mgr, bot: c.bot });
    for (const c of N.clubs) { const o = old.clubs.find(x => x.uid === c.uid && x.name === c.name); c.conn = o ? o.conn : true; }
    B.G = N; B.lastPriv = {}; B.mainKey = ''; ST.del('save-' + B.code);
  }
  else if (k === 'quit') { try { sessionStorage.removeItem('fe-board'); } catch (_) {} ST.del('save-' + B.code); ST.set('saves', ST.get('saves', []).filter(x => x.code !== B.code)); try { B.H.destroy(); } catch (_) {} window.BOARD_ON = false; B.G = null; showStart(); return; }
  else if (k === 'mclose') { const m = $('#bmenu'); if (m) m.remove(); return; }
  else if (k === 'msave') { flush(Date.now() + 1e7); const m = $('#bmenu'); if (m) m.remove(); toast('Gespeichert. Auf der Startseite unter „Fortsetzen: ' + B.code + '“.'); return; }
  else if (k === 'mquit') { try { sessionStorage.removeItem('fe-board'); } catch (_) {} B.saveAt = 0; flush(Date.now() + 1e7); try { B.H.close(); } catch (_) {} window.BOARD_ON = false; B.G = null; showStart(); return; }
  B.mainKey = ''; markDirty();
});
function boardMenu() {

  d.innerHTML = '<div class="bigt s">MENÜ</div><div class="col" style="width:min(360px,80vw)"><button class="btn wide" data-b="mclose">Zurück zum Spiel</button><button class="btn dark wide" data-b="msave">Jetzt speichern</button><button class="btn ghost wide" data-b="mquit">Speichern und zur Startseite</button></div><p class="mut" style="max-width:420px;text-align:center;font-size:13px">Gespeicherte Spiele setzt du auf diesem Gerät über die Startseite fort. Die Handys kommen mit demselben Code wieder rein.</p>';

async function phoneStart(code) {
  window.PHONE_ON = true; window.BOARD_ON = false;

  Object.assign(P, { code, pub: null, me: null, html: '', tab: 'akt', lastErrN: -1, bids: null, bidsKey: '', luPend: null, dl: null, editJoin: false });
  P.C = makeClient({ onPub: phoneOnPub, onPriv: phoneOnPriv, onState: s => { P.conn = s; phoneRender(); } });

function phoneOnPriv(s) {

  const tagT = d.kind === 'elf' ? (s ? 'ELFMETER FÜR DICH' : 'ELFMETER GEGEN DICH') : s ? (d.kind === 'kopf' ? 'ECKE · KOPFBALL' : 'TORCHANCE') : 'TORWART GEFRAGT';

  const meV = s ? d.sS : d.kS, opV = s ? d.kS : d.sS;
  let center, btn = '';
  if (d.res) {
    const good = s ? d.res.goal : !d.res.goal;
    center = '<div class="row" style="gap:12px">' + dieHtml(d.my[0], 'land lime', 110) + (d.my[1] ? dieHtml(d.my[1], 'land', 80) : '') + '</div>' +
      '<div class="bigmsg" style="padding:0"><h2 class="' + (good ? 'lime' : '') + '" style="font-size:42px">' + (s ? (d.res.goal ? 'TOOOR!' : 'Gehalten …') : (d.res.goal ? 'Gegentor …' : 'GEHALTEN!')) + '</h2><p>' + (s ? d.res.s + ' gegen ' + d.res.k : d.res.k + ' gegen ' + d.res.s) + '</p></div>';
  } else if (d.rolled) {
    center = '<div class="row" style="gap:12px">' + dieHtml(d.my[0], 'land lime', 130) + (d.my[1] ? dieHtml(d.my[1], 'land', 90) : '') + '</div><p class="hint">Warte auf ' + esc(cPub(me.match.opp).mgr) + ' …</p>';
  } else if (d.real) {
    // echte Würfel am Tisch: Augenzahl eintippen (mit Glücksmünze zwei Würfel)
    const two = coin; const rv = P.dl.rv || [];
    const pad = i => '<div class="rvpad">' + [1, 2, 3, 4, 5, 6].map(n => '<button data-p="rv" data-i="' + i + '" data-v="' + n + '" class="' + (rv[i] === n ? 'on' : '') + '" aria-label="' + n + '">' + dieHtml(n, '', 46) + '</button>').join('') + '</div>';
    center = '<p class="hint" style="text-align:center;margin:0">Würfle mit ' + (two ? 'zwei echten Würfeln' : 'deinem echten Würfel') + ' und tippe die Augenzahl ein:</p>' + (two ? '<span class="lbl">WÜRFEL 1</span>' : '') + pad(0) + (two ? '<span class="lbl">WÜRFEL 2</span>' + pad(1) : '');
    btn = '<p class="hint" style="text-align:center">Sonst würfelt das iPad in ' + d.left + ' s.</p>';
  } else {
    center = (P.dl.rolling ? dieHtml(1, 'roll lime', 140) : dieHtml(6, 'lime', 140)) +
      (MOTION_OK ? '<div class="shakehint">' + ic('shake') + 'Handy schütteln oder Knopf drücken</div>' : '<button class="btn sm dark" data-p="motion">' + ic('shake') + 'Schütteln erlauben</button>');
    btn = '<button class="btn big wide" data-p="roll"' + (P.dl.rolling ? ' disabled' : '') + '>WÜRFELN</button><p class="hint" style="text-align:center">' + (d.auto ? 'Automatisches Würfeln ist an.' : 'Sonst würfelt das iPad in ' + d.left + ' s.') + '</p>';
  }
  const opts = (!d.rolled && !d.res) ? ((s && d.trAvail ? '<button class="dopt' + (P.dl.trait ? ' on' : '') + '" data-p="dtrait"><span class="t"><b>Torjäger einsetzen: +2</b><span>Einmal pro Spiel</span></span><span class="sw"></span></button>' : '') +
    (me.coins > 0 ? '<button class="dopt' + (P.dl.coin ? ' on' : '') + '" data-p="dcoin"><span class="t"><b>Glücksmünze: zwei Würfel</b><span>Der bessere zählt · noch ' + me.coins + '</span></span><span class="sw"></span></button>' : '')) : '';
  return '<div class="dscreen"><div><span class="tag' + (s ? '' : ' white') + '"><span>' + tagT + (min ? ' · ' + min + '′' : '') + '</span></span><h2>' + title + '</h2></div>' +
    '<div class="dvs"><div class="g"><div><b>' + esc(d.me.n.toUpperCase()) + '</b><span>' + (s ? 'Abschluss' : 'Torwart') + ' <b style="display:inline;font-size:16px">' + meV + '</b></span></div><span class="vs" style="text-align:center;font-weight:900;font-style:italic;color:var(--ink2)">VS</span><div style="text-align:right"><b>' + esc(d.opp.n.toUpperCase()) + '</b><span>' + (s ? 'Torwart' : 'Abschluss') + ' <b style="display:inline;font-size:16px">' + opV + '</b></span></div></div>' +
    '<div style="padding:0 14px 10px;font-size:12px;color:var(--ink2)"><b style="color:var(--ink)">' + (myAdv > 0 ? 'Vorteil +' + myAdv + ' für dich' : myAdv < 0 ? 'Vorteil +' + (-myAdv) + ' für den Gegner' : 'Ausgeglichen') + '</b>' + (d.notes && d.notes.length ? ' · ' + d.notes.map(esc).join(' · ') : '') + (trait ? ' · Torjäger +2' : '') + (d.kb ? ' · Katze +1' : '') + '<br>Ein Stärkeunterschied zählt höchstens ±2.</div>' +
    '<div class="pb"><span class="lbl">' + (s ? 'TORCHANCE' : 'HALTECHANCE') + '</span><span class="bar"><i style="width:' + pct + '%"></i></span><b>' + pct + ' %</b></div></div>' +
    opts + '<div class="dcenter">' + center + '</div>' + btn + '</div>';
}
function sendRealRoll() {
  const me = P.me; if (!me || !me.duel || me.duel.rolled || me.duel.res || !P.dl) return;
  const two = P.dl.coin && me.coins > 0; const rv = P.dl.rv || [];
  if (!rv[0] || (two && !rv[1])) { phoneRender(); return; }
  P.dl.rolling = true;
  send({ t: 'roll', d: me.duel.id, coin: two, trait: P.dl.trait && me.duel.trAvail, v: two ? [rv[0], rv[1]] : [rv[0]] });
  phoneRender();
}
function doRollPhone() {
  const me = P.me; if (!me || !me.duel || me.duel.rolled || me.duel.res || !P.dl || P.dl.rolling) return;
  P.dl.rolling = true;
  if (navigator.vibrate) try { navigator.vibrate(120); } catch (_) {}
  send({ t: 'roll', d: me.duel.id, coin: P.dl.coin && me.coins > 0, trait: P.dl.trait && me.duel.trAvail });
  phoneRender();
  setTimeout(() => { if (P.dl && P.dl.rolling && P.me && P.me.duel && !P.me.duel.rolled) { P.dl.rolling = false; phoneRender(); } }, 6000);
}
window.addEventListener('devicemotion', e => {
  if (!window.PHONE_ON || !P.me || !P.me.duel || P.me.duel.rolled || P.me.duel.real || (P.dl && P.dl.rolling)) return;
  const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
  let mag;
  if (a) mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  else { const g = e.accelerationIncludingGravity || {}; const m2 = Math.sqrt((g.x || 0) ** 2 + (g.y || 0) ** 2 + (g.z || 0) ** 2); mag = Math.abs(m2 - (P.lastMag || m2)); P.lastMag = m2; }
  if (mag > 14 && Date.now() - P.shakeAt > 1500) { P.shakeAt = Date.now(); MOTION_OK = true; doRollPhone(); }
});

/* ---------- Kader, Stadion, Finanzen, Liga ---------- */
function kaderHtml() {
  const me = P.me;
  const lu = me.lu; const inXi = new Set(lu ? POS.flatMap(x => lu.xi[x] || []) : []);
  let h = '<div class="sec"><h2><span class="lbl">KADER · ' + me.players.length + ' SPIELER</span><span class="mut" style="font-size:12px">Gehälter ' + fmtM(me.salary) + ' / Saison</span></h2></div>';
  for (const pos of POS) {
    const ps = me.players.filter(p => p.pos === pos).sort((a, b) => b.s - a.s);
    if (!ps.length) continue;
    h += '<div class="sec"><h2><span class="lbl">' + POSN[pos].toUpperCase() + '</span></h2><div class="plist">' + ps.map(p => '<button class="prow" data-p="pinfo" data-v="' + p.id + '"><span class="s">' + p.s + '</span><span class="i"><b>' + esc(p.n) + trChip(p.tr) + (p.am ? ' <span class="trc">Amateur</span>' : '') + '</b><span>' + p.age + ' J. ' + (p.age <= 23 ? stars(p.tal) + ' ' : '') + '· Wert ' + fmtM(p.v) + (p.goals ? ' · ' + p.goals + ' Tore' : '') + (p.st ? ' · <span class="st-inj">' + esc(p.st.n) + ' (' + p.st.left + ')</span>' : '') + '</span></span><span class="r">' + (inXi.has(p.id) ? '<b class="lime">Elf</b>' : '') + '</span></button>').join('') + '</div></div>';
  }
  return h;
}

  const p = pl(pid); if (!p) return;

  P.sheet = { k: 'info', title: p.n, html: '<div class="kv"><span>Position</span><b>' + POSN[p.pos] + '</b></div><div class="kv"><span>Stärke</span><b>' + p.s + '</b></div><div class="kv"><span>Alter</span><b>' + p.age + '</b></div>' +
    (p.age <= 23 ? '<div class="kv"><span>Talent</span><b>' + stars(p.tal) + '</b></div>' : '') +
    (tr ? '<div class="kv"><span>' + esc(tr.n) + '</span><b style="font-weight:600;max-width:60%;text-align:right">' + esc(tr.d) + '</b></div>' : '') +
    '<div class="kv"><span>Marktwert</span><b>' + fmtM(p.v) + '</b></div><div class="kv"><span>Gehalt pro Saison</span><b>' + fmtM(p.sal) + '</b></div>' +
    '<div class="kv"><span>Tore (Saison / gesamt)</span><b>' + p.goals + ' / ' + (p.gt + p.goals) + '</b></div><div class="kv"><span>Einsätze</span><b>' + p.apps + '</b></div>' +
    (p.yc ? '<div class="kv"><span>Gelbe Karten</span><b>' + p.yc + ' (bei 3 gesperrt)</b></div>' : '') +
    (p.st ? '<div class="kv"><span>Status</span><b class="st-inj">' + esc(p.st.n) + ', noch ' + p.st.left + (p.st.left === 1 ? ' Spiel' : ' Spiele') + '</b></div>' : '') +
    '<p class="hint" style="margin-top:8px">Junge Spieler mit Talent werden am Saisonende oft besser, ab 31 lassen sie nach.</p>' };
  phoneRender();
}
function stadionHtml() {
  const me = P.me, mc = myPub(), ph = P.pub.ph;
  const can = BUILD_PHASES.includes(ph) && !(ph === 'spiel' && me.match && (me.match.stat === 'live' || me.match.stat === 'ht'));
  let h = '<div class="sec"><div class="kv"><span>Plätze</span><b>' + fmtN(15000 + 6000 * me.st.tri) + '</b></div><div class="kv"><span>Fans</span><b>' + fmtN(mc.fans) + '</b></div>' +
    '<p class="hint">Jede Ausbaustufe bringt sofort +2 Ruhm. ' + (can ? '' : 'Bauen geht zwischen den Spieltagen.') + (me.flags && me.flags.discount ? ' Bauzuschuss: nächster Ausbau ' + fmtM(me.flags.discount) + ' günstiger.' : '') + '</p></div>';
  for (const k of BUILD_KEYS) {

      (cost == null ? '<span class="chip on">' + ic('check') + 'Voll ausgebaut</span>' : '<button class="btn sm' + (me.money >= cost && can ? '' : ' dark') + '" data-p="build" data-v="' + k + '"' + (me.money >= cost && can ? '' : ' disabled') + '>Stufe ' + (lv + 1) + ' bauen · ' + fmtM(cost) + '</button>') + '</div><div style="height:8px"></div>';
  }

function geldHtml() {
  const me = P.me;
  let h = '<div class="sec"><div class="kv"><span>Vereinskasse</span><b class="' + (me.money < 0 ? 'neg' : '') + '">' + fmtM(me.money) + '</b></div><div class="kv"><span>Gehälter pro Saison</span><b>' + fmtM(me.salary) + '</b></div>' +
    (me.sponsor ? '<div class="kv"><span>Sponsor</span><b>' + esc(me.sponsor.n) + '</b></div>' : '') +
    '<div class="kv"><span>Glücksmünzen</span><b>' + me.coins + '</b></div>' +
    '<p class="hint">Schulden kosten Zinsen und jeden Spieltag 1 Ruhm. Am Spielende bringt die Vereinskasse je 5 Mio € 1 Ruhm.</p></div>';
  for (const f of me.fin.slice().reverse()) {
    h += '<div class="sec"><h2><span class="lbl">' + esc(f.label.toUpperCase()) + ' · SAISON ' + f.s + '</span><b class="' + (f.sum >= 0 ? 'pos' : 'neg') + '">' + fmtMs(f.sum) + '</b></h2>' + f.items.map(x => '<div class="kv"><span>' + esc(x.t) + '</span><b class="' + (x.v >= 0 ? 'pos' : 'neg') + '">' + fmtMs(x.v) + '</b></div>').join('') + '</div>';

function ligaHtml() {
  const pub = P.pub, me = P.me;
  const ord = pubTable();
  let h = '<div class="sec"><h2><span class="lbl">TABELLE SAISON ' + pub.season + '</span></h2><table class="ptab"><thead><tr><th>#</th><th>Verein</th><th>Sp</th><th>Tore</th><th>Pkt</th></tr></thead><tbody>' +

  if (pub.hist && pub.hist.length) h += '<div class="sec"><h2><span class="lbl">MEISTER</span></h2>' + pub.hist.map(x => '<div class="kv"><span>Saison ' + x.season + '</span><b>' + esc((cPub(x.champ) || {}).name) + '</b></div>').join('') + '</div>';
  h += '<div class="sec"><h2><span class="lbl">NEUES</span></h2><div class="evl">' + pub.news.slice().reverse().map(n => '<div><span>' + esc(n.t) + '</span></div>').join('') + '</div></div>';
  h += '<p class="hint" style="text-align:center">Football Empire · Version ' + APP_VERSION + '</p>';
  return h;
}

/* ---------- Tippen ---------- */
document.addEventListener('click', e => {
  if (!window.PHONE_ON) return;
  const b = e.target.closest('[data-p]'); if (!b) return;
  const k = b.dataset.p, v = b.dataset.v;
  const me = P.me;
  switch (k) {
    case 'tab': P.tab = v; P.sheet = null; phoneRender(); const m = $('#ph-main'); if (m) m.scrollTop = 0; return;
    case 'col': P.form.col = +v; updateJoinColors(); return;
    case 'joinback': P.editJoin = false; P.html = ''; phoneRender(); return;
    case 'editjoin': { const mc = myPub(); P.form = { mgr: mc.mgr, name: mc.name, short: mc.short, col: mc.col }; P.editJoin = true; P.html = ''; phoneRender(); return; }
    case 'leave': if (confirm('Liga wirklich verlassen?')) send({ t: 'leave' }); return;
    case 'take': send({ t: 'takeover', c: v }); return;
    case 'motion': askMotion(); return;
    case 'ready': send({ t: 'ready', v: true }); return;
    case 'unready': send({ t: 'ready', v: false }); return;
    case 'sponsor': send({ t: 'sponsor', i: +v }); return;
    case 'list': { let ids = me.listed.slice(); if (ids.includes(v)) ids = ids.filter(x => x !== v); else { if (ids.length >= 3) { toast('Höchstens 3 Spieler.'); return; } ids.push(v); } me.listed = ids; send({ t: 'list', ids }); phoneRender(); return; }
    case 'bid': {
      const card = (P.pub.market || []).find(x => x.id === v); if (!card) return;
      const d = +b.dataset.d; let cur = P.bids[v] || 0;
      if (d === 0) cur = cur ? 0 : card.min;
      else if (!cur) cur = d > 0 ? card.min : 0;
      else { cur += d; if (cur < card.min) cur = 0; }
      const nb = Object.assign({}, P.bids); if (cur > 0) nb[v] = cur; else delete nb[v];
      const sum = Object.values(nb).reduce((a, x) => a + x, 0);
      if (sum > Math.max(0, me.money)) { toast('Dafür reicht dein Geld nicht.'); return; }
      P.bids = nb; phoneRender();
      clearTimeout(P.bidT); P.bidT = setTimeout(() => send({ t: 'bids', b: P.bids }), 350);
      return;
    }
    case 'card': send({ t: 'card', i: +v }); return;
    case 'cardopen': if (me.card && !me.card.open) { P.cov = { id: me.card.id }; send({ t: 'cardopen' }); if (navigator.vibrate) try { navigator.vibrate(40); } catch (_) {} cardOverlay(); } return;
    case 'covclose': P.cov = null; cardOverlay(); phoneRender(); return;
    case 'covshow': if (me.card) { P.cov = { id: me.card.id }; cardOverlay(); } return;
    case 'rv': { if (!P.dl) return; P.dl.rv = P.dl.rv || []; P.dl.rv[+b.dataset.i] = +v; sendRealRoll(); return; }
    case 'form': { const lu = JSON.parse(JSON.stringify(luCur())); lu.form = v; sendLineup(lu); return; }
    case 'taktik': { const lu = JSON.parse(JSON.stringify(luCur())); lu.taktik = v; sendLineup(lu); return; }
    case 'einsatz': { const lu = JSON.parse(JSON.stringify(luCur())); lu.einsatz = v; sendLineup(lu); return; }
    case 'best': { const lu = luCur(); sendLineup({ form: lu.form, taktik: lu.taktik, einsatz: lu.einsatz, xi: {} }); return; }
    case 'slot': slotSheet(b.dataset.pos, +b.dataset.i); return;
    case 'sheetpick': {
      const S = P.sheet; P.sheet = null;
      if (S.k === 'slot') applySlot(S.pos, S.i, v);
      else if (S.k === 'sub') { send({ t: 'ht', subs: [[S.out, v]] }); phoneRender(); }
      return;
    }
    case 'sheetclose': P.sheet = null; phoneRender(); return;
    case 'sheetbg': if (e.target === b) { P.sheet = null; phoneRender(); } return;
    case 'pinfo': playerSheet(v); return;
    case 'build': send({ t: 'build', k: v }); return;
    case 'httaktik': send({ t: 'ht', taktik: v }); return;
    case 'hteinsatz': send({ t: 'ht', einsatz: v }); return;
    case 'htform': send({ t: 'ht', form: v }); return;
    case 'subout': subSheet(v); return;
    case 'roll': doRollPhone(); return;
    case 'dcoin': P.dl.coin = !P.dl.coin; phoneRender(); return;
    case 'dtrait': P.dl.trait = !P.dl.trait; phoneRender(); return;
  }
});
document.addEventListener('submit', e => {
  if (!window.PHONE_ON || e.target.id !== 'jf') return;
  e.preventDefault();
  askMotion();
  const f = P.form;
  f.mgr = ($('#jmgr').value || '').trim(); f.name = ($('#jname').value || '').trim(); f.short = ($('#jshort').value || '').trim().toUpperCase();
  if (!f.mgr) { toast('Wie heißt du?'); return; }
  if (!f.name) { toast('Wie heißt dein Verein?'); return; }
  if (f.col == null) { const used = new Set(P.pub.clubs.filter(c => !P.me || c.id !== P.me.id).map(c => c.col)); f.col = COLORS.findIndex((x, i) => !used.has(i)); }
  ST.set('form', f);
  send({ t: 'join', mgr: f.mgr, name: f.name, short: f.short, col: f.col });
  P.editJoin = false; P.html = '';
  setTimeout(phoneRender, 50);
});

/* ---------- Start ---------- */
(function boot() {
  const q = new URLSearchParams(location.search);
  const code = (q.get('raum') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  const tempo = +q.get('tempo'); if (tempo > 1) for (const k in T) T[k] = Math.round(T[k] / tempo);
  if (code.length === 4) { phoneStart(code); return; }
  let bc = null; try { bc = sessionStorage.getItem('fe-board'); } catch (_) {}
  const sv = bc ? ST.get('save-' + bc, null) : null;
  if (sv) { boardStart(sv); return; } // iPad hat neu geladen: gleiches Spiel, gleicher Code
  if (q.has('brett')) { boardStart(null); return; }
  showStart();
})();
