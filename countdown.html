/* ---------- Bauplan-Werkzeuge ---------- */
function snap(){return JSON.stringify(D().parts)}
function pushHist(){E.hist.push(snap());if(E.hist.length>40)E.hist.shift()}
ACT.undo=()=>{const h=E.hist.pop();if(!h){toast('Nichts zum Rückgängigmachen');return}D().parts=JSON.parse(h);E.sel=-1;edChanged()};
ACT.sym=()=>{E.sym=E.sym===1?2:1;setTxt('#bSym',E.sym+'×');toast(E.sym===2?'Spiegeln an: seitliche Teile kommen paarweise':'Spiegeln aus')};
ACT.edNew=(v,b)=>{if(D().parts.length&&b.dataset.sure!=='1'){b.dataset.sure='1';toast('Nochmal tippen: alles abreißen und neu anfangen');setTimeout(()=>{b.dataset.sure=''},2500);return}
  pushHist();S.cur={n:nextName(),parts:[]};E.sel=-1;edChanged(true);edFit()};
function nextName(){let i=1;const n=new Set([S.cur&&S.cur.n,...S.designs.map(d=>d.n)]);while(n.has('Rakete '+i))i++;return'Rakete '+i}
function partHalfW(q,y){
  const t=P[q.t],f=clamp((y-(q.y-t.h/2))/t.h,0,1);
  const top={pod:.5,pod3:.44,lander:.8,nose:.12,chute:.1,les:.24}[t.sh];
  let w=t.w;if(top!==undefined)w=lerp(t.w,t.w*top,f);else if(t.sh==='adapter')w=lerp(t.wb||t.w,t.wt||t.w,f);
  return w/2;
}
function topFree(ps,i){const q=ps[i];if(!P[q.t].nd||!P[q.t].nd.includes('t'))return false;if(q.p>=0&&q.n==='top')return false;return!ps.some(c=>c.p===i&&c.a==='top')}
function botFree(ps,i){const q=ps[i];if(!P[q.t].nd||!P[q.t].nd.includes('b'))return false;if(q.p>=0&&q.n==='bot')return false;return!ps.some(c=>c.p===i&&c.a==='bot')}
/* Teile hinzufügen (Liste von Teilen mit relativen Positionen; Wurzel = erstes Element) */
function addSub(sub,pi,a,n,dx,dy){
  const ps=D().parts,base=ps.length;
  sub.forEach((q,k)=>{const c=Object.assign({},q,{x:q.x+dx,y:q.y+dy});c.p=k===0?pi:base+q.p;if(k===0){c.a=a;c.n=n}c.sy=-1;delete c._k;ps.push(c)});
  return base;
}
function mirrorSub(sub,ax){return sub.map(q=>Object.assign({},q,{x:2*ax-q.x,fx:q.fx?0:1,a:q.a==='L'?'R':q.a==='R'?'L':q.a}))}
/* Unterbaum ab i als lose Liste (Positionen bleiben, p relativ) */
function cutSub(i){
  const ps=D().parts,kids=kidsOf(ps),idx=subtree(kids,i),map=new Map(idx.map((j,k)=>[j,k]));
  return idx.map((j,k)=>{const q=Object.assign({},ps[j]);q.p=k===0?-1:map.get(q.p);return q});
}
function removeIdx(set){
  const ps=D().parts,kids=kidsOf(ps),all=new Set();
  for(const i of set)for(const j of subtree(kids,i))all.add(j);
  const keep=[],map=new Map();ps.forEach((q,i)=>{if(!all.has(i)){map.set(i,keep.length);keep.push(q)}});
  for(const q of keep){if(q.p>=0)q.p=map.has(q.p)?map.get(q.p):-1;if(q.sy>=0)q.sy=map.has(q.sy)?map.get(q.sy):-1}
  D().parts=keep;
}
/* Anbau-Position berechnen: Kandidaten an allen freien Knoten */
function attachCands(t,ps,skip){
  const d=P[t],out=[];
  ps.forEach((q,i)=>{
    if(skip&&skip.has(i))return;const pd=P[q.t];
    if(!d.rad&&d.nd){
      if(d.nd.includes('t')&&botFree(ps,i)&&!q.fy){const w=nodeW(q,'bot');if(Math.abs(w-(d.wt||d.w))<.01||true)out.push({i,a:'bot',n:'top',x:q.x,y:q.y-pd.h/2-d.h/2,nx:q.x,ny:q.y-pd.h/2,k:'s'})}
      if(d.nd.includes('b')&&topFree(ps,i)&&!q.fy)out.push({i,a:'top',n:'bot',x:q.x,y:q.y+pd.h/2+d.h/2,nx:q.x,ny:q.y+pd.h/2,k:'s'});
    }
    if(pd.srf&&(d.rad||d.srf&&d.nd&&d.nd.length===2))out.push({i,k:'r'});
  });
  return out;
}
function sideSpot(q,t,fy,fx){
  const d=P[t],pd=P[q.t];
  const lim=Math.max(0,pd.h/2-Math.min(d.h,pd.h)/2);
  const y=clamp(fy,q.y-lim,q.y+lim),side=fx<q.x?-1:1;
  const hw=Math.max(partHalfW(q,y-d.h/2+.05),partHalfW(q,y+d.h/2-.05));
  return{x:q.x+side*(hw+d.w/2-.03),y,side};
}
/* ---------- Antippen: automatisch anbauen ---------- */
function centralCol(ps){const out=[];if(!ps.length)return out;const st=[0];while(st.length){const i=st.pop();out.push(i);for(let j=0;j<ps.length;j++){const c=ps[j];if(c.p===i&&(c.a==='top'||c.a==='bot'))st.push(j)}}return out}
function autoAdd(t){
  const ps=D().parts,d=P[t];
  if(!partOK(t))return;
  pushHist();
  const one=[{t,x:0,y:0,fx:0,p:-1}];
  if(!ps.length){addSub(one,-1,undefined,undefined,0,0);E.sel=0;edChanged(true);edFit();return}
  const col=centralCol(ps);
  const sel=E.sel>=0&&E.sel<ps.length?E.sel:-1;
  if(d.rad){
    let tgt=sel>=0&&P[ps[sel].t].srf?sel:-1;
    if(tgt<0){const cs=col.filter(i=>P[ps[i].t].srf);
      const low=['fin','fin2','leg','leg_l','wheel','wheel_l','e_spinne','dec_r'].includes(t);
      cs.sort((a,b)=>ps[a].y-ps[b].y);tgt=low?cs[0]:cs[cs.length-1];
      if(t==='dec_r'){const tk=cs.filter(i=>P[ps[i].t].c==='tank'||P[ps[i].t].c==='eng');if(tk.length)tgt=tk.sort((a,b)=>P[ps[b].t].h-P[ps[a].t].h)[0]}}
    if(tgt===undefined||tgt<0){toast('Hier gibt es keine Stelle für ein seitliches Teil','bad');E.hist.pop();return}
    const q=ps[tgt],pd=P[q.t];
    let fy=['fin','fin2','e_spinne'].includes(t)?q.y-pd.h/2+d.h/2:d.leg?q.y-pd.h/2+d.h*.15:t==='dec_r'?q.y:q.y+pd.h/2-d.h/2;
    if(d.wheel)fy=q.y-pd.h/2;
    placeSide(one,tgt,fy,q.x+1,E.sym===2);
    return;
  }
  // Stapelteile (Spitzen, Schirme und Andockstutzen kommen bevorzugt oben drauf)
  if(d.nd==='b'||d.dock&&(sel>=0?topFree(ps,sel):col.some(i=>topFree(ps,i)))){
    let tgt=sel>=0&&topFree(ps,sel)?sel:-1;
    if(tgt<0){const cs=col.filter(i=>topFree(ps,i));cs.sort((a,b)=>ps[b].y-ps[a].y);tgt=cs[0]}
    if(tgt===undefined){toast('Oben ist kein Platz frei','bad');E.hist.pop();return}
    const q=ps[tgt];addSub(one,tgt,'top','bot',q.x,q.y+P[q.t].h/2+d.h/2);E.sel=ps.length-1;twinCopy(tgt,ps.length-1);edChanged();return;
  }
  // unten anbauen – oder zwischen ausgewähltem Teil und dem darunter einfügen
  if(sel>=0&&P[ps[sel].t].nd&&P[ps[sel].t].nd.includes('b')){
    const below=ps.findIndex(c=>c.p===sel&&c.a==='bot');
    if(below>=0&&d.nd.includes('b')){insertBelow(sel,t);return}
    if(below<0&&botFree(ps,sel)){const q=ps[sel];addSub(one,sel,'bot','top',q.x,q.y-P[q.t].h/2-d.h/2);E.sel=ps.length-1;twinCopy(sel,ps.length-1);edChanged();return}
  }
  const cs=col.filter(i=>botFree(ps,i));cs.sort((a,b)=>ps[a].y-ps[b].y);
  const tgt=cs[0];
  if(tgt===undefined){
    // ganz oben drauf, wenn unten alles belegt ist
    const ct=col.filter(i=>topFree(ps,i));if(ct.length&&d.nd.includes('b')){const q=ps[ct[0]];addSub(one,ct[0],'top','bot',q.x,q.y+P[q.t].h/2+d.h/2);E.sel=ps.length-1;edChanged();return}
    toast('Kein freier Platz – wähle ein Teil aus, unter das es soll','bad');E.hist.pop();return}
  const q=ps[tgt];addSub(one,tgt,'bot','top',q.x,q.y-P[q.t].h/2-d.h/2);E.sel=ps.length-1;edChanged();
}
/* zwischen Teil i und dem darunter einfügen */
function insertBelow(i,t){
  const ps=D().parts,d=P[t],q=ps[i],c=ps.findIndex(x=>x.p===i&&x.a==='bot');
  const kids=kidsOf(ps);for(const j of subtree(kids,c))ps[j].y-=d.h;
  addSub([{t,x:0,y:0,fx:0,p:-1}],i,'bot','top',q.x,q.y-P[q.t].h/2-d.h/2);
  const ni=ps.length-1;ps[c].p=ni;ps[c].a='bot';ps[c].n='top';
  E.sel=ni;edChanged();
}
/* an ein gespiegeltes Gegenstück dieselbe Ergänzung bauen */
function twinCopy(pi,ni){
  const ps=D().parts,tw=ps[pi].sy;if(tw===undefined||tw<0||tw>=ps.length)return;
  const ax=(ps[pi].x+ps[tw].x)/2,sub=mirrorSub(cutSub(ni),ax),q=ps[ni];
  const b=addSub(sub,tw,q.a,q.n,0,0);
  for(let k=0;k<sub.length;k++){ps[b+k].sy=ni+k;ps[ni+k].sy=b+k}
}
function placeSide(sub,tgt,fy,fx,mirror){
  const ps=D().parts,q=ps[tgt],root=sub[0],sp=sideSpot(q,root.t,fy,fx);
  const dx=sp.x-root.x,dy=sp.y-root.y;
  let s1=sub.map(p=>Object.assign({},p));
  if(sp.side<0){s1=mirrorSub(s1,root.x);}
  // Nach dem Spiegeln an der Wurzel ist sie an derselben Stelle
  const a=sp.side<0?'L':'R';
  const b1=addSub(s1,tgt,a,'side',dx,dy);
  const tw=q.sy!==undefined&&q.sy>=0&&ps[q.sy]?q.sy:-1;
  if(tw>=0){twinCopy(tgt,b1)}                    // Ziel ist gespiegelt: das Gegenstück bekommt auch eins
  else if(mirror){const s2=mirrorSub(s1.map(p=>Object.assign({},p,{x:p.x+dx,y:p.y+dy})),q.x),b2=addSub(s2,tgt,a==='L'?'R':'L','side',0,0);
    for(let k=0;k<sub.length;k++){ps[b1+k].sy=b2+k;ps[b2+k].sy=b1+k}}
  E.sel=b1;edChanged();
}
/* ---------- Ziehen ---------- */
function startNewDrag(t,sx,sy){
  if(!partOK(t))return;
  E.drag={sub:[{t,x:0,y:0,fx:0,p:-1}],sx,sy,pid:palDn?palDn.id:0,isNew:true,snapC:null,rx:0,ry:0};
  E.sel=-1;setCls('#edTrash','on',true);selUI();dragSnap();
}
function startPartDrag(i,sx,sy,pid){
  const ps=D().parts;
  if(i===0&&ps.length>1){return false}         // die Wurzel bleibt stehen
  pushHist();
  const q=ps[i],sub=cutSub(i),tw=q.sy;
  const p0=s2d(sx,sy);
  E.drag={sub,sx,sy,pid,isNew:false,offX:q.x-p0.x,offY:q.y-p0.y,snapC:null};
  const rem=[i];if(tw!==undefined&&tw>=0&&tw<ps.length)rem.push(tw);
  removeIdx(rem);E.sel=-1;edChanged(true);
  setCls('#edTrash','on',true);dragSnap();return true;
}
function dragSnap(){
  const g=E.drag;if(!g)return;
  const ps=D().parts,root=g.sub[0],d=P[root.t];
  const lift=g.isNew?60:0;
  const p=s2d(g.sx,g.sy-lift);
  const fx=p.x+(g.offX||0),fy=p.y+(g.offY||0);
  g.fx=fx;g.fy=fy;g.snapC=null;
  if(!ps.length){g.snapC={free:1,x:fx,y:fy};return}
  let best=null,bd=(46/E.z)**2;
  for(const c of attachCands(root.t,ps)){
    if(c.k==='s'){const ny=c.n==='top'?fy+d.h/2:fy-d.h/2,dd=(fx-c.nx)**2+(ny-c.ny)**2;if(dd<bd){bd=dd;best=c}}
    else{const q=ps[c.i],pd=P[q.t];const sp=sideSpot(q,root.t,fy,fx);const dd=(fx-sp.x)**2+(fy-sp.y)**2*.25;
      if(dd<bd&&Math.abs(fy-q.y)<pd.h/2+d.h/2){bd=dd;best={i:c.i,k:'r',x:sp.x,y:sp.y,side:sp.side}}}
  }
  g.snapC=best;
}
function dropDrag(){
  const g=E.drag;E.drag=null;setCls('#edTrash','on',false);
  if(!g)return;
  const trash=g.sy>E.bot-10;
  if(trash||!g.snapC){if(!g.isNew){toast(trash?'Entfernt':'Hier passt es nicht dran – entfernt',trash?'':'bad')}else if(!trash)toast('Zieh das Teil an einen freien Anschluss','bad');edChanged();return}
  if(g.isNew)pushHist();
  const c=g.snapC,root=g.sub[0];
  if(c.free){addSub(g.sub,-1,undefined,undefined,c.x-root.x,c.y-root.y);E.sel=0;edChanged(true);sfx('stage');return}
  if(c.k==='s'){const b=addSub(g.sub,c.i,c.a,c.n,c.x-root.x,c.y-root.y);E.sel=b;twinCopy(c.i,b);edChanged();sfx('stage');return}
  placeSide(g.sub,c.i,c.y,c.side<0?D().parts[c.i].x-1:D().parts[c.i].x+1,E.sym===2);sfx('stage');
}
/* ---------- Leinwand-Gesten ---------- */
function edPointer(e,kind){
  const x=e.clientX,y=e.clientY;
  if(kind==='down'){
    E.ptr.set(e.pointerId,{x,y});
    if(E.ptr.size===2){const[a,b]=[...E.ptr.values()];E.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:E.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:E.cx,cy:E.cy};E.cand=null;return}
    if(y>E.bot)return;
    const hit=edHit(x,y);
    E.cand={i:hit,x,y,pid:e.pointerId,cx:E.cx,cy:E.cy,moved:false};
  }else if(kind==='move'){
    if(!E.ptr.has(e.pointerId))return;E.ptr.set(e.pointerId,{x,y});
    if(E.pinch&&E.ptr.size>=2){const[a,b]=[...E.ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);E.z=clamp(E.pinch.z*d/E.pinch.d,2,90);
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;E.cx=E.pinch.cx-(mx-E.pinch.mx)/E.z;E.cy=E.pinch.cy+(my-E.pinch.my)/E.z;return}
    const c=E.cand;if(!c||c.pid!==e.pointerId||E.drag)return;
    if(!c.moved&&Math.hypot(x-c.x,y-c.y)>10){c.moved=true;if(c.i>=0&&startPartDrag(c.i,x,y,e.pointerId)){E.cand=null;return}}
    if(c.moved){E.cx=c.cx-(x-c.x)/E.z;E.cy=c.cy+(y-c.y)/E.z}
  }else{
    E.ptr.delete(e.pointerId);if(E.ptr.size<2)E.pinch=null;
    const c=E.cand;E.cand=null;
    if(c&&c.pid===e.pointerId&&!c.moved){E.sel=c.i===E.sel?-1:c.i;selUI();if(E.sel>=0)sfx('click')}
  }
}
function edHit(x,y){
  const ps=D().parts,p=s2d(x,y);let best=-1,ba=1e9;
  for(let i=0;i<ps.length;i++){const q=ps[i],t=P[q.t],m=Math.max(.2,12/E.z);
    if(Math.abs(p.x-q.x)<=t.w/2+m&&Math.abs(p.y-q.y)<=t.h/2+m){const a=t.w*t.h;if(a<ba){ba=a;best=i}}}
  return best;
}
/* ---------- nach jeder Änderung ---------- */
function edChanged(){
  const d=D();
  if(d.parts.length)autoStage(d,!!d.ms);
  if(E.sel>=d.parts.length)E.sel=-1;
  // Crew automatisch in die erste Kapsel
  assignDefaultCrew(d);
  E.stats=designStats(d,G0);
  statsUI();selUI();
  if(d.parts.length>1)tip('edit2');
}
function assignDefaultCrew(d){
  const busy=new Set();for(const V of VESSELS)for(const id of vCrew(V))busy.add(id);
  const used=new Set();
  for(const q of d.parts){const t=P[q.t];if(!t.crew){delete q.crew;continue}
    q.crew=(q.crew||[]).filter(id=>{const c=crewById(id);return c&&c.st==='frei'&&!busy.has(id)&&!used.has(id)});
    for(const id of q.crew)used.add(id)}
  if(d.noAuto)return;
  const pods=d.parts.filter(q=>P[q.t].crew&&P[q.t].ctl);if(!pods.length)return;
  const any=d.parts.some(q=>q.crew&&q.crew.length);if(any)return;
  const free=crewAlive().filter(c=>c.st==='frei'&&!busy.has(c.id)&&!used.has(c.id)).sort((a,b)=>(a.job==='pilot'?-1:0)-(b.job==='pilot'?-1:0)||b.xp-a.xp);
  const q=pods[0];if(free.length)q.crew.push(free.shift().id);   // nur einen Platz besetzen – weitere über 👤
}
function statsUI(){
  const st=E.stats,d=D();if(!st)return;
  setTxt('#edName',d.n);
  if(!d.parts.length){setHTML('#edStats','<div class="chip">Tippe unten ein Teil an</div>');return}
  const s0=st.stages[0]||{twr:0,twrA:0},mxP=bldV('vab'),mxM=bldV('pad');
  const bad=(c)=>c?' bad':'';
  setHTML('#edStats',`<div class="chip">Δv <b>&nbsp;${fmtNum(st.dv)}</b>&nbsp;m/s</div><div class="chip${bad(s0.twrA<1&&st.n>1)}">TWR ${dc(s0.twrA||0,2)}</div>
    <div class="chip${bad(st.m>mxM)}">${dc(st.m,1)} t</div><div class="chip${bad(st.n>mxP)}">${st.n}/${mxP} Teile</div>${SANDBOX()?'':`<div class="chip${bad(st.k>S.money)}">${fmtM(st.k)}</div>`}`);
}
/* ---------- Auswahl-Leiste ---------- */
function selUI(){
  const el=$('#edSel'),ps=D().parts,i=E.sel;
  if(i<0||!ps[i]){el.classList.remove('on');return}
  const q=ps[i],t=P[q.t];
  let info=[];
  if(t.eng)info.push(`Schub ${fmtNum(t.eng.f)} kN · Isp ${t.eng.ia}–${t.eng.iv} s`);
  if(t.res){if(t.res.lf)info.push(`Treibstoff ${dc(t.res.lf,2)} t`);if(t.res.sf)info.push(`Feststoff ${dc(t.res.sf,2)} t`);if(t.res.xe)info.push(`Xenon ${dc(t.res.xe,2)} t`);if(t.res.ec&&!t.crew&&!t.ctl)info.push(`Strom ${t.res.ec}`)}
  if(t.crew)info.push(`${t.crew} Sitz${t.crew>1?'e':''}`);
  info.push(`${dc(partMass({t:q.t,r:Object.assign({},t.res||{})}),2)} t`);if(!SANDBOX())info.push(fmtM(t.k));

function drawEditor(c){

  const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#1a2440');g.addColorStop(1,'#0b1020');c.fillStyle=g;c.fillRect(0,0,VW,VH);

  for(let y=Math.floor(p1.y/step)*step;y<p0.y;y+=step){const s=d2s(0,y).y;c.moveTo(0,s);c.lineTo(VW,s)}c.stroke();

    if(q.sy>=0&&ps[q.sy]){const w=ps[q.sy],s2=d2s(w.x-t.w/2,w.y+t.h/2);c.strokeStyle='rgba(92,225,255,.5)';c.strokeRect(s2.x-3,s2.y-3,t.w*E.z+6,t.h*E.z+6)}}
  // Schwerpunkt

    const s=d2s(x/m,y/m),r=9;c.fillStyle='#ffd23f';c.beginPath();c.arc(s.x,s.y,r,0,TAU);c.fill();c.fillStyle='#222';c.beginPath();c.moveTo(s.x,s.y);c.arc(s.x,s.y,r,0,Math.PI/2);c.closePath();c.fill();c.beginPath();c.moveTo(s.x,s.y);c.arc(s.x,s.y,r,Math.PI,Math.PI*1.5);c.closePath();c.fill();
    c.strokeStyle='#222';c.lineWidth=1.5;c.beginPath();c.arc(s.x,s.y,r,0,TAU);c.stroke()}

   11. OBERFLÄCHE – Teil 4: Flug (Start, Anzeigen, Steuerung, Karte, Manöver)

const F={V:null,cam:null,camB:'murmel',map:false,z:20,zt:20,pred:null,predT:0,nodes:[],nsel:-1,ca:null,caT:0,cd:0,trackT:0,lostT:0,dvT:0,dv:null,ptr:new Map(),pinch:null,mapDrag:null,camRot:Math.PI/2,shk:0,hint:{}};
/* ---------- Start ---------- */
function launch(d){
  if(!d||!d.parts.length){toast('Erst eine Rakete bauen','bad');return}
  const st=designStats(d,G0);
  if(st.n>bldV('vab')){toast(`Zu viele Teile (${st.n}/${bldV('vab')}) – Montagehalle ausbauen`,'bad');return}
  if(st.m>bldV('pad')){toast(`Zu schwer für die Startrampe (${dc(st.m,1)}/${fmtNum(bldV('pad'))} t)`,'bad');return}
  for(const q of d.parts)if(!partOK(q.t)){toast(P[q.t].n+' ist noch nicht erforscht','bad');return}
  if(!SANDBOX()&&S.money<st.k){toast('Zu wenig Geld: '+fmtM(st.k),'bad');return}
  if(!d.parts.some(q=>P[q.t].ctl)){toast('Ohne Kapsel oder Sonde kann niemand steuern!','bad');return}
  // Crew prüfen
  const busy=new Set();for(const V of VESSELS)for(const id of vCrew(V))busy.add(id);
  for(const q of d.parts)if(q.crew)q.crew=q.crew.filter(id=>{const c=crewById(id);return c&&c.st==='frei'&&!busy.has(id)});
  if(!d.parts.some(q=>P[q.t].ctl&&(P[q.t].ctl.probe||q.crew&&q.crew.length))){toast('Niemand an Bord – setz jemanden in die Kapsel (👤)','bad');return}
  if(!SANDBOX())S.money-=st.k;
  // andere Fahrzeuge auf der Rampe wegräumen
  for(const V of VESSELS.slice())if(V.body==='murmel'&&V.mode==='landed'&&Math.abs(wrapA(Math.atan2(V.y,V.x)-PAD_A))*BODIES.murmel.R<40&&V.kind!=='flag'){
    if(V.kind==='debris'||!vCrew(V).length)killVessel(V)}
  const V=mkVessel(d,d.n);vCalc(V);V.srcD=JSON.parse(JSON.stringify(d));
  const B=BODIES.murmel;let low=0;for(const p of V.d.pts)low=Math.max(low,V.d.cy-p.y);
  V.x=0;V.y=B.R+B.padH+low+.02;V.th=PAD_A;V.vx=V.vy=V.om=0;V.met0=null;V.pad=1;V.rest=true;V.mode='phys';V.landed=true;V.nc=1;
  V.sasT=PAD_A;
  for(const id of vCrew(V)){const c=crewById(id);if(c)c.st='flug'}
  VESSELS.push(V);
  S.st.launch++;
  enterFlight(V,false);
  tip('launch');
}
ACT.launch=()=>launch(S.cur);
function enterFlight(V,resume){
  MODE='flight';show('fl');closeSheet();TSMAP=false;setCls('#fl','tsmap',false);
  WS.t=S.t;WS.act=V;WS.wi=0;WS.wto=null;WS.near=[];WS.nearT=0;WS.evq.length=0;
  if(V.mode!=='phys')toPhys(V);
  if(V.met0!==null&&V.met0!==undefined&&!V.landed)V.sasT=V.th;
  F.V=V;F.cam=V;F.camB=V.body;F.map=false;F.nodes=(V.nodes||[]).map(n=>Object.assign({},n));F.nsel=-1;F.pred=null;F.predT=0;F.ca=null;F.cd=0;F.lostT=0;F.dv=null;F.dvT=0;
  PTS.length=0;
  flFit(true);F.camRot=Math.atan2(V.y,V.x);
  setCls('#lost','on',false);setCls('#cd','on',false);
  S.act=V.id;
  setCls('#bMap','on',false);
  recalcNodes();flightUI(true);
  others(0);                                     // Nachbarn sofort mitrechnen
  if(resume)toast('Willkommen zurück bei „'+V.name+'“');
}
function leaveFlight(){
  const A=WS.act;
  if(A){A.nodes=F.nodes.map(n=>({t:n.t,dp:n.dp,dr:n.dr}));A.thr=0}
  for(const V of[...WS.near,A].filter(Boolean)){
    if(V.mode!=='phys')continue;
    const B=vB(V),alt=vAlt(V);
    if(V.landed&&V.nc>0&&Math.hypot(V.vx,V.vy)<1.5){V.mode='landed';V.vx=V.vy=V.om=0}
    else if(B.atm&&alt<B.ah){if(hasCmd(V))V.mode='bg';else killVessel(V)}
    else if(V.kind==='debris')killVessel(V);
    else toRails(V);
  }
  S.t=WS.t;WS.act=null;WS.near=[];S.act=null;F.V=null;F.cam=null;
  engineSound(0,0,0);
  PTS.length=0;
}
function flFit(snap){const V=F.cam||F.V;if(!V||!V.d)return;F.zt=clamp(VH*.34/(2*Math.max(1.5,V.d.bR)),.5,60);if(snap)F.z=F.zt}
/* ---------- Steuerung ---------- */
function rotInput(){
  if(F.map&&F.nsel>=0)return 0;
  let r=(HOLD.rl?1:0)-(HOLD.rr?1:0)+(KEY.a?1:0)-(KEY.d?1:0);
  if(SET.ctrl==='tilt'&&TILTOK){const t=TILT;if(Math.abs(t)>4)r+=clamp(-(t-Math.sign(t)*4)/22,-1,1)}
  return clamp(r,-1,1);
}
function ctlFn(A,dt){
  const ci=A.ci||(A.ci=ctlInfo(A));
  const C={thr:A.thr,rot:0,tx:0,ty:0,drive:0};
  if(A.kind==='eva'){
    // Astronaut: aufrecht halten, laufen oder mit dem Rucksack fliegen
    const up=Math.atan2(A.y,A.x),grounded=A.nc>0;
    const lr=(HOLD.er?1:0)-(HOLD.el?1:0)+(HOLD.rr?1:0)-(HOLD.rl?1:0),ud=(HOLD.eu?1:0)-(HOLD.ed?1:0);
    A.sasT=grounded||vB(A).atm&&vAlt(A)<vB(A).ah?up:A.sasT;
    C.rot=sasRot(A,{tq:.6},dt);
    if(grounded){C.drive=-lr;A.parts[0].walk=(A.parts[0].walk||0)+Math.abs(lr)*dt}
    if(ud||!grounded&&lr){C.tx=lr;C.ty=ud}
    C.eva=1;return C;
  }
  const man=rotInput();
  if(!ci.ok){C.thr=0;return C}
  if(man){C.rot=man;A.sasT=A.th;if(A.sas!=='hold'&&A.sas!=='off'){}}

/* ---------- Ereignisse aus der Welt ---------- */
function handleEvents(){
  const q=WS.evq.splice(0);
  for(const e of q){
    switch(e.k){
      case'boom':{
        if(F.camB===e.b){explode(e.x,e.y,Math.min(3,e.s*.8),'#9aa3ad',e.vx*.7,e.vy*.7)}
        const near=F.V&&F.V.body===e.b&&Math.hypot(e.x-F.V.x,e.y-F.V.y)<3000;
        if(near){sfx('boom',e.s);vib(60);F.shk=Math.min(18,F.shk+6+e.s*3);if(F.V)F.V.boomT=1.5}
        if(e.why==='heat'&&near)toast(P[e.t].n+' ist verglüht!','bad');
        break;
      }
      case'crewlost':{const c=crewById(e.id);crewLost(e.id);if(c){toast(c.n+' ist verloren gegangen …','bad',4000);sfx('sad')}tip('lostcrew',true);S.st.lost++;break}
      case'actlost':{
        // anderes steuerbares Teil in der Nähe übernehmen
        const cand=WS.near.filter(v=>VESSELS.includes(v)&&hasCmd(v)).sort((a,b)=>vCrew(b).length-vCrew(a).length);
        if(cand.length){const X=cand[0];WS.act=X;F.V=X;F.cam=X;S.act=X.id;F.nodes=[];F.pred=null;toast('Steuerung übernommen: '+X.name);flightUI(true)}
        else{F.V=null;F.cam=WS.near.find(v=>VESSELS.includes(v))||null;F.lostT=2.5;S.act=null}
        break;
      }
      case'nocmd':toast('Keine Steuerung mehr an Bord!','bad');break;
      case'soi':if(e.V===F.V){toast('Einflussbereich: '+BODIES[e.b].n,'gold');F.pred=null;F.camB=e.b;PTS.length=0;recalcNodes()}break;
      case'warpstop':toast(e.why);break;
      case'msg':toast(e.t,e.c);break;
      case'ms':toast(`Rekord: ${e.n}! ${SANDBOX()?'':'+'+fmtM(e.m)+' · 🔬 +'+e.s}`,'gold',4000);sfx('ms');if(e.k==='space')tip('space');if(e.k==='orbit'){say('Umlaufbahn! Du fällst jetzt ständig um Murmel herum. Glückwunsch!')}if(e.k==='knopf_fly')tip('knopf');break;
      case'con':toast('Auftrag erfüllt: '+e.c.n+(SANDBOX()?'':' · +'+fmtM(e.c.rew)),'gold',4000);sfx('con');break;
      case'rtc':if(e.ok){if(!SANDBOX())S.money+=e.val;toast(`Booster gelandet! +${fmtM(e.val)}`,'gold',3500);milestone('rtc');conEvent('rtc',{});sfx('con')}else toast('Booster-Landung gescheitert: '+e.why,'bad');break;
      case'dock':toast('Angedockt!','good');sfx('dock');vib(50);F.pred=null;break;
      case'bgland':toast((e.V.name||'Fahrzeug')+' ist sicher gelandet','good');break;
      case'bgcrash':toast((e.name||'Fahrzeug')+' ist abgestürzt'+(e.crew?' – mit Crew an Bord …':''),'bad',4000);break;
      case'stage':break;
      case'abort':break;
    }
  }
}
/* ---------- Flug: ein Bild ---------- */
function flightFrame(dt){
  if(TSMAP){flightUI(false);return}
  const A=F.V;
  cdTick(dt);
  if(A&&(A.met0===null||A.met0===undefined)&&F.cd<=0){A.rest=true}  // auf der Rampe: warten
  // Lage-Werte gelegentlich neu
  WS.ciT-=dt;if(WS.ciT<=0){WS.ciT=.25;for(const V of[A,...WS.near])if(V&&V.d){V.ci=ctlInfo(V);V.light=sunLight(V,WS.t)}}
  if(A){const T=WS.tgt&&VESSELS.find(v=>v.id===WS.tgt);A.tgtState=T&&T.body===A.body?vPos(T):null}
  if(A&&(A.met0===null||A.met0===undefined)){WS.t+=dt;others(dt)}
  else worldStep(dt,ctlFn);
  handleEvents();
  const V=F.V;
  // Ausklappen
  for(const X of[V,...WS.near]){if(!X||!X.d)continue;
    for(const i of X.d.legs){const q=X.parts[i];const tg=X.flags.legs&&!q.brk?1:0;q.dep+=clamp(tg-q.dep,-dt*1.5,dt*1.5)}
    for(const i of X.d.sol){const q=X.parts[i];if(!P[q.t].sol.dep)continue;const tg=X.flags.sol&&!q.brk?1:0;q.dep+=clamp(tg-q.dep,-dt,dt)}
    for(const i of X.d.wheels){const q=X.parts[i];const up=Math.atan2(X.y,X.x);q.wa=(q.wa||0)-((X.vx*-Math.sin(up)+X.vy*Math.cos(up))/P[q.t].wheel.r)*dt}
    if(X.boomT>0)X.boomT-=dt;
  }
  // Partikel: Rauch aus Triebwerken
  const warp=WARPS[WS.wi];
  if(warp>4)PTS.length=0;
  else for(const X of[V,...WS.near]){if(!X||!X.d||X.body!==F.camB)continue;const B=vB(X),rho=rhoAt(B,vAlt(X));
    for(const i of X.d.eng){const q=X.parts[i];if(!(q.fl>0))continue;const t=P[q.t];
      const nP=rho>0?2:1;for(let k=0;k<nP;k++)if(R()<(rho>0?.95:.3)*Math.min(1,q.fl*1.5)){const w=l2w(X,q.x,q.y-pH(q)/2*sgnY(q)-t.w*(.4+R()*.8)),a=X.th+Math.PI+(R()-.5)*.5,sp=(rho>0?10:60)*(.5+R());
        addP({k:rho>0?'smoke':'fire',x:w.x+(X.vx*R()*.016),y:w.y+(X.vy*R()*.016),vx:Math.cos(a)*sp+(rho>0?0:X.vx),vy:Math.sin(a)*sp+(rho>0?0:X.vy),t:0,life:rho>0?1.6+R()*2.4*Math.min(1,rho*2):.4,s:t.w*.3,g:rho>0?t.w*(1+R()):t.w*2,drag:rho>0?.8:0,a0:rho>0?Math.min(.45,.15+rho*.5):.5,col:t.eng.fu==='sf'?'#e2e2e2':'#c4c8d0'})}}
    if(X.heatMax>40&&R()<.6){const w=l2w(X,X.d.cx,X.d.cy);addP({k:'fire',x:w.x,y:w.y,vx:X.vx*.2,vy:X.vy*.2,t:0,life:.5,s:X.d.bR*.4,g:X.d.bR,a0:.5})}
  }
  stepParticles(warp<=4?dt*warp:dt);
  if(V){
    // Vorhersage
    F.predT-=dt;if(F.predT<=0||!F.pred){F.predT=V.thrusting||V.mode==='phys'&&vB(V).atm&&vAlt(V)<vB(V).ah?.3:1.5;updPred();if(F.nodes.length)recalcNodes()}
    // Ziel: nächste Annäherung
    F.caT-=dt;if(F.caT<=0){F.caT=1;closestApproach()}
    F.dvT-=dt;if(F.dvT<=0){F.dvT=1;F.dv=V.kind==='ship'?designStats({parts:V.parts},G0,{stg:V.stg}):null}
    F.trackT-=dt;if(F.trackT<=0){F.trackT=.5;track(V);for(const X of WS.near)if(X.kind==='ship')track(X);flightTips(V)}
    nodeHold(dt);
    // Ton
    let lvl=0,srb=0;for(const i of V.d.eng){const q=V.parts[i];if(q.fl>0){lvl=Math.max(lvl,q.fl*Math.min(1,P[q.t].eng.f/200+.4));if(P[q.t].eng.fu==='sf')srb=1}}
    engineSound(warp>4?0:lvl,srb,clamp(pressAt(vB(V),vAlt(V))*2,0,1));
    S.t=WS.t;
  }else engineSound(0,0,0);
  // verloren?
  if(!F.V&&F.lostT>0){F.lostT-=dt;if(F.lostT<=0)showLost()}
  // Kamera
  const C=F.cam&&VESSELS.includes(F.cam)?F.cam:F.V;
  if(C){F.camB=C.body;F.z+=(F.zt-F.z)*Math.min(1,dt*6);
    const up=Math.atan2(C.y,C.x);F.camRot+=wrapA(up-F.camRot)*Math.min(1,dt*5);
    CAM.x=C.x;CAM.y=C.y;CAM.z=F.z;camRot(F.camRot);CAM.cx=VW/2;CAM.cy=VH*.44;
    if(F.shk>0){F.shk=Math.max(0,F.shk-dt*30);if(SET.shake){CAM.cx+=(R()-.5)*F.shk;CAM.cy+=(R()-.5)*F.shk}}
    if(V&&V.thrusting&&SET.shake&&vB(V).atm&&vAlt(V)<8000){CAM.cx+=(R()-.5)*2;CAM.cy+=(R()-.5)*2}
  }
  flightUI(false);
}
function flightTips(V){
  const B=vB(V),alt=vAlt(V);
  if(B.id==='murmel'&&alt>1500&&alt<9000&&V.thrusting)tip('turn');
  if(B.id==='murmel'&&alt>B.ah&&!S.ms.orbit)tip('orbit');
  if((V.heatMax||0)>60)tip('reentry');
  if(recoverable(V)&&V.met0!==null&&V.met0!==undefined&&WS.t-V.met0>5)tip('landed');
  if(V.d.docks.length&&WS.tgt)tip('dock');
}
function closestApproach(){
  const A=F.V;F.ca=null;if(!A||!WS.tgt)return;const T=VESSELS.find(v=>v.id===WS.tgt);if(!T||T.body!==A.body||T===A)return;
  const pa=vPos(A),pb=vPos(T),B=vB(A),oa=orbitFrom(B.mu,pa.x,pa.y,pa.vx,pa.vy,WS.t),ob=orbitFrom(B.mu,pb.x,pb.y,pb.vx,pb.vy,WS.t);
  const Tp=Math.min(isFinite(period(oa))?period(oa):2e5,2e6);let best={d:1e18};const qa={},qb={};
  for(let i=0;i<=240;i++){const t=WS.t+Tp*i/240;orbitAt(oa,t,qa);orbitAt(ob,t,qb);const d=Math.hypot(qa.x-qb.x,qa.y-qb.y);if(d<best.d)best={d,t,p:{x:qa.x,y:qa.y},q:{x:qb.x,y:qb.y}}}
  F.ca=best;
}
function showLost(){
  setTxt('#lostT','Fahrzeug verloren');setTxt('#lostP','Da ist leider nichts mehr übrig, was man steuern kann.');
  $('#lostB').innerHTML=`<button class="btn acc" data-a="lostHub">Zum Raumfahrtzentrum</button>${SANDBOX()?'<button class="btn cy" data-a="lostAgain">Nochmal starten</button>':''}`;
  setCls('#lost','on',true);
}
ACT.lostHub=()=>{setCls('#lost','on',false);goHub();saveNow()};
ACT.lostAgain=()=>{setCls('#lost','on',false);leaveFlight();launch(S.cur)};

/* ---------- Lage-Anzeige ---------- */
function drawDial(){
  const el=$('#dial'),V=F.V;if(!V||el.offsetParent===null)return;
  const w=el.clientWidth,h=el.clientHeight;if(el.width!==w*DPR||el.height!==h*DPR){el.width=w*DPR;el.height=h*DPR}
  const c=el.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,w,h);
  const r=Math.min(w,h)/2-3,cx=w/2,cy=h/2;
  const up=Math.atan2(V.y,V.x),rel=a=>-(a-up);   // Winkel relativ zu „oben“ (gegen den Uhrzeigersinn positiv)
  // Himmel/Boden
  c.save();c.beginPath();c.arc(cx,cy,r,0,TAU);c.clip();
  c.fillStyle='#2f6fb8';c.fillRect(cx-r,cy-r,r*2,r);c.fillStyle='#8a5a2a';c.fillRect(cx-r,cy,r*2,r);
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1.5;c.beginPath();c.moveTo(cx-r,cy);c.lineTo(cx+r,cy);c.stroke();
  c.restore();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(cx,cy,r,0,TAU);c.stroke();
  const mk=(a,draw)=>{const b=-Math.PI/2+(up-a);const x=cx+Math.cos(b)*r*.78,y=cy+Math.sin(b)*r*.78;draw(x,y)};
  const p=vPos(V),sp=Math.hypot(p.vx,p.vy);
  if(sp>.5){const pro=Math.atan2(p.vy,p.vx);
    mk(pro,(x,y)=>{c.strokeStyle='#ffd23f';c.lineWidth=2;c.beginPath();c.arc(x,y,6,0,TAU);c.stroke();c.beginPath();c.moveTo(x,y-6);c.lineTo(x,y-10);c.moveTo(x-6,y);c.lineTo(x-10,y);c.moveTo(x+6,y);c.lineTo(x+10,y);c.stroke()});
    mk(pro+Math.PI,(x,y)=>{c.strokeStyle='#ffd23f';c.lineWidth=2;c.beginPath();c.arc(x,y,6,0,TAU);c.stroke();c.beginPath();c.moveTo(x-4,y-4);c.lineTo(x+4,y+4);c.moveTo(x+4,y-4);c.lineTo(x-4,y+4);c.stroke()})}
  if(V.nodeDir!==undefined&&F.nodes.length)mk(V.nodeDir,(x,y)=>{c.fillStyle='#2fa8d8';c.strokeStyle='#fff';c.lineWidth=1.5;c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillRect(-5,-5,10,10);c.strokeRect(-5,-5,10,10);c.restore()});
  if(WS.tgt){const T=VESSELS.find(v=>v.id===WS.tgt);if(T&&T.body===V.body){const q=vPos(T);mk(Math.atan2(q.y-p.y,q.x-p.x),(x,y)=>{c.strokeStyle='#ff6bd6';c.lineWidth=2;c.beginPath();c.arc(x,y,6,0,TAU);c.stroke();c.beginPath();c.arc(x,y,2,0,TAU);c.stroke()})}}
  // Rakete in der Mitte
  c.save();c.translate(cx,cy);c.rotate(up-V.th);
  c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=1.5;poly(c,[0,-r*.55,r*.16,r*.25,0,r*.12,-r*.16,r*.25]);c.fill();c.stroke();c.restore();
  // Winkel über Horizont
  const pitch=Math.round(90-Math.abs(wrapA(V.th-up))*180/Math.PI);
  const ml=(SASM.find(x=>x[0]===V.sas)||['','Aus'])[1];c.font='bold 10px system-ui';c.fillStyle=V.sas==='off'?'#ff9a9a':'#5ce1ff';c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.7)';c.strokeText(ml.toUpperCase(),cx,cy-r+13);c.fillText(ml.toUpperCase(),cx,cy-r+13);
  c.fillStyle='#fff';c.font='bold 11px system-ui';c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.6)';c.strokeText(pitch+'°',cx,cy+r-6);c.fillText(pitch+'°',cx,cy+r-6);
}
/* =====================================================================
   12. SPEICHERN, EXPORT/IMPORT, CLOUD, SELBST-UPDATE, HAUPTSCHLEIFE
   ===================================================================== */
const KEYP='countdown-',SETKEY='countdown-set';
function validSave(o){return!!(o&&o.v===1&&(o.mode==='karriere'||o.mode==='frei')&&Array.isArray(o.crew)&&o.bld&&Array.isArray(o.tech))}
function migrate(o){
  const d=newState(o.mode);
  for(const k in d)if(o[k]===undefined)o[k]=d[k];
  for(const k in d.bld)if(!o.bld[k])o.bld[k]=1;
  for(const k in d.st)if(o.st[k]===undefined)o.st[k]=d.st[k];
  if(!o.con.off)o.con.off=[];if(!o.con.act)o.con.act=[];
  if(o.mode==='frei'){o.tech=TECH.map(t=>t.id);o.bld={vab:3,pad:3,lab:3,mc:3,ts:3,ac:3}}
  o.tech=o.tech.filter(id=>TECHM[id]);
  if(!o.cur||!Array.isArray(o.cur.parts))o.cur={n:'Rakete 1',parts:[]};
  o.cur.parts=o.cur.parts.filter(q=>P[q.t]);
  for(const d2 of o.designs)d2.parts=d2.parts.filter(q=>P[q.t]);
  o.vessels=(o.vessels||[]).filter(v=>v&&Array.isArray(v.parts)&&v.parts.length&&v.parts.every(q=>P[q.t])&&BODIES[v.body]);
  return o;
}
function loadSlot(m){try{const s=localStorage.getItem(KEYP+m);if(s){const o=JSON.parse(s);if(validSave(o))return o}}catch(_){}return null}
function loadWorld(){
  WS.t=S.t||0;WS.act=null;WS.near=[];WS.wi=0;WS.tgt=null;
  VESSELS=[];
  for(const o of S.vessels){try{VESSELS.push(desV(o))}catch(_){}}
}
function saveNow(force){
  if(!S)return;
  if(MODE==='flight'&&WS.act){S.t=WS.t;WS.act.nodes=F.nodes.map(n=>({t:n.t,dp:n.dp,dr:n.dr}));S.act=WS.act.id}
  else if(MODE!=='flight')S.act=null;
  S.vessels=VESSELS.map(serV);
  S.savedAt=Date.now();
  const js=JSON.stringify(S);
  try{localStorage.setItem(KEYP+S.mode,js)}catch(_){}
  pushCloud(js,force);
  return js;
}
function saveSet(){try{localStorage.setItem(SETKEY,JSON.stringify(SET))}catch(_){}}
function loadSet(){try{const o=JSON.parse(localStorage.getItem(SETKEY)||'null');if(o)Object.assign(SET,o)}catch(_){}}
/* Export-Code: komprimiert (deflate) und Base64 */
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function unb64(str){const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function exportCode(){
  const js=saveNow();
  try{if(window.CompressionStream){const st=new Blob([js]).stream().pipeThrough(new CompressionStream('deflate-raw'));return'CD1:'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(_){}
  return'CD0:'+b64(new TextEncoder().encode(js));
}
async function importCode(code){
  code=code.trim().replace(/\s+/g,'');let js;
  if(code.startsWith('CD1:')){const st=new Blob([unb64(code.slice(4))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));js=await new Response(st).text()}
  else if(code.startsWith('CD0:'))js=new TextDecoder().decode(unb64(code.slice(4)));
  else throw new Error('format');
  const o=JSON.parse(js);if(!validSave(o))throw new Error('invalid');
  closeSheet();if(MODE==='flight')leaveFlight();
  S=migrate(o);loadWorld();initCrew();saveNow();goHub();
}
ACT.export=async()=>{const t=$('#exTxt');t.value='Wird erzeugt …';t.value=await exportCode()};
ACT.copy=async()=>{const t=$('#exTxt');if(!t.value||t.value.startsWith('Wird'))t.value=await exportCode();try{await navigator.clipboard.writeText(t.value);toast('Code kopiert.','good')}catch(_){t.select();toast('Bitte den markierten Code kopieren.')}};
ACT.import=async()=>{const v=$('#imTxt').value;if(!v.trim())return toast('Bitte zuerst einen Code einfügen.','bad');try{await importCode(v);toast('Spielstand geladen.','good')}catch(_){toast('Der Code ist ungültig.','bad')}};
ACT.reset=(v,b)=>{
  if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Wirklich? Alles geht verloren!';return}
  const m=S.mode;try{localStorage.removeItem(KEYP+m)}catch(_){}
  if(MODE==='flight')leaveFlight();
  S=newState(m);loadWorld();initCrew();fillOffers();closeSheet();goHub();saveNow();toast('Neu angefangen.','good');
};
/* Selbst-Update */
let updating=false;
async function checkUpdate(){
  if(updating||window.claude||!/^https?:$/.test(location.protocol))return;
  if(sheetOpen()||MODE==='flight'||MODE==='edit'&&E.drag)return;
  try{
    const r=await fetch('countdown.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('cd-upd')}catch(_){}
    if(tried===m[1])return;try{sessionStorage.setItem('cd-upd',m[1])}catch(_){}
    updating=true;saveNow();toast('Neue Version wird geladen …','',3000);
    setTimeout(()=>location.replace('countdown.html?v='+encodeURIComponent(m[1])),700);
  }catch(_){}
}
/* Speichern im Konto, wenn das Spiel als Claude-Artifact läuft */
let DB=null,USERID=null,cloudBusy=false,cloudAgain=null,cloudT=0;
async function zipStr(js){try{if(window.CompressionStream){const st=new Blob([js]).stream().pipeThrough(new CompressionStream('deflate-raw'));return b64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(_){}return null}
async function unzipStr(z){const st=new Blob([unb64(z)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(st).text()}
/* höchstens alle 30 s ins Konto (und beim Verlassen der Seite) */
async function pushCloud(js,force){
  if(!DB||!USERID||!S)return;
  if(!force&&Date.now()-cloudT<30000)return;
  if(cloudBusy){cloudAgain=js;return}
  cloudBusy=true;cloudT=Date.now();
  try{const z=await zipStr(js);await DB.doc('data/users/'+USERID+'/countdown-'+S.mode).set(z?{v:2,savedAt:S.savedAt,z}:{v:1,savedAt:S.savedAt,json:js})}catch(_){}
  cloudBusy=false;
  if(cloudAgain){const j=cloudAgain;cloudAgain=null;pushCloud(j,true)}
}
async function connectCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;DB=db;USERID=uid;
    for(const m of['karriere','frei']){
      const snap=await db.doc('data/users/'+uid+'/countdown-'+m).get();
      if(!snap.exists)continue;const d=snap.data();if(!d||!d.json&&!d.z)continue;
      const loc=loadSlot(m);
      if(!loc||(d.savedAt||0)>(loc.savedAt||0)+1500){try{const js=d.z?await unzipStr(d.z):d.json;if(validSave(JSON.parse(js)))localStorage.setItem(KEYP+m,js)}catch(_){}}
    }
    if(MODE==='title')goTitle();
  }catch(_){}
}

/* ---------- Zeichenfläche ---------- */
function fitCanvas(){
  const r=cv.getBoundingClientRect(),w=Math.round(r.width)||innerWidth,h=Math.round(r.height)||innerHeight,d=Math.min(2,devicePixelRatio||1);
  if(w===VW&&h===VH&&d===DPR)return;
  const dprChanged=d!==DPR;VW=w;VH=h;DPR=d;
  const cw=Math.round(VW*DPR),ch=Math.round(VH*DPR);if(cv.width!==cw)cv.width=cw;if(cv.height!==ch)cv.height=ch;
  if(dprChanged){ICONS.clear();ICONURL.clear();if(MODE==='edit')buildPal()}
}
let FULLPX=-1;
function applyGap(){
  const app=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
  const portrait=innerHeight>=innerWidth,full=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
  const v=app&&full>0?full:0;GAPPX=v?Math.max(0,full-innerHeight):0;
  if(v===FULLPX)return;FULLPX=v;
  if(v)document.documentElement.style.setProperty('--vh',v+'px');else document.documentElement.style.removeProperty('--vh');
}
const satEl=document.createElement('div');satEl.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden';document.body.appendChild(satEl);
function resize(){applyGap();fitCanvas();SAT=satEl.offsetHeight||0;if(MODE==='edit')edLayout()}
addEventListener('resize',resize);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
addEventListener('pageshow',()=>setTimeout(resize,100));
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#sheetBody,#edParts,#edCats,#fChips,textarea'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in HOLD)HOLD[k]=0;saveNow(true)}else checkUpdate()});
addEventListener('pagehide',()=>saveNow(true));
/* Leinwand-Eingaben je Bildschirm */
let cvDn=null;
cv.addEventListener('pointerdown',e=>{audioUnlock();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(MODE==='edit')edPointer(e,'down');else if(MODE==='flight')flPointer(e,'down');else cvDn={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointermove',e=>{if(MODE==='edit')edPointer(e,'move');else if(MODE==='flight')flPointer(e,'move')});
const cvUp=e=>{if(MODE==='edit')edPointer(e,'up');else if(MODE==='flight')flPointer(e,'up');
  else if(MODE==='hub'&&cvDn&&e.type==='pointerup'&&Math.hypot(e.clientX-cvDn.x,e.clientY-cvDn.y)<12&&!sheetOpen()){const k=hubHit(e.clientX,e.clientY);if(k&&ACT[k]){sfx('click');ACT[k]()}}
  cvDn=null};
cv.addEventListener('pointerup',cvUp);cv.addEventListener('pointercancel',cvUp);
cv.addEventListener('wheel',e=>{if(MODE==='flight')flWheel(e);else if(MODE==='edit'){E.z=clamp(E.z*Math.exp(-e.deltaY*.0015),2,90)}e.preventDefault()},{passive:false});

/* ---------- Hauptschleife ---------- */
let last=performance.now(),saveT=5,slowT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;if(dt<0)dt=0;
  TIME+=dt;
  if(S)S.st.time+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  try{
    if(MODE==='title'){drawTitle(ctx);musicTick(dt,true)}
    else if(MODE==='hub'){drawHub(ctx);musicTick(dt,true);if(!sheetOpen())hubUI()}
    else if(MODE==='edit'){drawEditor(ctx);musicTick(dt,false)}
    else if(MODE==='flight'){
      if(!sheetOpen()||WS.wi>0||F.V&&F.V.met0!==null&&F.V.met0!==undefined)flightFrame(dt);
      if(F.map||TSMAP)drawMap(ctx);else drawFlight(ctx);
      drawDial();musicTick(dt,false);
    }
  }catch(err){console.error(err)}
  tipTick(dt);
  slowT-=dt;if(slowT<=0){slowT=.5;resize()}
  saveT-=dt;if(saveT<=0){saveT=5;if(S)saveNow()}
}
function boot(){
  loadSet();initBodies();resize();
  $('#boot').remove();
  goTitle();
  last=performance.now();requestAnimationFrame(frame);
  connectCloud();
  setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60*1000);
}
boot();
