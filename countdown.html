<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Countdown</title>
<!--pwa-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<meta name="theme-color" content="#070b16">
<link rel="apple-touch-icon" href="countdown-icon-180.png">
<link rel="icon" type="image/png" href="countdown-icon-192.png">
<link rel="manifest" href="countdown.webmanifest">
<!--/pwa-->
<style>
:root{
  --bg:#070b16; --panel:rgba(13,19,36,.93); --panel2:#18213b; --panel3:#24304f; --line:#33426a;
  --text:#eef3ff; --dim:#9fb0d6; --acc:#ff9a3d; --acc2:#ffd27a; --ok:#5fe08a; --bad:#ff5d5d; --cy:#5ce1ff; --sci:#8fdcff;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* iOS-Home-Bildschirm-App: die Seite ist um die Lücke länger, Wischen wird per touchmove gesperrt */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
html{min-height:var(--vh,100%)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);font-size:15px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;top:0;left:0;width:100%;height:var(--vh,100%);display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;top:0;height:var(--vh,100%);z-index:5;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.scr{position:absolute;inset:0;display:none;pointer-events:none}
#ui>.scr.on{display:block}
.scr>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:20px}
.ib svg{width:24px;height:24px}
.ib.on{border-color:var(--cy);color:var(--cy)}
.chip{height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 10px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.chip small{font-weight:600;color:var(--dim);font-size:12px}
.chip svg{width:18px;height:18px;flex:none}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.sp{flex:1}

/* ---------- Titel ---------- */
#title{background:transparent}
#tBox{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 22px}
#tLogo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9vh);text-align:center;pointer-events:none}
#tLogo h1{margin:0;font-size:46px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 #a4400f,0 0 30px rgba(255,140,40,.6)}
#tLogo p{margin:6px 0 0;color:var(--acc2);font-weight:700;letter-spacing:.2em;font-size:13px}
.bigb{width:100%;max-width:360px;height:60px;border:0;border-radius:16px;font-size:19px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.bigb small{font-size:12px;font-weight:600;opacity:.8}
.bigb.acc{background:linear-gradient(180deg,#ffc06b,#f0791c);color:#2a1300}
.bigb.cy{background:linear-gradient(180deg,#8fe9ff,#2fa8d8);color:#03202e}
.bigb.dk{background:var(--panel2);color:var(--text);border:1px solid var(--line);height:48px;font-size:16px}
#tVer{color:var(--dim);font-size:12px}

/* ---------- Raumfahrtzentrum ---------- */
#hubBtns{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#hubBtns button{position:relative;height:52px;border-radius:13px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#hubBtns button span{font-size:18px;line-height:1}
#hubBtns button.main{background:linear-gradient(180deg,#ffc06b,#f0791c);color:#2a1300;border:0}
.dot::after{content:"";position:absolute;right:7px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--panel2),0 0 8px var(--ok)}
#hMoney{color:var(--acc2)} #hSci{color:var(--sci)}

/* ---------- Montagehalle ---------- */
#edTop .chip{flex:1;min-width:0;overflow:hidden;justify-content:flex-start}
#edName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#edGo{height:44px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffc06b,#f0791c);color:#2a1300;font-weight:900;padding:0 14px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#edStats{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:8px;right:62px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:auto}
#edStats .chip{height:30px;font-size:13px;padding:0 8px}
#edStats .chip.bad{border-color:var(--bad);color:#ffb3b3}
#edTools{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;gap:6px}
#edTools .ib{font-size:18px;font-weight:800}
#edPal{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(7,11,22,.0),rgba(7,11,22,.93) 18%);padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
#edCats{display:flex;gap:5px;padding:0 8px 6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#edCats::-webkit-scrollbar{display:none}
#edCats button{flex:none;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:13px;padding:0 11px;color:var(--dim)}
#edCats button.on{background:var(--panel3);color:var(--text);border-color:var(--acc)}
#edParts{display:flex;gap:6px;padding:0 8px 2px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#edParts::-webkit-scrollbar{display:none}
.pb{flex:none;width:74px;height:92px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px 2px;gap:1px;position:relative}
.pb canvas{width:62px;height:58px;pointer-events:none}
.pb b{font-size:10.5px;line-height:1.1;text-align:center;font-weight:700;pointer-events:none;max-height:24px;overflow:hidden}
.pb i{position:absolute;right:4px;top:3px;font-style:normal;font-size:10px;color:var(--acc2);pointer-events:none}
.pb.more{justify-content:center;color:var(--dim);font-size:12px;text-align:center;padding:6px}
#edSel{position:absolute;left:8px;right:8px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 -4px 18px rgba(0,0,0,.45)}
#edSel.on{display:block}
#edSel .nm{font-weight:800;font-size:15px}
#edSel .ds{font-size:12.5px;color:var(--dim);margin:2px 0 6px;line-height:1.35}
#edSel .row2{display:flex;gap:6px;flex-wrap:wrap}
#edSel .row2 button{height:38px;border-radius:10px;border:0;background:var(--panel3);font-weight:700;padding:0 10px;font-size:13px}
#edSel .row2 button.red{background:#5e2626;color:#ffd0d0}
#edTrash{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:none;padding:12px 18px;border-radius:14px;background:rgba(120,30,30,.9);border:2px dashed #ff9a9a;font-weight:800}
#edTrash.on{display:block}

/* ---------- Flug ---------- */
#fInfo{flex:1;min-width:0;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.35);height:46px}
#fInfo>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#fInfo b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
#fInfo small{font-size:10.5px;color:var(--dim);white-space:nowrap}
#fRow2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
#fRow2>*{pointer-events:auto}
#fOrb{font-size:12.5px;height:32px;padding:0 8px;flex:1;min-width:0;overflow:hidden;justify-content:flex-start}
#fOrb b{color:var(--cy)}
#warp{display:flex;height:32px;border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#warp button{border:0;background:transparent;width:36px;font-weight:900;font-size:13px}
#warp #wv{width:auto;min-width:50px;font-variant-numeric:tabular-nums;color:var(--acc2);border-left:1px solid var(--line);border-right:1px solid var(--line)}
#warp.on #wv{background:rgba(255,154,61,.18)}
#fMet{height:32px;font-size:12.5px;padding:0 8px}
#fRes{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 98px);display:flex;flex-direction:column;gap:4px;pointer-events:none}
.rb{width:96px;height:18px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid var(--line);position:relative;overflow:hidden;font-size:10.5px;font-weight:700}
.rb i{position:absolute;left:0;top:0;bottom:0;background:var(--c,#6fd)}
.rb span{position:absolute;inset:0;display:flex;align-items:center;padding-left:5px;text-shadow:0 1px 2px #000;white-space:nowrap}
#fStages{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 208px);display:flex;flex-direction:column-reverse;gap:4px;align-items:flex-end;pointer-events:none;max-height:40vh;overflow:hidden}
.stg{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px 5px;min-height:28px;opacity:.75}
.stg.next{opacity:1;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.stg em{font-style:normal;font-size:11px;font-weight:800;color:var(--dim);margin-right:3px}
.stg img{width:22px;height:22px}
.stg span{font-size:11px;color:var(--dim)}
#fChips{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;pointer-events:auto}
#fChips::-webkit-scrollbar{display:none}
#fChips button{flex:none;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;padding:0 11px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#fChips button.on{border-color:var(--cy);color:var(--cy);background:#10314a}
#fChips button.red{background:#6a1d1d;border-color:#ff7070;color:#ffdede}
#fChips button.gold{background:linear-gradient(180deg,#ffd27a,#e09a2a);color:#2a1700;border:0}
#fBot{position:absolute;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:142px;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#fBot>*{pointer-events:auto}
#thr{width:54px;height:142px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;flex:none;touch-action:none}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#f0791c,#ffd27a)}
#thrTxt{position:absolute;left:0;right:0;top:4px;text-align:center;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000}
#thrLbl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:var(--dim);font-weight:700;text-shadow:0 1px 2px #000}
.rot{width:58px;height:66px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:28px;font-weight:900;flex:none;touch-action:none}
.rot.hold{background:var(--panel3);border-color:var(--cy)}
#dialBox{position:relative;flex:1;min-width:96px;height:142px;display:flex;align-items:flex-end;justify-content:center}
#sasRow{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);display:none;grid-template-columns:repeat(2,1fr);gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;width:190px;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#sasRow.open{display:grid}
#sasRow button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:800;color:var(--text)}
#sasRow button.on{background:#10314a;color:var(--cy);border-color:var(--cy)}
#sasRow button:disabled{opacity:.3}
#dial{width:100%;height:124px;pointer-events:none}
#stageB{width:84px;height:84px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff8a7a,#d8261e 60%,#8c120e);color:#fff;font-weight:900;font-size:15px;letter-spacing:.04em;flex:none;
  box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 4px rgba(255,255,255,.12);touch-action:manipulation}
#stageB:active{transform:scale(.95)}
#stageB.off{filter:grayscale(1) brightness(.6)}
#evaPad{display:none;gap:4px;flex-direction:column;align-items:center}
#evaPad.on{display:flex}
#evaPad div{display:flex;gap:4px}
#evaPad button{width:50px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:900;touch-action:none}
#nodeP{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 -4px 18px rgba(0,0,0,.5)}
#nodeP.on{display:block}
#nodeP .nh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
#nodeP .nh b{font-size:15px;color:var(--cy)}
#nodeP .ng{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr;gap:4px;align-items:center;font-size:12.5px}
#nodeP .ng button{height:34px;border-radius:9px;border:0;background:var(--panel3);font-weight:800;font-size:13px;touch-action:none}
#nodeP .ng span{color:var(--dim);font-weight:700;padding-right:2px}
#nodeP .nb{display:flex;gap:6px;margin-top:6px}
#nodeP .nb button{flex:1;height:36px;border-radius:10px;border:0;background:var(--panel3);font-weight:800;font-size:13px}
#nodeP .nb button.red{background:#5e2626}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:120px;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,140,40,.9),0 6px 0 #a4400f}
#cd.on{display:flex}
#cd span{animation:cdp .9s ease-out}
@keyframes cdp{from{transform:scale(1.8);opacity:0}25%{opacity:1}to{transform:scale(1);opacity:.9}}
#lost{position:absolute;left:16px;right:16px;top:30%;display:none;flex-direction:column;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--bad);border-radius:16px;padding:16px;text-align:center}
#lost.on{display:flex}
#lost h3{margin:0;color:#ffb0b0}
#lost p{margin:0;color:var(--dim)}

@media (max-width:380px){
  #thr{width:48px}.rot{width:50px;height:60px;font-size:24px}#stageB{width:74px;height:74px;font-size:13px}#dialBox{min-width:84px}
  #fBot{gap:4px;left:4px;right:4px}#edSel .ds{font-size:11.5px}.pb{width:68px;height:86px}
}
@media (max-height:700px){#fBot{height:128px}#thr{height:128px}#dial{height:110px}#fChips{bottom:calc(env(safe-area-inset-bottom,0px) + 142px)}#nodeP{bottom:calc(env(safe-area-inset-bottom,0px) + 142px)}#fStages{bottom:calc(env(safe-area-inset-bottom,0px) + 192px)}}
/* ---------- Tipp der Missionsleiterin ---------- */
#tip{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 100px);display:none;gap:10px;align-items:flex-start;background:rgba(13,19,36,.97);border:1px solid var(--line);border-left:4px solid var(--acc);
  border-radius:14px;padding:9px 10px;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:15}
#tip.on{display:flex;animation:tin .25s ease-out}
#fl.on~#tip{left:110px;top:calc(env(safe-area-inset-top,0px) + 98px);padding:7px 8px;gap:7px}
#fl.on~#tip div{font-size:13px}
#fl.on~#tip canvas{width:38px;height:38px}
#tip canvas{width:52px;height:52px;flex:none;border-radius:50%;background:#2b3a66}
#tip div{flex:1;font-size:14.5px;line-height:1.38}
#tip small{display:block;color:var(--acc2);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
#tip button{flex:none;width:34px;height:34px;border-radius:9px;border:0;background:var(--panel3);font-size:15px}

/* ---------- Bottom-Sheet ---------- */
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:18;display:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;z-index:19;display:none;flex-direction:column;background:#111a30;border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.55);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on,#sheetBg.on{display:flex}
#sheetHead{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
#sheetTitle{flex:1;font-size:18px;font-weight:800}
#sheetX{width:44px;height:44px;border:0;border-radius:10px;background:var(--panel2);font-size:20px}
#sheetTabs{display:flex;gap:5px;padding:8px 10px 0}
#sheetTabs:empty{display:none}
#sheetTabs button{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:9px;background:var(--panel2);padding:0 2px;min-height:42px;font-weight:700;color:var(--dim)}
#sheetTabs button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 -2px 0 var(--acc)}
#sheetBody{overflow-y:auto;padding:10px 12px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#sheetBody p{margin:6px 0;line-height:1.45;color:var(--dim)}
#sheetBody h4{margin:14px 0 6px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.04em}
#sheetBody h4:first-child{margin-top:2px}
.btn{border:0;border-radius:11px;background:var(--panel3);padding:8px 13px;min-height:44px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.acc{background:linear-gradient(180deg,#ffc06b,#f0791c);color:#2a1300}
.btn.ok{background:linear-gradient(180deg,#8ff0a8,#3fbf66);color:#06260f}
.btn.cy{background:linear-gradient(180deg,#8fe9ff,#2fa8d8);color:#03202e}
.btn.red{background:#6a2626;color:#ffd6d0}
.btn.big{flex:1;min-height:52px;font-size:16px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:9px 11px;margin-bottom:6px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px}
.row .rt small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block}
.row .rv{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row canvas,.row img{flex:none}
.row.done{opacity:.55}
.row.hi{box-shadow:inset 3px 0 0 var(--acc)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--panel3);color:var(--dim);margin-right:4px}
.tag.ok{background:#1e4a2e;color:#9ff0b8}.tag.bad{background:#4a1e1e;color:#ffb0b0}.tag.acc{background:#4a3214;color:var(--acc2)}.tag.cy{background:#123a4e;color:var(--cy)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 6px}
.sum div{background:var(--panel2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.sum small{color:var(--dim);font-size:12px}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
table.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.st td,table.st th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.st th{color:var(--dim);font-weight:700;font-size:11.5px}
table.st td:first-child,table.st th:first-child{text-align:left}
textarea,input[type=text]{width:100%;border-radius:10px;border:1px solid var(--line);background:#0b1224;color:var(--text);padding:9px;font:15px system-ui;user-select:text;-webkit-user-select:text}
textarea{min-height:90px;font:12px ui-monospace,monospace;resize:vertical}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:12px;padding:8px 10px 8px 12px;margin-bottom:6px;min-height:52px;gap:8px}
.sw{width:54px;height:32px;border-radius:16px;background:var(--panel3);border:0;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#d8dff0;transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:25px}
.seg{display:flex;gap:4px}
.seg button{border:0;border-radius:9px;background:var(--panel3);padding:6px 10px;font-weight:700;font-size:13px;min-height:36px}
.seg button.on{background:var(--cy);color:#03202e}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pal button{width:40px;height:40px;border-radius:10px;border:2px solid transparent;padding:0}
.pal button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.lead{font-size:16px;color:var(--text)!important}
.bar{height:8px;border-radius:4px;background:var(--panel3);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- Meldungen ---------- */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 98px);transform:translateX(-50%);z-index:20;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:92vw}
#toast div{background:rgba(13,19,36,.97);border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-size:14px;font-weight:600;text-align:center;
  animation:tin .2s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#toast div.good{border-color:var(--ok)}
#toast div.bad{border-color:var(--bad)}
#toast div.gold{border-color:var(--acc);color:var(--acc2)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;font-size:18px;color:var(--dim)}
</style>
</head>

    7. Karriere (Crew, Forschung, Wissenschaft, Rekorde, Aufträge, Bergung)
    8. Spielstand-Daten (Speichern/Laden der Fahrzeuge)

   10. Ton (Web Audio, synthetisch)

   12. Speichern, Cloud, Selbst-Update, Hauptschleife
   Der Teil zwischen LOGIK-ANFANG und LOGIK-ENDE kommt ohne DOM aus (tools/countdown-sim.mjs nutzt ihn).
   ===================================================================== */
const BUILD='2026.10.25-1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dc=(v,n)=>v.toFixed(n).replace('.',',');
function fmtDist(m){
  const a=Math.abs(m),s=m<0?'−':'';
  if(a<1000)return s+Math.round(a)+' m';
  const k=a/1000;
  if(k<100)return s+dc(k,1)+' km';
  if(k<1e6)return s+fmtNum(Math.round(k))+' km';
  return s+dc(k/1e6,2)+' Mio. km';
}
function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
const fmtV=v=>fmtNum(v)+' m/s';
const fmtM=n=>fmtNum(n)+' €';
const fmtSci=n=>(n<10&&n%1?dc(n,1):fmtNum(n));
function fmtT(s){
  s=Math.max(0,Math.floor(s));
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d>0)return`${d} Tg. ${h} Std.`;
  if(h>0)return`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
  return`${m}:${String(x).padStart(2,'0')}`;
}
function fmtTs(s){s=Math.max(0,s);if(s<90)return Math.round(s)+' s';if(s<5400)return Math.round(s/60)+' min';if(s<172800)return dc(s/3600,1)+' Std.';return dc(s/86400,1)+' Tage'}
// ==LOGIK-ANFANG==
/* =====================================================================
   2. DATEN: Himmelskörper, Bauteile, Forschung, Gebäude, Experimente
   ===================================================================== */
const TAU=Math.PI*2,G0=9.81,PAD_A=Math.PI/2;   // Startrampe liegt oben auf Murmel
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI};
let R=Math.random;                               // Zufall (Tests können ihn ersetzen)
function rng(seed){let s=seed|0;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const BODIES={},BLIST=[];
function initBodies(){
  for(const d of BDEF){const b=Object.assign({},d);BODIES[b.id]=b;BLIST.push(b);b.kids=[]}
  for(const b of BLIST){
    if(!b.mu)b.mu=b.g*b.R*b.R;
    if(b.p){const P=BODIES[b.p];b.par=P;P.kids.push(b);b.mm=Math.sqrt(P.mu/(b.a*b.a*b.a));b.v=b.mm*b.a;
      if(!b.soi)b.soi=b.a*Math.pow(b.mu/P.mu,.4)}
    else{b.soi=Infinity;b.mm=0;b.v=0}
    b.ah=b.atm?b.atm.h:0;
    terInit(b);
  }
}
/* ---------- Gelände: Summe von Wellen + Krater + flache Startrampe ---------- */
function terInit(b){
  b.tw=[];b.cr=[];b.hmax=0;b.hmin=0;
  const T=b.ter;if(!T)return;
  const r=rng(T.seed*7919+11);
  for(let i=0;i<T.n;i++){
    const k=Math.round(3*Math.pow(1.9,i))+Math.floor(r()*3),a=Math.min(T.amp*Math.pow(k/3,-1.02)*(.6+r()*.6),b.R*.03/k);
    b.tw.push([k,a,r()*TAU]);
  }
  // ganz feine Unebenheiten (nur ein paar Meter)
  b.tw.push([Math.round(b.R/40),Math.min(1.2,T.amp*.001),r()*TAU]);
  for(let i=0;i<(T.crat||0);i++){const w=(.01+r()*.06*(i<3?2:1))*(30e3/Math.max(b.R,30e3))*3,dep=Math.min(T.amp*(.25+r()*.5),w*b.R*.12);b.cr.push([r()*TAU,w,dep])}
  b.off=0;
  if(T.ocean){                                   // so verschieben, dass ein Teil unter dem Meeresspiegel liegt
    const s=[];for(let i=0;i<720;i++)s.push(terRaw(b,i/720*TAU));s.sort((x,y)=>x-y);b.off=-s[Math.floor(s.length*T.ocean)];
  }
  if(T.pad){b.padH=terRaw(b,PAD_A)+b.off;if(b.padH<40)b.padH=40}
  let mx=-1e9,mn=1e9;for(let i=0;i<2048;i++){const h=terH(b,i/2048*TAU);if(h>mx)mx=h;if(h<mn)mn=h}
  b.hmax=mx;b.hmin=mn;
}
function terRaw(b,a){
  let h=0;const tw=b.tw;
  for(let i=0;i<tw.length;i++)h+=tw[i][1]*Math.sin(tw[i][0]*a+tw[i][2]);
  if(b.ter&&b.ter.flats)h=h>0?h*.35:h*1.1;      // Brösel: flache Eisflächen
  for(const c of b.cr){const d=Math.abs(wrapA(a-c[0]))/c[1];if(d<1.6){h+=d<1?-c[2]*(1-d*d):0;h+=c[2]*.35*Math.exp(-Math.pow((d-1)/.25,2))}}
  return h;
}
function terH(b,a){
  if(!b.tw.length)return 0;
  let h=terRaw(b,a)+b.off;
  if(b.padH!==undefined){const d=Math.abs(wrapA(a-PAD_A));if(d<.03){const t=d<.012?0:(d-.012)/.018,s=t*t*(3-2*t);h=lerp(b.padH,h,s)}}
  return h;
}
/* Oberflächenhöhe für Kontakte (Wasser zählt als Oberfläche) */
function surfH(b,a){const h=terH(b,a);return b.ocean&&h<0?0:h}
function biome(b,a,h){
  a=(a%TAU+TAU)%TAU;
  if(b.id==='murmel'){if(Math.abs(wrapA(a-PAD_A))<.012)return'Startgelände';if(h<0)return'Ozean';if(h>b.hmax*.62)return'Berge'}
  if(b.cr.length&&h<b.hmin*.5)return'Kratergrund';
  let n=b.bio[0][1];for(const[s,nm]of b.bio)if(a>=s)n=nm;return n;
}
/* Luftdichte und Druck (1 = Murmel am Boden) */
function rhoAt(b,alt){
  const A=b.atm;if(!A||alt>=A.h)return 0;
  let r=A.rho*Math.exp(-Math.max(0,alt)/A.H);
  const f=alt>A.h*.85?(A.h-alt)/(A.h*.15):1;   // sanft auslaufen
  return r*f;
}
const pressAt=(b,alt)=>rhoAt(b,alt)/1.225;

/* =====================================================================
   3. BAHNMECHANIK (2D-Keplerbahnen, Einflusssphären, Vorhersage)
   ---------------------------------------------------------------------
   Eine Bahn o: mu, e (Exzentrizität), p (Halbparameter), a (große Halbachse, negativ = Hyperbel),
   w (Winkel der Periapsis), s (+1 gegen den Uhrzeigersinn, −1 im Uhrzeigersinn), n (mittlere Bewegung), tp (Zeit der Periapsis)
   ===================================================================== */
/* Lage eines Körpers relativ zu seinem Mutterkörper (Kreisbahnen gegen den Uhrzeigersinn) */
function bodyRel(b,t,o){
  if(!b.par){o.x=o.y=o.vx=o.vy=0;return o}
  const an=b.M0+b.mm*t,c=Math.cos(an),s=Math.sin(an);
  o.x=b.a*c;o.y=b.a*s;o.vx=-b.v*s;o.vy=b.v*c;return o;
}
/* Lage relativ zur Sonne */
function bodyAbs(b,t,o){
  o.x=o.y=o.vx=o.vy=0;const q={x:0,y:0,vx:0,vy:0};
  for(let c=b;c&&c.par;c=c.par){bodyRel(c,t,q);o.x+=q.x;o.y+=q.y;o.vx+=q.vx;o.vy+=q.vy}
  return o;
}
/* Lage von Körper b im Bezugssystem von Körper f */
function bodyIn(b,f,t,o){
  const A=bodyAbs(b,t,{}),B=bodyAbs(f,t,{});
  o.x=A.x-B.x;o.y=A.y-B.y;o.vx=A.vx-B.vx;o.vy=A.vy-B.vy;return o;
}

function orbitFrom(mu,x,y,vx,vy,t){
  const r=Math.hypot(x,y),v2=vx*vx+vy*vy,h=x*vy-y*vx,rv=x*vx+y*vy;
  const en=v2/2-mu/r;
  const o={mu,s:h>=0?1:-1,h:Math.abs(h)};
  o.p=h*h/mu;
  o.a=Math.abs(en)<1e-12?1e30:-mu/(2*en);
  let e=Math.sqrt(Math.max(0,1-o.p/o.a));
  if(o.a>1e29){e=1+1e-7;o.a=o.p/(1-e*e)}          // Parabel → knapp Hyperbel
  else if(o.a>0)e=Math.min(e,1-1e-7);else e=Math.max(e,1+1e-7);
  // Richtung der Periapsis
  const ex=((v2-mu/r)*x-rv*vx)/mu,ey=((v2-mu/r)*y-rv*vy)/mu;
  if(e<1e-7){e=0;o.w=Math.atan2(y,x)}else o.w=Math.atan2(ey,ex);
  o.e=e;
  o.n=Math.sqrt(mu/Math.pow(Math.abs(o.a),3));
  const nu=wrapA(o.s*(Math.atan2(y,x)-o.w));
  o.tp=t-meanFromNu(o,nu)/o.n;
  return o;
}
function meanFromNu(o,nu){
  const e=o.e;
  if(e<1){const E=2*Math.atan2(Math.sqrt(1-e)*Math.sin(nu/2),Math.sqrt(1+e)*Math.cos(nu/2));return E-e*Math.sin(E)}
  const lim=Math.acos(-1/e)-1e-9;nu=clamp(nu,-lim,lim);
  const H=2*Math.atanh(Math.sqrt((e-1)/(e+1))*Math.tan(nu/2));
  return e*Math.sinh(H)-H;
}
function nuFromMean(o,M){
  const e=o.e;
  if(e<1){
    M=wrapA(M);
    let E=e<.8?M:(M<0?-Math.PI:Math.PI);
    for(let i=0;i<40;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-13)break}
    return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
  }
  let H=M===0?0:Math.sign(M)*Math.log(2*Math.abs(M)/e+1.8);
  for(let i=0;i<60;i++){const d=(e*Math.sinh(H)-H-M)/(e*Math.cosh(H)-1);H-=d;if(Math.abs(d)<1e-12)break}
  return 2*Math.atan(Math.sqrt((e+1)/(e-1))*Math.tanh(H/2));
}
const period=o=>o.e<1?TAU/o.n:Infinity;
const apo=o=>o.e<1?o.a*(1+o.e):Infinity;
const peri=o=>o.p/(1+o.e);
const radAt=(o,nu)=>o.p/(1+o.e*Math.cos(nu));
/* Zustand zur Wahren Anomalie nu */
function stateNu(o,nu,out){
  const r=radAt(o,nu),ph=o.w+o.s*nu,c=Math.cos(ph),s=Math.sin(ph),k=Math.sqrt(o.mu/o.p);
  const vr=k*o.e*Math.sin(nu),vt=k*(1+o.e*Math.cos(nu));
  out.x=r*c;out.y=r*s;out.vx=vr*c-o.s*vt*s;out.vy=vr*s+o.s*vt*c;out.nu=nu;out.r=r;return out;
}
function orbitAt(o,t,out){return stateNu(o,nuFromMean(o,o.n*(t-o.tp)),out)}
/* nächste Zeit ab t0, zu der die Bahn den Abstand r erreicht (out=true nach außen, sonst nach innen) */
function timeToR(o,r,t0,out){
  const pe=peri(o);if(r<pe)return Infinity;
  if(o.e<1&&r>apo(o))return Infinity;
  if(o.e<1e-9)return Infinity;
  const c=clamp((o.p/r-1)/o.e,-1,1),nu=Math.acos(c)*(out?1:-1);
  let tt=o.tp+meanFromNu(o,nu)/o.n;
  if(o.e<1){const T=period(o);tt=t0+(((tt-t0)%T)+T)%T;return tt}
  return tt>=t0?tt:Infinity;
}
/* Nächstes Ereignis einer Bahn um Körper b: Verlassen der Einflusssphäre, Eintritt bei einem Mond, Lufthülle/Boden */
function nextEvent(b,o,t0,tMax){
  let best={t:tMax,k:'none'};
  // Boden oder Lufthülle
  const top=b.R+Math.max(b.ah,b.hmax+(b.ah?0:500));
  if(peri(o)<top){const tt=timeToR(o,top,t0,false);if(tt<best.t)best={t:tt,k:b.ah?'atmo':'ground'}}
  if(b.par&&(o.e>=1||apo(o)>b.soi)){const tt=timeToR(o,b.soi,t0,true);if(tt<best.t)best={t:tt,k:'exit'}}
  const pe=peri(o),ap=apo(o);
  const vmax=Math.sqrt(o.mu*(2/Math.max(pe,1)-1/o.a));
  const st={},cs={};
  for(const c of b.kids){
    if(pe>c.a+c.soi||ap<c.a-c.soi)continue;
    let t=t0,tp=t0,n=0;const end=best.t,minS=Math.max(1,(end-t0)/3000);
    while(t<end&&n<4000){
      n++;orbitAt(o,t,st);bodyRel(c,t,cs);
      const d=Math.hypot(st.x-cs.x,st.y-cs.y)-c.soi;
      if(d<=0){
        if(t===t0)break;                          // schon drin (sollte nicht passieren)
        let lo=tp,hi=t;
        for(let i=0;i<40&&hi-lo>.05;i++){const m=(lo+hi)/2;orbitAt(o,m,st);bodyRel(c,m,cs);if(Math.hypot(st.x-cs.x,st.y-cs.y)<c.soi)hi=m;else lo=m}
        if(hi<best.t)best={t:hi,k:'enter',c};
        break;
      }
      tp=t;t+=Math.max(d/(vmax+c.v),minS);
    }
  }
  return best;
}
/* Zustandswechsel beim Übergang in ein anderes Bezugssystem */
function toChild(st,c,t){const q=bodyRel(c,t,{});return{x:st.x-q.x,y:st.y-q.y,vx:st.vx-q.vx,vy:st.vy-q.vy}}
function toParent(st,b,t){const q=bodyRel(b,t,{});return{x:st.x+q.x,y:st.y+q.y,vx:st.vx+q.vx,vy:st.vy+q.vy}}
/* Bahnvorhersage über mehrere Abschnitte (für Karte und Manöver) */
function predict(b,st,t0,maxP,horizon){
  const out=[];let body=b,s=st,t=t0;
  for(let i=0;i<maxP;i++){
    const o=orbitFrom(body.mu,s.x,s.y,s.vx,s.vy,t);
    const T=period(o),lim=t+Math.min(isFinite(T)?T:1e12,horizon||1e8);
    const ev=nextEvent(body,o,t,lim);
    out.push({b:body,o,t0:t,t1:ev.t,k:ev.k,c:ev.c});
    if(ev.k==='enter'){const q=orbitAt(o,ev.t,{});s=toChild(q,ev.c,ev.t);body=ev.c;t=ev.t}
    else if(ev.k==='exit'){const q=orbitAt(o,ev.t,{});s=toParent(q,body,ev.t);body=body.par;t=ev.t}
    else break;
  }
  return out;
}
/* Hohmann-Hilfe: Phasenwinkel und Δv zwischen zwei Kreisbahnen (für Hinweise) */
function hohmann(mu,r1,r2){
  const at=(r1+r2)/2,v1=Math.sqrt(mu/r1),vp=Math.sqrt(mu*(2/r1-1/at)),va=Math.sqrt(mu*(2/r2-1/at)),v2=Math.sqrt(mu/r2);
  const tt=Math.PI*Math.sqrt(at*at*at/mu);
  return{dv1:vp-v1,dv2:v2-va,t:tt,phase:Math.PI-Math.sqrt(mu/(r2*r2*r2))*tt};
}
/* =====================================================================
   4. FAHRZEUGE: Bauplan, Verbindungen, Stufen, Werte (Masse, Schub, Δv)
   ---------------------------------------------------------------------
   Ein Teil q: t Typ, x/y Mitte im Bauplan (m, y nach oben), fx/fy gespiegelt/umgedreht, p Elternteil, a Knoten am Elternteil
   ('top','bot','L','R','dock'), n eigener Knoten ('top','bot','side','dock'), s Stufe, col Farbe/Muster
   ===================================================================== */
const RESM={lf:1,sf:1,xe:1,mp:1,ab:1,ec:0};      // Masse je Einheit (t) – Strom wiegt nichts
const CREWM=.09;
function partMass(q){
  let m=P[q.t].m;const r=q.r;
  if(r)for(const k in r)m+=r[k]*(RESM[k]||0);
  if(q.crew)m+=q.crew.length*CREWM;
  return m;
}
const pW=q=>P[q.t].w,pH=q=>P[q.t].h;
const sgnY=q=>q.fy?-1:1;
/* Knoten eines Teils im Bauplan (eigener Knoten 'top'/'bot') */
function nodePos(q,nd){const h=pH(q)/2*sgnY(q);return{x:q.x,y:q.y+(nd==='top'?h:-h)}}
/* Breite eines Knotens (Adapter haben oben/unten verschiedene Breiten) */
function nodeW(q,nd){const d=P[q.t];const top=(nd==='top')!==!!q.fy;return top?(d.wt||d.w):(d.wb||d.w)}
function kidsOf(ps){const k=ps.map(()=>[]);for(let i=0;i<ps.length;i++){const p=ps[i].p;if(p>=0&&k[p])k[p].push(i)}return k}
/* Nachbar am Knoten nd von Teil i (Kind oder Elternteil) */
function nbAt(ps,kids,i,nd){
  const q=ps[i];
  if(q.p>=0&&q.n===nd)return q.p;
  for(const c of kids[i])if(ps[c].a===nd)return c;
  return -1;
}
function subtree(kids,i,out){out=out||[];out.push(i);for(const c of kids[i])subtree(kids,c,out);return out}
/* Baum umhängen: Teil r wird Wurzel und steht danach an Stelle 0 (Reihenfolge: von der Wurzel aus) */
function reroot(ps,r){
  const path=[];for(let i=r;i>=0;i=ps[i].p)path.push(i);
  for(let k=path.length-1;k>0;k--){const par=path[k],ch=path[k-1],q=ps[ch];
    const a=q.a,n=q.n;ps[par].p=ch;ps[par].a=n;ps[par].n=a;}
  ps[r].p=-1;ps[r].a=ps[r].n=undefined;
  const kids=kidsOf(ps),ord=subtree(kids,r),map=new Map(ord.map((j,k)=>[j,k]));
  for(let j=0;j<ps.length;j++)if(!map.has(j)){map.set(j,ord.length);ord.push(j)}
  const out=ord.map(j=>ps[j]);for(const q of out)if(q.p>=0)q.p=map.get(q.p);
  return out;
}
/* Wurzel auf ein Steuerteil legen (Kapsel mit Crew bevorzugt, sonst Sonde) */
function normRoot(ps){
  if(!ps.length)return ps;
  const isC=q=>P[q.t].crew&&P[q.t].ctl,isP=q=>P[q.t].ctl;
  if(isC(ps[0]))return ps;
  let r=ps.findIndex(isC);if(r<0){if(isP(ps[0]))return ps;r=ps.findIndex(isP)}
  return r>0?reroot(ps,r):ps;
}

/* ---------- automatische Stufen ----------
   Stufe 0: alle Triebwerke, unter denen kein Trenner hängt. Danach je Stufe: die „untersten“ Trenner (ohne weiteren Trenner darunter)
   feuern, und Triebwerke, die dadurch frei werden, zünden gleich mit. Zuletzt Fallschirme. */
function autoStage(D,keep){
  D.parts=normRoot(D.parts);
  const ps=D.parts,n=ps.length;if(!n)return;
  const kids=kidsOf(ps),gone=new Uint8Array(n),done=new Uint8Array(n);
  let st=0,any=false;
  const isEng=i=>{const d=P[ps[i].t];return d.eng&&!d.les};
  const set=i=>{done[i]=1;if(!(keep&&ps[i].s!==undefined&&ps[i].s>=0))ps[i].s=st;any=true};
  function blocked(i){
    let x=P[ps[i].t].rad?ps[i].p:i;if(x<0)return false;
    for(let k=0;k<60;k++){const c=nbAt(ps,kids,x,'bot');if(c<0||gone[c])return false;if(P[ps[c].t].dec)return true;
      if(c===ps[x].p)return false;x=c}
    return false;
  }
  function hasDec(i){for(const c of kids[i]){if(gone[c])continue;if(P[ps[c].t].dec||hasDec(c))return true}return false}
  const ignite=()=>{for(let i=0;i<n;i++)if(!gone[i]&&!done[i]&&isEng(i)&&!blocked(i))set(i)};
  for(let i=0;i<n;i++)ps[i].s=keep&&ps[i].s>=0?ps[i].s:-1;
  ignite();if(any)st++;
  let les=-1;for(let i=0;i<n;i++)if(P[ps[i].t].les){les=i;break}
  for(let g=0;g<40;g++){
    const decs=[];for(let i=0;i<n;i++)if(!gone[i]&&!done[i]&&P[ps[i].t].dec&&!hasDec(i))decs.push(i);
    if(!decs.length)break;
    any=false;
    for(const i of decs){set(i);for(const j of subtree(kids,i))gone[j]=1}
    if(les>=0&&!done[les])set(les);
    ignite();st++;
  }
  any=false;if(les>=0&&!done[les]){set(les);st++}
  any=false;for(let i=0;i<n;i++)if(!done[i]&&P[ps[i].t].chute&&!gone[i])set(i);
  for(let i=0;i<n;i++)if(!done[i]&&P[ps[i].t].chute)set(i);
  // Lücken schließen
  const used=[...new Set(ps.map(q=>q.s).filter(s=>s>=0))].sort((a,b)=>a-b);
  for(const q of ps)if(q.s>=0)q.s=used.indexOf(q.s);
}
const stageable=t=>{const d=P[t];return!!(d.eng&&!d.rcs||d.dec||d.chute||d.les)};
function maxStage(ps){let m=-1;for(const q of ps)if(stageable(q.t)&&q.s>m)m=q.s;return m}

/* ---------- Treibstoff-Gruppen: verbundene Teile, Trenner sperren den Durchfluss ---------- */
function fuelGroups(ps){
  const n=ps.length,par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const f=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i]}return i};
  for(let i=0;i<n;i++){const q=ps[i];if(q.p<0)continue;if(P[q.t].dec||P[ps[q.p].t].dec)continue;par[f(i)]=f(q.p)}
  const g=new Int32Array(n);for(let i=0;i<n;i++)g[i]=f(i);return g;
}
function ispAt(e,pr){return Math.max(e.iv*.05,e.iv-(e.iv-e.ia)*pr)}

/* ---------- Werte für die Montagehalle: Masse, Kosten, Δv und TWR je Stufe ----------
   Simuliert das Abbrennen Stufe für Stufe (im Vakuum und am Boden von Murmel). */
function designStats(D,gB,live){
  const ps=D.parts,n=ps.length,res={m:0,k:0,n,stages:[],dv:0,dvA:0};
  if(!n)return res;
  for(const q of ps){const d=P[q.t];res.k+=d.k;res.m+=d.m;const rs=live?q.r:d.res;if(rs)for(const k in rs)res.m+=rs[k]*(RESM[k]||0)}
  const ms=maxStage(ps),k0=live?Math.max(0,live.stg-1):0;
  for(const pr of[0,1]){
    const kids=kidsOf(ps),grp=fuelGroups(ps),gone=new Uint8Array(n),lit=new Uint8Array(n);
    const fuel=ps.map(q=>Object.assign({},live?q.r:P[q.t].res||{}));
    if(live)for(let i=0;i<n;i++)if(ps[i].on&&P[ps[i].t].eng&&!P[ps[i].t].rcs)lit[i]=1;
    const mass=()=>{let m=0;for(let i=0;i<n;i++)if(!gone[i]){const d=P[ps[i].t];m+=d.m;for(const k in fuel[i])m+=fuel[i][k]*(RESM[k]||0)}return m};
    const gFuel=(g,fu)=>{let s=0;for(let i=0;i<n;i++)if(!gone[i]&&grp[i]===g&&fuel[i][fu])s+=fuel[i][fu];return s};
    const engFuel=i=>{const e=P[ps[i].t].eng;return e.fu==='sf'?(fuel[i].sf||0):gFuel(grp[i],e.fu)};
    for(let k=k0;k<=Math.max(ms,k0);k++){
      if(!(live&&k===k0&&live.stg>0))for(let i=0;i<n;i++)if(!gone[i]&&ps[i].s===k){const d=P[ps[i].t];
        if(d.dec)for(const j of subtree(kids,i))gone[j]=1;

    if(q.dep<1&&rho>.0005&&sp<t.chute.vmax){q.dep=Math.min(1,q.dep+dt/2.2)}
    if(q.dep>.3&&sp>t.chute.vmax*1.6&&rho>.05){q.brk=1;q.dep=0;q.why='rip'}
    if(V.landed&&q.dep>0&&sp<1.5){q.cut=(q.cut||0)+dt;if(q.cut>2.5){q.dep=0;q.arm=0;q.brk=1;q.why='cut'}}
  }
  // ---- Strom-Haushalt ----
  let ecIn=0;
  if(d.sol.length){const sl=V.light!==undefined?V.light:1;for(const i of d.sol){const q=ps[i],t=P[q.t];if(q.brk||q.dead)continue;if(t.sol.dep&&q.dep<.9)continue;ecIn+=t.sol.ec*sl}}
  resAdd(V,'ec',ecIn*dt);resTake(V,'ec',ecUse*dt);
  const wake=thrustOn||C.rot||C.drive||C.tx||C.ty||V.wake>0;
  if(V.wake>0)V.wake-=dt;
  // ---- Geschwindigkeit: Kräfte, dann Bodenkontakt (Stoß-Löser), dann Lage ----
  const g=-B.mu/(r*r*r),ovx=V.vx,ovy=V.vy,oom=V.om;
  V.vx+=(Fx/m+g*V.x)*dt;V.vy+=(Fy/m+g*V.y)*dt;
  V.om+=Tq/I*dt;
  const nc=contactSolve(V,B,dt,C,ca,sa);
  if(V.rest&&!wake&&nc>0){V.vx=V.vy=V.om=0;return}  // liegt still: nichts bewegen
  V.rest=false;
  V.om=clamp(V.om,-15,15);
  V.x+=V.vx*dt;V.y+=V.vy*dt;
  V.th+=V.om*dt;if(V.th>1e4||V.th<-1e4)V.th=wrapA(V.th);
  if(TFx||TFy){V.tdvx=(V.tdvx||0)+TFx/m*dt;V.tdvy=(V.tdvy||0)+TFy/m*dt}
  V.acc=nc?Math.hypot(V.vx-ovx,V.vy-ovy)/dt:Math.hypot(Fx,Fy)/m;
  // Stillstand erkennen
  if(nc>0&&Math.hypot(V.vx,V.vy)<.15&&Math.abs(V.om)<.03&&!wake){V.restT=(V.restT||0)+dt;if(V.restT>.5){V.rest=true;V.vx=V.vy=V.om=0}}else V.restT=0;
}

/* Bodenkontakt als Stoß-Löser: Für jeden berührenden Eckpunkt wird ein Stoß berechnet, der das Eindringen aufhebt
   (mit wirksamer Masse inkl. Drehung), mehrfach wiederholt. Reibung bremst seitlich, Räder und Astronauten treiben an.
   Gibt die Zahl der Berührungen zurück. */
const CT=[];
function contactSolve(V,B,dt,C,ca,sa){
  const d=V.d,pts=d.pts,m=d.m,I=d.I;
  const r=Math.hypot(V.x,V.y);
  if(r-B.R-B.hmax>d.bR+5){V.landed=false;V.nc=0;for(const p of pts)p.c=0;return 0}
  let n=0,water=0;CT.length=0;
  for(const p of pts){
    const q=V.parts[p.i];
    if(q.dead){p.c=0;continue}
    if(p.leg&&q.dep<.95){p.c=0;continue}
    const rx=p.x-d.cx,ry=p.y-d.cy,wx=ca*rx-sa*ry,wy=sa*rx+ca*ry,px=V.x+wx,py=V.y+wy;
    const pr=Math.hypot(px,py),an=Math.atan2(py,px);
    const h=terH(B,an),wet=B.ocean&&h<0,sh=wet?0:h,Rs=B.R+sh;
    const pen=Rs+(p.k===2?p.r:0)-pr;
    if(pen<=-.02){p.c=0;continue}
    let nx=px/pr,ny=py/pr;
    if(!wet){const e=.4/B.R,h1=terH(B,an+e),h0=terH(B,an-e),dh=(h1-h0)/(2*e)/Rs;const tx=-ny,ty=nx;nx-=dh*tx;ny-=dh*ty;const l=Math.hypot(nx,ny);nx/=l;ny/=l}
    const vn=(V.vx-V.om*wy)*nx+(V.vy+V.om*wx)*ny;
    if(pen<=0&&vn>=0){p.c=0;continue}
    // Aufprall: beim ersten Berühren zu schnell → Teil kaputt
    if(!p.c&&-vn>p.tol*(wet?2.2:1)&&!V.noCrash){q.dead=1;q.why='crash';q.hitV=-vn;continue}
    p.c=1;n++;if(wet)water++;
    const tx=-ny,ty=nx,rn=wx*ny-wy*nx,rt=wx*ty-wy*tx;
    const soft=p.k===1?.12:wet?.05:.25,slop=p.k===1?.06:.01;
    CT.push({p,q,nx,ny,tx,ty,wx,wy,wet,kn:1/(1/m+rn*rn/I),kt:1/(1/m+rt*rt/I),bias:Math.min(wet?1.5:3,soft*Math.max(0,pen-slop)/dt),Ln:0,Lt:0});
  }
  if(n){
    const eva=V.kind==='eva';
    for(let it=0;it<10;it++){
      for(const c of CT){
        let vx=V.vx-V.om*c.wy,vy=V.vy+V.om*c.wx;
        const vn=vx*c.nx+vy*c.ny;
        let dL=c.kn*(c.bias-vn);const L=Math.max(0,c.Ln+dL);dL=L-c.Ln;c.Ln=L;
        if(dL){V.vx+=dL*c.nx/m;V.vy+=dL*c.ny/m;V.om+=(c.wx*c.ny-c.wy*c.nx)*dL/I}
        // Reibung / Antrieb
        vx=V.vx-V.om*c.wy;vy=V.vy+V.om*c.wx;
        const vt=vx*c.tx+vy*c.ty;
        let mu=.8,tg=0;
        if(c.wet)mu=.05;
        else if(c.p.k===2){if(C.drive){mu=.85;tg=C.drive*14}else mu=V.flags.brake?.85:.03}
        else if(eva&&C.drive){mu=.9;tg=C.drive*2.2}
        let dT=c.kt*(tg-vt);const T=clamp(c.Lt+dT,-mu*c.Ln,mu*c.Ln);dT=T-c.Lt;c.Lt=T;
        if(dT){V.vx+=dT*c.tx/m;V.vy+=dT*c.ty/m;V.om+=(c.wx*c.ty-c.wy*c.tx)*dT/I}
      }
    }
    if(water){const f=Math.exp(-.8*dt*water/n);V.vx*=f;V.vy*=f;V.om*=f}
  }
  V.nc=n;
  const sp=Math.hypot(V.vx,V.vy);
  V.landed=n>0&&sp<1.2;V.splashed=V.landed&&water>0;
  return n;
}
/* =====================================================================
   6. WELT: Fahrzeuge verwalten, Stufen zünden, Trennen, Andocken, Zeitraffer, Einflusssphären
   ===================================================================== */
const WARPS=[1,2,4,10,50,100,1000,10000,100000];
const PRANGE=2500;                               // Physik-Reichweite um das aktive Fahrzeug
const WS={t:0,act:null,near:[],wi:0,wto:null,ctl:{thr:0,rot:0,tx:0,ty:0,drive:0},evq:[],nearT:0,ciT:0};
let VESSELS=[];                                  // alle Fahrzeuge (wird mit dem Spielstand gespeichert)
const emit=(k,o)=>{WS.evq.push(Object.assign({k},o||{}))};
const vB=V=>BODIES[V.body];
const vAlt=V=>Math.hypot(V.x,V.y)-vB(V).R;
function vRadar(V){const B=vB(V),a=Math.atan2(V.y,V.x);return Math.hypot(V.x,V.y)-B.R-surfH(B,a)}
function vSit(V){
  const B=vB(V),alt=vAlt(V);
  if(V.mode==='landed'||V.landed&&V.nc>0)return V.splashed?'wasser':'boden';
  if(B.atm&&alt<B.ah)return alt<B.lo?'tief':'hoch';
  return alt<B.hi?'nah':'fern';
}
const hasCmd=V=>V.parts.some(q=>{const t=P[q.t];return t.ctl&&(t.ctl.probe||q.crew&&q.crew.length||t.id==='eva')});
const vCrew=V=>{const a=[];for(const q of V.parts)if(q.crew)a.push(...q.crew);return a};
function vValue(V){let k=0;for(const q of V.parts){const t=P[q.t];k+=t.k}return k}
function vOrbit(V){return orbitFrom(vB(V).mu,V.x,V.y,V.vx,V.vy,WS.t)}

/* ---------- Teile entfernen, abtrennen, zusammenfügen ---------- */
function newVesselFrom(V,parts){
  const N={id:'v'+(Date.now()%1e8).toString(36)+Math.floor(R()*1e5).toString(36),name:V.name,parts,body:V.body,x:V.x,y:V.y,vx:V.vx,vy:V.vy,th:V.th,om:V.om,
    mode:'phys',stg:V.stg,thr:0,sas:'hold',sasT:V.th,data:[],flags:Object.assign({},V.flags),kind:'ship',hist:Object.assign({},V.hist),met0:V.met0};
  vCalc(N);N.kind=hasCmd(N)?(N.parts.length===1&&N.parts[0].t==='eva'?'eva':'ship'):'debris';
  if(N.kind==='debris')N.name='Trümmer';
  return N;
}
/* Unterbaum ab Teil i als neues Fahrzeug abtrennen (imp = Trenngeschwindigkeit m/s) */
function splitOff(V,i,imp){
  const ps=V.parts,kids=kidsOf(ps),sub=subtree(kids,i),inS=new Uint8Array(ps.length);
  for(const j of sub)inS[j]=1;
  if(sub.length===ps.length)return null;
  const keep=[];for(let j=0;j<ps.length;j++)if(!inS[j])keep.push(j);
  const mK=new Map(keep.map((j,k)=>[j,k])),mS=new Map(sub.map((j,k)=>[j,k]));
  const o={x:V.x,y:V.y,vx:V.vx,vy:V.vy,th:V.th,om:V.om,d:{cx:V.d.cx,cy:V.d.cy}};
  const np=sub.map(j=>ps[j]);for(const q of np){if(q===ps[i]){q.p=-1;q.a=q.n=undefined}else q.p=mS.get(q.p)}
  const kp=keep.map(j=>ps[j]);for(const q of kp)if(q.p>=0)q.p=mK.get(q.p);
  V.parts=kp;vCalc(V);
  const N=newVesselFrom(V,np);
  for(const X of[V,N]){const w=l2w(o,X.d.cx,X.d.cy),dx=w.x-o.x,dy=w.y-o.y;X.x=w.x;X.y=w.y;X.vx=o.vx-o.om*dy;X.vy=o.vy+o.om*dx;X.th=o.th;X.om=o.om}
  if(imp){let dx=N.x-V.x,dy=N.y-V.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const mt=V.d.m+N.d.m;
    N.vx+=dx*imp*V.d.m/mt;N.vy+=dy*imp*V.d.m/mt;V.vx-=dx*imp*N.d.m/mt;V.vy-=dy*imp*N.d.m/mt}
  V.ci=null;N.ci=null;V.rest=false;N.rest=false;
  VESSELS.push(N);
  if(V===WS.act&&!WS.near.includes(N))WS.near.push(N);
  else if(WS.near.includes(V))WS.near.push(N);
  // Rückkehr-Computer: Stufe landet von selbst
  if(N.d.rtc&&N.body==='murmel'&&vAlt(N)<vB(N).ah)rtcCheck(N);
  return N;
}
function removeLeaf(V,j){
  V.parts.splice(j,1);for(const q of V.parts)if(q.p>j)q.p--;
  if(V.parts.length)vCalc(V);V.ci=null;
}
/* zerstörte Teile entfernen (Explosion, Hitze, Aufprall) */
function cleanDead(V){
  let any=false;
  for(let g=0;g<300;g++){
    const j=V.parts.findIndex(q=>q.dead);if(j<0)break;any=true;
    const q=V.parts[j],w=l2w(V,q.x,q.y);
    emit('boom',{x:w.x,y:w.y,b:V.body,s:Math.max(pW(q),pH(q)),why:q.why,t:q.t,vx:V.vx,vy:V.vy,V});
    if(q.crew&&q.crew.length)for(const c of q.crew)emit('crewlost',{id:c,why:q.why});
    q.crew=[];
    const kids=kidsOf(V.parts);
    for(const c of kids[j].slice().reverse()){splitOff(V,c,1.5)}
    const jj=V.parts.indexOf(q);
    if(V.parts.length===1){V.parts=[];break}
    // jetzt ist das Teil ein Blatt (oder die Wurzel ohne Kinder)
    if(q.p<0){// Wurzel mit Kindern sollte nicht vorkommen – Kinder wurden abgetrennt
      V.parts.splice(jj,1);for(const x of V.parts){if(x.p>jj)x.p--}}
    else removeLeaf(V,jj);
  }
  if(!any)return;
  if(!V.parts.length){killVessel(V);return}
  vCalc(V);
  if(V.kind!=='debris'&&!hasCmd(V)){V.kind='debris';if(V===WS.act)emit('nocmd',{V})}
}
function killVessel(V){
  VESSELS=VESSELS.filter(x=>x!==V);WS.near=WS.near.filter(x=>x!==V);
  if(WS.act===V){emit('actlost',{V});WS.act=null}
}
/* Baum umhängen: Teil r wird Wurzel */

/* freie Andock-Seite in Weltkoordinaten */
function dockInfo(V,i){
  const q=V.parts[i],face=dockFace(V.parts,V.d.kids,i);
  if(V.d.occ[i][face])return null;
  const np=nodePos(q,face),w=l2w(V,np.x,np.y),dirL=(face==='top')!==!!q.fy?1:-1,a=V.th+(dirL>0?0:Math.PI);
  return{x:w.x,y:w.y,a,face,size:P[q.t].dock};
}
function dockCheck(){
  const A=WS.act;if(!A||!A.d.docks.length)return;
  for(const B of WS.near){
    if(B===A||!B.d||!B.d.docks.length||B.body!==A.body)continue;
    if(Math.hypot(B.x-A.x,B.y-A.y)>A.d.bR+B.d.bR+3)continue;
    for(const i of A.d.docks){const da=dockInfo(A,i);if(!da)continue;
      for(const j of B.d.docks){const db=dockInfo(B,j);if(!db||db.size!==da.size)continue;
        const dist=Math.hypot(da.x-db.x,da.y-db.y),al=Math.abs(wrapA(da.a-db.a-Math.PI));
        const rv=Math.hypot(A.vx-B.vx,A.vy-B.vy);
        if(dist<.6&&al<.2&&rv<1.6){mergeDock(A,i,B,j);emit('dock',{V:A,O:B});return}
      }}
  }
}
function mergeDock(A,i,B,j){
  const mA=A.d.m,mB=B.d.m,da=dockInfo(A,i),db=dockInfo(B,j);
  B.parts=reroot(B.parts,j);
  vCalc(B);
  // B in das Teile-System von A übertragen; Drehung auf 0 oder 180° einrasten
  const rel=wrapA(B.th-A.th),flip=Math.abs(rel)>Math.PI/2;
  const qa=A.parts[i],qb=B.parts[0];
  const fa=nodePos(qa,da.face),fb=nodePos(qb,db.face);
  const base=A.parts.length;
  for(const q of B.parts){
    let dx=q.x-fb.x,dy=q.y-fb.y;
    if(flip){dx=-dx;dy=-dy;q.fx=q.fx?0:1;q.fy=q.fy?0:1}
    q.x=fa.x+dx;q.y=fa.y+dy;
    if(q.p>=0)q.p+=base;
  }
  qb.p=i;qb.a='dock';qb.n='dock';
  const vx=(mA*A.vx+mB*B.vx)/(mA+mB),vy=(mA*A.vy+mB*B.vy)/(mA+mB),om=(A.d.I*A.om+B.d.I*B.om)/(A.d.I+B.d.I);
  const o={x:A.x,y:A.y,th:A.th,d:{cx:A.d.cx,cy:A.d.cy}};
  A.parts=A.parts.concat(B.parts);A.data=A.data.concat(B.data||[]);
  vCalc(A);
  const w=l2w(o,A.d.cx,A.d.cy);A.x=w.x;A.y=w.y;A.vx=vx;A.vy=vy;A.om=om;A.ci=null;
  if(B.hist)for(const k in B.hist)if(!A.hist[k])A.hist[k]=B.hist[k];
  VESSELS=VESSELS.filter(x=>x!==B);WS.near=WS.near.filter(x=>x!==B);
  if(WS.tgt===B.id)WS.tgt=null;
}
/* Abdocken: Andockverbindung an Teil j (Kind mit a='dock') lösen */
function undock(V,j){const N=splitOff(V,j,.6);if(N){N.kind=hasCmd(N)?'ship':'debris';if(N.kind==='ship'&&N.name===V.name)N.name=V.name+' B'}return N}

/* ---------- Stufen ---------- */
function stageNext(V){
  if(!V)return;
  const s=V.stg;
  if(s>maxStage(V.parts)){return false}
  V.stg++;
  const ps=V.parts.slice();
  // zuerst Triebwerke und Schirme, dann Trenner
  for(const q of ps)if(q.s===s){const t=P[q.t];
    if(t.eng&&!t.rcs){q.on=1;if(t.les){V.wake=1}}
    if(t.chute)q.arm=1;}
  for(const q of ps)if(q.s===s){const t=P[q.t];
    if(t.dec||t.les){const i=V.parts.indexOf(q);if(i>0)splitOff(V,i,t.les?1:2.5);else if(i===0)for(const c of V.d.kids[0].slice().reverse())splitOff(V,c,2.5)}}
  V.wake=1;V.rest=false;V.ci=null;
  emit('stage',{V,s});
  return true;
}
/* Abbruch: Rettungsturm zünden und Kapsel abtrennen */
function abortV(V){
  const ps=V.parts;const les=ps.findIndex(q=>P[q.t].les);
  V.thr=0;
  let pod=-1;for(let i=0;i<ps.length;i++)if(P[ps[i].t].crew&&ps[i].crew&&ps[i].crew.length){pod=i;break}
  if(les>=0){ps[les].on=1;ps[les].s=-9}
  if(pod>=0){
    const kids=V.d.kids;let x=pod;
    for(let k=0;k<40;k++){const c=nbAt(ps,kids,x,'bot');if(c<0)break;if(P[ps[c].t].dec){splitOff(V,c,3);break}x=c}
  }
  for(const q of V.parts)if(P[q.t].chute&&!q.arm)q.arm=1;
  V.wake=1;emit('abort',{V});
}

/* ---------- Rückkehr-Computer: Booster landet automatisch ---------- */
function rtcCheck(N){
  const st=designStats({parts:N.parts.map(q=>({t:q.t,s:0,p:q.p,a:q.a,n:q.n,fy:q.fy,fx:q.fx}))},G0);
  // tatsächlicher Treibstoff statt voller Tanks
  let lf=0,cap=0;for(const q of N.parts){lf+=q.r.lf||0;cap+=(P[q.t].res||{}).lf||0}
  const legs=N.d.legs.length>0,eng=N.d.eng.some(i=>P[N.parts[i].t].eng.fu==='lf');
  let dv=0;
  if(eng&&lf>0){let F=0,md=0;for(const i of N.d.eng){const e=P[N.parts[i].t].eng;if(e.fu!=='lf')continue;F+=e.f;md+=e.f/(e.iv*G0)}
    dv=(F/md)*Math.log(N.d.m/(N.d.m-lf))}
  let F0=0;for(const i of N.d.eng){const e=P[N.parts[i].t].eng;if(e.fu==='lf')F0+=e.f*e.ia/e.iv}
  const twr=F0/((N.d.m)*G0),need=Math.hypot(N.vx,N.vy)*1.05+260;
  const ok=legs&&eng&&twr>1.15&&dv>=need;
  const why=!eng?'kein Flüssig-Triebwerk':!legs?'keine Landebeine':twr<=1.15?'zu schwach':'zu wenig Treibstoff';
  N.rtc={t:WS.t+3,ok,why,val:Math.round(vValue(N)*.9)};
}

/* ---------- Bahn statt Physik (für Zeitraffer und entfernte Fahrzeuge) ---------- */
function toRails(V){
  if(V.mode==='rails'||V.mode==='landed')return;
  if(V.rest||V.landed&&V.nc>0&&Math.hypot(V.vx,V.vy)<.3){V.mode='landed';V.vx=V.vy=V.om=0;return}
  V.o=vOrbit(V);V.ev=nextEvent(vB(V),V.o,WS.t,WS.t+Math.min(period(V.o),1e9));V.mode='rails';V.om=0;
}
function toPhys(V){
  if(V.mode==='rails'){railsSync(V);const s=orbitAt(V.o,WS.t,{});V.x=s.x;V.y=s.y;V.vx=s.vx;V.vy=s.vy}
  if(V.mode==='landed'){V.rest=true;V.vx=V.vy=V.om=0}
  V.mode='phys';V.o=null;V.ev=null;if(!V.d)vCalc(V);
}
function railsSync(V){
  if(V.mode!=='rails')return;
  for(let g=0;g<20&&V.ev&&WS.t>=V.ev.t;g++){
    const ev=V.ev,st=orbitAt(V.o,ev.t,{});
    if(ev.k==='enter'){const s=toChild(st,ev.c,ev.t);V.body=ev.c.id;Object.assign(V,{x:s.x,y:s.y,vx:s.vx,vy:s.vy});emit('soi',{V,b:ev.c.id})}
    else if(ev.k==='exit'){const s=toParent(st,vB(V),ev.t);V.body=vB(V).par.id;Object.assign(V,{x:s.x,y:s.y,vx:s.vx,vy:s.vy});emit('soi',{V,b:V.body})}
    else if(ev.k==='atmo'||ev.k==='ground'){
      Object.assign(V,{x:st.x,y:st.y,vx:st.vx,vy:st.vy});
      if(V===WS.act){V.mode='phys';V.o=V.ev=null;WS.wi=0;emit('warpstop',{why:ev.k==='atmo'?'Eintritt in die Lufthülle':'Boden kommt näher'});return}
      if(hasCmd(V)&&vB(V).atm){V.mode='bg';V.o=V.ev=null;return}
      // ohne Steuerung: stürzt ab
      V.mode='phys';V.o=V.ev=null;bgCrash(V);return;
    }else{Object.assign(V,{x:st.x,y:st.y,vx:st.vx,vy:st.vy})}
    V.o=orbitFrom(vB(V).mu,V.x,V.y,V.vx,V.vy,ev.t);
    V.ev=nextEvent(vB(V),V.o,ev.t,ev.t+Math.min(period(V.o),1e9));
  }
}
/* Position eines Fahrzeugs jetzt (für Karte und Abstände) */
function vPos(V){
  if(V.mode==='rails'){railsSync(V);if(V.mode==='rails'){const s=orbitAt(V.o,WS.t,{});return s}}
  return{x:V.x,y:V.y,vx:V.vx,vy:V.vy};
}
/* Hintergrund-Flug durch die Luft (entfernte Fahrzeuge mit Steuerung): Punktmasse mit Luftwiderstand */
function bgStep(V,dt){
  const B=vB(V);if(!V.d)vCalc(V);
  let area=0,chute=0,tol=99;
  for(const q of V.parts){const t=P[q.t];area+=t.w*t.w*.4;if(t.chute&&q.arm&&!q.brk)chute+=t.chute.cda;tol=Math.min(tol,t.tol)}
  const n=Math.min(400,Math.ceil(dt/.05)),h=dt/n,m=V.d.m;
  for(let k=0;k<n;k++){
    const r=Math.hypot(V.x,V.y),alt=r-B.R,rho=rhoAt(B,alt),sp=Math.hypot(V.vx,V.vy);
    const cda=area+(sp<300?chute:0);
    const dr=rho>0?.5*rho*sp*cda/1000/m:0,g=-B.mu/(r*r*r);
    const f=Math.min(dr*h,.9);
    V.vx+=g*V.x*h-V.vx*f;V.vy+=g*V.y*h-V.vy*f;V.x+=V.vx*h;V.y+=V.vy*h;
    const an=Math.atan2(V.y,V.x),gr=B.R+surfH(B,an);
    if(Math.hypot(V.x,V.y)<=gr+V.d.bR*.5){
      const imp=Math.hypot(V.vx,V.vy);
      if(imp<Math.max(9,tol)){landPlace(V);emit('bgland',{V})}else bgCrash(V);
      return;
    }
    if(alt>B.ah+1000&&!B.atm||(B.atm&&alt>B.ah)){toRailsBg(V);return}
  }
}
function toRailsBg(V){V.mode='phys';toRails(V)}
function landPlace(V){
  const B=vB(V),an=Math.atan2(V.y,V.x),gr=B.R+surfH(B,an);
  let low=0;for(const p of V.d.pts){if(p.leg)continue;low=Math.max(low,V.d.cy-p.y)}
  const r=gr+low+.05;V.x=Math.cos(an)*r;V.y=Math.sin(an)*r;V.vx=V.vy=V.om=0;V.th=an;V.mode='landed';V.landed=true;V.nc=1;V.rest=true;
  if(B.ocean&&terH(B,an)<0)V.splashed=true;
}
function bgCrash(V){
  const c=vCrew(V);for(const id of c)emit('crewlost',{id,why:'crash'});
  emit('bgcrash',{V,name:V.name,b:V.body,crew:c.length});
  killVessel(V);
}

/* ---------- Einflusssphäre im Physik-Modus ---------- */
function soiCheck(V){
  const B=vB(V),r=Math.hypot(V.x,V.y);
  if(B.par&&r>B.soi){shiftFrame(V,B,1);V.body=B.par.id;emit('soi',{V,b:V.body});return true}
  for(const c of B.kids){const q=bodyRel(c,WS.t,{});if(Math.hypot(V.x-q.x,V.y-q.y)<c.soi){shiftFrame(V,c,-1);V.body=c.id;emit('soi',{V,b:c.id});return true}}
  return false;
}
function shiftFrame(V,c,sg){const q=bodyRel(c,WS.t,{});V.x+=sg*q.x;V.y+=sg*q.y;V.vx+=sg*q.vx;V.vy+=sg*q.vy}

/* ---------- Zeitraffer ---------- */
function railsBlock(V){
  if(!V)return'';
  if(V.mode==='landed'||V.rest)return'';
  if(V.landed&&V.nc>0)return Math.hypot(V.vx,V.vy)<.3?'':'Erst ganz zur Ruhe kommen';
  const B=vB(V),alt=vAlt(V);
  if(V.thrusting||V.d.eng.some(i=>V.parts[i].on&&P[V.parts[i].t].eng.fu==='sf'&&V.parts[i].r.sf>0))return'Nicht während ein Triebwerk läuft';
  if(B.atm&&alt<B.ah)return'Schneller Zeitraffer nur über der Lufthülle';
  if(!B.atm&&vRadar(V)<Math.max(500,B.hmax*.3))return'Zu nah am Boden';
  const h=Math.abs(V.x*V.vy-V.y*V.vx);if(h<1e3)return'Bahn zu steil';
  return'';
}
function setWarp(i){
  const A=WS.act;i=clamp(i,0,WARPS.length-1);
  if(i>2){const b=railsBlock(A);if(b){const ok=physWarpOK(A);if(i>3||!ok){emit('msg',{t:b,c:'bad'});i=Math.min(i,ok?3:2)}}}
  WS.wi=i;
  if(i<=2&&A&&A.mode!=='phys')toPhys(A);
}

/* Physik-Zeitraffer bis 10× (z. B. am Fallschirm), wenn kein Triebwerk läuft */
const physWarpOK=A=>A&&!A.thrusting&&A.parts.length<=60&&!A.d.eng.some(i=>A.parts[i].on&&P[A.parts[i].t].eng.fu==='sf'&&A.parts[i].r.sf>0);
/* ---------- Hauptschritt der Welt ---------- */
function worldStep(dtR,ctlFn){
  const A=WS.act;let warp=WARPS[WS.wi];
  const rb=warp>4&&A&&A.mode==='phys'?railsBlock(A):'';
  if(rb){if(warp<=10&&physWarpOK(A)){/* Physik-Zeitraffer */}else{WS.wi=physWarpOK(A)?3:2;emit('msg',{t:rb,c:'bad'});warp=WARPS[WS.wi]}}
  if(warp>4&&A&&!rb){
    if(A.mode==='phys'){for(const V of WS.near)if(V!==A)toRails(V);toRails(A)}
    let left=dtR*warp;
    for(let g=0;g<30&&left>0;g++){
      let step=left;
      if(A.mode==='rails'&&A.ev)step=Math.min(step,Math.max(0,A.ev.t-WS.t));
      if(WS.wto)step=Math.min(step,Math.max(0,WS.wto-WS.t));
      WS.t+=step;left-=step;
      if(WS.wto&&WS.t>=WS.wto-1e-6){WS.wto=null;WS.wi=0;toPhys(A);emit('warpstop',{why:'Ziel erreicht'});break}
      if(A.mode==='rails'&&A.ev&&WS.t>=A.ev.t-1e-6){const k=A.ev.k;railsSync(A);if(A.mode!=='rails')break;if(k==='enter'&&WS.wi>6)WS.wi=6}
    }
    if(A.mode==='rails'){const s=orbitAt(A.o,WS.t,{});A.x=s.x;A.y=s.y;A.vx=s.vx;A.vy=s.vy}
    others(dtR*warp);
    return;
  }
  if(A&&A.mode!=='phys')toPhys(A);
  const sim=dtR*warp;
  const nearG=A&&vRadar(A)<200;
  const h=nearG?1/240:1/120;
  const n=Math.min(64,Math.max(1,Math.round(sim/h)));
  const hh=sim/n;
  for(let k=0;k<n;k++){
    if(A){const C=ctlFn?ctlFn(A,hh):null;physStep(A,hh,C)}
    for(const V of WS.near)if(V!==A&&V.mode==='phys')physStep(V,hh,null);
    WS.t+=hh;
    const all=A?[A,...WS.near.filter(v=>v!==A)]:WS.near.slice();
    for(const V of all){if(V.parts.some(q=>q.dead))cleanDead(V)}
    if(A&&WS.act===A&&soiCheck(A)){for(const V of WS.near)if(V!==A&&V.body!==A.body){/* mitnehmen */const B=BODIES[V.body];if(B.par&&B.par.id===A.body)shiftFrame(V,B,1),V.body=A.body;else{const c=BODIES[A.body];if(c.par&&c.par.id===V.body)shiftFrame(V,c,-1),V.body=A.body}}}
    if(!WS.act)break;
  }
  if(WS.act)dockCheck();
  others(sim);
}
/* alles außer dem aktiven Fahrzeug: Nähe prüfen, Hintergrundflüge, Bahnen */
function others(sim){
  const A=WS.act;
  WS.nearT-=sim;
  for(const V of VESSELS.slice()){
    if(V===A)continue;
    if(V.rtc&&WS.t>=V.rtc.t){emit('rtc',{V,ok:V.rtc.ok,why:V.rtc.why,val:V.rtc.val});killVessel(V);continue}
    if(V.mode==='bg')bgStep(V,sim);
    else if(V.mode==='rails')railsSync(V);
  }
  // Nähe neu bestimmen
  if(WS.nearT<=0||!A){WS.nearT=.5;
    const near=[];
    if(A){
      for(const V of VESSELS){if(V===A)continue;
        if(V.body!==A.body){unload(V);continue}
        const p=vPos(V);const dd=Math.hypot(p.x-A.x,p.y-A.y);
        if(dd<PRANGE&&(WARPS[WS.wi]<=4||A.mode==='phys')){if(V.mode!=='phys'){if(V.mode==='rails'||V.mode==='landed')toPhys(V)}near.push(V)}
        else unload(V);
      }
    }
    WS.near=near;
  }
}
function unload(V){
  if(V.mode!=='phys')return;
  const B=vB(V),alt=vAlt(V);
  if(V.kind==='debris'){
    if(!(B.atm&&alt<B.ah)&&peri(vOrbit(V))>B.R+B.ah+B.hmax){/* Trümmer im Orbit: verschwinden lassen */}
    killVessel(V);return;
  }
  if(V.landed&&V.nc>0&&Math.hypot(V.vx,V.vy)<1){V.mode='landed';V.vx=V.vy=V.om=0;return}
  if(B.atm&&alt<B.ah){V.mode='bg';return}
  toRails(V);
}
/* =====================================================================
   7. KARRIERE: Spielstand, Crew, Forschung, Wissenschaft, Rekorde, Aufträge, Bergung
   ===================================================================== */
let S=null;                                      // Spielstand
const SANDBOX=()=>S&&S.mode==='frei';
function newState(mode){
  const s={v:1,mode,money:mode==='frei'?0:25000,sci:0,t:0,bld:{vab:1,pad:1,lab:1,mc:1,ts:1,ac:1},tech:['start'],
    designs:[],cur:{n:'Rakete 1',parts:[]},crew:[],vessels:[],act:null,con:{off:[],act:[],n:0},ms:{},subj:{},tips:{},
    st:{launch:0,lost:0,rec:0,crewLost:0,maxAlt:0,time:0},app:[],nid:1,flags:0,gerda:[],memo:[]};
  if(mode==='frei'){s.tech=TECH.map(t=>t.id);s.bld={vab:3,pad:3,lab:3,mc:3,ts:3,ac:3}}
  return s;
}
const bldV=k=>BLD[k].lv[(S.bld[k]||1)-1].v;
const hasTech=id=>S.tech.includes(id);
const partOK=t=>SANDBOX()||hasTech(P[t].tech);
crewById=id=>S&&S.crew.find(c=>c.id===id)||null;

/* ---------- Crew ---------- */
function newCrew(job,name){
  const r=R;
  const used=new Set(S.crew.map(c=>c.n.split(' ')[0]));
  let n=name;if(!n){const pool=FIRST.filter(x=>!used.has(x));n=(pool.length?pool:FIRST)[Math.floor(r()*(pool.length||FIRST.length))]}
  return{id:'c'+(S.nid++),n:n+' Knubbel',job:job||['pilot','ing','sci'][Math.floor(r()*3)],xp:0,st:'frei',
    face:{skin:Math.floor(r()*5),hair:Math.floor(r()*6),hc:Math.floor(r()*5),eye:Math.floor(r()*3),brave:r()}};
}
function initCrew(){
  if(S.crew.length)return;
  const a=newCrew('pilot','Jette'),b=newCrew('ing','Bodo'),c=newCrew('sci','Wilma');
  a.face={skin:1,hair:2,hc:3,eye:1,brave:.9};b.face={skin:2,hair:5,hc:0,eye:0,brave:.5};c.face={skin:0,hair:4,hc:2,eye:2,brave:.7};
  S.crew.push(a,b,c);
  refreshApplicants();
}
function refreshApplicants(){S.app=[newCrew('pilot'),newCrew('ing'),newCrew('sci')].map((c,i)=>{c.id='a'+i;return c})}
const crewAlive=()=>S.crew.filter(c=>c.st!=='tot'&&c.st!=='gestrandet');
const hireCost=()=>SANDBOX()?0:Math.round(10000+4000*crewAlive().length);
function hire(i){
  const a=S.app[i];if(!a)return'Nicht gefunden';
  if(crewAlive().length>=bldV('ac'))return'Das Astronautenzentrum ist voll – baue es aus.';
  const k=hireCost();if(S.money<k)return'Zu wenig Geld';
  S.money-=k;a.id='c'+(S.nid++);S.crew.push(a);S.app.splice(i,1,newCrew(['pilot','ing','sci'][i%3]));S.app[i].id='a'+i;
  return'';
}
function crewLost(id){
  const c=crewById(id);if(!c||c.st==='tot')return;
  c.st='tot';S.st.crewLost++;S.memo.push({n:c.n,t:S.t,job:c.job});
}

/* ---------- Forschung & Gebäude ---------- */
function techState(t){
  if(hasTech(t.id))return'done';
  if(!t.req.every(r=>hasTech(r)))return'locked';
  if(t.tier>bldV('lab'))return'lab';
  return S.sci>=t.k?'buy':'poor';
}
function buyTech(id){const t=TECHM[id];if(techState(t)!=='buy')return false;S.sci-=t.k;S.tech.push(id);return true}
function upgradeCost(k){const l=S.bld[k]||1;return l>=3?0:BLD[k].lv[l].k}
function upgrade(k){const c=upgradeCost(k);if(!c||S.money<c)return false;S.money-=c;S.bld[k]++;return true}

/* ---------- Wissenschaft ---------- */
function sciKey(sit){return sit==='wasser'?'boden':sit}
function subjOf(e,b,sit,bio){
  const E=EXP[e],B=BODIES[b],sk=sciKey(sit);
  if(!E.sit.includes(sk))return null;
  if(E.atm&&!B.atm)return null;
  const f=B.sci[sk];if(!f)return null;
  const useBio=E.bio.includes(sk);
  return{id:`${e}|${b}|${sk}|${useBio?bio:''}`,cap:E.v*f,n:`${E.n} ${sk==='boden'&&sit==='wasser'?'im Wasser':SITN[sk]} ${useBio&&bio?'('+bio+') ':''}bei ${B.n}`.replace(' bei',(sk==='boden'||sk==='tief'||sk==='hoch')?' auf':' bei')};
}
function subjLeft(s){return Math.max(0,s.cap-(S.subj[s.id]||0))}
function vBiome(V){const B=vB(V),a=Math.atan2(V.y,V.x);return biome(B,a,terH(B,a))}
/* Welche Experimente kann das Fahrzeug jetzt machen? */
function vExperiments(V){
  const out=[],sit=vSit(V),bio=vBiome(V),ci=ctlInfo(V);
  const add=(e,i,used)=>{const s=subjOf(e,V.body,sit,bio);out.push({e,i,s,used,have:s&&V.data.some(d=>d.id===s.id)})};
  if(V.d.crew.length)add('crew',-1,false);
  if(V.kind==='eva'){add('eva',-1,false);if(sciKey(sit)==='boden')add('probe',-1,false)}
  const seen=new Set();
  for(const i of V.d.exp){const q=V.parts[i],e=P[q.t].exp;if(seen.has(e)&&!q.used)continue;seen.add(e);add(e,i,!!q.used)}
  return out;
}
function runExperiment(V,x){
  if(!x.s)return'Hier nicht möglich';
  if(x.used)return'Schon benutzt';
  if(x.have)return'Diese Daten hast du schon an Bord';
  const ci=ctlInfo(V),f=ci.sci>=0?1+.1*(ci.sci+1):1;
  V.data.push({id:x.s.id,e:x.e,n:x.s.n,cap:x.s.cap,f});
  if(x.i>=0&&EXP[x.e].once)V.parts[x.i].used=1;
  return'';
}
/* Wert von Daten beim Bergen oder Senden */
function dataValue(d,send){const left=Math.max(0,d.cap-(S.subj[d.id]||0));return left*(send?EXP[d.e].tx:1)*(d.f||1)}
function creditData(d,send){
  const v=dataValue(d,send);
  S.subj[d.id]=(S.subj[d.id]||0)+v/(d.f||1);
  if(!SANDBOX())S.sci+=v;
  conEvent('sci',{id:d.id,e:d.e,b:d.id.split('|')[1],s:d.id.split('|')[2]});
  return v;
}
function canSend(V){
  if(!V.d.ant)return'Keine Antenne';
  if(ecTotal(V)<10)return'Zu wenig Strom';
  if(V.d.ant<2){let b=vB(V);while(b&&b.id!=='murmel'&&b.par&&b.par.id!=='sonne')b=b.par;if(!b||b.id!=='murmel')return'Zu weit weg – dafür braucht es eine Parabolantenne'}
  return'';
}
/* Forscher können Einmal-Experimente zurücksetzen */
function resetExp(V){const ci=ctlInfo(V);if(ci.sci<0)return 0;let n=0;for(const q of V.parts)if(q.used){q.used=0;n++}return n}

/* ---------- Rekorde (Erstleistungen) ---------- */
function msDef(k){
  const fix={start:['Erster Start',2000,1],h1:['1 km Höhe',1500,1],h5:['5 km Höhe',3000,2],h10:['10 km Höhe',5000,2],h20:['20 km Höhe',7000,3],
    space:['Im Weltraum!',12000,8],orbit:['Erste Umlaufbahn',20000,12],eva:['Erster Ausstieg',8000,5],dock:['Erstes Andocken',25000,15],
    rtc:['Booster gelandet',15000,8],station:['Erste Raumstation',40000,20],rover:['Erste Rover-Fahrt',15000,8],flag:['Erste Flagge',10000,6],
    rescue:['Erste Rettung',15000,6],murmel_ret:['Heil zurück',4000,2]};
  if(fix[k])return{n:fix[k][0],k:fix[k][1],s:fix[k][2]};
  const[b,w]=k.split('_'),B=BODIES[b];if(!B)return null;
  const x=B.xp,W={fly:['Vorbeiflug an '+B.n,7000,3],orbit:['Umlaufbahn um '+B.n,11000,5],land:['Landung auf '+B.n,16000,8],ret:['Zurück von '+B.n,20000,8]}[w];
  if(!W)return null;
  return{n:W[0],k:Math.round(W[1]*x/10)*10,s:Math.round(W[2]*x)};
}
function milestone(k){
  if(S.ms[k])return;const d=msDef(k);if(!d)return;
  S.ms[k]=S.t;
  if(!SANDBOX()){S.money+=d.k;S.sci+=d.s}
  emit('ms',{k,n:d.n,m:d.k,s:d.s});
}

/* ---------- Flug-Beobachtung: Geschichte des Fahrzeugs, Rekorde ---------- */
function track(V){
  if(!V||!V.d)return;
  const B=vB(V),alt=vAlt(V),sit=vSit(V),h=V.hist;
  if(V.kind==='debris')return;
  if(B.id==='murmel'){
    for(const[k,a]of[['h1',1e3],['h5',5e3],['h10',1e4],['h20',2e4]])if(alt>a)milestone(k);
    if(alt>B.ah){milestone('space');h.space=1}
    S.st.maxAlt=Math.max(S.st.maxAlt,alt);
  }
  if(B.id!=='sonne'&&B.id!=='murmel'){h[B.id+'_fly']=1;milestone(B.id+'_fly')}
  if(B.id==='sonne'){h.sonne_fly=1;milestone('sonne_fly')}
  // Umlaufbahn: Periapsis über Lufthülle/Gelände und nicht gelandet
  if(V.mode!=='landed'&&!V.landed){const o=vOrbit(V);if(o.e<1&&peri(o)>B.R+Math.max(B.ah,B.hmax+500)&&apo(o)<B.soi){h[B.id+'_orbit']=1;if(B.id==='murmel')milestone('orbit');else milestone(B.id+'_orbit')}}
  if((sit==='boden'||sit==='wasser')&&B.id!=='murmel'&&V.kind!=='flag'){h[B.id+'_land']=1;milestone(B.id+'_land')}
  if(V.kind==='eva'&&sit!=='boden'&&sit!=='wasser')milestone('eva');
  // Rover: Strecke auf fremden Körpern
  if(V.d.wheels.length&&V.landed&&V.nc>0){
    const a=Math.atan2(V.y,V.x);if(V.rv&&V.rv.b===B.id){const dd=Math.abs(wrapA(a-V.rv.a))*B.R;if(dd<200){V.rv.d+=dd}}
    V.rv={b:B.id,a,d:(V.rv&&V.rv.b===B.id?V.rv.d:0)};
    if(V.rv.d>1000&&B.id!=='murmel'){milestone('rover');conEvent('rover',{b:B.id,d:V.rv.d})}
  }
  conCheck(V);
}

/* ---------- Bergung auf Murmel ---------- */
function recoverInfo(V){
  const B=vB(V);if(B.id!=='murmel')return null;
  const a=Math.atan2(V.y,V.x),dist=Math.abs(wrapA(a-PAD_A))*B.R;
  const f=dist<2500?1:clamp(1-dist/(Math.PI*B.R)*.7,.3,.98);
  return{dist,f,val:Math.round(vValue(V)*f)};
}
function recover(V){
  const info=recoverInfo(V);if(!info)return null;
  const res={val:info.val,f:info.f,sci:0,xp:[],data:[],con:[]};
  if(!SANDBOX())S.money+=info.val;
  for(const d of V.data){const v=creditData(d,false);res.sci+=v;res.data.push([d.n,v])}
  V.data=[];
  // Erfahrung
  const xp=missionXP(V.hist);
  for(const id of vCrew(V)){const c=crewById(id);if(!c)continue;
    const l0=lvOf(c.xp);c.xp+=xp;c.st='frei';res.xp.push({n:c.n,xp,up:lvOf(c.xp)>l0,lv:lvOf(c.xp)});
    if(c.resc){delete c.resc;conEvent('rescue',{id:c.id});milestone('rescue')}}
  // Rückkehr-Rekorde
  for(const k in V.hist){const m=k.match(/^(\w+)_land$/);if(m)milestone(m[1]+'_ret')}
  if(V.hist.space||V.hist.murmel_orbit)milestone('murmel_ret');
  conEvent('recover',{V});
  S.st.rec++;
  killVessel(V);
  return res;
}
function missionXP(h){
  let x=0;
  for(const b of BLIST){
    const B=b;if(B.id==='murmel'){if(h.murmel_orbit)x+=1;else if(h.space)x+=.5;continue}
    if(h[B.id+'_land'])x+=B.xp*2.3;else if(h[B.id+'_orbit'])x+=B.xp*1.5;else if(h[B.id+'_fly'])x+=B.xp;
  }
  return Math.round(x*10)/10;
}

/* ---------- Aufträge ---------- */
const CON_N=4;
function reachable(){
  const ok=new Set(['murmel']);
  const m=k=>!!S.ms[k];
  if(m('orbit')){ok.add('knopf');ok.add('broesel')}
  if(m('knopf_orbit')||m('broesel_orbit')||m('knopf_land')){ok.add('dunstia');ok.add('rosto')}
  if(m('rosto_fly'))ok.add('kiesel');

function drawTerrain(c,B){

  const g=c.createLinearGradient(0,SP2.y,0,SP2.y+Math.max(60,1200*CAM.z));g.addColorStop(0,gd[0]);g.addColorStop(1,gd[1]);

  for(let i=0;i<pts.length;i+=3){if(i===0)c.moveTo(pts[i],pts[i+1]);else c.lineTo(pts[i],pts[i+1])}c.stroke();
  if(B.hmax>500){c.strokeStyle=gd[2];c.lineWidth=Math.max(3,Math.min(10,CAM.z));c.beginPath();let on=false;
    for(let i=0;i<pts.length;i+=3){const sn=pts[i+2]>B.hmax*.62;if(sn){if(!on){c.moveTo(pts[i],pts[i+1]);on=true}else c.lineTo(pts[i],pts[i+1])}else on=false}c.stroke()}

/* ---------- Partikel (Rauch, Feuer, Trümmer) ---------- */
const PTS=[];
function addP(o){if(PTS.length>900)PTS.splice(0,PTS.length-900);PTS.push(o)}
function stepParticles(dt){
  for(let i=PTS.length-1;i>=0;i--){const p=PTS[i];p.t+=dt;if(p.t>=p.life){PTS.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f}if(p.rot)p.a+=p.rot*dt}
}
function drawParticles(c){
  for(const p of PTS){
    w2s(p.x,p.y,SP);const k=p.t/p.life,s=(p.s+p.g*p.t)*CAM.z;
    if(SP.x<-s-50||SP.y<-s-50||SP.x>VW+s+50||SP.y>VH+s+50)continue;
    if(p.k==='deb'){c.save();c.translate(SP.x,SP.y);c.rotate(p.a);c.fillStyle=p.col;c.globalAlpha=1-k*k;const z=Math.max(2,p.s*CAM.z);c.fillRect(-z/2,-z/4,z,z/2);c.restore();c.globalAlpha=1;continue}
    const a=(p.a0||1)*(1-k);if(a<=.01)continue;
    c.globalAlpha=a;c.fillStyle=p.k==='fire'?(k<.3?'#fff2b0':k<.6?'#ffa23a':'#c8401e'):p.col||'#bbb';
    const rr2=Math.max(1,s);
    if(p.k==='smoke'&&rr2>6){c.globalAlpha=a*.55;c.beginPath();c.arc(SP.x,SP.y,rr2,0,TAU);c.fill();c.globalAlpha=a;c.beginPath();c.arc(SP.x,SP.y,rr2*.7,0,TAU);c.fill()}
    else{c.beginPath();c.arc(SP.x,SP.y,rr2,0,TAU);c.fill()}

function explode(x,y,size,col,vx,vy){

/* Bahn als Linie: von nu0 bis nu1 (Bahn o um Körper mit Lage bx,by im Kartensystem) */
function orbitPath(c,o,bx,by,nu0,nu1,tStart,store){
  const n=Math.max(24,Math.min(320,Math.ceil(Math.abs(nu1-nu0)/TAU*240))),q={};
  c.beginPath();
  let lastT=tStart,first=true;
  for(let i=0;i<=n;i++){
    const nu=nu0+(nu1-nu0)*i/n;stateNu(o,nu,q);
    m2s(bx+q.x,by+q.y,SP);
    if(first){c.moveTo(SP.x,SP.y);first=false}else c.lineTo(SP.x,SP.y);
    if(store){let tt=o.tp+meanFromNu(o,wrapA(nu))/o.n;if(o.e<1){const T=period(o);while(tt<lastT-1)tt+=T}lastT=tt;store.push(SP.x,SP.y,tt)}
  }

}
function nuAt(o,t){return nuFromMean(o,o.n*(t-o.tp))}

      c.strokeStyle='#ff5d5d';c.setLineDash([5,5]);orbitPath(c,o,bp.x,bp.y,nuA,ng,pt.t1,null);
      const q=stateNu(o,ng,{});m2s(bp.x+q.x,bp.y+q.y,SP);mark(c,SP.x,SP.y,'✕ Aufschlag','#ff5d5d')}
    else{const q=orbitAt(o,pt.t1,{});m2s(bp.x+q.x,bp.y+q.y,SP);mark(c,SP.x,SP.y,b.atm?'Eintritt':'Bodennähe','#ffb547')}

function audioUnlock(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(AC.destination);
      SFXG=AC.createGain();SFXG.gain.value=SET.sound?1:0;SFXG.connect(MASTER);
      MUSG=AC.createGain();MUSG.gain.value=SET.music?.32:0;MUSG.connect(MASTER);
      NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

}
function tone(f,d,type,vol,slide,delay,dest){

    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||SFXG);o.start(t);o.stop(t+d+.05);
  }catch(_){}
}

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(SFXG);s.start(t,Math.random());s.stop(t+d+.05);

}
const SFXT={};
function sfx(k,a){

    case'ignite':noise(.6,.25,'bandpass',400,1600);break;

function engineInit(){

    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;lp.Q.value=.6;
    const g=AC.createGain();g.gain.value=0;
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=42;const og=AC.createGain();og.gain.value=0;
    const crk=AC.createBiquadFilter();crk.type='bandpass';crk.frequency.value=2200;crk.Q.value=.8;const cg=AC.createGain();cg.gain.value=0;
    s.connect(lp);lp.connect(g);g.connect(SFXG);o.connect(og);og.connect(lp);s.connect(crk);crk.connect(cg);cg.connect(SFXG);
    s.start();o.start();ENG={g,lp,og,cg};
  }catch(_){}
}
function engineSound(level,srb,air){
  if(!ENG||!AC)return;
  if(!isFinite(level))level=0;if(!isFinite(air))air=0;
  const t=AC.currentTime,v=SET.sound?level:0;
  ENG.g.gain.setTargetAtTime(v*.55,t,.08);ENG.og.gain.setTargetAtTime(v*.25,t,.08);
  ENG.lp.frequency.setTargetAtTime(160+1400*clamp(air,0,1)+v*300,t,.2);
  ENG.cg.gain.setTargetAtTime(SET.sound&&srb?(.04+Math.random()*.08)*clamp(air+.2,0,1):0,t,.03);
}

function bbox(ps){let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const q of ps){const t=P[q.t];a=Math.min(a,q.x-t.w/2);b=Math.max(b,q.x+t.w/2);c=Math.min(c,q.y-t.h/2);d=Math.max(d,q.y+t.h/2)}return{x0:a,x1:b,y0:c,y1:d}}
function edFit(){
  const ps=D().parts;edLayout();
  if(!ps.length){E.cx=0;E.cy=0;E.z=48;return}
  const b=bbox(ps),bw=Math.max(2,b.x1-b.x0),bh=Math.max(2,b.y1-b.y0);
  E.z=clamp(Math.min((VW-110)/bw,(E.bot-E.top-40)/bh),3,70);E.cx=(b.x0+b.x1)/2;E.cy=(b.y0+b.y1)/2;
}
