let tapDn=null,tapT=0;
const UIEL=$('#ui');
UIEL.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');tapDn=b?{b,x:e.clientX,y:e.clientY,t:performance.now()}:null});
UIEL.addEventListener('pointercancel',()=>{tapDn=null});
UIEL.addEventListener('pointerup',e=>{
  const d=tapDn;tapDn=null;
  if(!d||e.pointerType==='mouse'||e.target.closest('[data-a]')!==d.b)return;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>14||performance.now()-d.t>900)return;
  tapT=performance.now();runAct(d.b);
});
document.addEventListener('click',e=>{if(performance.now()-tapT<450){e.stopPropagation();e.preventDefault()}},true);
UIEL.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)runAct(b)});

/* ---------- obere Leiste ---------- */
let TOPSIG='';
function updTop(){
  if(MODE!=='play'||!G)return;
  const tm=G.turn,sig=[tm,G.day,G.gold[tm],G.fh[tm],tmName(tm),income(G,tm)].join('|');
  if(sig===TOPSIG)return;TOPSIG=sig;
  document.documentElement.style.setProperty('--tc',tm===0?'var(--red)':'var(--blue)');
  drawPortrait($('#tPic'),G.fh[tm],tm);
  setTxt('#tName',tmName(tm));
  setTxt('#tSub',`Tag ${G.day} · ${FH[G.fh[tm]].n}`);
  $('#tGold').innerHTML=ICO.coin+`<span>${G.gold[tm]}</span><small>+${income(G,tm)}</small>`;
}

/* ---------- untere Leiste ---------- */
let BOTSIG='';
function unitLine(u,extra){
  const U=UNITS[u.k],t=TER[G.t[u.i]];
  const tags=[];
  if(u.tm===G.turn&&u.done&&!G.ai[u.tm])tags.push('fertig');
  if(G.cp[u.i]<CAPMAX)tags.push(`Einnahme ${CAPMAX-G.cp[u.i]}/${CAPMAX}`);
  return`<canvas class="px" data-k="${u.k}" data-tm="${u.tm}"></canvas><div class="it"><b>${U.n}</b>${hpBar(u.hp)} <small>${esc(tmName(u.tm))} · Bewegung ${mvPts(G,u)} · ${rngTxt(u,u.i)} · ${t.n} ${stars(t.def)}</small>${extra||''}</div>${tags.length?`<span class="tag">${tags.join(' · ')}</span>`:''}`;
}
function tileLine(i){
  const t=TER[G.t[i]],o=G.own[i];
  let s=`<div class="it"><b>${t.n}</b> <small>Deckung ${stars(t.def)}`;
  if(G.t[i]==='~')s+=' · unpassierbar';
  if(G.t[i]==='M')s+=' · nur zu Fuß · Bogenschützen schießen weiter';
  if(G.t[i]==='F')s+=' · versteckt Einheiten im Nebel';
  if(t.bld)s+=` · ${o<0?'neutral':'gehört '+esc(tmName(o))} · ${t.inc} Gold pro Zug${t.prod?' · bildet Truppen aus':''}`;
  return s+'</small></div>';
}
function teamLine(){
  const tm=G.turn,n=unitCount(G,tm),ready=G.units.filter(u=>u.tm===tm&&!u.done).length;
  return`<canvas class="px" data-fh="${G.fh[tm]}" data-tm="${tm}"></canvas><div class="it"><b>${esc(tmName(tm))}</b> <small>${n} Einheiten · ${ready} bereit · ${bldCount(G,tm)} Gebäude · +${income(G,tm)} Gold pro Zug</small></div>`;
}
function forecastHtml(s,d){
  const f=forecast(G,s,s.i,d);
  return`<div class="fc"><div><canvas class="px" data-k="${s.k}" data-tm="${s.tm}"></canvas><b>${UNITS[s.k].n}</b> → ${UNITS[d.k].n} <span class="dmg">−${fmtLp(f.dm)} LP</span>${hpBar(d.hp,d.hp-f.dm)}${f.kill?' <span class="ko">besiegt</span>':''}</div>`+
    `<div><canvas class="px" data-k="${d.k}" data-tm="${d.tm}" data-fl="1"></canvas>${f.kill?'<span>Kein Gegenschlag</span>':canCounter(G,d,s,s.i)?`<b>Gegenschlag</b> <span class="dmg">−${fmtLp(f.ct)} LP</span>${hpBar(s.hp,s.hp-f.ct)}${f.die?' <span class="ko">besiegt</span>':''}`:'<span>Kein Gegenschlag</span>'}</div></div>`;
}
function updBot(){
  if(MODE!=='play'||!G)return;
  let info='',btns='';
  const st=UI.st,me=G.turn,s=UI.sel!=null?unitById(G,UI.sel):null;
  if(G.over){
    info=`<canvas class="px" data-fh="${G.fh[G.over.win]}" data-tm="${G.over.win}"></canvas><div class="it"><b>Die Partie ist entschieden</b></div>`;
  }else if(st==='ai'||!humanTurn()){
    const ui=UI.info>=0?unitAt(G,UI.info):null;
    info=ui&&seen(ui)?unitLine(ui):`<canvas class="px" data-fh="${G.fh[me]}" data-tm="${me}"></canvas><div class="think">${esc(tmName(me))} überlegt <i></i><i></i><i></i></div>`;
    btns=`<button data-a="fast" class="${S.fast?'grn':''}">${S.fast?'Schnell ✓':'Schneller zeigen'}</button>`;
  }else if(st==='sel'&&s){
    info=unitLine(s,'');
    btns=`<button data-a="cancel">Abbrechen</button>`;
  }else if(st==='act'&&s){
    info=unitLine(s);
    const a=UI.acts;
    if(a.atk.length)btns+=`<button class="red" data-a="atk">${ICO.sword}Angreifen</button>`;
    if(a.cap)btns+=`<button class="acc" data-a="cap">${ICO.flag}Einnehmen</button>`;
    if(a.heal.length)btns+=`<button class="grn" data-a="heal">${ICO.heal}Heilen</button>`;
    btns+=`<button data-a="wait">${ICO.wait}Warten</button><button class="sm" data-a="undo" aria-label="Zurück">${ICO.back}</button>`;
  }else if(st==='target'&&s){
    const d=UI.tg!=null?unitById(G,UI.tg):null;
    info=d?forecastHtml(s,d):`<div class="it"><b>Ziel wählen</b><small>Tippe einen rot markierten Gegner an.</small></div>`;
    btns=`<button class="red" data-a="fire" ${d?'':'disabled'}>${ICO.sword}Angreifen!</button><button class="sm" data-a="back">${ICO.back}</button>`;
  }else if(st==='heal'&&s){
    info=`<div class="it"><b>Wen heilen?</b><small>Tippe eine grün markierte Einheit an (+${fmtLp(healAmt(G,s))} LP).</small></div>`;
    btns=`<button class="sm" data-a="back">${ICO.back}</button>`;
  }else{
    const iu=UI.insp!=null?unitById(G,UI.insp):UI.info>=0?unitAt(G,UI.info):null;
    if(iu&&seen(iu))info=unitLine(iu,UI.insp!=null?'<small style="color:#ffb08a">Orange: dorthin kann sie ziehen · Rot: dort kann sie angreifen</small>':'');
    else if(UI.info>=0)info=tileLine(UI.info);
    else info=teamLine();
    const f=G.fh[me],need=FH[f].need,pc=Math.min(100,G.mut[me]/need*100),full=pc>=100;
    btns=`<button id="bPow" data-a="power" class="${full?'full':''}"><div class="fill" style="width:${pc.toFixed(0)}%"></div><span>${ICO.star}</span><span>${FH[f].pw}</span></button>`;
    const ready=G.units.filter(u=>u.tm===me&&!u.done).length;
    btns+=`<button class="acc ${ENDARM>performance.now()?'arm':''}" data-a="end">${ENDARM>performance.now()?`Wirklich? (${ready} bereit)`:'Zug beenden'}${ICO.end}</button>`;
  }
  if(BUSY&&st!=='ai')btns=btns.replace(/<button/g,'<button disabled');
  const sig=info+'#'+btns;
  if(sig===BOTSIG)return;BOTSIG=sig;
  $('#info').innerHTML=info;$('#btns').innerHTML=btns;paintIcons($('#bot'));
}
function updAll(){updTop();updBot();updBanner()}

/* ---------- Knöpfe im Spiel ---------- */
ACT.cancel=()=>clearSel();
ACT.atk=()=>startTarget(null);
ACT.fire=()=>{if(UI.st==='target'&&UI.tg!=null)fire()};
ACT.back=()=>{UI.st='act';UI.tg=null;UI.tgts=null;sfx('click');updAll()};
ACT.undo=()=>{sfx('click');undoMove()};
ACT.wait=()=>{const s=unitById(G,UI.sel);if(!s)return;s.done=true;sfx('click');finishAction()};
ACT.cap=async()=>{const s=unitById(G,UI.sel);if(!s||!canCapture(G,s))return;BUSY=true;UI.st='busy';updBot();hintDone('cap');await doCapture(s);BUSY=false;finishAction()};
ACT.heal=()=>{const s=unitById(G,UI.sel);if(!s)return;UI.tgts=UI.acts.heal.slice();if(UI.tgts.length===1)return healFlow(UI.tgts[0]);UI.st='heal';sfx('click');updAll()};
ACT.fast=()=>{S.fast=!S.fast;saveNow();BOTSIG='';updBot()};
ACT.end=()=>{
  if(!humanTurn()||BUSY)return;
  const ready=G.units.filter(u=>u.tm===G.turn&&!u.done).length;
  if(ready&&ENDARM<performance.now()){ENDARM=performance.now()+2600;sfx('click');updBot();setTimeout(()=>updBot(),2700);return}
  hintDone('end');endTurnFlow();
};
ACT.power=()=>{
  if(!humanTurn()||BUSY)return;
  const tm=G.turn,f=G.fh[tm],F=FH[f],full=powerReady(G,tm),pc=Math.min(100,Math.floor(G.mut[tm]/F.need*100));
  openSheet('power',F.pw,`<div class="row"><canvas class="px" data-fh="${f}" data-tm="${tm}"></canvas><div class="rt"><b>${F.n}</b><small>${F.t}</small></div></div>
    <p><b>Fähigkeit „${F.pw}“:</b> ${F.pwt}</p><p><b>Dauerhaft:</b> ${F.pass}</p>
    <p>Mut ${pc} %<div class="mut"><i style="width:${pc}%"></i></div></p>
    ${full?`<div class="btns"><button class="btn acc big" data-a="usepow">${F.pw} einsetzen</button></div>`:'<p>Der Mut steigt, wenn deine Truppen kämpfen – mit jedem Treffer, den sie austeilen oder einstecken.</p>'}`);
};
ACT.usepow=async()=>{closeSheet();if(!humanTurn()||BUSY||!powerReady(G,G.turn))return;BUSY=true;UI=UI0();UI.st='busy';updBot();hintDone('power');await doPower();BUSY=false;finishAction()};
ACT.ready=()=>{if(!$('#pass').classList.contains('on'))return;hidePass()};
ACT.rematch=()=>{const set=Object.assign({},S.set);if(G&&set.first!=='r')set.first=String(1-G.first);newGame(set)};
ACT.tohome=()=>goHome();

/* ---------- Truppen ausbilden ---------- */
function openRecruit(i){
  RECI=i;const tm=G.turn,gold=G.gold[tm],n=unitCount(G,tm),full=n>=UNITMAX;
  let h=`<p>${ICO.coin.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"')} <b>${gold} Gold</b> · Einheiten ${n}/${UNITMAX}${full?' – mehr geht nicht':''}. Neue Truppen ziehen erst im nächsten Zug.</p>`;
  for(const k of UORD){
    const U=UNITS[k],ok=!full&&gold>=U.cost;
    h+=`<button class="row" data-a="buy" data-v="${k}" ${ok?'':'disabled'}><canvas class="px" data-k="${k}" data-tm="${tm}"></canvas><div class="rt"><b>${U.n}</b><small>Bewegung ${U.mv} · ${U.rng?(U.rng[0]===U.rng[1]?'Reichweite '+U.rng[0]:'Reichweite '+U.rng[0]+'–'+U.rng[1]):'kämpft nicht'} · ${MTN[U.mt]}</small><small>${U.info}</small></div><div class="rv">${ICO.coin}${U.cost}</div></button>`;
  }
  openSheet('recruit',G.t[i]==='C'?'Burg – Truppen ausbilden':G.t[i]==='K'?'Kaserne – Truppen ausbilden':'Dorf – Söldner anwerben',h);
  hintDone('buy');
}
ACT.buy=async k=>{
  const i=RECI;closeSheet();if(!humanTurn()||BUSY||!canRecruitAt(G,G.turn,i))return;
  BUSY=true;UI=UI0();UI.st='busy';updBot();
  await doRecruit(i,k);
  BUSY=false;finishAction();
};

/* ---------- Tipps ---------- */
const TIPS={
  sel:'Tippe eine deiner Einheiten an.',
  move:'Blau: hierhin kann sie ziehen. Rot: dort kann sie angreifen. Tippe ein Feld oder direkt einen Gegner an.',
  act:'Wähle unten eine Aktion. Mit ↶ machst du den Zug rückgängig.',
  cap:'Stell Bauern oder Speerträger auf Dörfer und tippe „Einnehmen“ – Dörfer bringen Gold und heilen.',
  buy:'Tippe deine leuchtende Burg an, um neue Truppen auszubilden.',
  end:'Alle Einheiten sind fertig – tippe auf „Zug beenden“.',
  enemy:'Tippe einen Gegner an, um zu sehen, wohin er ziehen und wo er angreifen kann.',
  power:'Der Mut deines Feldherrn ist voll! Tippe auf die leuchtende Fähigkeit.',
};
function hintDone(k){if(S&&S.hints&&!S.hints[k]){S.hints[k]=1;updBanner()}}
function curHint(){
  if(!S.tips||MODE!=='play'||!humanTurn()||BUSY||sheetOpen()||$('#pass').classList.contains('on'))return null;
  const H=S.hints,tm=G.turn;
  if(UI.st==='sel'&&!H.move)return'move';
  if(UI.st==='act'){if(UI.acts&&UI.acts.cap&&!H.cap)return'cap';return null}
  if(UI.st!=='idle')return null;
  if(powerReady(G,tm)&&!H.power)return'power';
  const ready=G.units.some(u=>u.tm===tm&&!u.done);
  if(ready&&!H.sel)return'sel';
  if(!H.buy&&G.gold[tm]>=100&&G.t.some((c,i)=>canRecruitAt(G,tm,i)))return'buy';
  if(!ready&&!H.end)return'end';
  if(G.day>=3&&!H.enemy&&G.units.some(u=>u.tm!==tm&&seen(u)))return'enemy';
  return null;
}
let BANSIG='';
function updBanner(){
  const k=S&&curHint(),sig=k||'';
  if(sig===BANSIG)return;BANSIG=sig;
  $('#banner').classList.toggle('on',!!k);if(k)$('#bText').textContent=TIPS[k];
  layout();                              // die Karte macht dem Tipp Platz
}

/* ---------- Startbildschirm ---------- */
function updHome(){
  const b=$('#bCont'),m=S.match;
  b.classList.toggle('on',!!m);
  if(m){const M=MAPS.find(x=>x.id===m.map);b.innerHTML=`Partie fortsetzen <small>${M?M.n:''} · Tag ${m.day}</small>`}
  // Bilanz der letzten Partien zu zweit nach Namen
  const w={};for(const h of S.hist){const n=h.names[h.win];w[n]=(w[n]||0)+1}
  const top=Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $('#hStats').textContent=S.hist.length?`${S.hist.length} ${S.hist.length===1?'Partie':'Partien'} gespielt · Siege: ${top.map(([n,c])=>n+' '+c).join(' · ')}`:'';
}
function makeDemo(){
  const g=newMatch({map:'feld',fh:['grimbart','rosalind'],first:0});
  const put=(k,tm,x,y)=>{const i=y*g.w+x;if(!unitAt(g,i)&&MOVE[UNITS[k].mt][g.t[i]])addUnit(g,k,tm,i)};
  put('ritter',0,4,9);put('katapult',0,6,11);put('bogen',0,3,8);put('moench',0,5,10);put('reiter',0,8,8);
  put('ritter',1,5,4);put('bogen',1,6,5);put('reiter',1,1,5);put('katapult',1,3,2);put('speer',1,7,4);
  for(const u of g.units)u.done=false;
  DEMO=g;
}

function fhPicker(tm,cur,allowRand){
  let h=`<div class="fhs" style="--c:${tm?'var(--blue)':'var(--red)'}">`;
  for(const f of FHORD)h+=`<button data-a="sfh" data-v="${tm}:${f}" class="${cur===f?'on':''}" aria-label="${FH[f].n}"><canvas class="px" data-fh="${f}" data-tm="${tm}"></canvas></button>`;
  if(allowRand)h+=`<button data-a="sfh" data-v="${tm}:zufall" class="${cur==='zufall'?'on':''}" style="font-size:24px;font-weight:900">?</button>`;
  h+='</div>';
  const F=FH[cur];
  h+=F?`<div class="fhd" style="--c:${tm?'var(--blue)':'var(--red)'}"><b>${F.n}</b> · ${F.t}<br>${F.pass}<br><i>${F.pw}:</i> ${F.pwt}</div>`:`<div class="fhd" style="--c:${tm?'var(--blue)':'var(--red)'}"><b>Zufall</b> – der Feldherr wird beim Start ausgelost.</div>`;
  return h;
}

  let h=`<h4>Mitspieler</h4><div class="seg"><button data-a="smode" data-v="2p" class="${!ai?'on':''}">Zu zweit</button><button data-a="smode" data-v="ai" class="${ai?'on':''}">Gegen den Computer</button></div>`;
  h+=`<h4>Namen</h4><div class="names"><label style="--c:var(--red);color:#ffb0a4">${ai?'Dein Name':'Rot'}<input id="nm0" maxlength="12" autocomplete="off" placeholder="${ai?'Du':'Rot'}" value="${esc(s.names[0]||'')}"></label>`+
    (ai?'':`<label style="--c:var(--blue);color:#a8ccff">Blau<input id="nm1" maxlength="12" autocomplete="off" placeholder="Blau" value="${esc(s.names[1]||'')}"></label>`)+'</div>';
  h+='<h4>Karte</h4><div class="maps">'+MAPS.map(M=>`<button data-a="smap" data-v="${M.id}" class="${s.map===M.id?'on':''}"><canvas data-map="${M.id}"></canvas><b>${M.n}</b><small>${M.w} × ${M.top.length*2} · ${M.d}</small></button>`).join('')+'</div>';

  h+=`<div style="font-size:13px;color:var(--dim);margin:10px 2px 6px">Wer beginnt?</div><div class="seg">`+
    [['0',ai?'Du':'Rot'],['1',ai?'Computer':'Blau'],['r','Zufall']].map(([v,n])=>`<button data-a="sfirst" data-v="${v}" class="${s.first===v?'on':''}">${n}</button>`).join('')+'</div>';

function openMenu(tab,keep){
  tab=tab||'spiel';let h='';
  if(tab==='spiel'){
    h='<div class="side">'+[0,1].map(tm=>{
      const F=FH[G.fh[tm]],pc=Math.min(100,Math.floor(G.mut[tm]/F.need*100));
      return`<div style="--c:${tm?'var(--blue)':'var(--red)'}"><b>${esc(tmName(tm))}</b>${F.n}<br>${G.gold[tm]} Gold · +${income(G,tm)}<br>${unitCount(G,tm)} Einheiten · ${bldCount(G,tm)} Gebäude<br>Mut ${pc} %<div class="mut"><i style="width:${pc}%"></i></div></div>`}).join('')+'</div>';
    const M=MAPS.find(m=>m.id===G.map);
    h+=`<p>${M.n} · Tag ${G.day}${G.fog?' · Nebel des Krieges':''}</p>`;
    h+=`<div class="btns"><button class="btn" data-a="tohome">Zum Hauptmenü</button>${humanTurn()?'<button class="btn red" data-a="giveup">Aufgeben</button>':''}</div><p style="font-size:12.5px">Die Partie wird automatisch gespeichert und kann im Hauptmenü fortgesetzt werden.</p>`;
  }

  if(tab==='hilfe')h=helpHtml();
  if(tab==='opt')h=optsHtml(true);
  openSheet('menu','Menü',h,{tabs:[['spiel','Partie'],['truppen','Truppen'],['hilfe','Anleitung'],['opt','Optionen']],tab,keepScroll:keep});
}
ACT.menu=()=>{if(MODE==='play')openMenu('spiel')};

function troopsHtml(){
  let h='<p>Grundschaden in Prozent der Lebenspunkte bei vollen LP auf freiem Feld – Deckung und LP verringern ihn.</p>';
  h+='<table class="tbl"><tr><th>Angreifer</th>'+UORD.filter(k=>k).map(k=>`<th><canvas class="px" data-k="${k}" data-tm="1" data-fl="1" style="width:26px;height:26px"></canvas></th>`).join('')+'</tr>';
  for(const a of UORD){if(!DMG[a])continue;h+=`<tr><td><canvas class="px" data-k="${a}" data-tm="0" style="width:26px;height:26px;vertical-align:middle"></canvas></td>`+UORD.map(d=>{const v=DMG[a][d];return`<td style="color:${v>=70?'#8ff0a8':v<=30?'#ff9a8a':'inherit'}">${v}</td>`}).join('')+'</tr>'}
  h+='</table><h4>Einheiten</h4>';
  for(const k of UORD){const U=UNITS[k];h+=`<div class="row"><canvas class="px" data-k="${k}" data-tm="0"></canvas><div class="rt"><b>${U.n} · ${U.cost} Gold</b><small>Bewegung ${U.mv} · ${U.rng?(U.rng[0]===U.rng[1]?'Reichweite '+U.rng[0]:'Reichweite '+U.rng[0]+'–'+U.rng[1]):'kämpft nicht'} · ${MTN[U.mt]} · Sicht ${U.vis}</small><small>${U.info}</small></div></div>`}
  return h;
}

  const t=(k,n,sub)=>`<div class="tog"><div>${n}${sub?`<small>${sub}</small>`:''}</div><button class="sw ${S[k]?'on':''}" data-a="opt" data-v="${k}" aria-label="${n}"></button></div>`;

ACT.opt=v=>{S[v]=!S[v];if(v==='rot'&&MODE==='play')applyView();saveNow();BANSIG='';updAll();if(SH.kind==='menu')openMenu('opt',true);else openSheet('opts','Einstellungen',optsHtml(false),{keepScroll:true})};
ACT.resettips=()=>{S.hints={};S.tips=true;saveNow();BANSIG='';toast('Die Tipps erscheinen wieder.','good');if(SH.kind==='menu')openMenu('opt',true);else openSheet('opts','Einstellungen',optsHtml(false),{keepScroll:true})};

/* =====================================================================
   7. SPEICHERN, CLOUD, SELBST-UPDATE
   ===================================================================== */
const KEY='feldherren-1';
const BUILD='2026-10-20-1';
function newSettings(){return{v:1,sound:true,vib:true,fast:false,rot:true,grid:true,tips:true,hints:{},hist:[],
  set:{mode:'2p',names:['',''],map:'au',fh:['rosalind','grimbart'],fog:false,first:'0'},match:null,savedAt:0}}
function validMatch(m){return m&&m.v===1&&Array.isArray(m.units)&&Array.isArray(m.t)&&MAPS.some(x=>x.id===m.map)&&m.t.length===m.w*m.h}
function migrate(o){
  const d=newSettings();
  if(!o||o.v!==1)return d;
  for(const k in d)if(o[k]===undefined)o[k]=d[k];
  for(const k in d.set)if(o.set[k]===undefined)o.set[k]=d.set[k];
  if(!Array.isArray(o.hist))o.hist=[];
  if(!o.hints||typeof o.hints!=='object')o.hints={};
  if(!MAPS.some(m=>m.id===o.set.map))o.set.map='au';
  if(o.match&&!validMatch(o.match))o.match=null;
  if(o.match&&!o.match.merc)o.match.merc=[0,0];
  return o;
}
function saveNow(){
  if(!S)return;
  if(G&&MODE==='play')S.match=G.over?null:G;
  S.savedAt=Date.now();
  const js=JSON.stringify(S);
  try{localStorage.setItem(KEY,js)}catch(_){}
  pushCloud(js);
  return js;
}
/* Selbst-Update: vergleicht BUILD mit der Datei auf dem Server und lädt neu – nur im Hauptmenü */
let updating=false;
async function checkUpdate(){
  if(updating||window.claude||!/^https?:$/.test(location.protocol))return;
  if(MODE!=='home'||sheetOpen())return;
  try{
    const r=await fetch('feldherren.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('fh-upd')}catch(_){}
    if(tried===m[1])return;
    try{sessionStorage.setItem('fh-upd',m[1])}catch(_){}
    updating=true;saveNow();toast('Neue Version wird geladen …','',3000);
    setTimeout(()=>location.replace('feldherren.html?v='+encodeURIComponent(m[1])),700);
  }catch(_){}
}
/* Speichern im Konto, wenn das Spiel als Claude-Artifact läuft */
let DB=null,UID=null,cloudBusy=false,cloudAgain=null;
async function pushCloud(js){
  if(!DB||!UID)return;
  if(cloudBusy){cloudAgain=js;return}
  cloudBusy=true;
  try{await DB.doc('data/users/'+UID+'/feldherren').set({v:1,savedAt:S.savedAt,json:js})}catch(_){}
  cloudBusy=false;
  if(cloudAgain){const j=cloudAgain;cloudAgain=null;pushCloud(j)}
}
async function connectCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    DB=db;UID=uid;
    const snap=await db.doc('data/users/'+uid+'/feldherren').get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.savedAt||0)>(S.savedAt||0)+1500&&MODE==='home'){
        const o=JSON.parse(d.json);
        if(o&&o.v===1){S=migrate(o);updHome();toast('Spielstand aus deinem Konto geladen.','good')}
      }
    }
  }catch(_){}
}

/* =====================================================================
   8. HAUPTSCHLEIFE & START
   ===================================================================== */
/* Zeichenfläche an ihre echte Größe anpassen – nur wenn sie sich wirklich geändert hat */
function fitCanvas(){
  const r=cv.getBoundingClientRect(),w=Math.round(r.width)||innerWidth,h=Math.round(r.height)||innerHeight,d=Math.min(3,devicePixelRatio||1);
  if(w===VW&&h===VH&&d===DPR)return false;
  VW=w;VH=h;DPR=d;
  const cw=Math.round(VW*DPR),ch=Math.round(VH*DPR);
  if(cv.width!==cw)cv.width=cw;
  if(cv.height!==ch)cv.height=ch;
  return true;
}
/* Home-Bildschirm-App: iOS meldet dort eine schwankende, zu kleine Fensterhöhe. Deshalb richtet sich das
   Spiel fest nach der Bildschirmhöhe (hängt nur von der Ausrichtung ab – keine Rückkopplung, kein Wackeln). */
let FULLPX=-1;
function applyGap(){
  const app=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
  const portrait=innerHeight>=innerWidth,full=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
  const v=app&&full>0?full:0;
  GAPPX=v?Math.max(0,full-innerHeight):0;
  if(v===FULLPX)return;
  FULLPX=v;
  if(v)document.documentElement.style.setProperty('--vh',v+'px');else document.documentElement.style.removeProperty('--vh');
}
function resize(){applyGap();fitCanvas();layout()}
addEventListener('resize',resize);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
addEventListener('pageshow',()=>setTimeout(resize,100));
// Die Seite darf nie verrutschen: iOS darf Wischbewegungen nicht zum Scrollen nutzen (außer in Listen und Textfeldern)
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#sheetBody,input'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else checkUpdate()});
addEventListener('pagehide',()=>saveNow());

let last=performance.now(),slowT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>.1)dt=.1;if(dt<0)dt=0;
  TIME+=dt;
  stepTweens(dt);
  for(const r of RS.values())if(r.flash>0)r.flash=Math.max(0,r.flash-dt);
  stepParticles(dt);
  for(const[el,t]of pulseEl){const r=t-dt;if(r<=0){el.classList.remove('pop');pulseEl.delete(el)}else pulseEl.set(el,r)}
  render(dt);
  slowT-=dt;if(slowT<=0){slowT=.5;resize();if(MODE==='play'){updTop();updBot();updBanner()}}   // iOS ändert die Fensterhöhe teils ohne resize-Ereignis
}

function boot(){
  let o=null;
  try{const s=localStorage.getItem(KEY);if(s)o=JSON.parse(s)}catch(_){o=null}
  S=migrate(o);
  makeDemo();
  resize();goHome();resize();
  $('#boot').remove();
  last=performance.now();
  requestAnimationFrame(frame);
  connectCloud();
  setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60*1000);
}
boot();
