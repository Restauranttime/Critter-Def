/* ---------- Bild zeichnen ---------- */
let SEL=null,HOVER=null,FLASH=null;
function render(dt){
  TIME+=dt;
  const ts=cam.z*DPR,ox=(VW/2-cam.x*cam.z)*DPR,oy=(VH/2-cam.y*cam.z)*DPR,CW=cv.width,CHh=cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0d1115';ctx.fillRect(0,0,CW,CHh);
  const x0=Math.max(0,Math.floor(-ox/ts)),y0=Math.max(0,Math.floor(-oy/ts));
  const x1=Math.min(W-1,Math.floor((CW-ox)/ts)),y1=Math.min(H-1,Math.floor((CHh-oy)/ts));
  if(x1<x0||y1<y0)return;
  const TX=x=>ox+x*ts,TY=y=>oy+y*ts;

  // Gelände: nur sichtbare Blöcke
  ctx.imageSmoothingEnabled=true;
  const nc=W/CH;
  for(let cy=Math.floor(y0/CH);cy<=Math.floor(y1/CH);cy++)for(let cx=Math.floor(x0/CH);cx<=Math.floor(x1/CH);cx++){
    const a=Math.round(TX(cx*CH)),b=Math.round(TY(cy*CH)),a2=Math.round(TX((cx+1)*CH)),b2=Math.round(TY((cy+1)*CH));
    ctx.drawImage(CHUNKS[cy*nc+cx],a,b,a2-a,b2-b);
  }
  // feines Raster, damit man Kacheln gut erkennt
  if(ts>=14){
    ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=Math.max(1,ts*.025);ctx.beginPath();
    for(let x=x0;x<=x1+1;x++){const px=Math.round(TX(x))+.5;ctx.moveTo(px,TY(y0));ctx.lineTo(px,TY(y1+1))}
    for(let y=y0;y<=y1+1;y++){const py=Math.round(TY(y))+.5;ctx.moveTo(TX(x0),py);ctx.lineTo(TX(x1+1),py)}
    ctx.stroke();
  }
  // Erz: pro sichtbarer Kachel ein scharfes Sprite
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const r=RES[y*W+x];if(!r||r===WATER||G[y*W+x])continue;   // unter Gebäuden nicht nötig
    ctx.drawImage(oreSpr(r,(hash2(x,y,S.seed)*6)|0,ts),TX(x),TY(y),ts,ts);
  }
  // Kartenrand
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=Math.max(2,ts*.08);ctx.strokeRect(TX(0),TY(0),W*ts,H*ts);

  // sichtbare Gebäude einsammeln
  const belts=[],blds=[],poles=[],pipes=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const e=G[y*W+x];if(!e)continue;
    const k=BLD[e.t].kind;
    if(k==='belt')belts.push(e);else if(k==='pole')poles.push(e);else if(k==='pipe')pipes.push(e);else blds.push(e);
  }

  // Stromabdeckung zeigen, wenn Masten oder Strom-Gebäude gewählt sind
  const showCover=(tool&&(BLD[tool].kind==='pole'||ELECTRIC(tool)||BLD[tool].kind==='steam'||BLD[tool].kind==='solar'))||(SEL&&BLD[SEL.t].kind==='pole');
  if(showCover){
    ctx.fillStyle='rgba(90,168,255,.1)';ctx.strokeStyle='rgba(90,168,255,.35)';ctx.lineWidth=Math.max(1,ts*.03);
    for(const p of L.pole){const sp=BLD[p.t].sup;if(p.x<x0-sp-1||p.x>x1+sp+1||p.y<y0-sp-1||p.y>y1+sp+1)continue;ctx.fillRect(TX(p.x-sp),TY(p.y-sp),ts*(2*sp+1),ts*(2*sp+1));ctx.strokeRect(TX(p.x-sp),TY(p.y-sp),ts*(2*sp+1),ts*(2*sp+1))}
  }

  // Bänder
  // Sprites werden pro Bild nur einmal nachgeschlagen (spart bei großen Fabriken viel Zeit)
  const bs=bucket(ts),beltC=[],itemC={},bldC={};
  const iSpr=(id,px)=>itemC[id]||(itemC[id]=itemSpr(id,px));
  for(const b of belts){
    const tier=BLD[b.t].tier,turn=(b.d-b._in+4)%4,key=tier*16+turn*4+b.d;
    let s=beltC[key];
    if(!s){
      const sp=BLD[b.t].speed,per=turn?1/3:.25,fr=Math.floor(((TIME*sp)%per)/per*8)%8;
      s=beltC[key]=sprite('L'+tier+turn+fr+b.d,bs,g=>{g.translate(.5,.5);g.rotate(b.d*Math.PI/2);g.translate(-.5,-.5);beltArt(g,tier,turn,fr)});
    }
    ctx.drawImage(s,TX(b.x),TY(b.y),ts,ts);
  }
  // Wasserleitungen mit Füllstand
  for(const b of pipes){
    const tier=BLD[b.t].tier,turn=(b.d-b._in+4)%4,key='P'+tier+turn+b.d;
    ctx.drawImage(bldC[key]||(bldC[key]=sprite(key,bs,g=>{g.translate(.5,.5);g.rotate(b.d*Math.PI/2);g.translate(-.5,-.5);pipeArt(g,tier,turn)})),TX(b.x),TY(b.y),ts,ts);
    if(b.fl>.05||b._mv){
      ctx.save();ctx.translate(TX(b.x),TY(b.y));ctx.scale(ts,ts);ctx.translate(.5,.5);ctx.rotate(b.d*Math.PI/2);ctx.translate(-.5,-.5);
      pipePath(ctx,turn);ctx.lineCap='butt';ctx.strokeStyle=`rgba(${FLC[b.ft]||FLC.wasser},${(.5+.45*Math.min(1,b.fl/FCAP.pipe)).toFixed(2)})`;ctx.lineWidth=.12;ctx.stroke();
      ctx.restore();
    }
  }
  // Items auf Bändern
  const is=ts*.36,lod=ts<26;                  // weit herausgezoomt: Items als einfache Farbpunkte
  for(const b of belts){
    if(!b.it.length)continue;
    const turn=(b.d-b._in+4)%4;
    for(const[item,p]of b.it){
      const[u,v]=beltPos(turn,p),[rx,ry]=rotPt(u,v,b.d),x=TX(b.x+rx),y=TY(b.y+ry);
      if(lod){ctx.fillStyle=ITEMS[item].c||'#ddd';ctx.fillRect(x-is*.35,y-is*.35,is*.7,is*.7)}
      else ctx.drawImage(iSpr(item,is),x-is/2,y-is/2,is,is);
    }
  }

  // Gebäude + bewegte Details
  for(const e of blds){
    const X=TX(e.x),Y=TY(e.y),k=BLD[e.t].kind;
    const bk=e.t+e.d,tun=k==='ug'||k==='pug';                       // Tunnel: nur das Band/Rohr, der Deckel kommt je nach Eingang/Ausgang dazu
    ctx.drawImage(bldC[bk]||(bldC[bk]=tun?sprite('U'+bk,bs,g=>{g.translate(.5,.5);g.rotate(e.d*Math.PI/2);g.translate(-.5,-.5);if(k==='pug')pipeArt(g,1,0);else beltArt(g,BLD[e.t].tier,0,0)}):bldSpr(e.t,e.d,ts)),X,Y,ts,ts);
    if(k==='merge'){const it=e.q.find(Boolean);if(it){const q=ts*.3;ctx.drawImage(iSpr(it,q),X+ts*.5-q/2,Y+ts*.36-q/2,q,q)}}
    else if(k==='split'){if(e.h){const q=ts*.34;ctx.drawImage(iSpr(e.h,q),X+ts*.5-q/2,Y+ts*.55-q/2,q,q)}}
    else if(k==='drill'){
      const[u,v]=rotPt(.5,.54,e.d),cx=X+u*ts,cy=Y+v*ts,a=e._on?TIME*7:0;
      ctx.strokeStyle='#aeb6bf';ctx.lineWidth=ts*.05;ctx.beginPath();
      for(let i=0;i<4;i++){const q=a+i*Math.PI/2;ctx.moveTo(cx+Math.cos(q)*ts*.06,cy+Math.sin(q)*ts*.06);ctx.lineTo(cx+Math.cos(q)*ts*.18,cy+Math.sin(q)*ts*.18)}
      ctx.stroke();
      ctx.fillStyle='#d5dbe1';ctx.beginPath();ctx.arc(cx,cy,ts*.055,0,Math.PI*2);ctx.fill();
      if(e._on&&BLD[e.t].burner&&Math.random()<dt*1.2)puff(e.x+.25,e.y+.3,'rgba(90,90,90,.5)',1,.3);
    }else if(k==='furn'){
      if(e.r&&SMELT[e.r]){const q=ts*.3;ctx.drawImage(iSpr(SMELT[e.r].o,q),X+ts*.04,Y+ts*.04,q,q)}
      if(e._on){
        const f=.55+.25*Math.sin(TIME*9+e.x);
        const burnerF=e.t==='ofen'||e.t==='stahlofen';
        ctx.fillStyle=burnerF?`rgba(255,140,40,${f})`:`rgba(255,90,60,${f*.8})`;
        if(burnerF){ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.5,ts*.17,0,Math.PI*2);ctx.fill()}
        else ctx.fillRect(X+ts*.25,Y+ts*.47,ts*.5,ts*.28);
        if(burnerF&&Math.random()<dt*1.5)puff(e.x+.5,e.y+.3,'rgba(110,110,110,.45)',1,.3);
      }
    }else if(k==='asm'){
      const g=sprite('gear',bucket(ts*.5),q=>gear(q,.5,.5,.46,'#9aa6b2'));
      ctx.fillStyle=shade(ASM_COL[e.t],-.5);ctx.fillRect(X+ts*.23,Y+ts*.23,ts*.54,ts*.54);   // statisches Zahnrad aus dem Sprite überdecken
      ctx.save();ctx.translate(X+ts*.5,Y+ts*.5);if(e._on)ctx.rotate(TIME*2.5);ctx.globalAlpha=.55;ctx.drawImage(g,-ts*.26,-ts*.26,ts*.52,ts*.52);ctx.restore();
      if(e.r){const q=ts*.36;ctx.drawImage(itemSpr(e.r,q),X+ts*.5-q/2,Y+ts*.5-q/2,q,q)}
      if(e.w){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(X+ts*.2,Y+ts*.84,ts*.6,ts*.06);ctx.fillStyle='#63d17f';ctx.fillRect(X+ts*.2,Y+ts*.84,ts*.6*e.p,ts*.06)}
    }else if(k==='ug'){
      // Items auf dem sichtbaren Stück des Eingangs bzw. Ausgangs, dann der Deckel darüber
      const ent=e.io==='in'?e:e._pair,len=ent&&ent._pair?ent._len:1;
      if(ent&&ent.it.length)for(const[item,p]of ent.it){
        const q=e.io==='in'?p:p-(len-1);if(q<0||q>1)continue;
        const[u,v]=beltPos(0,q),[rx,ry]=rotPt(u,v,e.d),is2=ts*.36;
        if(ts<26){ctx.fillStyle=ITEMS[item].c||'#ddd';ctx.fillRect(X+rx*ts-is2*.35,Y+ry*ts-is2*.35,is2*.7,is2*.7)}
        else ctx.drawImage(iSpr(item,is2),X+rx*ts-is2/2,Y+ry*ts-is2/2,is2,is2);
      }
      tunnelHood(X,Y,ts,e);
    }else if(k==='pug'){
      if(e.fl>.05||e._mv){ctx.save();ctx.translate(X,Y);ctx.scale(ts,ts);ctx.translate(.5,.5);ctx.rotate(e.d*Math.PI/2);ctx.translate(-.5,-.5);
        pipePath(ctx,0);ctx.lineCap='butt';ctx.strokeStyle=`rgba(${FLC[e.ft]||FLC.wasser},.8)`;ctx.lineWidth=.12;ctx.stroke();ctx.restore()}
      tunnelHood(X,Y,ts,e);
    }else if(k==='refinery'){
      if(e._on&&Math.random()<dt*2)puff(e.x+.5,e.y+.15,'rgba(120,120,120,.45)',1,.3);
    }else if(k==='wind'){
      const cx=X+ts*.5,cy=Y+ts*.5,a=e.off?0:TIME*3+e.x;
      ctx.fillStyle='#e8edf2';ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=Math.max(1,ts*.015);
      for(let i=0;i<3;i++){const q=a+i*2.094;ctx.save();ctx.translate(cx,cy);ctx.rotate(q);ctx.beginPath();ctx.moveTo(-ts*.04,0);ctx.quadraticCurveTo(-ts*.05,-ts*.3,0,-ts*.47);ctx.quadraticCurveTo(ts*.04,-ts*.3,ts*.03,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
      ctx.fillStyle='#7d8894';ctx.beginPath();ctx.arc(cx,cy,ts*.06,0,Math.PI*2);ctx.fill();
    }else if(k==='pump'){
      if(e._on){ctx.fillStyle=`rgba(140,200,255,${.35+.25*Math.sin(TIME*6+e.x)})`;ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.58,ts*.12,0,Math.PI*2);ctx.fill()}
    }else if(k==='psplit'||k==='pmerge'){
      if(e.fl>.05||e._mv){ctx.fillStyle=`rgba(${FLC[e.ft]||FLC.wasser},${(.5+.45*Math.min(1,e.fl/FCAP.psplit)).toFixed(2)})`;ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.5,ts*.08,0,Math.PI*2);ctx.fill()}
    }else if(k==='dimin'||k==='dimout'){
      const f=.2+.15*Math.sin(TIME*3+e.x*.7);ctx.fillStyle=`rgba(200,160,255,${f.toFixed(2)})`;ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.5,ts*.3,0,Math.PI*2);ctx.fill();
      if(k==='dimout'&&e.oi){const q=ts*.3;ctx.drawImage(iSpr(e.oi,q),X+ts*.5-q/2,Y+ts*.5-q/2,q,q)}
    }else if(k==='chest'){
      if(e.oi){const q=ts*.26;ctx.drawImage(iSpr(e.oi,q),X+ts*.37,Y+ts*.52,q,q)}
    }else if(k==='lab'){
      if(e._on){ctx.fillStyle=`rgba(160,220,255,${.25+.2*Math.sin(TIME*5+e.y)})`;ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.5,ts*.26,0,Math.PI*2);ctx.fill()}
    }else if(k==='steam'){
      const cx=X+ts*.78,cy=Y+ts*.5,a=e._out>0?TIME*8:0;
      ctx.strokeStyle='#9aa4ad';ctx.lineWidth=ts*.035;ctx.beginPath();
      for(let i=0;i<3;i++){const q=a+i*2.094;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(q)*ts*.13,cy+Math.sin(q)*ts*.13)}ctx.stroke();
      if(e._out>0&&Math.random()<dt*3)puff(e.x+.3,e.y+.35,'rgba(225,230,235,.5)',1,.4);
    }else if(k==='silo'){
      if(!e._launch&&e.parts>0){
        ctx.strokeStyle='#63d17f';ctx.lineWidth=ts*.05;ctx.beginPath();ctx.arc(X+ts*.5,Y+ts*.5,ts*.44,-Math.PI/2,-Math.PI/2+Math.PI*2*e.parts/ROCKET);ctx.stroke();
      }
    }
  }

  // Baustellen: durchscheinend mit Sanduhr-Symbol
  if(S.sites.length){
    for(const st of S.sites){
      if(st.x<x0||st.x>x1||st.y<y0||st.y>y1)continue;
      const X=TX(st.x),Y=TY(st.y),B=BLD[st.t];
      ctx.globalAlpha=.4;
      ctx.drawImage(B.kind==='belt'?sprite('L'+B.tier+'00'+st.d,bs,g=>{g.translate(.5,.5);g.rotate(st.d*Math.PI/2);g.translate(-.5,-.5);beltArt(g,B.tier,0,0)}):bldSpr(st.t,st.d,ts),X,Y,ts,ts);
      ctx.globalAlpha=1;
      ctx.setLineDash([ts*.12,ts*.08]);ctx.strokeStyle='rgba(255,210,122,.8)';ctx.lineWidth=Math.max(1,ts*.04);ctx.strokeRect(X+ts*.06,Y+ts*.06,ts*.88,ts*.88);ctx.setLineDash([]);
      const r=Math.max(5,ts*.14),cx=X+ts*.5,cy=Y+ts*.5;
      ctx.fillStyle='rgba(20,24,30,.8)';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.moveTo(cx-r*.5,cy-r*.6);ctx.lineTo(cx+r*.5,cy-r*.6);ctx.lineTo(cx,cy);ctx.lineTo(cx+r*.5,cy+r*.6);ctx.lineTo(cx-r*.5,cy+r*.6);ctx.lineTo(cx,cy);ctx.closePath();ctx.fill();
    }
  }

  // Raten direkt am Gebäude (ab mittlerem Zoom): aktuelle Ausgabe pro Minute
  if(ts>=56){
    ctx.font=`600 ${Math.round(ts*.17)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(const e of blds){
      const k=BLD[e.t].kind;
      if(e._r===undefined||!(k==='drill'||k==='furn'||k==='asm'||k==='split'||k==='pump'))continue;
      const t=fmtRate(e._r)+'/min',w=ctx.measureText(t).width+ts*.12,cx=TX(e.x)+ts/2,cy=TY(e.y)+ts*.93;
      ctx.fillStyle='rgba(12,15,19,.8)';ctx.fillRect(cx-w/2,cy-ts*.1,w,ts*.2);
      ctx.fillStyle=e._r>0?'#9fe6b0':'#9aa7b4';ctx.fillText(t,cx,cy+ts*.005);
    }
  }

  // Vorschau beim Bandbau (Start antippen, Ziel antippen)
  if(ROUTE){
    ctx.globalAlpha=.6;
    for(const c of ROUTE.path)ctx.drawImage(bldSpr(c.ug?TUN_OF[ROUTE.t]:ROUTE.t,c.d,ts),TX(c.x),TY(c.y),ts,ts);
    ctx.globalAlpha=1;
    ctx.lineWidth=Math.max(2,ts*.06);
    ctx.strokeStyle='#63d17f';ctx.strokeRect(TX(ROUTE.sx)+2,TY(ROUTE.sy)+2,ts-4,ts-4);
    for(const w of ROUTE.way){ctx.strokeStyle='#5aa8ff';ctx.strokeRect(TX(w.x)+3,TY(w.y)+3,ts-6,ts-6)}
    if(ROUTE.end){ctx.strokeStyle=ROUTE.ok?'#f2a33a':'#ff6b5b';ctx.strokeRect(TX(ROUTE.end.x)+2,TY(ROUTE.end.y)+2,ts-4,ts-4)}
  }

  // Auswahlrahmen
  if(SELR){const b=selBox();ctx.fillStyle='rgba(90,168,255,.14)';ctx.fillRect(TX(b.x0),TY(b.y0),(b.x1-b.x0+1)*ts,(b.y1-b.y0+1)*ts);
    ctx.setLineDash([ts*.2,ts*.12]);ctx.strokeStyle='#5aa8ff';ctx.lineWidth=Math.max(2,ts*.05);ctx.strokeRect(TX(b.x0),TY(b.y0),(b.x1-b.x0+1)*ts,(b.y1-b.y0+1)*ts);ctx.setLineDash([])}
  // Blaupause: Vorschau an der gewählten Stelle
  if(BPM&&BPM.x!=null&&S.bps[BPM.i]){
    for(const q of bpPieces(S.bps[BPM.i],BPM.rot)){
      const x=BPM.x+q.x,y=BPM.y+q.y;if(x<x0-1||x>x1+1||y<y0-1||y>y1+1)continue;
      const ok=x>=0&&y>=0&&x<W&&y<H&&canStand(q.t,x,y);
      ctx.globalAlpha=ok?.55:.3;ctx.drawImage(bldSpr(q.t,q.d,ts),TX(x),TY(y),ts,ts);ctx.globalAlpha=1;
      if(!ok){ctx.strokeStyle='rgba(255,107,91,.8)';ctx.lineWidth=Math.max(1,ts*.04);ctx.strokeRect(TX(x)+2,TY(y)+2,ts-4,ts-4)}
    }
  }
  // Strommasten und Leitungen
  for(const p of poles)ctx.drawImage(bldSpr(p.t,0,ts),TX(p.x),TY(p.y),ts,ts);
  if(WIRES.length){
    ctx.strokeStyle='rgba(40,30,22,.9)';ctx.lineWidth=Math.max(1,ts*.03);ctx.beginPath();
    for(const[a,b]of WIRES){
      if(Math.max(a.x,b.x)<x0-1||Math.min(a.x,b.x)>x1+1||Math.max(a.y,b.y)<y0-1||Math.min(a.y,b.y)>y1+1)continue;
      const ax=TX(a.x+.5),ay=TY(a.y+.47),bx=TX(b.x+.5),by=TY(b.y+.47);
      ctx.moveTo(ax,ay);ctx.quadraticCurveTo((ax+bx)/2,(ay+by)/2+ts*.3,bx,by);
    }
    ctx.stroke();
  }

  // Warnsymbole (blinken): keine Kohle, kein Strom, kein Rezept
  const blink=Math.sin(TIME*5)>-.3;
  for(const e of blds){
    let st=e._st;if(st==='komplex')st='rezept';
    if(e.off)st='aus';else if(!blink||(st!=='kohle'&&st!=='strom'&&st!=='rezept'&&st!=='wenig'&&st!=='wasser'))continue;
    const X=TX(e.x),Y=TY(e.y),r=Math.max(6,ts*.16),cx=X+ts*.82,cy=Y+ts*.18;
    ctx.fillStyle=st==='aus'?'#8b96a3':st==='kohle'?'#ff6b5b':st==='rezept'||st==='wasser'?'#5aa8ff':st==='wenig'?'#f2a33a':'#ffcf3f';
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=Math.max(1,r*.15);ctx.stroke();
    if(st==='aus'){ctx.fillStyle='#1b2027';ctx.fillRect(cx-r*.42,cy-r*.5,r*.28,r);ctx.fillRect(cx+r*.14,cy-r*.5,r*.28,r)}
    else if(st==='wasser'){ctx.fillStyle='#10202f';ctx.beginPath();ctx.moveTo(cx,cy-r*.6);ctx.quadraticCurveTo(cx+r*.5,cy+r*.05,cx,cy+r*.55);ctx.quadraticCurveTo(cx-r*.5,cy+r*.05,cx,cy-r*.6);ctx.fill()}
    else if(st==='kohle'){const q=r*1.5;ctx.drawImage(itemSpr('kohle',q),cx-q/2,cy-q/2,q,q)}
    else if(st==='rezept'){ctx.fillStyle='#10202f';ctx.font=`bold ${Math.round(r*1.4)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',cx,cy+r*.08)}
    else{ctx.fillStyle='#2a2006';ctx.beginPath();ctx.moveTo(cx+r*.15,cy-r*.75);ctx.lineTo(cx-r*.45,cy+r*.12);ctx.lineTo(cx,cy+r*.12);ctx.lineTo(cx-r*.15,cy+r*.75);ctx.lineTo(cx+r*.45,cy-r*.12);ctx.lineTo(cx,cy-r*.12);ctx.closePath();ctx.fill()}
  }

  // Raketenstart
  for(const s of L.silo){
    if(!s._launch)continue;
    const t=s._launch,rise=t<2?0:(t-2)*(t-2)*1.4;
    drawRocket(TX(s.x+.5),TY(s.y+.5-rise)-(t<2?(t/2)*ts*.2:ts*.2),ts,t);
    if(t>1.5&&Math.random()<.8)puff(s.x+.5+(Math.random()-.5)*.6,s.y+.8-rise*.2,'rgba(230,230,230,.6)',2,1.4);
  }

  // Auswahl, Tipp-Rückmeldung, Maus-Vorschau
  if(SEL&&G[SEL.y*W+SEL.x]===SEL){ctx.strokeStyle='#f2a33a';ctx.lineWidth=Math.max(2,ts*.06);ctx.strokeRect(TX(SEL.x)+1,TY(SEL.y)+1,ts-2,ts-2)}
  if(FLASH){FLASH.t-=dt;if(FLASH.t<=0)FLASH=null;else{ctx.strokeStyle=`rgba(${FLASH.bad?'255,107,91':'255,255,255'},${FLASH.t*2})`;ctx.lineWidth=Math.max(2,ts*.05);ctx.strokeRect(TX(FLASH.x),TY(FLASH.y),ts,ts)}}
  if(HOVER&&tool&&!ROUTE&&!G[HOVER.y*W+HOVER.x]){
    ctx.globalAlpha=.5;ctx.drawImage(bldSpr(tool,BLD[tool].rot?curDir:0,ts),TX(HOVER.x),TY(HOVER.y),ts,ts);ctx.globalAlpha=1;
  }

  // Partikel
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];p.l-=dt;if(p.l<=0){PARTS.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;const a=Math.min(1,p.l/p.m*1.5);
    if(p.txt){ctx.globalAlpha=a;ctx.fillStyle=p.col||'#fff';ctx.font=`bold ${Math.round(Math.max(12*DPR,ts*.32))}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3*DPR;ctx.strokeText(p.txt,TX(p.x),TY(p.y));ctx.fillText(p.txt,TX(p.x),TY(p.y))}
    else{ctx.globalAlpha=a*.8;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(TX(p.x),TY(p.y),ts*p.r*(1.6-a*.6),0,Math.PI*2);ctx.fill()}
  }
  ctx.globalAlpha=1;
}

/* Symbol eines Items/Gebäudes als eigener Canvas für die Oberfläche */
function iconCanvas(id,px,d){
  const c=document.createElement('canvas'),s=Math.round(px*Math.min(3,devicePixelRatio||1));
  c.width=c.height=s;drawIcon(c,id,d);return c;
}
function drawIcon(c,id,d){
  const g=c.getContext('2d'),s=c.width;g.clearRect(0,0,s,s);
  g.save();g.scale(s,s);g.lineJoin='round';g.lineCap='round';
  if(BLD[id])bldArt(g,id,d||0);else itemArt(g,id);
  g.restore();
}

/* =====================================================================
   6. EINGABE
   Ein Finger ziehen = Karte verschieben, zwei Finger = Zoom,
   Tippen = bauen / öffnen, lange drücken = Info mit Abreißen.
   ===================================================================== */
let tool=null,curDir=1,delMode=false;
const PT=new Map();
let gest=null;
/* Bildschirmposition relativ zur Zeichenfläche (nicht zum Fenster) */
function loc(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*(VW/(r.width||VW)),(e.clientY-r.top)*(VH/(r.height||VH))]}
function toTile(sx,sy){return[Math.floor((sx-VW/2)/cam.z+cam.x),Math.floor((sy-VH/2)/cam.z+cam.y)]}
function clampCam(){cam.z=clamp(cam.z,ZMIN,ZMAX);cam.x=clamp(cam.x,0,W);cam.y=clamp(cam.y,0,H)}

cv.addEventListener('pointerdown',e=>{
  audioUnlock();
  if(e.button===2)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const[ex,ey]=loc(e);
  PT.set(e.pointerId,{x:ex,y:ey});
  cam.vx=cam.vy=0;
  if(PT.size===1&&selMode){                                     // Auswahl: Rahmen aufziehen
    const[tx,ty]=toTile(ex,ey);gest={m:'sel'};SELR={x0:tx,y0:ty,x1:tx,y1:ty,drag:1};updSelBar();
  }else if(PT.size===1){
    gest={m:'tap',sx:ex,sy:ey,lx:ex,ly:ey,lt:performance.now(),vx:0,vy:0,
      lp:setTimeout(()=>{if(gest&&gest.m==='tap'){gest.m='done';longPress(gest.sx,gest.sy)}},450)};
  }else if(PT.size===2){
    if(gest)clearTimeout(gest.lp);
    if(gest&&gest.m==='sel'){SELR=null;updSelBar()}
    const[a,b]=[...PT.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    gest={m:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:cam.z,wx:(mx-VW/2)/cam.z+cam.x,wy:(my-VH/2)/cam.z+cam.y};
  }
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&!PT.size){
    const[x,y]=toTile(...loc(e));HOVER=x>=0&&y>=0&&x<W&&y<H?{x,y}:null;return;
  }
  const p=PT.get(e.pointerId);if(!p||!gest)return;
  [p.x,p.y]=loc(e);
  if(gest.m==='sel'){const[tx,ty]=toTile(p.x,p.y);if(SELR){SELR.x1=tx;SELR.y1=ty}return}
  if(gest.m==='tap'&&Math.hypot(p.x-gest.sx,p.y-gest.sy)>9){clearTimeout(gest.lp);gest.m='pan';gest.lx=gest.sx;gest.ly=gest.sy}
  if(gest.m==='pan'){
    const dx=p.x-gest.lx,dy=p.y-gest.ly,now=performance.now(),dts=Math.max(.008,(now-gest.lt)/1000);
    cam.x-=dx/cam.z;cam.y-=dy/cam.z;
    gest.vx=gest.vx*.5+(-dx/cam.z/dts)*.5;gest.vy=gest.vy*.5+(-dy/cam.z/dts)*.5;
    gest.lx=p.x;gest.ly=p.y;gest.lt=now;clampCam();
  }else if(gest.m==='pinch'&&PT.size>=2){
    const[a,b]=[...PT.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.z=clamp(gest.z0*d/gest.d0,ZMIN,ZMAX);
    cam.x=gest.wx-(mx-VW/2)/cam.z;cam.y=gest.wy-(my-VH/2)/cam.z;clampCam();
  }
});
function endPtr(e){
  if(!PT.has(e.pointerId))return;
  PT.delete(e.pointerId);
  if(!gest)return;
  if(gest.m==='sel'){if(SELR)delete SELR.drag;if(e.type!=='pointerup')SELR=null;updSelBar();gest=null;return}
  if(gest.m==='tap'){clearTimeout(gest.lp);if(e.type==='pointerup')tap(gest.sx,gest.sy);gest=null}
  else if(gest.m==='pinch'){
    if(PT.size===1){const p=[...PT.values()][0];gest={m:'pan',lx:p.x,ly:p.y,lt:performance.now(),vx:0,vy:0}}
    else if(!PT.size)gest=null;
  }else if(gest.m==='pan'){
    if(!PT.size){if(performance.now()-gest.lt<90){cam.vx=clamp(gest.vx,-60,60);cam.vy=clamp(gest.vy,-60,60)}gest=null}
  }else if(!PT.size)gest=null;
}

/* Kamera gleitet nach dem Wischen kurz nach */
function camInertia(dt){
  if(!cam.vx&&!cam.vy)return;
  cam.x+=cam.vx*dt;cam.y+=cam.vy*dt;clampCam();
  const k=Math.pow(.005,dt);cam.vx*=k;cam.vy*=k;
  if(Math.abs(cam.vx)<.05&&Math.abs(cam.vy)<.05)cam.vx=cam.vy=0;
}

function tap(sx,sy){
  const[x,y]=toTile(sx,sy);
  if(x<0||y<0||x>=W||y>=H)return;
  if(BPM){BPM.x=x;BPM.y=y;sfx('click');updSelBar();return}   // Blaupause: Position wählen
  const e=G[y*W+x];
  const site=!e&&siteAt(x,y);
  if(delMode){if(e)demolish(e);else if(site)removeSite(site);return}
  if(site){toast(`Baustelle ${BLD[site.t].n}: wartet auf Material aus dem Handwerk. Mit Abriss entfernen.`,'',2400);return}
  if(tool&&LINE(BLD[tool].kind)){beltTap(x,y);return}
  if(tool){
    // Verteiler/Zusammenführer auf ein Band (bzw. eine Leitung) tippen: ersetzt es und übernimmt die Richtung
    const tk=BLD[tool].kind,ek=e&&BLD[e.t].kind;
    if((ek==='belt'&&(tk==='split'||tk==='merge'))||(ek==='pipe'&&(tk==='psplit'||tk==='pmerge'))){replaceBelt(e,tool);return}
    if(e){
      if(e.t===tool&&BLD[tool].rot){
        if(e.d!==curDir){e.d=curDir;dirty=true;sfx('click')}
        FLASH={x,y,t:.4};return;
      }
      openInfo(e);return;
    }
    tryPlace(tool,x,y,curDir);return;
  }
  if(e){openInfo(e);return}
  const r=RES[y*W+x];
  if(r&&r!==WATER)handMine(x,y,r);
}
function longPress(sx,sy){
  const[x,y]=toTile(sx,sy);
  if(x<0||y<0||x>=W||y>=H)return;
  try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}
  const e=G[y*W+x];
  if(e)openInfo(e);else openTileInfo(x,y);
}

/* ---------- Bauen, Abreißen, Abbauen ---------- */
/* ---------- Förderbänder verlegen: Start antippen, Ziel antippen ----------
   Auto: kürzester Weg mit wenigen Kurven (A*), Manuell: eigene Wegpunkte, dazwischen gerade/L-förmig. */
let ROUTE=null;
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!G[y*W+x]&&RES[y*W+x]!==WATER&&!SITESET.has(y*W+x);
function dirTo(ax,ay,bx,by){return bx>ax?1:bx<ax?3:by>ay?2:0}
/* Ende einer Bandlinie (dem Band in Pfeilrichtung folgen) */
function beltEnd(b){
  const seen=new Set([b]),k=BLD[b.t].kind;
  for(let i=0;i<500;i++){
    const n=entAt(b.x+DX[b.d],b.y+DY[b.d]);
    if(!n||BLD[n.t].kind!==k||seen.has(n)||n.d===(b.d+2)%4)break;
    seen.add(n);b=n;
  }
  return b;
}
/* Startfeld bestimmen: am Ausgang eines Gebäudes, am Ende eines Bandes oder ein freies Feld.
   Liegt am Ausgang schon ein Band, geht es an dessen Ende weiter. */
function routeStart(x,y){
  const e=G[y*W+x],lk=BLD[tool].kind,pipe=lk==='pipe',word=pipe?'Diese Leitung':'Dieses Band';
  if(!e){if(RES[y*W+x]===WATER){fail(x,y,'Auf Wasser kann man nicht bauen.');return null}return{x,y,d:null}}
  let src=e;
  const ek=BLD[e.t].kind;
  if(LINE(ek)&&ek!==lk){fail(x,y,pipe?'Leitungen können nicht an ein Förderband anschließen.':'Bänder können nicht an eine Leitung anschließen.');return null}
  if(ek!==lk){
    if(!hasOut(e)||FLUID.has(ek)!==pipe){fail(x,y,BLD[e.t].n+(pipe?' gibt kein Wasser aus. Starte an einer Pumpe, einer Leitung oder einem freien Feld.':' hat keinen Item-Ausgang. Tippe auf ein Gebäude mit oranger Seite, ein Band oder ein freies Feld.'));return null}
    const fx=x+DX[e.d],fy=y+DY[e.d];
    if(free(fx,fy))return{x:fx,y:fy,d:e.d};
    const f=entAt(fx,fy);
    if(!f||BLD[f.t].kind!==lk){fail(x,y,'Vor dem Ausgang ist kein Platz frei.');return null}
    src=f;
  }
  const end=beltEnd(src),fx=end.x+DX[end.d],fy=end.y+DY[end.d];
  if(!free(fx,fy)){fail(x,y,word+' endet schon an einem Gebäude oder Hindernis.');return null}
  FLASH={x:end.x,y:end.y,t:.6};
  return{x:fx,y:fy,d:end.d};
}
/* Zielfelder: freie Nachbarn eines Gebäudes/Bandes (mit Richtung hinein) oder das Feld selbst.
   Bei Gebäuden zählen auch Bänder, die schon hineinführen – dort wird seitlich eingespeist. */
function routeGoals(x,y){
  const t=G[y*W+x],goals=[],lk=ROUTE?BLD[ROUTE.t].kind:'belt';
  if(!t){if(free(x,y))goals.push({x,y,d:null});return goals}
  const tk=BLD[t.t].kind,accept=lk==='pipe'?(nx,ny)=>fluidIn(t,nx,ny):(nx,ny)=>inputOk(t,nx,ny);
  if(LINE(tk)&&tk!==lk)return goals;
  const okCell=(nx,ny)=>free(nx,ny)||(ROUTE&&nx===ROUTE.cx&&ny===ROUTE.cy);
  const beltGoals=b=>{
    for(let d=0;d<4;d++){
      const nx=b.x-DX[d],ny=b.y-DY[d];
      if(d===(b.d+2)%4||!okCell(nx,ny))continue;                 // nicht frontal gegen das Band
      goals.push({x:nx,y:ny,d});
    }
  };
  if(tk===lk){beltGoals(t);return goals}
  for(let d=0;d<4;d++){
    const nx=x-DX[d],ny=y-DY[d];                                 // Nachbar, von dem aus ein Band in Richtung d auf t zeigt
    if(!accept(nx,ny))continue;                                  // nicht in einen Ausgang
    if(okCell(nx,ny)){goals.push({x:nx,y:ny,d});continue}
    const n=entAt(nx,ny);
    if(n&&BLD[n.t].kind===lk&&n.d===d)beltGoals(n);              // Band führt schon hinein: seitlich einspeisen
  }
  return goals;
}
/* A* über (Feld, Richtung); Kurven kosten etwas mehr, damit der Weg ruhig aussieht */
/* tun: Tunnel-Gebäude, mit dem Hindernisse untertunnelt werden dürfen (oder null) */
function findPath(sx,sy,sd,goals,tun){
  if(!goals.length)return null;
  const gi=new Map();for(const g of goals)gi.set(g.y*W+g.x,g);
  const N=W*H*5,cost=new Float32Array(N).fill(1e9),prev=new Int32Array(N).fill(-1),jmp=new Uint8Array(N);
  const TR=tun?BLD[tun].range:0,tk=tun&&BLD[tun].kind;
  const h=(x,y)=>{let m=1e9;for(const g of goals)m=Math.min(m,Math.abs(g.x-x)+Math.abs(g.y-y));return m};
  const heap=[];
  const push=(f,s)=>{heap.push([f,s]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return top};
  const s0=(sy*W+sx)*5+(sd===null?4:sd);
  cost[s0]=0;push(h(sx,sy),s0);
  let guard=0;
  while(heap.length&&guard++<300000){
    const[,s]=pop(),c=cost[s],cell=(s/5)|0,dir=s%5,x=cell%W,y=(cell/W)|0;
    const g=gi.get(cell);
    if(g&&(!jmp[s]||g.d==null||g.d===dir)){             // Ziel erreicht: Weg zurückverfolgen
      const cells=[];let q=s;
      while(q>=0){
        const cc=(q/5)|0,qx=cc%W,qy=(cc/W)|0;
        if(jmp[q]){                                      // Tunnel: Ausgang, dann Eingang direkt hinter dem Vorgänger
          const d=q%5,pc=(prev[q]/5)|0;cells.push({x:qx,y:qy,ug:'out'});cells.push({x:pc%W+DX[d],y:((pc/W)|0)+DY[d],ug:'in'});
        }else cells.push({x:qx,y:qy});
        q=prev[q];
      }
      cells.reverse();return{cells,endDir:g.d};
    }
    for(let d=0;d<4;d++){
      if(jmp[s]&&d!==dir)continue;                       // Tunnel-Ausgang gibt nur geradeaus weiter
      if(dir!==4&&d===(dir+2)%4)continue;                // nie direkt kehrtmachen
      const nx=x+DX[d],ny=y+DY[d];
      if(!free(nx,ny))continue;
      const nc=c+1+(dir!==4&&dir!==d?.35:0),ns=(ny*W+nx)*5+d;
      if(nc<cost[ns]){cost[ns]=nc;prev[ns]=s;jmp[ns]=0;push(nc+h(nx,ny),ns)}
      // Tunnel: Eingang auf (nx,ny), Ausgang D Felder weiter, dazwischen darf alles sein
      if(!TR)continue;
      let blocked=false;
      for(let D=2;D<=TR+1;D++){
        const mx=nx+DX[d]*(D-1),my=ny+DY[d]*(D-1),ox=nx+DX[d]*D,oy=ny+DY[d]*D;
        if(mx<0||my<0||mx>=W||my>=H||ox<0||oy<0||ox>=W||oy>=H)break;
        const m=G[my*W+mx];if(m&&BLD[m.t].kind===tk&&m.d===d)break;   // fremder Tunnel gleicher Richtung würde die Kopplung stören
        if(!free(mx,my))blocked=true;
        if(!blocked||!free(ox,oy))continue;
        const og=gi.get(oy*W+ox);if(og&&og.d!=null&&og.d!==d)continue;   // Ausgang nicht falsch herum aufs Zielfeld
        const tc=c+D+2.5+(dir!==4&&dir!==d?.35:0),ts2=(oy*W+ox)*5+d;
        if(tc<cost[ts2]){cost[ts2]=tc;prev[ts2]=s;jmp[ts2]=1;push(tc+h(ox,oy),ts2)}
      }
    }
  }
  return null;
}
/* gerade oder L-förmige Strecke für den manuellen Modus (ohne Startfeld) */
function lSegment(ax,ay,bx,by){
  for(const hFirst of[true,false]){
    const cells=[];let x=ax,y=ay,ok=true;
    const step=(tx,ty)=>{while((x!==tx||y!==ty)&&ok){x+=Math.sign(tx-x);y+=Math.sign(ty-y);if(!free(x,y))ok=false;else cells.push({x,y})}};
    if(hFirst){step(bx,y);step(bx,by)}else{step(x,by);step(bx,by)}
    if(ok)return cells;
  }
  return null;
}
/* Richtungen aus der Zellenfolge; das letzte Band zeigt ins Ziel */
function withDirs(cells,endDir,startDir){
  return cells.map((c,i)=>{
    const n=cells[i+1];
    let d=n?dirTo(c.x,c.y,n.x,n.y):endDir!=null?endDir:i>0?dirTo(cells[i-1].x,cells[i-1].y,c.x,c.y):startDir!=null?startDir:curDir;
    if(c.ug==='out')d=dirTo(cells[i-1].x,cells[i-1].y,c.x,c.y);                // Tunnel-Ausgang zeigt in Tunnelrichtung
    return{x:c.x,y:c.y,d,ug:c.ug};
  });
}
function computeRoute(){
  const R=ROUTE;
  R.cx=R.sx;R.cy=R.sy;
  let cells=[{x:R.sx,y:R.sy}];
  // manuelle Wegpunkte
  for(const w of R.way){
    const last=cells[cells.length-1],seg=lSegment(last.x,last.y,w.x,w.y);
    if(!seg){R.ok=false;R.path=withDirs(cells,null,R.sd);return}
    cells=cells.concat(seg);
  }
  if(!R.end){R.ok=true;R.path=withDirs(cells,null,R.sd);return}
  const last=cells[cells.length-1],tgt=G[R.end.y*W+R.end.x];
  let res=null;
  if(R.mode==='manual'&&!tgt){const seg=lSegment(last.x,last.y,R.end.x,R.end.y);if(seg)res={cells:[last].concat(seg),endDir:null}}
  else{R.cx=last.x;R.cy=last.y;const tt=TUN_OF[R.t];res=findPath(last.x,last.y,cells.length>1?dirTo(cells[cells.length-2].x,cells[cells.length-2].y,last.x,last.y):R.sd,routeGoals(R.end.x,R.end.y),tt&&unlocked(tt)&&R.mode!=='manual'?tt:null)}
  if(!res){R.ok=false;R.path=withDirs(cells,null,R.sd);return}
  cells=cells.concat(res.cells.slice(1));
  R.ok=true;R.path=withDirs(cells,res.endDir,R.sd);
}
function beltTap(x,y){
  const e=G[y*W+x];
  if(!ROUTE){
    if(e&&BLD[e.t].kind===BLD[tool].kind&&e.t!==tool){upgradeBelts([e],tool);return}   // anderes Band antippen = aufrüsten
    const st=routeStart(x,y);if(!st)return;
    ROUTE={t:tool,sx:st.x,sy:st.y,sd:st.d,way:[],end:null,path:[],ok:true,mode:S.routeMode||'auto'};
    computeRoute();sfx('click');updRouteBar();return;
  }
  if(ROUTE.mode==='manual'&&!e&&!ROUTE.end){
    const w={x,y};ROUTE.way.push(w);computeRoute();
    if(!ROUTE.ok){ROUTE.way.pop();computeRoute();fail(x,y,'Dieser Abschnitt ist blockiert.')}
  }else{ROUTE.end={x,y};computeRoute();if(!ROUTE.ok)fail(x,y,'Kein freier Weg dorthin gefunden.')}
  sfx('click');updRouteBar();
}
function buildRoute(){
  const R=ROUTE;if(!R||!R.ok||!R.path.length)return;
  const seen=new Set(),cells=R.path.filter(c=>{const k=c.y*W+c.x;if(seen.has(k)||!free(c.x,c.y))return false;seen.add(k);return true});
  // so viel wie möglich sofort bauen, den Rest als Baustellen
  const typ=c=>c.ug?TUN_OF[R.t]:R.t,rest=[];let built=0;
  for(const c of cells){
    const t=typ(c);
    if(rest.length||obtain(t)){rest.push(c);continue}
    const e=mkEnt(t,c.x,c.y,c.d);if(c.ug)e.io=c.ug;addEnt(e);built++;
  }
  let msg=`${built} × gebaut.`,cls='good';
  if(rest.length){
    const need={};for(const c of rest)need[typ(c)]=(need[typ(c)]||0)+1;
    let m=null;for(const t in need){m=queueFor(t,need[t]);if(m)break}
    if(m){msg=`${built} gebaut – für den Rest fehlen ${fmt(m.n)} × ${ITEMS[m.k].n}.`;cls='bad'}
    else{for(const c of rest)addSite(typ(c),c.x,c.y,c.d,c.ug?{io:c.ug}:null);msg=`${built} gebaut, ${rest.length} als Baustelle – fertig, sobald das Handwerk nachliefert.`}
  }
  const nt=cells.filter(c=>c.ug).length;if(nt&&!rest.length)msg=`${built-nt} × ${BLD[R.t].n} und ${nt} Tunnelstücke gebaut.`;
  else if(!rest.length)msg=`${built} × ${BLD[R.t].n} gebaut.`;
  const l=cells[cells.length-1];FLASH={x:l.x,y:l.y,t:.4};
  ROUTE=null;sfx('place');uiDirty=true;updRouteBar();
  toast(msg,cls,2400);
}
function cancelRoute(){ROUTE=null;updRouteBar()}

/* Bänder einer zusammenhängenden Linie (vorwärts und rückwärts) */
function beltLine(b){
  const out=[b],seen=new Set([b]),k=BLD[b.t].kind;
  let c=b;
  for(let i=0;i<400;i++){const n=entAt(c.x+DX[c.d],c.y+DY[c.d]);if(!n||BLD[n.t].kind!==k||seen.has(n)||n.d===(c.d+2)%4)break;seen.add(n);out.push(n);c=n}
  c=b;
  for(let i=0;i<400;i++){const p=entAt(c.x-DX[c._in],c.y-DY[c._in]);if(!p||BLD[p.t].kind!==k||seen.has(p)||p.d!==c._in)break;seen.add(p);out.push(p);c=p}
  return out;
}
/* Bänder austauschen (Items bleiben liegen); das alte Band kommt ins Inventar */
function upgradeBelts(list,t){
  list=list.filter(b=>b.t!==t);
  if(!list.length){toast('Schon '+BLD[t].n+'.');return 0}
  if(total(t)<list.length){toast(`Dafür fehlen ${list.length-total(t)} × ${BLD[t].n}.`,'bad');sfx('err');return 0}
  takeItems(t,list.length);
  for(const b of list){give(b.t,1);b.t=t}
  dirty=true;sfx('place');uiDirty=true;
  toast(`${list.length} × ${BLD[t].n} (${fmt(lineRate(t))}/min) umgebaut.`,'good');
  return list.length;
}
function updRouteBar(){
  const el=$('#route');
  if(!ROUTE){el.classList.remove('on');updBanner();return}
  const R=ROUTE,n=new Set(R.path.filter(c=>free(c.x,c.y)).map(c=>c.y*W+c.x)).size,nt=R.path.filter(c=>c.ug).length,have=total(R.t);
  let txt;
  if(!R.end&&!R.way.length)txt=R.mode==='manual'?'Tippe Wegpunkte an, zum Schluss das Ziel (Gebäude oder Band).':'Tippe auf das Ziel: ein Gebäude, ein Band oder ein freies Feld.';
  else if(!R.ok)txt='Kein freier Weg gefunden.';
  else txt=`${n-nt} × ${BLD[R.t].n} <span style="color:${have>=n-nt?'var(--dim)':'var(--bad)'}">(Vorrat ${fmt(have)})</span>`+(nt?` + ${nt} × ${BLD[TUN_OF[R.t]].n} (Vorrat ${fmt(total(TUN_OF[R.t]))})`:'');
  $('#rText').innerHTML=txt;
  $('#rMode').textContent=R.mode==='manual'?'Manuell':'Auto-Weg';
  $('#rBack').style.display=R.way.length||R.end?'':'none';
  $('#rBuild').disabled=!(R.ok&&n>0&&(R.end||R.way.length||n===1));
  $('#rBuild').textContent=`Bauen (${n})`;
  el.classList.add('on');$('#banner').className='';
  el.style.bottom=($('#bottom').offsetHeight+8)+'px';
}
$('#rBuild').onclick=buildRoute;

const UPG={band:'schnellband',schnellband:'expressband',tunnel:'tunnel2',tunnel2:'tunnel3',leitung:'leitung2',bohrer:'ebohrer',ebohrer:'ebohrer2',
  ofen:'stahlofen',stahlofen:'eofen',montage:'montage2',montage2:'montage3',labor:'labor2',labor2:'labor3',pumpe:'pumpe2',mast:'mast2',mast2:'mast3'};
const selBox=()=>SELR&&{x0:Math.max(0,Math.min(SELR.x0,SELR.x1)),y0:Math.max(0,Math.min(SELR.y0,SELR.y1)),x1:Math.min(W-1,Math.max(SELR.x0,SELR.x1)),y1:Math.min(H-1,Math.max(SELR.y0,SELR.y1))};
function selEnts(){
  const b=selBox(),out=[];if(!b)return out;
  for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){const e=G[y*W+x];if(e)out.push(e)}
  return out;
}
function setSelMode(on){

/* Einstellungen eines Gebäudes für Blaupausen und Aufrüsten */
function captureCfg(e){
  const c={};
  if(e.r)c.r=e.r;
  if(e.fo)c.fo=e.fo.slice();
  if(Array.isArray(e.fi))c.fi=e.fi.slice();
  if(e.oi!==undefined&&e.oi)c.oi=e.oi,c.orate=e.orate;
  if(e.io)c.io=e.io;
  if(e.off)c.off=1;
  return c;
}

const BPACT={};                                   // Aktionen der Blaupausen-Bibliothek (werden unten in ACT übernommen)
/* Teile einer Blaupause, rot mal um 90° im Uhrzeigersinn gedreht */
function bpPieces(bp,rot){
  let w=bp.w,h=bp.h,ps=bp.p.map(q=>({t:q.t,x:q.x,y:q.y,d:q.d,c:q.c}));
  for(let i=0;i<rot;i++){ps=ps.map(q=>({t:q.t,x:h-1-q.y,y:q.x,d:BLD[q.t].rot?(q.d+1)%4:q.d,c:q.c}));[w,h]=[h,w]}
  return ps;
}
/* Kann t auf (x,y) stehen? */
function canStand(t,x,y){
  if(!free(x,y))return false;
  const r=RES[y*W+x],B=BLD[t];
  if(B.kind==='drill'&&(!r||r===OIL))return false;
  if(B.kind==='opump'&&r!==OIL)return false;
  if(B.shore&&!nearWater(x,y))return false;
  return true;
}
function bpBuild(){
  if(!BPM||BPM.x==null)return;
  const bp=S.bps[BPM.i],ps=bpPieces(bp,BPM.rot);
  let built=0,skip=0;const rest=[];
  for(const q of ps){
    const x=BPM.x+q.x,y=BPM.y+q.y;
    if(!canStand(q.t,x,y)){skip++;continue}
    if(obtain(q.t)){rest.push([q,x,y]);continue}
    const e=mkEnt(q.t,x,y,q.d);applyCfg(e,q.c);addEnt(e);autoFuel(e);built++;
  }
  let msg=`${built} gebaut`,cls='good';
  if(rest.length){
    const need={};for(const[q]of rest)need[q.t]=(need[q.t]||0)+1;
    let m=null;for(const t in need){m=queueFor(t,need[t]);if(m)break}
    if(m){msg+=` · für ${rest.length} weitere fehlen ${fmt(m.n)} × ${ITEMS[m.k].n}`;cls='bad'}
    else{for(const[q,x,y]of rest)addSite(q.t,x,y,q.d,q.c);msg+=` · ${rest.length} als Baustelle`}
  }
  if(skip)msg+=` · ${skip} Felder belegt oder ungeeignet`;
  toast(msg+'.',cls,3200);sfx('place');uiDirty=true;
  BPM.x=BPM.y=null;updSelBar();
}
BPACT.bpsave=()=>{
  const b=selBox();if(!b)return;
  const name=(($('#bpName')||{}).value||'').trim()||'Blaupause '+(S.bps.length+1);
  const p=selEnts().map(e=>({t:e.t,x:e.x-b.x0,y:e.y-b.y0,d:e.d,c:captureCfg(e)}));
  S.bps.push({n:name.slice(0,30),w:b.x1-b.x0+1,h:b.y1-b.y0+1,p});
  closeSheet();toast(`Blaupause „${name}“ gespeichert (${p.length} Teile). Du findest sie unter „Gebäude“.`,'good',2600);
  SELR=null;updSelBar();
};
BPACT.bpuse=v=>{closeSheet();setSelMode(false);BPM={i:+v,rot:0,x:null,y:null};updSelBar()};
BPACT.bpdel=v=>{const bp=S.bps[+v];if(!bp)return;S.bps.splice(+v,1);toast(`„${bp.n}“ gelöscht.`);openBuild()};

function fail(x,y,msg){FLASH={x,y,t:.5,bad:1};toast(msg,'bad');sfx('err')}
function tryPlace(t,x,y,d){
  const r=RES[y*W+x],B=BLD[t];
  if(r===WATER)return fail(x,y,'Auf Wasser kann man nicht bauen.');
  if(B.kind==='drill'&&(!r||r===OIL))return fail(x,y,r===OIL?'Auf Öl braucht es eine Ölpumpe.':'Bohrer müssen auf einem Rohstofffeld stehen.');
  if(B.kind==='opump'&&r!==OIL)return fail(x,y,'Die Ölpumpe muss auf einer Ölquelle stehen.');
  if(B.shore&&!nearWater(x,y))return fail(x,y,B.n+' muss direkt neben Wasser stehen.');
  if(SITESET.has(y*W+x))return fail(x,y,'Hier ist schon eine Baustelle.');
  const miss=obtain(t,1);
  if(miss){
    // Material fehlt: Zwischenprodukte ins Handwerk, hier entsteht eine Baustelle
    const m=queueFor(t,1);
    if(m)return fail(x,y,`Für ${B.n} fehlen ${fmt(m.n)} × ${ITEMS[m.k].n}.`);
    addSite(t,x,y,d);sfx('place');FLASH={x,y,t:.35};uiDirty=true;
    toast(`Baustelle: ${B.n} wird gebaut, sobald ${Object.keys(miss).map(k=>ITEMS[k].n).join(', ')} fertig ist.`,'',2600);
    return;
  }
  const e=mkEnt(t,x,y,d);
  if(B.kind==='ug'||B.kind==='pug'){
    e.io=tunnelRole(t,x,y,d);
    toast(e.io==='in'?`Tunnel-Eingang gesetzt. Setze jetzt den Ausgang in Pfeilrichtung (bis ${B.range} Felder dazwischen).`:'Tunnel-Ausgang gesetzt – verbunden.',e.io==='in'?'':'good',2600);
  }
  addEnt(e);autoFuel(e);
  // Öfen und Montagemaschinen brauchen ein Rezept: Auswahl gleich öffnen
  if(B.kind==='furn'||B.kind==='asm'){openInfo(e);ACT[B.kind==='furn'?'frecipes':'recipes']();SH.autoPick=1}
  if(B.kind==='silo'){S.flags.silo=1}
  sfx('place');FLASH={x,y,t:.35};puff(x+.5,y+.6,'rgba(200,200,200,.35)',4,1.2);
  uiDirty=true;
}
/* ---------- Gebäude direkt aus Material bauen ----------
   Gebäude brauchen keine Handwerk-Warteschlange: sind die Materialien da, steht das Gebäude sofort.
   Gebäude in der Zutatenliste (z. B. der Ofen im Bohrer) werden ebenfalls sofort mitgebaut.
   Fehlen Zwischenprodukte (Zahnrad …), kommen nur diese ins Handwerk und am Platz entsteht eine Baustelle,
   die sich selbst fertig baut, sobald alles da ist. */
let SITESET=new Set();
const nearWater=(x,y)=>[0,1,2,3].some(d=>RES[(y+DY[d])*W+x+DX[d]]===WATER);
function syncSites(){SITESET=new Set(S.sites.map(s=>s.y*W+s.x))}
const siteAt=(x,y)=>S.sites.find(s=>s.x===x&&s.y===y);
/* plant need Stück von t aus dem Vorrat av; was fehlt, landet in miss */
function instantPlan(t,need,av,miss){
  const have=Math.max(0,av[t]||0),use=Math.min(have,need);
  av[t]=have-use;let rest=need-use;if(!rest)return;
  const r=REC[t];
  if(!r||!BLD[t]||!unlocked(t)){miss[t]=(miss[t]||0)+rest;return}
  const times=Math.ceil(rest/r.n);
  for(const k in r.i)instantPlan(k,r.i[k]*times,av,miss);
  av[t]+=times*r.n-rest;
}
/* verbraucht die Materialien (nur nach erfolgreichem Plan aufrufen) */
function instantTake(t,need){
  const use=Math.min(total(t),need);if(use)takeItems(t,use);
  const rest=need-use;if(!rest)return;
  const r=REC[t],times=Math.ceil(rest/r.n);
  for(const k in r.i)instantTake(k,r.i[k]*times);
  addProd(t,times*r.n);if(times*r.n>rest)give(t,times*r.n-rest);
}
/* n Gebäude t sofort bereitstellen. Ergebnis: null = geklappt, sonst fehlende Items */
function obtain(t,n){
  const miss={};instantPlan(t,n||1,totals(),miss);
  if(Object.keys(miss).length)return miss;
  instantTake(t,n||1);return null;
}
/* Fehlendes für n Gebäude t ins Handwerk einreihen. false = Rohstoffe fehlen (nicht herstellbar) */
function queueFor(t,n){
  const av=queueAvail(),miss={};
  for(const s of S.sites)instantPlan(s.t,1,av,{});   // was bestehende Baustellen schon brauchen, ist nicht mehr frei
  instantPlan(t,n,av,miss);
  const steps=[];let raw=null;
  for(const k in miss){
    if(!REC[k]||!unlocked(k)||REC[k].mach||!planCraft(k,miss[k],av,steps,0,{})){raw=k;break}
  }
  if(raw){const m={};if(REC[raw]&&unlocked(raw))planCraft(raw,miss[raw],queueAvail(),[],0,m);return m.k?m:{k:raw,n:miss[raw]}}
  for(const s of steps)S.cq.push({r:s,s:0,a:0});
  return null;
}
function addSite(t,x,y,d,c){const s={t,x,y,d:BLD[t].rot?d:0};if(c)s.c=c;S.sites.push(s);syncSites()}
/* übernimmt gespeicherte Einstellungen (Blaupause, Aufrüsten, Tunnel) */
function applyCfg(e,c){
  if(!c)return;
  const k=BLD[e.t].kind;
  if(c.r!==undefined&&(k==='asm'||k==='furn')){
    if(k==='furn'?SMELT[c.r]:(REC[c.r]&&unlocked(c.r)))e.r=c.r;
  }
  if(c.fo&&e.fo)e.fo=c.fo.slice();
  if(c.fi&&Array.isArray(e.fi))e.fi=c.fi.slice();
  if(c.oi!==undefined&&(k==='chest'||k==='dimout')){e.oi=c.oi;if(c.orate!==undefined)e.orate=c.orate}
  if(c.io&&(k==='ug'||k==='pug'))e.io=c.io;
  if(c.off)e.off=1;
}
/* Tunnelstück: Ausgang, wenn dahinter in Reichweite ein freier Eingang gleicher Art und Richtung liegt */
function tunnelRole(t,x,y,d){
  const k=BLD[t].kind,R=BLD[t].range;
  for(let j=1;j<=R+1;j++){
    const c=entAt(x-DX[d]*j,y-DY[d]*j);
    if(!c||BLD[c.t].kind!==k||c.d!==d)continue;
    return c.io==='in'&&(!c._pair||Math.abs(c._pair.x-c.x)+Math.abs(c._pair.y-c.y)>j)?'out':'in';
  }
  return'in';
}
function removeSite(s){S.sites.splice(S.sites.indexOf(s),1);syncSites();sfx('del');uiDirty=true}
/* Baustellen der Reihe nach fertigstellen, sobald die Materialien da sind */
function sitesUpd(){
  if(!S.sites.length)return;
  let changed=false;
  for(const s of S.sites.slice()){
    if(G[s.y*W+s.x]||RES[s.y*W+s.x]===WATER){S.sites.splice(S.sites.indexOf(s),1);changed=true;continue}
    if(obtain(s.t))continue;
    S.sites.splice(S.sites.indexOf(s),1);changed=true;
    const e=mkEnt(s.t,s.x,s.y,s.d);
    const tk=BLD[s.t].kind;if((tk==='ug'||tk==='pug')&&!(s.c&&s.c.io))e.io=tunnelRole(s.t,s.x,s.y,s.d);
    applyCfg(e,s.c);addEnt(e);autoFuel(e);
    if(BLD[s.t].kind==='silo')S.flags.silo=1;
    puff(s.x+.5,s.y+.6,'rgba(200,200,200,.35)',4,1.2);
  }
  if(changed){syncSites();sfx('place');uiDirty=true}
}
/* Neu gebaute Brenner bekommen etwas Kohle aus dem Vorrat */
function autoFuel(e){
  const B=BLD[e.t];if(!(B.burner||B.kind==='steam'))return;
  const n=Math.min(5,total('kohle'));
  if(n>0){takeItems('kohle',n);e.f+=n}
}
function replaceBelt(b,t){
  const miss=obtain(t,1);
  if(miss){const k=Object.keys(miss)[0];return fail(b.x,b.y,`Für ${BLD[t].n} fehlen ${fmt(miss[k])} × ${ITEMS[k].n}.`)}
  const x=b.x,y=b.y,d=b.d;
  refund(b);removeEnt(b);
  addEnt(mkEnt(t,x,y,d));
  sfx('place');FLASH={x,y,t:.35};uiDirty=true;
}
function demolish(e){
  refund(e);removeEnt(e);
  if(SEL===e)closeSheet();
  sfx('del');puff(e.x+.5,e.y+.5,'rgba(180,170,150,.5)',7,2);
  uiDirty=true;
}
function handMine(x,y,r){
  const k=RES_ITEM[r];
  if(!k){toast('Öl kann man nicht per Hand abbauen – dafür gibt es die Ölpumpe.','',1800);return}
  give(k,1);addProd(k,1);
  floatText(x+.5,y+.35,'+1',ITEMS[k].c);sfx('mine');uiDirty=true;
}

/* ---------- Ton (Web Audio, synthetisch) ---------- */
let AC=null;
function audioUnlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}}
function tone(f,d,type,vol,slide,delay){
  if(!AC)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(_){}
}
function sfx(k){
  if(!S||!S.sound||!AC||NOTE)return;
  switch(k){
    case 'place':tone(330,.07,'triangle',.08,120);tone(520,.05,'sine',.04,0,.04);break;
    case 'del':tone(260,.14,'sawtooth',.04,-150);break;
    case 'click':tone(700,.03,'sine',.04);break;
    case 'mine':tone(180+Math.random()*60,.06,'triangle',.07,-40);break;
    case 'craft':tone(620,.06,'triangle',.05);tone(930,.08,'triangle',.04,0,.06);break;
    case 'err':tone(160,.16,'square',.035,-30);break;
    case 'res':[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.06,0,i*.09));break;
    case 'goal':[392,523,659].forEach((f,i)=>tone(f,.2,'sine',.07,0,i*.1));break;
    case 'rocket':tone(90,2.5,'sawtooth',.05,400);tone(60,3,'triangle',.07,200,.3);break;
  }
}

/* ---------- Meldungen ---------- */
function toast(msg,cls,dur){
  const box=$('#toast');while(box.children.length>1)box.firstChild.remove();
  const d=document.createElement('div');d.textContent=msg;if(cls)d.className=cls;box.appendChild(d);
  setTimeout(()=>d.remove(),dur||2800);
}
function notify(msg,cls){if(NOTE)NOTE.push(msg);else toast(msg,cls)}

const BUILD_GROUPS=[
  ['Förderbänder',['band','schnellband','expressband','tunnel','tunnel2','tunnel3','verteiler','zusammen','sverteiler','szusammen']],
  ['Lager',['kiste','dimin','dimout']],
  ['Abbau',['bohrer','ebohrer','ebohrer2']],
  ['Verarbeitung',['ofen','stahlofen','eofen','montage','montage2','montage3']],
  ['Forschung',['labor','labor2','labor3']],
  ['Energie',['solar','windrad','dampf','mast','mast2','mast3']],
  ['Leitungen',['pumpe','pumpe2','leitung','leitung2','rtunnel','rverteiler','rzusammen']],
  ['Öl',['oelpumpe','raffinerie']],
  ['Raumfahrt',['silo']],
];
let palKey='';
function buildPalette(){
  const fav=S.fav,key=fav.join(',')+'|'+curDir;
  if(key!==palKey){
    palKey=key;
    $('#pal').innerHTML=fav.map((t,i)=>t
      ?`<button class="pb" data-t="${t}">${ic(t,BLD[t].rot?curDir:0)}<em id="p_${t}"></em><span>${BLD[t].n}</span></button>`
      :`<button class="pb empty" data-i="${i}" aria-label="Platz belegen">+</button>`).join('');
    fillIcons($('#pal'));
  }
  for(const t of fav){if(!t)continue;const n=TOT[t]||0,el=$('#p_'+t);if(el){el.textContent=fmt(n);el.className=n?'':'no'}}
  document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('sel',!!b.dataset.t&&b.dataset.t===tool));
  $('#bBuild').classList.toggle('sel',!!tool&&!fav.includes(tool));
}
$('#pal').addEventListener('click',e=>{
  const b=e.target.closest('.pb');if(!b)return;
  if(!b.dataset.t){openBuild();return}
  const t=b.dataset.t;
  selectTool(tool===t?null:t);
});
/* Bau-Menü: Gebäude nach Gruppen, Tippen wählt aus, Stern legt es in die Schnellleiste */
function openBuild(){
  const lockTech=t=>{const r=REC[t];return r&&r.tech&&!isDone(r.tech)?TECH[r.tech].n:null};
  let h='<p>Tippe auf ein Gebäude zum Bauen. Mit dem Stern legst du es in deine Schnellleiste (6 Plätze).</p>';
  h+='<h4>Blaupausen</h4>'+(S.bps.length?S.bps.map((bp,i)=>`<div class="row"><div class="chk">▦</div><div class="rt"><b>${esc(bp.n)}</b><div class="ing">${bp.w}×${bp.h} Felder · ${bp.p.length} Teile</div></div><div class="rb"><button class="btn" data-a="bpdel" data-v="${i}" aria-label="Löschen">✕</button><button class="btn acc" data-a="bpuse" data-v="${i}">Setzen</button></div></div>`).join('')
    :'<p>Noch keine. Mit „Auswahl“ in der unteren Leiste einen Rahmen aufziehen und „Blaupause“ tippen.</p>');
  for(const[name,list]of BUILD_GROUPS){
    h+=`<h4>${name}</h4>`;
    const vis=list.filter(t=>!(REC[t]&&REC[t].tech&&TECH[REC[t].tech].hide));
    if(!vis.length){h=h.slice(0,h.lastIndexOf('<h4>'));continue}
    for(const t of vis){
      const lock=lockTech(t)&&!(TOT[t]>0),fav=S.fav.includes(t);
      h+=`<div class="row${lock?' lock':''}${tool===t?' cur':''}">${ic(t,BLD[t].rot?curDir:0)}<div class="rt"><b>${esc(BLD[t].n)} <small style="color:var(--dim);font-weight:400">· ${fmt(TOT[t]||0)}</small>${S.newB.includes(t)?' <small style="color:var(--acc)">neu</small>':''}</b>
        <div class="ing">${lock?'Gesperrt – Forschung: '+esc(lockTech(t)):esc(toolHint(t))}</div>${REC[t]&&!lock?ingHtml(REC[t].i,1):''}</div>
        <div class="rb"><button class="btn star${fav?' on':''}" data-a="fav" data-v="${t}" aria-label="Favorit">${fav?'★':'☆'}</button>${lock?'':`<button class="btn acc" data-a="pick" data-v="${t}">Bauen</button>`}</div></div>`;
    }
  }
  openSheet('build','Gebäude',null,h,{keepScroll:SH.kind==='build'});
}
function selectTool(t){
  if(ROUTE&&ROUTE.t!==t){ROUTE=null;updRouteBar()}
  if(t&&(selMode||BPM)){selMode=false;SELR=null;BPM=null;updSelBar()}
  tool=t;if(t)delMode=false;
  if(t)toast(toolHint(t),'',1800);
  updToolUI();sfx('click');
}
/* Kurzinfo beim Auswählen eines Gebäudes */
function toolHint(t){
  const B=BLD[t];
  switch(B.kind){
    case 'belt':return`${B.n} (${beltRate(t)}/min): Start antippen, dann Ziel. Anderes Band antippen = umbauen.`;
    case 'drill':return`${B.n}: ${fmtRate(B.rate*DRILL_BONUS*60)} Erz/min`;
    case 'furn':return`${B.n}: ${fmtRate(B.speed*20)} Platten/min`;
    case 'asm':return`${B.n}: Rezepte mit bis zu ${B.tier} ${B.tier>1?'Zutaten':'Zutat'}, Tempo ×${String(B.speed).replace('.',',')}`;
    case 'steam':return`${B.n}: bis 1,8 MW, braucht Kohle und 600 Wasser/min per Leitung`;
    case 'solar':case 'wind':return`${B.n}: ${B.kw} kW ohne Brennstoff`;
    case 'pipe':return`${B.n} (${fmt(lineRate(t))}/min): Start antippen, dann Ziel. Andere Leitung antippen = umbauen.`;
    case 'pump':return`${B.n}: ${fmt(B.rate*60)} Wasser/min, muss direkt am Wasser stehen`;
    case 'opump':return`${B.n}: ${fmt(B.rate*60)} Öl/min auf einer Ölquelle, ${B.kw} kW`;
    case 'refinery':return`${B.n}: Öl + Wasser → Kunststoff + Schwefel, ${B.kw} kW`;
    case 'ug':return`${B.n}: bis ${B.range} Felder unter allem durch, ${beltRate(t)}/min. Eingang setzen, dann Ausgang.`;
    case 'pug':return`${B.n}: bis ${B.range} Felder unterirdisch, ${fmt(B.rate*60)}/min. Eingang setzen, dann Ausgang.`;
    case 'psplit':return`${B.n}: Eingang hinten, Ausgänge vorn/links/rechts. Auf eine Leitung tippen ersetzt sie.`;
    case 'pmerge':return`${B.n}: Eingänge hinten/links/rechts, Ausgang vorn. Auf eine Leitung tippen ersetzt sie.`;
    case 'lab':return`${B.n}: Forschung ×${B.speed}${B.kw?`, ${B.kw} kW`:', ohne Strom'}`;
    case 'dimin':return`${B.n}: schickt alles vom Band ins Dimensionslager`;
    case 'dimout':return`${B.n}: gibt ein Item aus dem Dimensionslager aufs Band`;
    case 'pole':return`${B.n}: ${2*B.sup+1}×${2*B.sup+1} Felder, Leitung bis ${Math.floor(B.reach)} Felder`;
    case 'split':return`${B.n}: Eingang hinten, Ausgänge vorn/links/rechts${B.smart?' mit Filter':''}. Auf ein Band tippen ersetzt es.`;
    case 'merge':return`${B.n}: Eingänge hinten/links/rechts${B.smart?' mit Filter':''}, Ausgang vorn. Auf ein Band tippen ersetzt es.`;
    case 'chest':return`${B.n}: 800 Plätze, Eingang hinten, Ausgang vorn mit einstellbarer Menge/min`;
  }
  return B.n;
}
function updToolUI(){
  document.querySelectorAll('.pb').forEach(b=>b.classList.toggle('sel',b.dataset.t===tool));
  $('#bHand').classList.toggle('sel',!tool&&!delMode&&!selMode&&!BPM);
  $('#bSel').classList.toggle('sel',selMode||!!BPM);
  $('#bDel').classList.toggle('sel',delMode);
  $('#bRot').querySelector('svg').style.transform=`rotate(${curDir*90}deg)`;
}
function rotateAct(){
  if(SEL&&BLD[SEL.t].rot&&sheetOpen()){SEL.d=(SEL.d+1)%4;dirty=true;sfx('click');return}
  if(BPM){SACT.bprot();sfx('click');return}
  curDir=(curDir+1)%4;palKey='';buildPalette();updToolUI();sfx('click');

$('#bHand').onclick=()=>{delMode=false;if(selMode||BPM)setSelMode(false);selectTool(null)};
$('#bRot').onclick=rotateAct;
$('#bDel').onclick=()=>{delMode=!delMode;if(delMode){tool=null;if(selMode||BPM)setSelMode(false);toast('Abriss: Tippe auf ein Gebäude.','',1600)}updToolUI();sfx('click')};
$('#bCraft').onclick=()=>openCraft();
$('#bRes').onclick=()=>openResearch();
$('#bBuild').onclick=()=>openBuild();
$('#bMenu').onclick=()=>openMenu();

/* ---------- Banner: Tutorial oder nächstes Ziel ---------- */
function updBanner(){
  const b=$('#banner');
  if(ROUTE||selMode||BPM){b.className='';return}
  $('#banner').style.bottom=($('#bottom').offsetHeight+8)+'px';
  if(S.tut>=0&&S.tut<TUT.length){
    const s=TUT[S.tut];
    b.className='on';$('#bSmall').textContent=`Tutorial ${Math.min(S.tut+1,TUT.length-1)}/${TUT.length-1}`;$('#bText').innerHTML=s.t;
    $('#bBtn').style.display=s.end?'':'none';$('#bBtn').textContent='Los geht’s';
    $('#bSkip').style.display=s.end?'none':'';
    return;
  }
  const g=S.showGoal&&GOALS.find(g=>!goalDone(g));
  if(!g){b.className='';return}
  b.className='on goal';$('#bSmall').textContent='Nächstes Ziel';
  let t=esc(g.d);if(g.p){const[a,m]=g.p();t+=` <b>(${fmt(Math.min(a,m))}/${m})</b>`}
  $('#bText').innerHTML=t;$('#bBtn').style.display='none';$('#bSkip').style.display='none';
}
$('#bBtn').onclick=e=>{e.stopPropagation();S.tut=-1;updBanner()};
$('#bSkip').onclick=e=>{e.stopPropagation();S.tut=-1;updBanner();toast('Tutorial übersprungen. Du findest es im Menü.')};
$('#banner').onclick=()=>{if(S.tut<0)openMenu('goals')};

  opt=opt||{};

function onSheetClick(e){const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){f(b.dataset.v,b);uiDirty=true}}
$('#sheetBody').addEventListener('click',onSheetClick);

/* iOS verschluckt Klicks, wenn sich der Finger minimal bewegt oder die Liste noch nachscrollt:
   Knöpfe im Menü lösen deshalb schon beim Loslassen aus, der nachfolgende Klick wird ignoriert */
let tapDn=null,tapT=0;
for(const el of [$('#sheetBody'),$('#sheetTabs')]){
  el.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');tapDn=b?{b,x:e.clientX,y:e.clientY,t:performance.now()}:null});
  el.addEventListener('pointercancel',()=>{tapDn=null});
  el.addEventListener('pointerup',e=>{
    const d=tapDn;tapDn=null;
    if(!d||e.pointerType==='mouse'||e.target.closest('[data-a]')!==d.b)return;
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>14||performance.now()-d.t>900)return;
    tapT=performance.now();onSheetClick({target:d.b});
  });
}
document.addEventListener('click',e=>{if(performance.now()-tapT<450){e.stopPropagation();e.preventDefault()}},true);
ACT.tab=v=>{if(SH.kind==='craft')openCraft(v);else if(SH.kind==='menu')openMenu(v)};
const setTxt=(id,t)=>{const el=document.getElementById(id);if(el&&el.textContent!==t)el.textContent=t};
const setBar=(id,f)=>{const el=document.getElementById(id);if(el)el.style.width=(clamp(f,0,1)*100).toFixed(1)+'%'};
/* Slot mit wechselndem Item (z. B. Ofen-Eingang) */
function setSlot(id,item,n){
  const el=document.getElementById(id);if(!el)return;
  const c=el.querySelector('canvas');
  if((c.dataset.ic||'')!==(item||'')){if(item){c.dataset.ic=item;fillIcons(el)}else{c.dataset.ic='';c.getContext('2d').clearRect(0,0,c.width,c.height)}}
  const b=el.querySelector('b'),t=item?fmt(n):'–';if(b.textContent!==t)b.textContent=t;
}
const slot=(id,label,item)=>`<div class="slot" id="${id}">${ic(item||'')}<div><small>${label}</small><b>–</b></div></div>`;

/* ---------- Gebäude-Info ---------- */
const ST_TXT={kohle:['Kein Brennstoff – bitte Kohle einlegen','bad'],strom:['Kein Strom','bad'],wenig:['Zu wenig Strom – arbeitet langsamer','warn'],
  voll:['Ausgang voll','warn'],zutaten:['Wartet auf Zutaten','warn'],leer:['Wartet auf Material','warn'],rezept:['Kein Rezept gewählt','bad'],
  komplex:['Rezept hat zu viele Zutaten für diese Stufe – Montagemaschine aufrüsten','bad'],
  keine:['Keine Forschung ausgewählt','warn'],pakete:['Wartet auf Forschungspakete','warn'],wartet:['Forschung wird gerade abgeschlossen','ok'],
  aus:['Abgeschaltet','warn'],oel:['Kein Öl – Ölpumpe per Leitung anschließen','bad'],wasser:['Kein Wasser – Pumpe am See setzen und per Leitung anschließen','bad'],abnehmer:['Leitung voll oder nicht angeschlossen','warn']};
function statusOf(e){
  if(ELECTRIC(e.t)&&e._net<0)return['Kein Strommast in der Nähe','bad'];
  if(e._st)return ST_TXT[e._st]||['Bereit','ok'];
  return e._on?['Arbeitet','ok']:['Bereit','ok'];
}
/* Maximale Raten pro Minute: [Eingänge, Ausgänge] als [[item, Menge/min], …] */
function maxRates(e){
  const B=BLD[e.t],fuel=kw=>['kohle',kw*60/COAL];
  switch(B.kind){
    case 'drill':{const r=RES_ITEM[RES[e.y*W+e.x]];return[B.burner?[fuel(B.kw)]:[],r?[[r,B.rate*DRILL_BONUS*60]]:[]]}
    case 'furn':{
      const key=e.r||e.w||e.in||'eisenerz',r=SMELT[key],per=B.speed*60/r.t;
      return[[[key,per*r.n]].concat(B.burner?[fuel(B.kw)]:[]),[[r.o,per]]];
    }
    case 'asm':{if(!e.r)return[[],[]];const r=REC[e.r],per=B.speed*60/r.t;return[Object.keys(r.i).map(k=>[k,r.i[k]*per]),[[e.r,r.n*per]]]}
    case 'lab':{const T=S.res.cur&&TECH[S.res.cur];return T?[Object.keys(T.c).map(k=>[k,60*B.speed/T.t]),[]]:[[],[]]}
    case 'steam':return[[fuel(B.kw),['wasser',B.kw*60/WATER_KJ]],[]];
    case 'pump':return[[],[['wasser',B.rate*60]]];
    case 'opump':return[[],[['oel',B.rate*60]]];
    case 'refinery':{const per=B.speed*60/REFINE.t;return[Object.keys(REFINE.i).map(k=>[k,REFINE.i[k]*per]),Object.keys(REFINE.o).map(k=>[k,REFINE.o[k]*per])]}
  }
  return[[],[]];
}
function rateBlock(e){
  const[i,o]=maxRates(e);if(!i.length&&!o.length)return'';
  const row=(l,a)=>a.length?`<div class="rrow"><small>${l}</small>${a.map(([k,v])=>`<span>${ic(k)}<b>${fmtRate(v)}</b>/min</span>`).join('')}</div>`:'';
  return`<div class="rates">${row('Braucht max.',i)}${row('Liefert max.',o)}<div class="rrow"><small>Liefert jetzt</small><b id="iRate">wird gemessen …</b></div></div>`;
}
function liveRate(e){
  const[,o]=maxRates(e),max=o.length?o[0][1]:0;
  if(e._r===undefined)return;
  const unit=BLD[e.t].kind==='lab'?' Einheiten/min':'/min';
  setTxt('iRate',fmtRate(e._r)+unit+(max?` (${Math.round(Math.min(1,e._r/max)*100)} %)`:''));
}
function openInfo(e){
  const B=BLD[e.t],k=B.kind;
  let h=`<div class="st" id="iSt"></div>`,live;
  const btns=[];
  const setSt=(t,c)=>{const el=$('#iSt');if(el){el.textContent=t;el.className='st '+(c||'')}};
  switch(k){
    case 'drill':{
      const res=RES_ITEM[RES[e.y*W+e.x]];
      h+=`<div class="slots">${B.burner?slot('sF','Brennstoff','kohle'):''}${slot('sR','Fördert',res)}</div><div class="bar"><div id="iBar"></div></div>`;

      if(feeds.length)h+=`<h4>Einlegen</h4><div class="btns">${feeds.map(i=>`<button class="btn" data-a="feed" data-v="${i}">${ic(i)} ${esc(ITEMS[i].n)} (${fmt(TOT[i])})</button>`).join('')}</div>`;
      if(B.burner)btns.push(['fuel','Kohle einlegen']);
      btns.push(['takeout','Ausgang nehmen']);
      live=()=>{const[s,c]=statusOf(e);setSt(s,c);if(B.burner)setSlot('sF','kohle',e.f);setSlot('sI',e.in||e.w,e.inN);setSlot('sO',e.out,e.outN);setBar('iBar',e.p);liveRate(e)};

      h+=`<div class="slots" id="aIn"></div><div class="bar"><div id="iBar"></div></div>`;
      if(r)h+=rateBlock(e)+`<p>Dauer: ${(r.t/B.speed).toLocaleString('de-DE',{maximumFractionDigits:1})} s · ${B.kw} kW</p>`;
      if(r){btns.push(['feedall','Zutaten einlegen']);btns.push(['takeout','Ausgang nehmen'])}
      live=()=>{const[s,c]=statusOf(e);setSt(s,c);setBar('iBar',e.p);liveRate(e);
        const box=$('#aIn');if(!box||!r)return;

          fillIcons(box)}};
      break;
    }
    case 'dimin':
      h+=`<h4>Dimensionslager</h4><div class="grid" id="cInv"></div>`;
      live=()=>{setSt(e.off?'Abgeschaltet':e._r?`Schickt ${fmtRate(e._r)}/min ins Lager`:'Wartet auf Items (Eingang von allen Seiten)',e.off?'warn':'ok');invGrid('cInv',S.dim)};
      break;
    case 'chest':case 'dimout':{
      const inv=k==='dimout'?S.dim:e.inv;
      h+=`${k==='dimout'?'<h4>Dimensionslager</h4>':''}<div class="grid" id="cInv"></div>`;
      {const keys=Object.keys(ITEMS).filter(i=>inv[i]>0||i===e.oi);

/* ---------- Handwerk ---------- */
function queueAvail(){
  const av=totals();
  for(const c of S.cq){const r=REC[c.r];if(!c.s)for(const k in r.i)av[k]=(av[k]||0)-r.i[k];av[c.r]=(av[c.r]||0)+r.n}
  return av;
}
/* plant n Stück von id; fehlende Zwischenprodukte werden rekursiv mitgeplant */
function planCraft(id,n,av,steps,depth,miss){
  const r=REC[id],times=Math.ceil(n/r.n);
  for(const k in r.i){
    const need=r.i[k]*times,have=Math.max(0,av[k]||0);
    if(have<need){
      if(depth<8&&REC[k]&&unlocked(k)&&!REC[k].mach){if(!planCraft(k,need-have,av,steps,depth+1,miss))return false}
      else{if(miss){miss.k=k;miss.n=need-have}return false}
    }
    av[k]=(av[k]||0)-need;
  }
  for(let i=0;i<times;i++)steps.push(id);
  av[id]=(av[id]||0)+times*r.n;
  return true;
}
function canCraft(id,n){return planCraft(id,n,queueAvail(),[],0,null)}
function craft(id,n){
  const steps=[],miss={};
  if(!planCraft(id,n,queueAvail(),steps,0,miss)){toast(`Es fehlen ${fmt(miss.n)} × ${ITEMS[miss.k].n}.`,'bad');sfx('err');return false}
  if(S.cq.length+steps.length>500){toast('Die Warteschlange ist voll.','bad');return false}
  for(const s of steps)S.cq.push({r:s,s:0,a:0});
  sfx('click');return true;
}

function newGame(){

    res:{cur:null,prog:0,done:[]},flags:{water:1},goals:[],tut:0,rockets:0,sound:true,cq:[],dir:1,ents:[],newB:[],fav:FAV_DEFAULT.slice(),showGoal:false,dim:{},bps:[]};
  initWorld();

  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(RES[y*W+x]===1&&Math.hypot(x-W/2,y-H/2)<18){sx+=x;sy+=y;n++}
  cam.x=n?sx/n+.5:W/2;cam.y=n?sy/n+.5:H/2;cam.z=clamp(Math.min(VW,560)/9,ZMIN,ZMAX);
  curDir=1;tool=null;delMode=false;
}
function initWorld(){
  setWorldSize(S.ws||64);
  for(const e of S.ents)G[e.y*W+e.x]=e;
  genWorld(S.seed);applyWorldRules();syncDone();syncSites();reindex();buildTerrain();statReset();
  SPR.clear();palKey='';lastUnlock='';RESQ=[];
}
function validSave(o){return o&&o.v===1&&typeof o.seed==='number'&&Array.isArray(o.ents)}
/* ergänzt fehlende Felder und verwirft kaputte Einträge */
function migrate(o){
  const d={ws:64,gen:1,sites:[],time:0,inv:{},prod:{},res:{cur:null,prog:0,done:[]},flags:{},goals:[],tut:-1,rockets:0,sound:true,cq:[],dir:1,newB:[],fav:FAV_DEFAULT.slice(),showGoal:false,dim:{},bps:[]};
  for(const k in d)if(o[k]===undefined)o[k]=d[k];
  if(o.ws!==64&&o.ws!==128&&o.ws!==192)o.ws=64;
  setWorldSize(o.ws);
  // Greifarme gibt es nicht mehr: jeder wird zu 2 Förderbändern
  const oldIns=k=>k==='greifer'||k==='schnellgreifer';
  let comp=0;for(const k in o.inv)if(oldIns(k))comp+=o.inv[k];
  for(const e of o.ents)if(e&&oldIns(e.t))comp++;
  if(comp)o.inv.band=(o.inv.band||0)+comp*2;
  const clean=inv=>{for(const k in inv)if(!ITEMS[k]||!(inv[k]>0))delete inv[k]};
  clean(o.inv);clean(o.dim);
  const seen=new Set();
  o.ents=o.ents.filter(e=>{
    if(!e||!BLD[e.t]||!(e.x>=0&&e.y>=0&&e.x<W&&e.y<H))return false;
    if(e.inv)clean(e.inv);
    if(e.it)e.it=e.it.filter(i=>ITEMS[i[0]]);
    if(e.t==='kiste'){delete e.ou;if(e.oi&&!ITEMS[e.oi])e.oi=null}
    if(e.t==='verteiler'){                                                   // alter Verteiler mit Filter wird zum Smart-Verteiler
      if(e.fi&&ITEMS[e.fi]){e.t='sverteiler';e.fo=[e.fi,'_rest','_rest']}
      delete e.fi;
    }
    if(e.fo)e.fo=e.fo.map(f=>f&&f[0]!=='_'&&!ITEMS[f]?null:f);
    if(Array.isArray(e.fi))e.fi=e.fi.map(f=>f&&f[0]!=='_'&&!ITEMS[f]?null:f);
    if(BLD[e.t].kind==='furn'&&e.r===undefined)e.r=e.in||e.w||Object.keys(SMELT).find(k=>SMELT[k].o===e.out)||null;   // alte Öfen: Rezept aus dem Inhalt ableiten
    if(e.t==='stahlofen'&&e.f){o.inv.kohle=(o.inv.kohle||0)+e.f;e.f=0}
    const k=e.y*W+e.x;if(seen.has(k))return false;seen.add(k);
    const f=mkEnt(e.t,e.x,e.y,e.d||0);for(const q in f)if(e[q]===undefined)e[q]=f[q];
    return true;
  });
  o.res.done=o.res.done.filter(id=>TECH[id]);
  if(o.res.cur&&!TECH[o.res.cur])o.res.cur=null;
  o.cq=o.cq.filter(c=>REC[c.r]);
  o.sites=(o.sites||[]).filter(t=>t&&BLD[t.t]&&t.x>=0&&t.y>=0&&t.x<o.ws&&t.y<o.ws);
  o.bps=(Array.isArray(o.bps)?o.bps:[]).filter(b=>b&&Array.isArray(b.p)).map(b=>(b.p=b.p.filter(q=>q&&BLD[q.t]),b));
  o.sites.forEach(t=>{if(t.c&&typeof t.c!=='object')delete t.c});
  o.fav=Array.from({length:6},(_,i)=>{const t=o.fav&&o.fav[i];return t&&BLD[t]?t:null});
  return o;
}
function loadState(o){
  S=migrate(o);initWorld();
  if(S.cam){cam.x=S.cam.x;cam.y=S.cam.y;cam.z=S.cam.z}
  curDir=S.dir||1;tool=null;delMode=false;clampCam();
}
function saveNow(){
  if(!S)return;
  S.cam={x:+cam.x.toFixed(2),y:+cam.y.toFixed(2),z:+cam.z.toFixed(1)};S.dir=curDir;S.savedAt=Date.now();
  const js=JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v);   // Laufzeitfelder (_…) weglassen
  try{localStorage.setItem(KEY,js)}catch(_){}
  pushCloud(js);
  return js;
}

/* Export-Code: komprimiert (deflate) und Base64, sonst nur Base64 */
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function unb64(str){const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function exportCode(){
  const js=saveNow();
  try{
    if(window.CompressionStream){
      const st=new Blob([js]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'FW1:'+b64(new Uint8Array(await new Response(st).arrayBuffer()));
    }
  }catch(_){}
  return 'FW0:'+b64(new TextEncoder().encode(js));
}
async function importCode(code){
  code=code.trim().replace(/\s+/g,'');
  let js;
  if(code.startsWith('FW1:')){
    const st=new Blob([unb64(code.slice(4))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    js=await new Response(st).text();
  }else if(code.startsWith('FW0:'))js=new TextDecoder().decode(unb64(code.slice(4)));
  else throw new Error('format');
  const o=JSON.parse(js);
  if(!validSave(o))throw new Error('invalid');
  closeSheet();loadState(o);afterLoad();saveNow();
}

/* Offline-Fortschritt:
   Handwerk läuft einfach weiter. Die Fabrik wird kurz echt simuliert (Aufwärmen + Messung),
   danach werden Kisten, Forschung und Statistik auf die restliche Zeit hochgerechnet –
   aber nur so lange, bis der erste Vorrat leer wäre, der während der Messung schrumpfte. */
function offlineProgress(sec,show){
  sec=Math.min(sec,OFFLINE_MAX);
  if(!S||sec<2)return;
  NOTE=[];
  const prod0=Object.assign({},S.prod);
  craftUpd(sec);
  if(dirty)reindex();
  const dt=1/30,sim=s=>{for(let i=Math.ceil(s/dt);i>0;i--)simTick(dt)};
  const warm=Math.min(sec,20);sim(warm);
  const meas=Math.min(sec-warm,60);
  if(meas>0){
    const snap=offSnap();sim(meas);
    const rest=sec-warm-meas;
    if(rest>0)extrapolate(snap,meas,rest);
  }
  const gain={};for(const k in S.prod){const d=S.prod[k]-(prod0[k]||0);if(d>0)gain[k]=d}
  const msgs=NOTE;NOTE=null;
  statReset();uiDirty=true;
  if(show&&sec>=60)openWelcome(sec,gain,msgs);
}
function offSnap(){
  const s={chest:new Map(),stock:[],prod:Object.assign({},S.prod),rcur:S.res.cur,rprog:S.res.prog,silo:new Map(),dim:Object.assign({},S.dim)};
  for(const c of L.chest)s.chest.set(c,Object.assign({},c.inv));
  for(const e of S.ents){
    const k=BLD[e.t].kind;
    if(e.f!==undefined)s.stock.push([e,'f',e.f]);                           // Brennstoff
    if(k==='furn')s.stock.push([e,'inN',e.inN]);                             // Ofen-Eingang
    if(k==='lab')for(const i in e.inv)s.stock.push([e,'L'+i,e.inv[i]]);      // Pakete im Labor
    if(k==='silo')s.silo.set(e,e.parts);
  }
  return s;
}
function extrapolate(s,meas,rest){
  const val=(e,f)=>f[0]==='L'?(e.inv[f.slice(1)]||0):e[f];
  // Wie lange reichen schrumpfende Vorräte noch?
  let T=rest;
  for(const[e,f,v0]of s.stock){const v=val(e,f),d=v-v0;if(d<0)T=Math.min(T,v/(-d/meas))}
  for(const c of L.chest){const b=s.chest.get(c)||{};for(const k in b){const d=(c.inv[k]||0)-b[k];if(d<0)T=Math.min(T,(c.inv[k]||0)/(-d/meas))}}
  for(const k in s.dim){const d=(S.dim[k]||0)-s.dim[k];if(d<0)T=Math.min(T,(S.dim[k]||0)/(-d/meas))}
  const f=Math.max(0,T)/meas;
  if(f<=0)return;
  // Kisten (Platz begrenzt)
  for(const c of L.chest){
    const b=s.chest.get(c)||{},keys=new Set([...Object.keys(b),...Object.keys(c.inv)]);
    let now=0,plus=0;for(const k in c.inv)now+=c.inv[k];
    const d={};for(const k of keys){d[k]=(c.inv[k]||0)-(b[k]||0);if(d[k]>0)plus+=d[k]*f}
    const sc=plus>0?Math.min(1,Math.max(0,BLD.kiste.cap-now)/plus):1;
    for(const k of keys){
      if(!d[k])continue;
      const v=Math.max(0,Math.floor((c.inv[k]||0)+d[k]*f*(d[k]>0?sc:1)));
      if(v)c.inv[k]=v;else delete c.inv[k];
    }
  }
  // schrumpfende Vorräte in Maschinen
  for(const[e,fl,v0]of s.stock){
    const d=val(e,fl)-v0;if(d>=0)continue;
    const v=Math.max(0,Math.floor(val(e,fl)+d*f));
    if(fl[0]==='L')e.inv[fl.slice(1)]=v;else{e[fl]=v;if(fl==='inN'&&!v)e.in=null}
  }
  for(const[e,p0]of s.silo){const d=e.parts-p0;if(d>0)e.parts=Math.min(ROCKET,e.parts+Math.floor(d*f))}
  // Dimensionslager (unbegrenzt)
  for(const k of new Set([...Object.keys(s.dim),...Object.keys(S.dim)])){
    const d=(S.dim[k]||0)-(s.dim[k]||0);if(!d)continue;
    const v=Math.max(0,Math.floor((S.dim[k]||0)+d*f));if(v)S.dim[k]=v;else delete S.dim[k];
  }
  // Forschung
  if(S.res.cur&&S.res.cur===s.rcur){
    const d=S.res.prog-s.rprog;
    if(d>0){S.res.prog+=Math.floor(d*f);if(S.res.prog>=techCount(S.res.cur))finishTech()}
  }
  // Statistik
  for(const k in S.prod){const d=S.prod[k]-(s.prod[k]||0);if(d>0)S.prod[k]+=Math.floor(d*f)}
}

/* Selbst-Update: vergleicht BUILD mit der Datei auf dem Server und lädt neu, wenn es eine neue Version gibt */
let updating=false;
async function checkUpdate(){
  if(updating||window.claude||!/^https?:$/.test(location.protocol))return;
  if(sheetOpen())return;
  try{
    const r=await fetch('fabrik.html?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('fw-upd')}catch(_){}
    if(tried===m[1])return;
    try{sessionStorage.setItem('fw-upd',m[1])}catch(_){}
    updating=true;saveNow();toast('Neue Version wird geladen …','',3000);
    setTimeout(()=>location.replace('fabrik.html?v='+encodeURIComponent(m[1])),700);
  }catch(_){}
}

/* Speichern im Konto, wenn das Spiel als Claude-Artifact läuft */
let DB=null,UID=null,cloudBusy=false,cloudAgain=null;
async function pushCloud(js){
  if(!DB||!UID)return;
  if(cloudBusy){cloudAgain=js;return}
  cloudBusy=true;
  try{await DB.doc('data/users/'+UID+'/fabrik').set({v:1,savedAt:S.savedAt,json:js})}catch(_){}
  cloudBusy=false;
  if(cloudAgain){const j=cloudAgain;cloudAgain=null;pushCloud(j)}
}
async function connectCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    DB=db;UID=uid;
    const snap=await db.doc('data/users/'+uid+'/fabrik').get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.savedAt||0)>(S.savedAt||0)+1500){
        const o=JSON.parse(d.json);
        if(validSave(o)){loadState(o);afterLoad();toast('Spielstand aus deinem Konto geladen.','good')}
      }
    }
  }catch(_){}
}

/* =====================================================================
   9. HAUPTSCHLEIFE & START
   ===================================================================== */
/* Zeichenfläche an ihre echte Größe anpassen – nur wenn sie sich wirklich geändert hat,
   denn jedes Neusetzen der Canvas-Größe leert das Bild */
function fitCanvas(){
  const r=cv.getBoundingClientRect(),w=Math.round(r.width)||innerWidth,h=Math.round(r.height)||innerHeight,d=Math.min(2,devicePixelRatio||1);
  if(w===VW&&h===VH&&d===DPR)return;
  VW=w;VH=h;DPR=d;
  const cw=Math.round(VW*DPR),ch=Math.round(VH*DPR);
  if(cv.width!==cw)cv.width=cw;
  if(cv.height!==ch)cv.height=ch;
  if(S)updBanner();
}
/* Lücke nur bei echten Größenänderungen neu bestimmen */
/* Home-Bildschirm-App: iOS meldet dort eine schwankende, zu kleine Fensterhöhe. Deshalb richtet sich das
   Spiel fest nach der Bildschirmhöhe (hängt nur von der Ausrichtung ab – keine Rückkopplung, kein Wackeln). */
let FULLPX=-1;
function applyGap(){
  const app=navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
  const portrait=innerHeight>=innerWidth,full=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
  const v=app&&full>0?full:0;
  GAPPX=v?Math.max(0,full-innerHeight):0;
  if(v===FULLPX)return;
  FULLPX=v;
  if(v)document.documentElement.style.setProperty('--vh',v+'px');else document.documentElement.style.removeProperty('--vh');
}
function resize(){applyGap();fitCanvas()}
addEventListener('resize',resize);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
addEventListener('pageshow',()=>setTimeout(resize,100));
// Die Seite darf nie verrutschen: iOS darf Wischbewegungen nicht zum Scrollen nutzen (außer in Listen und Textfeldern)
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#sheetBody,#pal,textarea'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else checkUpdate()});
addEventListener('pagehide',()=>saveNow());

function afterLoad(){
  TOT=totals();buildTop();palKey='';buildPalette();updToolUI();updBanner();uiDirty=true;
}

let acc=0,last=performance.now(),lastWall=Date.now(),saveT=10;
function frame(now){
  requestAnimationFrame(frame);
  // lange Pause (App im Hintergrund): verpasste Zeit als Offline-Fortschritt nachholen
  const wall=Date.now();
  if(wall-lastWall>5000){offlineProgress((wall-lastWall)/1000,true);acc=0;last=now}
  lastWall=wall;
  let dt=(now-last)/1000;last=now;
  if(dt>.25)dt=.25;if(dt<0)dt=0;
  // Simulation mit festem Takt, maximal 8 Schritte pro Bild
  acc+=dt;let n=0;
  while(acc>=TICK&&n<8){simTick(TICK);acc-=TICK;n++}
  if(n===8)acc=0;
  camInertia(dt);
  render(dt);
  uiTick(dt);
  saveT-=dt;if(saveT<=0){saveT=10;saveNow()}
}

function boot(){
  resize();
  let o=null;
  try{const s=localStorage.getItem(KEY);if(s)o=JSON.parse(s)}catch(_){o=null}
  let gone=0;
  if(validSave(o)){loadState(o);gone=(Date.now()-(o.savedAt||Date.now()))/1000}
  else newGame();
  afterLoad();
  if(gone>2)offlineProgress(gone,true);
  $('#boot').remove();
  last=performance.now();lastWall=Date.now();
  requestAnimationFrame(frame);
  connectCloud();
  setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60*1000);
}
boot();
